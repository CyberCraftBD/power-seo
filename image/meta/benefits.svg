<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Six key benefits of @power-seo/meta: one unified SeoConfig, native Next.js Metadata, native Remix v2 output, full robots directives, zero runtime dependencies, and typed Open Graph and Twitter configuration</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Why @power-seo/meta</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Write your SEO config once — ship correct meta tags on every framework</text>
  <!-- row 1 -->
  <rect x="30" y="92" width="272" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="66" cy="128" r="16" fill="#dbeafe"/>
  <text x="66" y="133" class="font-mono" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">{ }</text>
  <text x="50" y="172" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">One unified config</text>
  <text x="50" y="196" class="font-ui" font-size="12" fill="#64748b">A single SeoConfig object drives</text>
  <text x="50" y="214" class="font-ui" font-size="12" fill="#64748b">every framework output — no</text>
  <text x="50" y="232" class="font-ui" font-size="12" fill="#64748b">duplicated meta boilerplate.</text>
  <rect x="314" y="92" width="272" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="350" cy="128" r="16" fill="#dbeafe"/>
  <text x="350" y="133" class="font-mono" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">N</text>
  <text x="334" y="172" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Native Next.js Metadata</text>
  <text x="334" y="196" class="font-mono" font-size="11" fill="#2563eb">createMetadata()</text>
  <text x="334" y="214" class="font-ui" font-size="12" fill="#64748b">returns a typed Metadata object for</text>
  <text x="334" y="232" class="font-ui" font-size="12" fill="#64748b">generateMetadata() and metadata.</text>
  <rect x="598" y="92" width="272" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="634" cy="128" r="16" fill="#dbeafe"/>
  <text x="634" y="133" class="font-mono" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">R</text>
  <text x="618" y="172" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Native Remix v2 output</text>
  <text x="618" y="196" class="font-mono" font-size="11" fill="#2563eb">createMetaDescriptors()</text>
  <text x="618" y="214" class="font-ui" font-size="12" fill="#64748b">returns MetaDescriptor[] ready for</text>
  <text x="618" y="232" class="font-ui" font-size="12" fill="#64748b">export const meta in any route.</text>
  <!-- row 2 -->
  <rect x="30" y="290" width="272" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="66" cy="326" r="16" fill="#fef3c7"/>
  <text x="66" y="331" class="font-mono" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">rbt</text>
  <text x="50" y="370" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Full robots directives</text>
  <text x="50" y="394" class="font-ui" font-size="12" fill="#64748b">maxSnippet, maxImagePreview,</text>
  <text x="50" y="412" class="font-ui" font-size="12" fill="#64748b">maxVideoPreview, unavailableAfter</text>
  <text x="50" y="430" class="font-ui" font-size="12" fill="#64748b">— translated correctly per framework.</text>
  <rect x="314" y="290" width="272" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="350" cy="326" r="16" fill="#dcfce7"/>
  <text x="350" y="331" class="font-ui" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">0</text>
  <text x="334" y="370" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Zero runtime dependencies</text>
  <text x="334" y="394" class="font-ui" font-size="12" fill="#64748b">Pure, synchronous functions with no</text>
  <text x="334" y="412" class="font-ui" font-size="12" fill="#64748b">Node.js globals — safe in Cloudflare</text>
  <text x="334" y="430" class="font-ui" font-size="12" fill="#64748b">Workers, Vercel Edge, and Deno.</text>
  <rect x="598" y="290" width="272" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="634" cy="326" r="16" fill="#dbeafe"/>
  <text x="634" y="331" class="font-mono" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">og</text>
  <text x="618" y="370" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Typed OG + Twitter Cards</text>
  <text x="618" y="394" class="font-ui" font-size="12" fill="#64748b">OGImage[] with width, height, alt,</text>
  <text x="618" y="412" class="font-ui" font-size="12" fill="#64748b">type, plus TwitterCardConfig and</text>
  <text x="618" y="430" class="font-ui" font-size="12" fill="#64748b">hreflang via languageAlternates.</text>
</svg>
