<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280">
  <title>@power-seo/meta banner: one SeoConfig generates native meta output for Next.js App Router, Remix v2, and generic SSR frameworks</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>
  <!-- logo mark -->
  <rect x="64" y="64" width="56" height="56" rx="12" fill="#2563eb"/>
  <text x="92" y="100" class="font-mono" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  <!-- name + tagline -->
  <text x="140" y="94" class="font-ui" font-size="30" font-weight="700" fill="#0f172a">@power-seo/meta</text>
  <text x="140" y="124" class="font-ui" font-size="15" fill="#64748b">One SeoConfig &#8594; native meta output for Next.js, Remix v2, and any SSR framework</text>
  <!-- badges -->
  <rect x="140" y="150" width="176" height="26" rx="13" fill="#dcfce7"/>
  <text x="228" y="167" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="328" y="150" width="130" height="26" rx="13" fill="#dbeafe"/>
  <text x="393" y="167" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Edge runtime safe</text>
  <rect x="470" y="150" width="118" height="26" rx="13" fill="#f1f5f9"/>
  <text x="529" y="167" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">TypeScript-first</text>
  <!-- vignette: config card -->
  <rect x="770" y="50" width="200" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="786" y="76" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">SeoConfig</text>
  <text x="786" y="100" class="font-mono" font-size="11" fill="#0f172a">title: <tspan fill="#16a34a">'Pricing'</tspan></text>
  <text x="786" y="120" class="font-mono" font-size="11" fill="#0f172a">description: <tspan fill="#94a3b8">&#8230;</tspan></text>
  <text x="786" y="140" class="font-mono" font-size="11" fill="#0f172a">canonical: <tspan fill="#94a3b8">&#8230;</tspan></text>
  <text x="786" y="160" class="font-mono" font-size="11" fill="#0f172a">robots: <tspan fill="#7c3aed">{&#8230;}</tspan></text>
  <text x="786" y="180" class="font-mono" font-size="11" fill="#0f172a">openGraph: <tspan fill="#7c3aed">{&#8230;}</tspan></text>
  <text x="786" y="200" class="font-mono" font-size="11" fill="#0f172a">twitter: <tspan fill="#7c3aed">{&#8230;}</tspan></text>
  <!-- connectors -->
  <path d="M 970 140 H 995 V 74 H 1012" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 970 140 H 1012" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 970 140 H 995 V 206 H 1012" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 1012 68 L 1020 74 L 1012 80 Z" fill="#2563eb"/>
  <path d="M 1012 134 L 1020 140 L 1012 146 Z" fill="#2563eb"/>
  <path d="M 1012 200 L 1020 206 L 1012 212 Z" fill="#2563eb"/>
  <!-- output pills -->
  <rect x="1024" y="50" width="192" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1040" y="70" class="font-ui" font-size="12" font-weight="600" fill="#0f172a">Next.js Metadata</text>
  <text x="1040" y="88" class="font-mono" font-size="10" fill="#2563eb">createMetadata()</text>
  <rect x="1024" y="116" width="192" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1040" y="136" class="font-ui" font-size="12" font-weight="600" fill="#0f172a">Remix MetaDescriptor[]</text>
  <text x="1040" y="154" class="font-mono" font-size="10" fill="#2563eb">createMetaDescriptors()</text>
  <rect x="1024" y="182" width="192" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1040" y="202" class="font-ui" font-size="12" font-weight="600" fill="#0f172a">SSR head-tag HTML</text>
  <text x="1040" y="220" class="font-mono" font-size="10" fill="#2563eb">createHeadTags()</text>
</svg>
