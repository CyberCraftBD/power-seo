<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix showing @power-seo/meta supports native Next.js Metadata, Remix MetaDescriptor arrays, generic SSR output, and zero runtime dependencies versus next-seo, remix-seo, and react-helmet</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">@power-seo/meta vs alternatives</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">One config, native output per framework — feature support at a glance</text>
  <!-- table card -->
  <rect x="30" y="86" width="840" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- header row -->
  <path d="M 30 94 a 8 8 0 0 1 8 -8 h 824 a 8 8 0 0 1 8 8 v 36 H 30 Z" fill="#f8fafc"/>
  <line x1="30" y1="130" x2="870" y2="130" stroke="#e2e8f0"/>
  <text x="50" y="113" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FEATURE</text>
  <text x="500" y="113" class="font-ui" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">@power-seo/meta</text>
  <text x="626" y="113" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">next-seo</text>
  <text x="726" y="113" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">remix-seo</text>
  <text x="822" y="113" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">react-helmet</text>
  <!-- row separators -->
  <line x1="30" y1="172" x2="870" y2="172" stroke="#e2e8f0"/>
  <line x1="30" y1="214" x2="870" y2="214" stroke="#e2e8f0"/>
  <line x1="30" y1="256" x2="870" y2="256" stroke="#e2e8f0"/>
  <line x1="30" y1="298" x2="870" y2="298" stroke="#e2e8f0"/>
  <line x1="30" y1="340" x2="870" y2="340" stroke="#e2e8f0"/>
  <line x1="30" y1="382" x2="870" y2="382" stroke="#e2e8f0"/>
  <line x1="30" y1="424" x2="870" y2="424" stroke="#e2e8f0"/>
  <!-- highlight column -->
  <rect x="436" y="130" width="128" height="340" fill="#dbeafe" opacity="0.25"/>
  <!-- rows -->
  <text x="50" y="156" class="font-ui" font-size="13" fill="#0f172a">Next.js App Router native <tspan class="font-mono" font-size="12">Metadata</tspan></text>
  <text x="500" y="156" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="156" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="726" y="156" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="822" y="156" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="50" y="198" class="font-ui" font-size="13" fill="#0f172a">Remix v2 native <tspan class="font-mono" font-size="12">MetaDescriptor[]</tspan></text>
  <text x="500" y="198" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="198" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="726" y="198" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="822" y="198" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="50" y="240" class="font-ui" font-size="13" fill="#0f172a">Generic SSR HTML string output</text>
  <text x="500" y="240" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="240" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="726" y="240" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="822" y="240" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="50" y="282" class="font-ui" font-size="13" fill="#0f172a">One config &#8594; multiple frameworks</text>
  <text x="500" y="282" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="282" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="726" y="282" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="822" y="282" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="50" y="324" class="font-ui" font-size="13" fill="#0f172a">Structured tag object output</text>
  <text x="500" y="324" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="324" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="726" y="324" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="822" y="324" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="50" y="366" class="font-ui" font-size="13" fill="#0f172a">Full robots directive support</text>
  <text x="500" y="366" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="366" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="726" y="366" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="822" y="366" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="50" y="408" class="font-ui" font-size="13" fill="#0f172a">Zero runtime dependencies</text>
  <text x="500" y="408" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="408" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="726" y="408" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="822" y="408" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="50" y="450" class="font-ui" font-size="13" fill="#0f172a">Tree-shakeable</text>
  <text x="500" y="450" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">&#10003;</text>
  <text x="626" y="450" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
  <text x="726" y="450" class="font-ui" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Partial</text>
  <text x="822" y="450" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">&#8212;</text>
</svg>
