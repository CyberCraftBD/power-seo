<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>One RobotsDirective config with maxSnippet, maxImagePreview, maxVideoPreview, and unavailableAfter translated by @power-seo/meta into Next.js metadata.other robots, a Remix meta descriptor, and a plain HTML robots meta tag</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Advanced robots directives, translated per framework</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">No manual mapping — maxSnippet, maxImagePreview and friends land in the right place</text>
  <!-- input card -->
  <rect x="30" y="94" width="330" height="376" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">RobotsDirective input</text>
  <rect x="50" y="138" width="290" height="220" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="66" y="164" class="font-mono" font-size="12" fill="#0f172a">robots: {</text>
  <text x="84" y="186" class="font-mono" font-size="12" fill="#0f172a">index: <tspan fill="#7c3aed">true</tspan>,</text>
  <text x="84" y="208" class="font-mono" font-size="12" fill="#0f172a">follow: <tspan fill="#7c3aed">true</tspan>,</text>
  <text x="84" y="230" class="font-mono" font-size="12" fill="#0f172a">maxSnippet: <tspan fill="#7c3aed">160</tspan>,</text>
  <text x="84" y="252" class="font-mono" font-size="12" fill="#0f172a">maxImagePreview: <tspan fill="#16a34a">'large'</tspan>,</text>
  <text x="84" y="274" class="font-mono" font-size="12" fill="#0f172a">maxVideoPreview: <tspan fill="#7c3aed">30</tspan>,</text>
  <text x="84" y="296" class="font-mono" font-size="12" fill="#0f172a">unavailableAfter:</text>
  <text x="102" y="318" class="font-mono" font-size="12" fill="#16a34a">'2026-12-31'</text>
  <text x="66" y="340" class="font-mono" font-size="12" fill="#0f172a">}</text>
  <rect x="50" y="376" width="128" height="24" rx="12" fill="#dcfce7"/>
  <text x="114" y="392" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">10 typed directives</text>
  <text x="50" y="428" class="font-ui" font-size="12" fill="#64748b">Also: noarchive, nosnippet,</text>
  <text x="50" y="446" class="font-ui" font-size="12" fill="#64748b">noimageindex, notranslate</text>
  <!-- connectors -->
  <path d="M 360 282 H 385 V 154 H 405" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 360 282 H 405" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 360 282 H 385 V 410 H 405" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 402 148 L 412 154 L 402 160 Z" fill="#2563eb"/>
  <path d="M 402 276 L 412 282 L 402 288 Z" fill="#2563eb"/>
  <path d="M 402 404 L 412 410 L 402 416 Z" fill="#2563eb"/>
  <!-- output: Next.js -->
  <rect x="418" y="94" width="452" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="438" y="110" width="128" height="22" rx="11" fill="#dbeafe"/>
  <text x="502" y="125" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Next.js App Router</text>
  <text x="438" y="154" class="font-mono" font-size="11" fill="#64748b">metadata.other[<tspan fill="#16a34a">'robots'</tspan>] via buildRobotsContent()</text>
  <text x="438" y="176" class="font-mono" font-size="11" fill="#0f172a">'index, follow, max-snippet:160,</text>
  <text x="438" y="194" class="font-mono" font-size="11" fill="#0f172a"> max-image-preview:large, max-video-preview:30, &#8230;'</text>
  <!-- output: Remix -->
  <rect x="418" y="222" width="452" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="438" y="238" width="76" height="22" rx="11" fill="#dbeafe"/>
  <text x="476" y="253" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Remix v2</text>
  <text x="438" y="282" class="font-mono" font-size="11" fill="#64748b">MetaDescriptor entry from createMetaDescriptors()</text>
  <text x="438" y="304" class="font-mono" font-size="11" fill="#0f172a">{ name: <tspan fill="#16a34a">'robots'</tspan>,</text>
  <text x="438" y="322" class="font-mono" font-size="11" fill="#0f172a">  content: <tspan fill="#16a34a">'index, follow, max-snippet:160, &#8230;'</tspan> }</text>
  <!-- output: HTML -->
  <rect x="418" y="350" width="452" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="438" y="366" width="100" height="22" rx="11" fill="#dbeafe"/>
  <text x="488" y="381" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Generic SSR</text>
  <text x="438" y="410" class="font-mono" font-size="11" fill="#64748b">HTML string from createHeadTags()</text>
  <text x="438" y="432" class="font-mono" font-size="11" fill="#0f172a">&lt;meta name=<tspan fill="#16a34a">"robots"</tspan> content=<tspan fill="#16a34a">"index, follow,</tspan></text>
  <text x="438" y="450" class="font-mono" font-size="11" fill="#16a34a">  max-snippet:160, max-image-preview:large, &#8230;"<tspan fill="#0f172a">&gt;</tspan></text>
</svg>
