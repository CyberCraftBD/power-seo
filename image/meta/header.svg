<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>@power-seo/meta hero: a single SeoConfig passed to createMetadata is converted into native Next.js Metadata, Remix v2 MetaDescriptor arrays, and generic SSR head-tag HTML</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- brand -->
  <rect x="516" y="36" width="40" height="40" rx="10" fill="#2563eb"/>
  <text x="536" y="62" class="font-mono" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  <text x="568" y="64" class="font-ui" font-size="30" font-weight="700" fill="#0f172a">@power-seo/meta</text>
  <text x="600" y="104" class="font-ui" font-size="16" fill="#64748b" text-anchor="middle">Server-side meta tags from one unified config — typed native output for every SSR framework</text>
  <!-- badges -->
  <rect x="404" y="124" width="176" height="28" rx="14" fill="#dcfce7"/>
  <text x="492" y="142" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="592" y="124" width="130" height="28" rx="14" fill="#dbeafe"/>
  <text x="657" y="142" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Edge runtime safe</text>
  <rect x="734" y="124" width="62" height="28" rx="14" fill="#f1f5f9"/>
  <text x="765" y="142" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Typed</text>
  <!-- input code card -->
  <rect x="70" y="184" width="510" height="400" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="94" y="214" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">One SeoConfig</text>
  <rect x="94" y="230" width="462" height="330" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="112" y="256" class="font-mono" font-size="12" fill="#2563eb">createMetadata<tspan fill="#0f172a">({</tspan></text>
  <text x="130" y="276" class="font-mono" font-size="12" fill="#0f172a">title: <tspan fill="#16a34a">'Pricing — Acme'</tspan>,</text>
  <text x="130" y="296" class="font-mono" font-size="12" fill="#0f172a">description: <tspan fill="#16a34a">'Simple, usage-based pricing.'</tspan>,</text>
  <text x="130" y="316" class="font-mono" font-size="12" fill="#0f172a">canonical: <tspan fill="#16a34a">'https://acme.dev/pricing'</tspan>,</text>
  <text x="130" y="336" class="font-mono" font-size="12" fill="#0f172a">robots: {</text>
  <text x="148" y="356" class="font-mono" font-size="12" fill="#0f172a">index: <tspan fill="#7c3aed">true</tspan>, follow: <tspan fill="#7c3aed">true</tspan>,</text>
  <text x="148" y="376" class="font-mono" font-size="12" fill="#0f172a">maxSnippet: <tspan fill="#7c3aed">160</tspan>,</text>
  <text x="148" y="396" class="font-mono" font-size="12" fill="#0f172a">maxImagePreview: <tspan fill="#16a34a">'large'</tspan>,</text>
  <text x="130" y="416" class="font-mono" font-size="12" fill="#0f172a">},</text>
  <text x="130" y="436" class="font-mono" font-size="12" fill="#0f172a">openGraph: {</text>
  <text x="148" y="456" class="font-mono" font-size="12" fill="#0f172a">type: <tspan fill="#16a34a">'website'</tspan>, siteName: <tspan fill="#16a34a">'Acme'</tspan>,</text>
  <text x="148" y="476" class="font-mono" font-size="12" fill="#0f172a">images: [{ url: <tspan fill="#16a34a">'/og.jpg'</tspan>,</text>
  <text x="166" y="496" class="font-mono" font-size="12" fill="#0f172a">width: <tspan fill="#7c3aed">1200</tspan>, height: <tspan fill="#7c3aed">630</tspan> }],</text>
  <text x="130" y="516" class="font-mono" font-size="12" fill="#0f172a">},</text>
  <text x="130" y="536" class="font-mono" font-size="12" fill="#0f172a">twitter: { cardType: <tspan fill="#16a34a">'summary_large_image'</tspan> },</text>
  <text x="112" y="556" class="font-mono" font-size="12" fill="#0f172a">})</text>
  <!-- arrow -->
  <line x1="586" y1="384" x2="632" y2="384" stroke="#2563eb" stroke-width="2"/>
  <path d="M 630 377 L 642 384 L 630 391 Z" fill="#2563eb"/>
  <!-- output cards -->
  <rect x="654" y="184" width="476" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="674" y="202" width="128" height="22" rx="11" fill="#dbeafe"/>
  <text x="738" y="217" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Next.js App Router</text>
  <text x="674" y="248" class="font-mono" font-size="12" fill="#2563eb">createMetadata() <tspan fill="#64748b">&#8594; Metadata</tspan></text>
  <text x="674" y="270" class="font-mono" font-size="11" fill="#64748b">{ title, description, alternates, openGraph,</text>
  <text x="674" y="288" class="font-mono" font-size="11" fill="#64748b">  other: { robots: <tspan fill="#16a34a">'max-snippet:160, &#8230;'</tspan> } }</text>
  <rect x="654" y="324" width="476" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="674" y="342" width="76" height="22" rx="11" fill="#dbeafe"/>
  <text x="712" y="357" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Remix v2</text>
  <text x="674" y="388" class="font-mono" font-size="12" fill="#2563eb">createMetaDescriptors() <tspan fill="#64748b">&#8594; MetaDescriptor[]</tspan></text>
  <text x="674" y="410" class="font-mono" font-size="11" fill="#64748b">[{ title }, { name: <tspan fill="#16a34a">'description'</tspan>, content },</text>
  <text x="674" y="428" class="font-mono" font-size="11" fill="#64748b"> { tagName: <tspan fill="#16a34a">'link'</tspan>, rel: <tspan fill="#16a34a">'canonical'</tspan>, &#8230; }]</text>
  <rect x="654" y="464" width="476" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="674" y="482" width="176" height="22" rx="11" fill="#dbeafe"/>
  <text x="762" y="497" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Astro / SvelteKit / Express</text>
  <text x="674" y="528" class="font-mono" font-size="12" fill="#2563eb">createHeadTags() <tspan fill="#64748b">&#8594; string</tspan></text>
  <text x="674" y="550" class="font-mono" font-size="11" fill="#64748b">&lt;title&gt;Pricing — Acme&lt;/title&gt;</text>
  <text x="674" y="568" class="font-mono" font-size="11" fill="#64748b">&lt;link rel="canonical" href="https://acme.dev/pricing"&gt;</text>
</svg>
