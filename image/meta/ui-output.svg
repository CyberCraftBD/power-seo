<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Meta output viewer showing a SeoConfig input and the generated Next.js Metadata object, with tabs for Remix v2 and HTML output formats</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <rect x="16" y="16" width="24" height="24" rx="6" fill="#2563eb"/>
  <text x="28" y="33" class="font-mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ps</text>
  <text x="48" y="33" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">power-seo</text>
  <text x="16" y="80" class="font-ui" font-size="13" fill="#64748b">Dashboard</text>
  <rect x="8" y="96" width="164" height="30" rx="6" fill="#dbeafe"/>
  <text x="16" y="116" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Meta Output</text>
  <text x="16" y="152" class="font-ui" font-size="13" fill="#64748b">Sitemap</text>
  <text x="16" y="184" class="font-ui" font-size="13" fill="#64748b">Audit</text>
  <text x="16" y="216" class="font-ui" font-size="13" fill="#64748b">Settings</text>
  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Meta Output</text>
  <rect x="776" y="11" width="100" height="30" rx="6" fill="#2563eb"/>
  <text x="826" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Generate</text>
  <!-- input card -->
  <rect x="204" y="72" width="310" height="404" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="222" y="100" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">SeoConfig</text>
  <rect x="222" y="116" width="274" height="290" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="238" y="140" class="font-mono" font-size="11" fill="#0f172a">{</text>
  <text x="252" y="160" class="font-mono" font-size="11" fill="#0f172a">title: <tspan fill="#16a34a">'Pricing — Acme'</tspan>,</text>
  <text x="252" y="180" class="font-mono" font-size="11" fill="#0f172a">description: <tspan fill="#16a34a">'Simple,</tspan></text>
  <text x="266" y="200" class="font-mono" font-size="11" fill="#16a34a">usage-based pricing.'<tspan fill="#0f172a">,</tspan></text>
  <text x="252" y="220" class="font-mono" font-size="11" fill="#0f172a">canonical: <tspan fill="#16a34a">'https://</tspan></text>
  <text x="266" y="240" class="font-mono" font-size="11" fill="#16a34a">acme.dev/pricing'<tspan fill="#0f172a">,</tspan></text>
  <text x="252" y="260" class="font-mono" font-size="11" fill="#0f172a">robots: { index: <tspan fill="#7c3aed">true</tspan>,</text>
  <text x="266" y="280" class="font-mono" font-size="11" fill="#0f172a">follow: <tspan fill="#7c3aed">true</tspan>, maxSnippet: <tspan fill="#7c3aed">160</tspan> },</text>
  <text x="252" y="300" class="font-mono" font-size="11" fill="#0f172a">openGraph: { type: <tspan fill="#16a34a">'website'</tspan>,</text>
  <text x="266" y="320" class="font-mono" font-size="11" fill="#0f172a">siteName: <tspan fill="#16a34a">'Acme'</tspan>,</text>
  <text x="266" y="340" class="font-mono" font-size="11" fill="#0f172a">images: [{ url: <tspan fill="#16a34a">'/og.jpg'</tspan>,</text>
  <text x="280" y="360" class="font-mono" font-size="11" fill="#0f172a">width: <tspan fill="#7c3aed">1200</tspan>, height: <tspan fill="#7c3aed">630</tspan> }] },</text>
  <text x="238" y="380" class="font-mono" font-size="11" fill="#0f172a">}</text>
  <rect x="222" y="422" width="150" height="24" rx="12" fill="#dcfce7"/>
  <text x="297" y="438" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Valid — 0 config issues</text>
  <!-- output card -->
  <rect x="530" y="72" width="346" height="404" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- tabs -->
  <text x="548" y="102" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Next.js</text>
  <rect x="548" y="110" width="44" height="2" fill="#2563eb"/>
  <text x="614" y="102" class="font-ui" font-size="13" fill="#64748b">Remix v2</text>
  <text x="694" y="102" class="font-ui" font-size="13" fill="#64748b">HTML</text>
  <line x1="530" y1="116" x2="876" y2="116" stroke="#e2e8f0"/>
  <text x="548" y="142" class="font-mono" font-size="11" fill="#94a3b8">// createMetadata(config)</text>
  <text x="548" y="164" class="font-mono" font-size="11" fill="#0f172a">{</text>
  <text x="562" y="184" class="font-mono" font-size="11" fill="#0f172a">title: <tspan fill="#16a34a">'Pricing — Acme'</tspan>,</text>
  <text x="562" y="204" class="font-mono" font-size="11" fill="#0f172a">description: <tspan fill="#16a34a">'Simple, usage-based</tspan></text>
  <text x="576" y="224" class="font-mono" font-size="11" fill="#16a34a">pricing.'<tspan fill="#0f172a">,</tspan></text>
  <text x="562" y="244" class="font-mono" font-size="11" fill="#0f172a">robots: { index: <tspan fill="#7c3aed">true</tspan>, follow: <tspan fill="#7c3aed">true</tspan> },</text>
  <text x="562" y="264" class="font-mono" font-size="11" fill="#0f172a">other: { robots: <tspan fill="#16a34a">'index, follow,</tspan></text>
  <text x="576" y="284" class="font-mono" font-size="11" fill="#16a34a">max-snippet:160'<tspan fill="#0f172a"> },</tspan></text>
  <text x="562" y="304" class="font-mono" font-size="11" fill="#0f172a">openGraph: { type: <tspan fill="#16a34a">'website'</tspan>,</text>
  <text x="576" y="324" class="font-mono" font-size="11" fill="#0f172a">siteName: <tspan fill="#16a34a">'Acme'</tspan>, images: [&#8230;] },</text>
  <text x="562" y="344" class="font-mono" font-size="11" fill="#0f172a">alternates: { canonical:</text>
  <text x="576" y="364" class="font-mono" font-size="11" fill="#16a34a">'https://acme.dev/pricing'<tspan fill="#0f172a"> },</tspan></text>
  <text x="548" y="384" class="font-mono" font-size="11" fill="#0f172a">}</text>
  <rect x="548" y="410" width="140" height="24" rx="12" fill="#dbeafe"/>
  <text x="618" y="426" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Metadata — App Router</text>
  <rect x="700" y="410" width="110" height="24" rx="12" fill="#dcfce7"/>
  <text x="755" y="426" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Type-checked</text>
</svg>
