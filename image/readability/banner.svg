<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280">
  <title>power-seo readability banner showing five readability algorithms with a live score panel scoring 64 on Flesch Reading Ease</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>
  <!-- left: branding -->
  <text x="64" y="96" class="font-mono" font-size="34" font-weight="700" fill="#0f172a">@power-seo/<tspan fill="#2563eb">readability</tspan></text>
  <text x="64" y="134" class="font-ui" font-size="17" fill="#64748b">Five readability algorithms, one typed TypeScript API — with actionable status labels.</text>
  <!-- algorithm pills -->
  <rect x="64" y="160" width="150" height="28" rx="14" fill="#dbeafe"/>
  <text x="139" y="178" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Flesch Reading Ease</text>
  <rect x="222" y="160" width="128" height="28" rx="14" fill="#dbeafe"/>
  <text x="286" y="178" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Flesch-Kincaid</text>
  <rect x="358" y="160" width="108" height="28" rx="14" fill="#dbeafe"/>
  <text x="412" y="178" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Gunning Fog</text>
  <rect x="474" y="160" width="112" height="28" rx="14" fill="#dbeafe"/>
  <text x="530" y="178" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Coleman-Liau</text>
  <rect x="594" y="160" width="60" height="28" rx="14" fill="#dbeafe"/>
  <text x="624" y="178" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">ARI</text>
  <!-- footer chips -->
  <text x="64" y="224" class="font-ui" font-size="13" fill="#64748b">Zero runtime dependencies</text>
  <circle cx="252" cy="219" r="2" fill="#94a3b8"/>
  <text x="264" y="224" class="font-ui" font-size="13" fill="#64748b">Tree-shakeable</text>
  <circle cx="374" cy="219" r="2" fill="#94a3b8"/>
  <text x="386" y="224" class="font-ui" font-size="13" fill="#64748b">HTML stripped automatically</text>
  <circle cx="580" cy="219" r="2" fill="#94a3b8"/>
  <text x="592" y="224" class="font-ui" font-size="13" fill="#64748b">SSR + Edge safe</text>
  <!-- right: score card vignette -->
  <rect x="780" y="34" width="436" height="212" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="804" y="66" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Readability</text>
  <rect x="1140" y="50" width="52" height="22" rx="11" fill="#dcfce7"/>
  <text x="1166" y="65" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
  <!-- score ring -->
  <circle cx="856" cy="150" r="42" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <path d="M 856 108 A 42 42 0 1 1 822 171" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <text x="856" y="158" class="font-ui" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">64</text>
  <text x="856" y="222" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Flesch Reading Ease</text>
  <!-- mini rows -->
  <text x="928" y="112" class="font-mono" font-size="12" fill="#64748b">fleschKincaidGrade</text>
  <text x="1192" y="112" class="font-mono" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">8.3</text>
  <line x1="928" y1="122" x2="1192" y2="122" stroke="#e2e8f0"/>
  <text x="928" y="142" class="font-mono" font-size="12" fill="#64748b">gunningFog</text>
  <text x="1192" y="142" class="font-mono" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">9.1</text>
  <line x1="928" y1="152" x2="1192" y2="152" stroke="#e2e8f0"/>
  <text x="928" y="172" class="font-mono" font-size="12" fill="#64748b">colemanLiau</text>
  <text x="1192" y="172" class="font-mono" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">10.2</text>
  <line x1="928" y1="182" x2="1192" y2="182" stroke="#e2e8f0"/>
  <text x="928" y="202" class="font-mono" font-size="12" fill="#64748b">automatedReadability</text>
  <text x="1192" y="202" class="font-mono" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">8.9</text>
</svg>
