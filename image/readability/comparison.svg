<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix of power-seo readability versus text-readability, readability-scores, and flesch libraries</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Readability Library Comparison</text>
  <!-- table card -->
  <rect x="40" y="64" width="820" height="404" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- header row -->
  <rect x="41" y="65" width="818" height="42" rx="7" fill="#f8fafc"/>
  <text x="60" y="91" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FEATURE</text>
  <text x="465" y="84" class="font-mono" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">@power-seo/</text>
  <text x="465" y="98" class="font-mono" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">readability</text>
  <text x="600" y="91" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">text-readability</text>
  <text x="722" y="84" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">readability-</text>
  <text x="722" y="98" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">scores</text>
  <text x="820" y="91" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">flesch</text>
  <!-- highlight column -->
  <rect x="410" y="107" width="110" height="360" fill="#dbeafe" opacity="0.35"/>
  <!-- rows: y = 107 + 36*i, text baseline +23, marks at same -->
  <line x1="41" y1="107" x2="859" y2="107" stroke="#e2e8f0"/>
  <text x="60" y="130" class="font-ui" font-size="13" fill="#0f172a">Flesch Reading Ease</text>
  <text x="465" y="130" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="130" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="722" y="130" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="820" y="130" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <line x1="41" y1="143" x2="859" y2="143" stroke="#e2e8f0"/>
  <text x="60" y="166" class="font-ui" font-size="13" fill="#0f172a">Flesch-Kincaid Grade Level</text>
  <text x="465" y="166" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="166" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="722" y="166" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="820" y="166" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="179" x2="859" y2="179" stroke="#e2e8f0"/>
  <text x="60" y="202" class="font-ui" font-size="13" fill="#0f172a">Gunning Fog Index</text>
  <text x="465" y="202" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="202" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="722" y="202" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="820" y="202" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="215" x2="859" y2="215" stroke="#e2e8f0"/>
  <text x="60" y="238" class="font-ui" font-size="13" fill="#0f172a">Coleman-Liau Index</text>
  <text x="465" y="238" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="238" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="722" y="238" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="820" y="238" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="251" x2="859" y2="251" stroke="#e2e8f0"/>
  <text x="60" y="274" class="font-ui" font-size="13" fill="#0f172a">Automated Readability Index (ARI)</text>
  <text x="465" y="274" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="274" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="722" y="274" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="820" y="274" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="287" x2="859" y2="287" stroke="#e2e8f0"/>
  <text x="60" y="310" class="font-ui" font-size="13" fill="#0f172a">Status labels per score</text>
  <text x="465" y="310" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="310" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="722" y="310" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="820" y="310" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="323" x2="859" y2="323" stroke="#e2e8f0"/>
  <text x="60" y="346" class="font-ui" font-size="13" fill="#0f172a">Unified multi-algorithm API</text>
  <text x="465" y="346" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="346" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="722" y="346" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="820" y="346" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="359" x2="859" y2="359" stroke="#e2e8f0"/>
  <text x="60" y="382" class="font-ui" font-size="13" fill="#0f172a">HTML auto-stripping</text>
  <text x="465" y="382" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="382" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="722" y="382" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="820" y="382" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="395" x2="859" y2="395" stroke="#e2e8f0"/>
  <text x="60" y="418" class="font-ui" font-size="13" fill="#0f172a">TypeScript-first with full types</text>
  <text x="465" y="418" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="418" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="722" y="418" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="820" y="418" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="41" y1="431" x2="859" y2="431" stroke="#e2e8f0"/>
  <text x="60" y="454" class="font-ui" font-size="13" fill="#0f172a">Zero runtime dependencies</text>
  <text x="465" y="454" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="600" y="454" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="722" y="454" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="820" y="454" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="450" y="488" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Feature availability based on published package documentation.</text>
</svg>
