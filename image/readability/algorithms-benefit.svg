<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Five tree-shakeable readability algorithm functions feeding the unified analyzeReadability API in power-seo readability</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Five Algorithms. One Unified API.</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Import individual functions, or run everything with analyzeReadability()</text>
  <!-- algorithm cards, row 1 -->
  <rect x="40" y="90" width="264" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="118" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">fleschReadingEase()</text>
  <text x="60" y="140" class="font-ui" font-size="12" fill="#64748b">0–100 score, higher = easier.</text>
  <text x="60" y="157" class="font-ui" font-size="12" fill="#64748b">60–69 is standard web content.</text>
  <rect x="60" y="168" width="96" height="20" rx="10" fill="#dbeafe"/>
  <text x="108" y="182" class="font-ui" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">ease score</text>
  <rect x="318" y="90" width="264" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="338" y="118" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">fleschKincaidGrade()</text>
  <text x="338" y="140" class="font-ui" font-size="12" fill="#64748b">US school grade level.</text>
  <text x="338" y="157" class="font-ui" font-size="12" fill="#64748b">8.0 = readable by 8th grade.</text>
  <rect x="338" y="168" width="96" height="20" rx="10" fill="#dbeafe"/>
  <text x="386" y="182" class="font-ui" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">grade level</text>
  <rect x="596" y="90" width="264" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="616" y="118" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">gunningFog()</text>
  <text x="616" y="140" class="font-ui" font-size="12" fill="#64748b">Grade estimate from complex</text>
  <text x="616" y="157" class="font-ui" font-size="12" fill="#64748b">word (3+ syllable) density.</text>
  <rect x="616" y="168" width="96" height="20" rx="10" fill="#dbeafe"/>
  <text x="664" y="182" class="font-ui" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">grade level</text>
  <!-- row 2 -->
  <rect x="179" y="216" width="264" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="199" y="244" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">colemanLiau()</text>
  <text x="199" y="266" class="font-ui" font-size="12" fill="#64748b">Character-based formula —</text>
  <text x="199" y="283" class="font-ui" font-size="12" fill="#64748b">no syllable counting required.</text>
  <rect x="199" y="294" width="96" height="20" rx="10" fill="#dbeafe"/>
  <text x="247" y="308" class="font-ui" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">grade level</text>
  <rect x="457" y="216" width="264" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="477" y="244" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">automatedReadability()</text>
  <text x="477" y="266" class="font-ui" font-size="12" fill="#64748b">ARI — grade estimate from</text>
  <text x="477" y="283" class="font-ui" font-size="12" fill="#64748b">character and word counts.</text>
  <rect x="477" y="294" width="96" height="20" rx="10" fill="#dbeafe"/>
  <text x="525" y="308" class="font-ui" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">grade level</text>
  <!-- connectors -->
  <path d="M 172 198 L 260 342" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M 450 198 L 450 342" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M 728 198 L 640 342" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M 311 324 L 380 348" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M 589 324 L 520 348" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <!-- unified API bar -->
  <rect x="180" y="352" width="540" height="56" rx="8" fill="#2563eb"/>
  <text x="450" y="378" class="font-mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">analyzeReadability({ content })</text>
  <text x="450" y="397" class="font-ui" font-size="11" fill="#dbeafe" text-anchor="middle">score · results[] · recommendations[] · passive voice · transition words · sentence length</text>
  <!-- benefit chips -->
  <rect x="180" y="432" width="166" height="28" rx="14" fill="#dcfce7"/>
  <text x="263" y="450" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Tree-shakeable exports</text>
  <rect x="358" y="432" width="184" height="28" rx="14" fill="#dcfce7"/>
  <text x="450" y="450" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="554" y="432" width="166" height="28" rx="14" fill="#dcfce7"/>
  <text x="637" y="450" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Typed results per check</text>
</svg>
