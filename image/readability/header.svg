<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>power-seo readability hero graphic with an analyzeReadability code example and a readability results panel showing Flesch, sentence length, and passive voice checks</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- headline -->
  <text x="600" y="92" class="font-mono" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">@power-seo/<tspan fill="#2563eb">readability</tspan></text>
  <text x="600" y="130" class="font-ui" font-size="18" fill="#64748b" text-anchor="middle">Readability scoring for TypeScript — Flesch Reading Ease, Flesch-Kincaid, Gunning Fog, Coleman-Liau, and ARI.</text>
  <rect x="464" y="152" width="130" height="26" rx="13" fill="#dcfce7"/>
  <text x="529" y="169" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Zero dependencies</text>
  <rect x="604" y="152" width="132" height="26" rx="13" fill="#dbeafe"/>
  <text x="670" y="169" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript-first</text>
  <!-- left: code block card -->
  <rect x="64" y="208" width="540" height="358" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="88" y="240" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Quick start</text>
  <rect x="88" y="256" width="492" height="286" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="108" y="288" class="font-mono" font-size="13"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { </tspan><tspan fill="#2563eb">analyzeReadability</tspan><tspan fill="#0f172a"> }</tspan></text>
  <text x="108" y="310" class="font-mono" font-size="13"><tspan fill="#0f172a">  </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#16a34a"> '@power-seo/readability'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="108" y="344" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> result = </tspan><tspan fill="#2563eb">analyzeReadability</tspan><tspan fill="#0f172a">({</tspan></text>
  <text x="108" y="366" class="font-mono" font-size="13"><tspan fill="#0f172a">  content: </tspan><tspan fill="#16a34a">'&lt;p&gt;Your article HTML...&lt;/p&gt;'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="108" y="388" class="font-mono" font-size="13" fill="#0f172a">});</text>
  <text x="108" y="422" class="font-mono" font-size="13"><tspan fill="#0f172a">result.fleschReadingEase;   </tspan><tspan fill="#94a3b8">// 64.2</tspan></text>
  <text x="108" y="444" class="font-mono" font-size="13"><tspan fill="#0f172a">result.fleschKincaidGrade;  </tspan><tspan fill="#94a3b8">// 8.3</tspan></text>
  <text x="108" y="466" class="font-mono" font-size="13"><tspan fill="#0f172a">result.score;               </tspan><tspan fill="#94a3b8">// 64</tspan></text>
  <text x="108" y="488" class="font-mono" font-size="13"><tspan fill="#0f172a">result.recommendations;     </tspan><tspan fill="#94a3b8">// string[]</tspan></text>
  <text x="108" y="522" class="font-mono" font-size="13" fill="#94a3b8">// HTML tags are stripped automatically</text>
  <!-- right: results panel card -->
  <rect x="628" y="208" width="508" height="358" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="652" y="240" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Readability results</text>
  <!-- score ring -->
  <circle cx="700" cy="308" r="36" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <path d="M 700 272 A 36 36 0 1 1 671 290" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <text x="700" y="315" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">64</text>
  <text x="756" y="298" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Overall score</text>
  <text x="756" y="318" class="font-ui" font-size="12" fill="#64748b">Normalized from Flesch Reading Ease (0–100)</text>
  <!-- check rows -->
  <line x1="652" y1="360" x2="1112" y2="360" stroke="#e2e8f0"/>
  <text x="652" y="386" class="font-ui" font-size="13" fill="#0f172a">Flesch Reading Ease</text>
  <text x="1000" y="386" class="font-mono" font-size="12" fill="#64748b" text-anchor="end">64.2</text>
  <rect x="1044" y="370" width="52" height="20" rx="10" fill="#dcfce7"/>
  <text x="1070" y="384" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
  <line x1="652" y1="398" x2="1112" y2="398" stroke="#e2e8f0"/>
  <text x="652" y="424" class="font-ui" font-size="13" fill="#0f172a">Sentence length</text>
  <text x="1000" y="424" class="font-mono" font-size="12" fill="#64748b" text-anchor="end">18% over 20 words</text>
  <rect x="1044" y="408" width="52" height="20" rx="10" fill="#dcfce7"/>
  <text x="1070" y="422" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
  <line x1="652" y1="436" x2="1112" y2="436" stroke="#e2e8f0"/>
  <text x="652" y="462" class="font-ui" font-size="13" fill="#0f172a">Passive voice</text>
  <text x="1000" y="462" class="font-mono" font-size="12" fill="#64748b" text-anchor="end">14% of sentences</text>
  <rect x="1044" y="446" width="52" height="20" rx="10" fill="#fef3c7"/>
  <text x="1070" y="460" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">ok</text>
  <line x1="652" y1="474" x2="1112" y2="474" stroke="#e2e8f0"/>
  <text x="652" y="500" class="font-ui" font-size="13" fill="#0f172a">Transition words</text>
  <text x="1000" y="500" class="font-mono" font-size="12" fill="#64748b" text-anchor="end">34% of sentences</text>
  <rect x="1044" y="484" width="52" height="20" rx="10" fill="#dcfce7"/>
  <text x="1070" y="498" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
  <line x1="652" y1="512" x2="1112" y2="512" stroke="#e2e8f0"/>
  <text x="652" y="538" class="font-ui" font-size="13" fill="#0f172a">Paragraph length</text>
  <text x="1000" y="538" class="font-mono" font-size="12" fill="#64748b" text-anchor="end">0 over 150 words</text>
  <rect x="1044" y="522" width="52" height="20" rx="10" fill="#dcfce7"/>
  <text x="1070" y="536" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
  <!-- footer -->
  <text x="600" y="606" class="font-ui" font-size="13" fill="#94a3b8" text-anchor="middle">npm install @power-seo/readability</text>
</svg>
