<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison of manual readability review versus an automated pipeline using analyzeReadability in a CI content quality gate</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Manual Review vs Automated Readability Gate</text>
  <!-- left panel: manual -->
  <rect x="40" y="70" width="395" height="392" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="60" y="90" width="128" height="24" rx="12" fill="#fee2e2"/>
  <text x="124" y="106" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Manual process</text>
  <text x="60" y="146" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Reviewing readability by hand</text>
  <circle cx="70" cy="182" r="5" fill="#ef4444"/>
  <text x="86" y="186" class="font-ui" font-size="13" fill="#64748b">Paste content into a web readability tool</text>
  <circle cx="70" cy="218" r="5" fill="#ef4444"/>
  <text x="86" y="222" class="font-ui" font-size="13" fill="#64748b">Strip HTML tags before every check</text>
  <circle cx="70" cy="254" r="5" fill="#ef4444"/>
  <text x="86" y="258" class="font-ui" font-size="13" fill="#64748b">Interpret raw scores against thresholds</text>
  <circle cx="70" cy="290" r="5" fill="#ef4444"/>
  <text x="86" y="294" class="font-ui" font-size="13" fill="#64748b">Repeat for every draft and revision</text>
  <circle cx="70" cy="326" r="5" fill="#ef4444"/>
  <text x="86" y="330" class="font-ui" font-size="13" fill="#64748b">No check at publish time — complex</text>
  <text x="86" y="348" class="font-ui" font-size="13" fill="#64748b">content ships unnoticed</text>
  <rect x="60" y="380" width="355" height="1" fill="#e2e8f0"/>
  <text x="60" y="410" class="font-ui" font-size="12" fill="#94a3b8">One page at a time, per editor, per revision.</text>
  <text x="60" y="430" class="font-ui" font-size="12" fill="#94a3b8">Results are not typed, stored, or enforced.</text>
  <!-- arrow -->
  <path d="M 442 266 L 458 266 M 452 259 L 460 266 L 452 273" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right panel: automated -->
  <rect x="465" y="70" width="395" height="392" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="485" y="90" width="204" height="24" rx="12" fill="#dcfce7"/>
  <text x="587" y="106" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">With @power-seo/readability</text>
  <text x="485" y="146" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">One function call in the pipeline</text>
  <!-- workflow steps -->
  <rect x="485" y="164" width="355" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="501" y="187" class="font-mono" font-size="12"><tspan fill="#2563eb">analyzeReadability</tspan><tspan fill="#0f172a">({ content })</tspan></text>
  <path d="M 662 200 L 662 212" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="485" y="214" width="355" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="501" y="237" class="font-ui" font-size="12" fill="#0f172a">HTML stripped, five formulas scored</text>
  <path d="M 662 250 L 662 262" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="485" y="264" width="355" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="501" y="287" class="font-mono" font-size="12"><tspan fill="#0f172a">results[] </tspan><tspan fill="#94a3b8">+ recommendations[]</tspan></text>
  <path d="M 662 300 L 662 312" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="485" y="314" width="355" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="501" y="337" class="font-ui" font-size="12" fill="#0f172a">CI gate blocks publish when status is <tspan class="font-mono" fill="#b91c1c">'poor'</tspan></text>
  <rect x="485" y="380" width="355" height="1" fill="#e2e8f0"/>
  <circle cx="495" cy="406" r="5" fill="#16a34a"/>
  <text x="510" y="410" class="font-ui" font-size="12" fill="#64748b">Every page scored automatically at build time</text>
  <circle cx="495" cy="434" r="5" fill="#16a34a"/>
  <text x="510" y="438" class="font-ui" font-size="12" fill="#64748b">Typed scores + actionable recommendations</text>
</svg>
