<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Architecture diagram showing @power-seo/core as the shared foundation layer consumed by the react, schema, sitemap, audit, content-analysis and meta packages</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Architecture — the shared foundation</text>
  <text x="32" y="66" class="font-ui" font-size="13" fill="#64748b">Every @power-seo package builds on the same core types and utilities</text>

  <!-- top layer: consumer packages -->
  <text x="32" y="102" class="font-ui" font-size="12" font-weight="600" fill="#94a3b8">CONSUMER PACKAGES</text>
  <rect x="32" y="114" width="130" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="97" y="140" class="font-mono" font-size="11" fill="#0f172a" text-anchor="middle">@power-seo/react</text>
  <rect x="174" y="114" width="130" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="239" y="140" class="font-mono" font-size="11" fill="#0f172a" text-anchor="middle">…/schema</text>
  <rect x="316" y="114" width="130" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="381" y="140" class="font-mono" font-size="11" fill="#0f172a" text-anchor="middle">…/sitemap</text>
  <rect x="458" y="114" width="130" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="523" y="140" class="font-mono" font-size="11" fill="#0f172a" text-anchor="middle">…/audit</text>
  <rect x="600" y="114" width="140" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="670" y="140" class="font-mono" font-size="11" fill="#0f172a" text-anchor="middle">…/content-analysis</text>
  <rect x="752" y="114" width="116" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="810" y="134" class="font-mono" font-size="11" fill="#0f172a" text-anchor="middle">…/meta</text>
  <text x="810" y="150" class="font-ui" font-size="10" fill="#94a3b8" text-anchor="middle">+ 11 more</text>

  <!-- arrows -->
  <line x1="97" y1="158" x2="230" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="239" y1="158" x2="330" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="381" y1="158" x2="420" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="523" y1="158" x2="500" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="670" y1="158" x2="590" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="810" y1="158" x2="680" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="192" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">import from</text>

  <!-- core layer -->
  <rect x="120" y="208" width="660" height="196" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="140" y="224" width="150" height="26" rx="13" fill="#dbeafe"/>
  <text x="215" y="242" class="font-mono" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">@power-seo/core</text>
  <rect x="640" y="224" width="122" height="26" rx="13" fill="#dcfce7"/>
  <text x="701" y="242" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">0 dependencies</text>

  <!-- module boxes inside core -->
  <rect x="140" y="264" width="148" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="214" y="288" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Shared Types</text>
  <text x="214" y="306" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">SEOConfig, SitemapURL…</text>
  <rect x="300" y="264" width="148" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="374" y="288" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Constants</text>
  <text x="374" y="306" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">TITLE_MAX_PIXELS=580</text>
  <rect x="460" y="264" width="148" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="534" y="288" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Meta Validators</text>
  <text x="534" y="306" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">validateTitle()</text>
  <rect x="620" y="264" width="142" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="691" y="288" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Meta Builders</text>
  <text x="691" y="306" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">buildMetaTags()</text>

  <rect x="140" y="332" width="148" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="214" y="356" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Text Statistics</text>
  <text x="214" y="374" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">getTextStatistics()</text>
  <rect x="300" y="332" width="148" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="374" y="356" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Keyword Density</text>
  <text x="374" y="374" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">calculateKeywordDensity()</text>
  <rect x="460" y="332" width="148" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="534" y="356" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">URL Utilities</text>
  <text x="534" y="374" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">resolveCanonical()</text>
  <rect x="620" y="332" width="142" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="691" y="356" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Rate Limiting</text>
  <text x="691" y="374" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">createTokenBucket()</text>

  <!-- runtime layer -->
  <text x="120" y="436" class="font-ui" font-size="12" font-weight="600" fill="#94a3b8">RUNS IN</text>
  <rect x="120" y="446" width="88" height="26" rx="13" fill="#f1f5f9"/>
  <text x="164" y="463" class="font-ui" font-size="11" fill="#64748b" text-anchor="middle">Next.js</text>
  <rect x="216" y="446" width="80" height="26" rx="13" fill="#f1f5f9"/>
  <text x="256" y="463" class="font-ui" font-size="11" fill="#64748b" text-anchor="middle">Remix</text>
  <rect x="304" y="446" width="70" height="26" rx="13" fill="#f1f5f9"/>
  <text x="339" y="463" class="font-ui" font-size="11" fill="#64748b" text-anchor="middle">Vite</text>
  <rect x="382" y="446" width="88" height="26" rx="13" fill="#f1f5f9"/>
  <text x="426" y="463" class="font-ui" font-size="11" fill="#64748b" text-anchor="middle">Node.js</text>
  <rect x="478" y="446" width="150" height="26" rx="13" fill="#f1f5f9"/>
  <text x="553" y="463" class="font-ui" font-size="11" fill="#64748b" text-anchor="middle">Cloudflare Workers</text>
  <rect x="636" y="446" width="110" height="26" rx="13" fill="#f1f5f9"/>
  <text x="691" y="463" class="font-ui" font-size="11" fill="#64748b" text-anchor="middle">Vercel Edge</text>
</svg>
