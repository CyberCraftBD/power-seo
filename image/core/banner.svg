<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>@power-seo/core banner: framework-agnostic SEO utilities, types and engines with zero runtime dependencies</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>
  <!-- left: branding -->
  <rect x="64" y="58" width="44" height="44" rx="10" fill="#2563eb"/>
  <path d="M79 88 l8 -22 4 12 8 -12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="90" class="font-mono" font-size="30" font-weight="700" fill="#0f172a">@power-seo/core</text>
  <text x="64" y="142" class="font-ui" font-size="17" fill="#64748b">Framework-agnostic SEO utilities, types &amp; engines — the foundation of the @power-seo ecosystem.</text>
  <!-- badges -->
  <rect x="64" y="168" width="186" height="26" rx="13" fill="#dcfce7"/>
  <text x="157" y="185" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="262" y="168" width="100" height="26" rx="13" fill="#dbeafe"/>
  <text x="312" y="185" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript</text>
  <rect x="374" y="168" width="122" height="26" rx="13" fill="#f1f5f9"/>
  <text x="435" y="185" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Tree-shakeable</text>
  <!-- module chips -->
  <text x="64" y="228" class="font-mono" font-size="12" fill="#94a3b8">validateTitle()  ·  buildMetaTags()  ·  calculateKeywordDensity()  ·  resolveCanonical()  ·  getTextStatistics()  ·  buildRobotsContent()</text>
  <!-- right: UI vignette card -->
  <rect x="880" y="42" width="336" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="900" y="72" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">validateTitle()</text>
  <rect x="1132" y="56" width="64" height="20" rx="10" fill="#dcfce7"/>
  <text x="1164" y="70" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">valid</text>
  <rect x="900" y="86" width="296" height="30" rx="6" fill="#f1f5f9"/>
  <text x="910" y="105" class="font-ui" font-size="12" fill="#64748b">Technical SEO Guide for Next.js Applications</text>
  <text x="900" y="142" class="font-ui" font-size="11" fill="#94a3b8">Pixel width vs TITLE_MAX_PIXELS (580)</text>
  <rect x="900" y="150" width="296" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="900" y="150" width="222" height="8" rx="4" fill="#2563eb"/>
  <text x="900" y="182" class="font-mono" font-size="11" fill="#64748b">charCount: 44   pixelWidth: 436.2</text>
  <text x="900" y="212" class="font-ui" font-size="11" fill="#16a34a">Fits within Google SERP display width</text>
</svg>
