<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix of @power-seo/core versus next-seo and hand-rolled utilities across validation, analysis and builder capabilities</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">How @power-seo/core compares</text>
  <text x="32" y="66" class="font-ui" font-size="13" fill="#64748b">Capabilities included out of the box</text>

  <!-- table card -->
  <rect x="32" y="84" width="836" height="388" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- header row -->
  <rect x="33" y="85" width="834" height="40" rx="7" fill="#f8fafc"/>
  <line x1="32" y1="125" x2="868" y2="125" stroke="#e2e8f0"/>
  <text x="52" y="110" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FEATURE</text>
  <text x="520" y="110" class="font-mono" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">@power-seo/core</text>
  <text x="672" y="110" class="font-mono" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">next-seo</text>
  <text x="800" y="110" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Hand-rolled</text>
  <!-- column highlight -->
  <rect x="444" y="125" width="152" height="346" fill="#dbeafe" opacity="0.25"/>

  <!-- rows -->
  <text x="52" y="150" class="font-ui" font-size="13" fill="#0f172a">Pixel-accurate title validation (580px SERP limit)</text>
  <text x="520" y="150" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="150" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="800" y="150" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="163" x2="868" y2="163" stroke="#e2e8f0"/>

  <text x="52" y="188" class="font-ui" font-size="13" fill="#0f172a">Meta / Open Graph / Twitter tag builders</text>
  <text x="520" y="188" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="188" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="800" y="188" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="201" x2="868" y2="201" stroke="#e2e8f0"/>

  <text x="52" y="226" class="font-ui" font-size="13" fill="#0f172a">Keyword density analysis (0.5–2.5% range)</text>
  <text x="520" y="226" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="226" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="800" y="226" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="239" x2="868" y2="239" stroke="#e2e8f0"/>

  <text x="52" y="264" class="font-ui" font-size="13" fill="#0f172a">Text statistics — words, sentences, syllables</text>
  <text x="520" y="264" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="264" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="800" y="264" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="277" x2="868" y2="277" stroke="#e2e8f0"/>

  <text x="52" y="302" class="font-ui" font-size="13" fill="#0f172a">URL canonicalization &amp; tracking-param stripping</text>
  <text x="520" y="302" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="302" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="800" y="302" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="315" x2="868" y2="315" stroke="#e2e8f0"/>

  <text x="52" y="340" class="font-ui" font-size="13" fill="#0f172a">Typed robots directive builder (incl. AI crawlers)</text>
  <text x="520" y="340" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="340" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="800" y="340" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="353" x2="868" y2="353" stroke="#e2e8f0"/>

  <text x="52" y="378" class="font-ui" font-size="13" fill="#0f172a">Title template engine with site-wide defaults</text>
  <text x="520" y="378" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="378" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="800" y="378" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="391" x2="868" y2="391" stroke="#e2e8f0"/>

  <text x="52" y="416" class="font-ui" font-size="13" fill="#0f172a">Token-bucket rate limiter &amp; HTTP retry</text>
  <text x="520" y="416" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="416" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="800" y="416" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <line x1="32" y1="429" x2="868" y2="429" stroke="#e2e8f0"/>

  <text x="52" y="454" class="font-ui" font-size="13" fill="#0f172a">Framework-agnostic, zero runtime dependencies</text>
  <text x="520" y="454" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="672" y="454" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="800" y="454" class="font-ui" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
</svg>
