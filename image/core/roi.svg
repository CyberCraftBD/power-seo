<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow improvement illustration comparing manual SEO plumbing with the automated utilities in @power-seo/core</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Before / After — SEO plumbing workflow</text>
  <text x="32" y="66" class="font-ui" font-size="13" fill="#64748b">The same tasks, hand-written versus handled by @power-seo/core</text>

  <!-- before panel -->
  <rect x="32" y="88" width="396" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="52" y="106" width="130" height="24" rx="12" fill="#fee2e2"/>
  <text x="117" y="122" class="font-ui" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Manual process</text>

  <text x="60" y="160" class="font-ui" font-size="13" fill="#ef4444">✕</text>
  <text x="82" y="160" class="font-ui" font-size="13" fill="#0f172a">Hand-write meta tag HTML strings per page</text>
  <text x="60" y="196" class="font-ui" font-size="13" fill="#ef4444">✕</text>
  <text x="82" y="196" class="font-ui" font-size="13" fill="#0f172a">Guess title length by character count only</text>
  <text x="82" y="214" class="font-ui" font-size="11" fill="#94a3b8">titles still truncate in Google SERPs</text>
  <text x="60" y="248" class="font-ui" font-size="13" fill="#ef4444">✕</text>
  <text x="82" y="248" class="font-ui" font-size="13" fill="#0f172a">Regex-count keywords by hand</text>
  <text x="60" y="284" class="font-ui" font-size="13" fill="#ef4444">✕</text>
  <text x="82" y="284" class="font-ui" font-size="13" fill="#0f172a">String-concatenate robots directives</text>
  <text x="60" y="320" class="font-ui" font-size="13" fill="#ef4444">✕</text>
  <text x="82" y="320" class="font-ui" font-size="13" fill="#0f172a">Canonical URLs via ad-hoc string surgery</text>
  <text x="60" y="356" class="font-ui" font-size="13" fill="#ef4444">✕</text>
  <text x="82" y="356" class="font-ui" font-size="13" fill="#0f172a">Separate packages for text stats, slugs, retry</text>
  <text x="60" y="392" class="font-ui" font-size="13" fill="#ef4444">✕</text>
  <text x="82" y="392" class="font-ui" font-size="13" fill="#0f172a">Types duplicated across every project</text>
  <rect x="52" y="418" width="356" height="36" rx="6" fill="#f1f5f9"/>
  <text x="230" y="441" class="font-ui" font-size="12" fill="#64748b" text-anchor="middle">Inconsistent, untyped, easy to break</text>

  <!-- arrow -->
  <path d="M440 278 h20 m-8 -8 l8 8 -8 8" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- after panel -->
  <rect x="472" y="88" width="396" height="384" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="492" y="106" width="186" height="24" rx="12" fill="#dcfce7"/>
  <text x="585" y="122" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">With @power-seo/core</text>

  <text x="500" y="160" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">✓</text>
  <text x="522" y="160" class="font-mono" font-size="12" fill="#0f172a">buildMetaTags(config) <tspan fill="#94a3b8">— typed output</tspan></text>
  <text x="500" y="196" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">✓</text>
  <text x="522" y="196" class="font-mono" font-size="12" fill="#0f172a">validateTitle() <tspan fill="#94a3b8">— 580px pixel check</tspan></text>
  <text x="522" y="214" class="font-ui" font-size="11" fill="#94a3b8">catches truncation before publishing</text>
  <text x="500" y="248" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">✓</text>
  <text x="522" y="248" class="font-mono" font-size="12" fill="#0f172a">calculateKeywordDensity()</text>
  <text x="500" y="284" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">✓</text>
  <text x="522" y="284" class="font-mono" font-size="12" fill="#0f172a">buildRobotsContent() <tspan fill="#94a3b8">— typed</tspan></text>
  <text x="500" y="320" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">✓</text>
  <text x="522" y="320" class="font-mono" font-size="12" fill="#0f172a">resolveCanonical() + normalizeUrl()</text>
  <text x="500" y="356" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">✓</text>
  <text x="522" y="356" class="font-mono" font-size="12" fill="#0f172a">getTextStatistics(), toSlug(),</text>
  <text x="522" y="374" class="font-mono" font-size="12" fill="#0f172a">fetchJsonWithRetry() <tspan fill="#94a3b8">— one package</tspan></text>
  <text x="500" y="404" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">✓</text>
  <text x="522" y="404" class="font-mono" font-size="12" fill="#0f172a">25+ shared interfaces (SEOConfig…)</text>
  <rect x="492" y="418" width="356" height="36" rx="6" fill="#dbeafe"/>
  <text x="670" y="441" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Consistent, type-safe, tested, zero deps</text>
</svg>
