<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>API overview of the eight @power-seo/core modules: meta validators, meta builders, URL utilities, keyword density, text statistics, robots builder, title templates and rate limiting</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">@power-seo/core — API Overview</text>
  <text x="32" y="66" class="font-ui" font-size="13" fill="#64748b">8 independently importable modules, all tree-shakeable</text>

  <!-- row 1 -->
  <rect x="32" y="86" width="268" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="112" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Meta Validators</text>
  <text x="48" y="136" class="font-mono" font-size="11" fill="#0f172a">validateTitle()</text>
  <text x="48" y="156" class="font-mono" font-size="11" fill="#0f172a">validateMetaDescription()</text>
  <text x="48" y="176" class="font-mono" font-size="11" fill="#0f172a">calculatePixelWidth()</text>
  <text x="48" y="196" class="font-ui" font-size="10" fill="#94a3b8">Pixel-accurate SERP limits</text>

  <rect x="316" y="86" width="268" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="332" y="112" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Meta Builders</text>
  <text x="332" y="136" class="font-mono" font-size="11" fill="#0f172a">buildMetaTags()  buildLinkTags()</text>
  <text x="332" y="156" class="font-mono" font-size="11" fill="#0f172a">buildOpenGraphTags()</text>
  <text x="332" y="176" class="font-mono" font-size="11" fill="#0f172a">buildTwitterTags()  buildHreflangTags()</text>
  <text x="332" y="196" class="font-ui" font-size="10" fill="#94a3b8">Typed tag arrays from SEOConfig</text>

  <rect x="600" y="86" width="268" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="616" y="112" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">URL Utilities</text>
  <text x="616" y="136" class="font-mono" font-size="11" fill="#0f172a">resolveCanonical()  normalizeUrl()</text>
  <text x="616" y="156" class="font-mono" font-size="11" fill="#0f172a">stripTrackingParams()  toSlug()</text>
  <text x="616" y="176" class="font-mono" font-size="11" fill="#0f172a">extractSlug()  isAbsoluteUrl()</text>
  <text x="616" y="196" class="font-ui" font-size="10" fill="#94a3b8">Canonical &amp; slug handling</text>

  <!-- row 2 -->
  <rect x="32" y="222" width="268" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="248" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Keyword Density</text>
  <text x="48" y="272" class="font-mono" font-size="11" fill="#0f172a">calculateKeywordDensity()</text>
  <text x="48" y="292" class="font-mono" font-size="11" fill="#0f172a">countKeywordOccurrences()</text>
  <text x="48" y="312" class="font-mono" font-size="11" fill="#0f172a">analyzeKeyphraseOccurrences()</text>
  <text x="48" y="332" class="font-ui" font-size="10" fill="#94a3b8">Optimal range 0.5–2.5%</text>

  <rect x="316" y="222" width="268" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="332" y="248" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Text Statistics</text>
  <text x="332" y="272" class="font-mono" font-size="11" fill="#0f172a">getTextStatistics()  stripHtml()</text>
  <text x="332" y="292" class="font-mono" font-size="11" fill="#0f172a">getWords()  getSentences()</text>
  <text x="332" y="312" class="font-mono" font-size="11" fill="#0f172a">countSyllables()  getParagraphs()</text>
  <text x="332" y="332" class="font-ui" font-size="10" fill="#94a3b8">Words, sentences, syllables</text>

  <rect x="600" y="222" width="268" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="616" y="248" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Robots Builder</text>
  <text x="616" y="272" class="font-mono" font-size="11" fill="#0f172a">buildRobotsContent()</text>
  <text x="616" y="292" class="font-mono" font-size="11" fill="#0f172a">parseRobotsContent()</text>
  <text x="616" y="312" class="font-mono" font-size="11" fill="#0f172a">AI_CRAWLERS  (GPTBot, ClaudeBot…)</text>
  <text x="616" y="332" class="font-ui" font-size="10" fill="#94a3b8">Typed robots directives</text>

  <!-- row 3 -->
  <rect x="32" y="358" width="268" height="112" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="384" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Title Templates</text>
  <text x="48" y="408" class="font-mono" font-size="11" fill="#0f172a">applyTitleTemplate()</text>
  <text x="48" y="428" class="font-mono" font-size="11" fill="#0f172a">createTitleTemplate()  resolveTitle()</text>
  <text x="48" y="450" class="font-ui" font-size="10" fill="#94a3b8">Site-wide %s | Site Name patterns</text>

  <rect x="316" y="358" width="268" height="112" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="332" y="384" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Rate Limiting &amp; HTTP</text>
  <text x="332" y="408" class="font-mono" font-size="11" fill="#0f172a">createTokenBucket()  consumeToken()</text>
  <text x="332" y="428" class="font-mono" font-size="11" fill="#0f172a">calculateBackoff()  fetchJsonWithRetry()</text>
  <text x="332" y="450" class="font-ui" font-size="10" fill="#94a3b8">Token bucket for API clients</text>

  <rect x="600" y="358" width="268" height="112" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="616" y="384" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Serialization Helpers</text>
  <text x="616" y="408" class="font-mono" font-size="11" fill="#0f172a">escapeXml()  serializeJsonLd()</text>
  <text x="616" y="428" class="font-mono" font-size="11" fill="#0f172a">countDistinctMatches()</text>
  <text x="616" y="450" class="font-ui" font-size="10" fill="#94a3b8">Safe XML &amp; JSON-LD output</text>
</svg>
