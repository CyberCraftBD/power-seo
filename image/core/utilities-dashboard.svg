<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>SEO utilities dashboard built on @power-seo/core showing meta validation, keyword density and text statistics for a page</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <rect x="16" y="18" width="22" height="22" rx="6" fill="#2563eb"/>
  <path d="M23 33 l4 -11 2 6 4 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="34" class="font-mono" font-size="12" font-weight="700" fill="#0f172a">power-seo</text>
  <rect x="12" y="62" width="156" height="30" rx="6" fill="#dbeafe"/>
  <text x="24" y="82" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Meta Validators</text>
  <text x="24" y="122" class="font-ui" font-size="13" fill="#64748b">Keyword Density</text>
  <text x="24" y="158" class="font-ui" font-size="13" fill="#64748b">Text Statistics</text>
  <text x="24" y="194" class="font-ui" font-size="13" fill="#64748b">URL Utilities</text>
  <text x="24" y="230" class="font-ui" font-size="13" fill="#64748b">Robots Builder</text>
  <text x="24" y="266" class="font-ui" font-size="13" fill="#64748b">Title Templates</text>
  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">SEO Utilities</text>
  <rect x="772" y="11" width="104" height="30" rx="6" fill="#2563eb"/>
  <text x="824" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Analyze Page</text>
  <!-- URL input -->
  <rect x="204" y="68" width="672" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="218" y="90" class="font-ui" font-size="13" fill="#64748b">https://example.com/blog/technical-seo-guide</text>
  <!-- card: title validation -->
  <rect x="204" y="118" width="328" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="144" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">validateTitle()</text>
  <rect x="452" y="130" width="64" height="20" rx="10" fill="#dcfce7"/>
  <text x="484" y="144" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">valid</text>
  <text x="220" y="172" class="font-ui" font-size="11" fill="#94a3b8">pixelWidth 447.3 / 580 max</text>
  <rect x="220" y="182" width="296" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="220" y="182" width="228" height="8" rx="4" fill="#2563eb"/>
  <text x="220" y="214" class="font-mono" font-size="11" fill="#64748b">charCount: 54  severity: 'info'</text>
  <text x="220" y="234" class="font-ui" font-size="10" fill="#16a34a">Fits within Google SERP width</text>
  <!-- card: description validation -->
  <rect x="548" y="118" width="328" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="564" y="144" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">validateMetaDescription()</text>
  <rect x="788" y="130" width="72" height="20" rx="10" fill="#fef3c7"/>
  <text x="824" y="144" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <text x="564" y="172" class="font-ui" font-size="11" fill="#94a3b8">charCount 104 / 120 min – 160 max</text>
  <rect x="564" y="182" width="296" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="564" y="182" width="192" height="8" rx="4" fill="#f59e0b"/>
  <text x="564" y="214" class="font-mono" font-size="11" fill="#64748b">severity: 'warning'</text>
  <text x="564" y="234" class="font-ui" font-size="10" fill="#b45309">Below 120 chars — add more detail</text>
  <!-- card: keyword density -->
  <rect x="204" y="264" width="328" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="290" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">calculateKeywordDensity()</text>
  <text x="220" y="316" class="font-mono" font-size="11" fill="#64748b">keyword: 'technical seo'</text>
  <text x="220" y="336" class="font-mono" font-size="11" fill="#64748b">count: 14   totalWords: 1842</text>
  <rect x="220" y="348" width="296" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="279" y="348" width="237" height="8" rx="4" fill="#dcfce7"/>
  <rect x="392" y="344" width="4" height="16" rx="2" fill="#16a34a"/>
  <text x="220" y="376" class="font-ui" font-size="10" fill="#16a34a">density 1.5% — inside optimal 0.5–2.5%</text>
  <!-- card: text statistics -->
  <rect x="548" y="264" width="328" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="564" y="290" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">getTextStatistics()</text>
  <text x="564" y="318" class="font-mono" font-size="11" fill="#64748b">words: 1842      sentences: 96</text>
  <text x="564" y="338" class="font-mono" font-size="11" fill="#64748b">paragraphs: 24   syllables: 2731</text>
  <rect x="564" y="352" width="120" height="22" rx="11" fill="#dcfce7"/>
  <text x="624" y="367" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">above 1000 words</text>
  <!-- card: canonical -->
  <rect x="204" y="400" width="672" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="426" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">resolveCanonical() + stripTrackingParams()</text>
  <text x="220" y="452" class="font-mono" font-size="11"><tspan fill="#94a3b8">/blog/technical-seo-guide?utm_source=news  →  </tspan><tspan fill="#16a34a">https://example.com/blog/technical-seo-guide</tspan></text>
</svg>
