<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>@power-seo/core header: the shared SEO foundation library with pixel-accurate validators, meta builders and text analysis</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- headline -->
  <rect x="80" y="96" width="52" height="52" rx="12" fill="#2563eb"/>
  <path d="M98 132 l9 -26 5 14 9 -14" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="132" class="font-mono" font-size="36" font-weight="700" fill="#0f172a">@power-seo/core</text>
  <text x="80" y="196" class="font-ui" font-size="20" fill="#64748b">Framework-agnostic SEO utilities, types and engines — one zero-dependency</text>
  <text x="80" y="226" class="font-ui" font-size="20" fill="#64748b">TypeScript library for Next.js, Remix, Vite, Node.js, Workers and Edge.</text>
  <!-- badges -->
  <rect x="80" y="252" width="204" height="30" rx="15" fill="#dcfce7"/>
  <text x="182" y="272" class="font-ui" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="296" y="252" width="112" height="30" rx="15" fill="#dbeafe"/>
  <text x="352" y="272" class="font-ui" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript 5</text>
  <rect x="420" y="252" width="140" height="30" rx="15" fill="#f1f5f9"/>
  <text x="490" y="272" class="font-ui" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Tree-shakeable</text>
  <!-- vignette: validator card -->
  <rect x="80" y="330" width="500" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="104" y="364" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">SERP Title Validation</text>
  <rect x="480" y="348" width="76" height="22" rx="11" fill="#dcfce7"/>
  <text x="518" y="363" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">valid</text>
  <rect x="104" y="380" width="452" height="34" rx="6" fill="#f1f5f9"/>
  <text x="116" y="402" class="font-ui" font-size="13" fill="#64748b">Complete Guide to Structured Data for Online Stores</text>
  <text x="104" y="440" class="font-ui" font-size="11" fill="#94a3b8">pixelWidth 448.7 / TITLE_MAX_PIXELS 580</text>
  <rect x="104" y="450" width="452" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="104" y="450" width="350" height="8" rx="4" fill="#2563eb"/>
  <text x="104" y="486" class="font-mono" font-size="12" fill="#64748b">validateTitle(title)  →  { valid: true, severity: 'info' }</text>
  <text x="104" y="512" class="font-mono" font-size="12" fill="#64748b">validateMetaDescription(desc)  →  { valid: true }</text>
  <text x="104" y="536" class="font-ui" font-size="11" fill="#16a34a">Checked against real Google SERP pixel metrics</text>
  <!-- vignette: code card -->
  <rect x="620" y="330" width="500" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="644" y="364" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">One import. Eight modules.</text>
  <rect x="644" y="380" width="452" height="146" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="660" y="406" class="font-mono" font-size="12"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> {</tspan></text>
  <text x="676" y="428" class="font-mono" font-size="12" fill="#2563eb">buildMetaTags, validateTitle,</text>
  <text x="676" y="450" class="font-mono" font-size="12" fill="#2563eb">calculateKeywordDensity,</text>
  <text x="676" y="472" class="font-mono" font-size="12" fill="#2563eb">resolveCanonical, getTextStatistics,</text>
  <text x="660" y="494" class="font-mono" font-size="12"><tspan fill="#0f172a">} </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#16a34a"> '@power-seo/core'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="660" y="516" class="font-mono" font-size="12" fill="#94a3b8">// shared by all 17 @power-seo packages</text>
</svg>
