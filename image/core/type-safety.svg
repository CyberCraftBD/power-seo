<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Type safety in @power-seo/core showing the ValidationResult interface, typed editor autocomplete and the shared interfaces used across the ecosystem</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Type-safe by design</text>
  <text x="32" y="66" class="font-ui" font-size="13" fill="#64748b">25+ shared interfaces power every @power-seo package</text>

  <!-- code editor card -->
  <rect x="32" y="86" width="520" height="386" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="33" y="87" width="518" height="36" rx="7" fill="#f8fafc"/>
  <line x1="32" y1="123" x2="552" y2="123" stroke="#e2e8f0"/>
  <text x="52" y="110" class="font-mono" font-size="12" fill="#64748b">meta-validators.ts</text>
  <rect x="470" y="95" width="66" height="20" rx="10" fill="#dbeafe"/>
  <text x="503" y="109" class="font-ui" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript</text>

  <text x="52" y="150" class="font-mono" font-size="12"><tspan fill="#7c3aed">export interface</tspan><tspan fill="#0f172a"> ValidationResult {</tspan></text>
  <text x="72" y="172" class="font-mono" font-size="12"><tspan fill="#0f172a">valid: </tspan><tspan fill="#2563eb">boolean</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="72" y="194" class="font-mono" font-size="12"><tspan fill="#0f172a">severity: </tspan><tspan fill="#16a34a">'error' | 'warning' | 'info'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="72" y="216" class="font-mono" font-size="12"><tspan fill="#0f172a">message: </tspan><tspan fill="#2563eb">string</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="72" y="238" class="font-mono" font-size="12"><tspan fill="#0f172a">charCount?: </tspan><tspan fill="#2563eb">number</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="72" y="260" class="font-mono" font-size="12"><tspan fill="#0f172a">pixelWidth?: </tspan><tspan fill="#2563eb">number</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="52" y="282" class="font-mono" font-size="12" fill="#0f172a">}</text>

  <text x="52" y="318" class="font-mono" font-size="12"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> result = </tspan><tspan fill="#2563eb">validateTitle</tspan><tspan fill="#0f172a">(title);</tspan></text>
  <text x="52" y="340" class="font-mono" font-size="12"><tspan fill="#0f172a">result.</tspan><tspan fill="#2563eb">sev</tspan></text>
  <!-- autocomplete popup -->
  <rect x="128" y="348" width="240" height="86" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="132" y="354" width="232" height="22" rx="4" fill="#dbeafe"/>
  <text x="142" y="369" class="font-mono" font-size="11" fill="#1d4ed8">severity  ValidationSeverity</text>
  <text x="142" y="393" class="font-mono" font-size="11" fill="#64748b">valid     boolean</text>
  <text x="142" y="415" class="font-mono" font-size="11" fill="#64748b">message   string</text>
  <text x="52" y="462" class="font-mono" font-size="11" fill="#94a3b8">// autocomplete from real exported types</text>

  <!-- shared interfaces card -->
  <rect x="572" y="86" width="296" height="386" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="592" y="114" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Shared interfaces</text>
  <text x="592" y="134" class="font-ui" font-size="11" fill="#94a3b8">exported from @power-seo/core</text>
  <text x="592" y="164" class="font-mono" font-size="12" fill="#0f172a">SEOConfig</text>
  <text x="592" y="188" class="font-mono" font-size="12" fill="#0f172a">OpenGraphConfig</text>
  <text x="592" y="212" class="font-mono" font-size="12" fill="#0f172a">TwitterCardConfig</text>
  <text x="592" y="236" class="font-mono" font-size="12" fill="#0f172a">RobotsDirective</text>
  <text x="592" y="260" class="font-mono" font-size="12" fill="#0f172a">HreflangConfig</text>
  <text x="592" y="284" class="font-mono" font-size="12" fill="#0f172a">MetaTag · LinkTag</text>
  <text x="592" y="308" class="font-mono" font-size="12" fill="#0f172a">ContentAnalysisInput</text>
  <text x="592" y="332" class="font-mono" font-size="12" fill="#0f172a">TextStatistics</text>
  <text x="592" y="356" class="font-mono" font-size="12" fill="#0f172a">SitemapURL · SitemapConfig</text>
  <text x="592" y="380" class="font-mono" font-size="12" fill="#0f172a">RedirectRule</text>
  <text x="592" y="404" class="font-mono" font-size="12" fill="#0f172a">SchemaBase · SchemaGraphConfig</text>
  <rect x="592" y="424" width="152" height="24" rx="12" fill="#dcfce7"/>
  <text x="668" y="440" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">25+ exported types</text>
</svg>
