<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Dashboard of the built-in SEO thresholds in @power-seo/core: title pixels, meta description limits, keyword density range, word counts and readability targets</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Built-in SEO thresholds</text>
  <text x="32" y="66" class="font-ui" font-size="13" fill="#64748b">Every constant is exported and used by the validators — no magic numbers</text>

  <!-- title card -->
  <rect x="32" y="86" width="408" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="112" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">SERP Title</text>
  <text x="52" y="136" class="font-mono" font-size="11" fill="#64748b">TITLE_MAX_PIXELS = 580</text>
  <text x="52" y="154" class="font-mono" font-size="11" fill="#64748b">TITLE_MIN_LENGTH = 50 · TITLE_MAX_LENGTH = 60</text>
  <rect x="52" y="168" width="368" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="52" y="168" width="284" height="8" rx="4" fill="#2563eb"/>
  <text x="52" y="194" class="font-ui" font-size="10" fill="#94a3b8">example title: 447px of 580px display width</text>

  <!-- description card -->
  <rect x="460" y="86" width="408" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="112" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Meta Description</text>
  <text x="480" y="136" class="font-mono" font-size="11" fill="#64748b">META_DESCRIPTION_MAX_PIXELS = 920</text>
  <text x="480" y="154" class="font-mono" font-size="11" fill="#64748b">MIN_LENGTH = 120 · MAX_LENGTH = 160 chars</text>
  <rect x="480" y="168" width="368" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="480" y="168" width="312" height="8" rx="4" fill="#2563eb"/>
  <text x="480" y="194" class="font-ui" font-size="10" fill="#94a3b8">example description: 148 chars, fits desktop SERP</text>

  <!-- density card -->
  <rect x="32" y="222" width="408" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="248" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Keyword Density</text>
  <text x="52" y="272" class="font-mono" font-size="11" fill="#64748b">KEYWORD_DENSITY = { MIN: 0.5, OPTIMAL: 1.5, MAX: 2.5 }</text>
  <rect x="52" y="288" width="368" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="126" y="288" width="294" height="8" rx="4" fill="#dcfce7"/>
  <rect x="270" y="284" width="4" height="16" rx="2" fill="#16a34a"/>
  <text x="52" y="316" class="font-ui" font-size="10" fill="#94a3b8">0%</text>
  <text x="126" y="316" class="font-ui" font-size="10" fill="#94a3b8">0.5%</text>
  <text x="262" y="316" class="font-ui" font-size="10" font-weight="600" fill="#16a34a">1.5% optimal</text>
  <text x="400" y="316" class="font-ui" font-size="10" fill="#94a3b8">2.5%</text>

  <!-- word count card -->
  <rect x="460" y="222" width="408" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="248" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Content Length</text>
  <text x="480" y="272" class="font-mono" font-size="11" fill="#64748b">MIN_WORD_COUNT = 300</text>
  <text x="480" y="290" class="font-mono" font-size="11" fill="#64748b">RECOMMENDED_WORD_COUNT = 1000</text>
  <rect x="480" y="302" width="368" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="480" y="302" width="110" height="8" rx="4" fill="#f59e0b"/>
  <rect x="590" y="302" width="258" height="8" rx="4" fill="#16a34a"/>
  <text x="480" y="326" class="font-ui" font-size="10" fill="#94a3b8">0</text>
  <text x="578" y="326" class="font-ui" font-size="10" fill="#b45309">300 min</text>
  <text x="800" y="326" class="font-ui" font-size="10" fill="#16a34a">1000 recommended</text>

  <!-- readability card -->
  <rect x="32" y="358" width="408" height="114" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="384" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Readability (READABILITY)</text>
  <text x="52" y="408" class="font-mono" font-size="11" fill="#64748b">FLESCH_EASE_GOOD = 60 · FLESCH_EASE_FAIR = 30</text>
  <text x="52" y="426" class="font-mono" font-size="11" fill="#64748b">MAX_SENTENCE_LENGTH = 20 words</text>
  <text x="52" y="444" class="font-mono" font-size="11" fill="#64748b">MAX_PASSIVE_VOICE_PERCENT = 10</text>
  <text x="52" y="462" class="font-mono" font-size="11" fill="#64748b">MIN_TRANSITION_WORD_PERCENT = 30</text>

  <!-- images & urls card -->
  <rect x="460" y="358" width="408" height="114" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="384" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Social Images &amp; URLs</text>
  <text x="480" y="408" class="font-mono" font-size="11" fill="#64748b">OG_IMAGE = 1200 × 630 (ratio 1.91)</text>
  <text x="480" y="426" class="font-mono" font-size="11" fill="#64748b">TWITTER_IMAGE.SUMMARY_LARGE = 800 × 418</text>
  <text x="480" y="444" class="font-mono" font-size="11" fill="#64748b">MAX_URL_LENGTH = 75</text>
  <rect x="480" y="452" width="76" height="18" rx="9" fill="#dbeafe"/>
  <text x="518" y="465" class="font-ui" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">constants.ts</text>
</svg>
