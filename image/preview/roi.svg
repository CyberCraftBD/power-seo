<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison showing manual snippet checking after publishing versus instant automated preview validation with power-seo preview before publishing</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Catch Truncated Snippets Before You Publish</text>

  <!-- left panel: manual -->
  <rect x="40" y="76" width="390" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="60" y="96" width="140" height="24" rx="12" fill="#fee2e2"/>
  <text x="130" y="112" class="font-ui" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Manual process</text>

  <text x="60" y="152" class="font-ui" font-size="13" fill="#0f172a">1.  Write title and meta description</text>
  <line x1="72" y1="164" x2="72" y2="184" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="200" class="font-ui" font-size="13" fill="#0f172a">2.  Publish the page</text>
  <line x1="72" y1="212" x2="72" y2="232" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="248" class="font-ui" font-size="13" fill="#0f172a">3.  Wait for Google to index and recrawl</text>
  <line x1="72" y1="260" x2="72" y2="280" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="296" class="font-ui" font-size="13" fill="#0f172a">4.  Discover the title was cut off in SERPs</text>
  <line x1="72" y1="308" x2="72" y2="328" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="344" class="font-ui" font-size="13" fill="#0f172a">5.  Edit, republish, and wait again</text>

  <rect x="60" y="372" width="350" height="66" rx="6" fill="#fee2e2" opacity="0.6"/>
  <text x="76" y="398" class="font-ui" font-size="16" fill="#2563eb">Complete Guide to TypeScript SEO Tool…</text>
  <text x="76" y="422" class="font-ui" font-size="12" fill="#b91c1c">Truncated live in Google — found after publishing</text>

  <!-- arrow -->
  <line x1="440" y1="268" x2="452" y2="268" stroke="#2563eb" stroke-width="3"/>
  <path d="M448 260 l12 8 -12 8 z" fill="#2563eb"/>

  <!-- right panel: automated -->
  <rect x="470" y="76" width="390" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="490" y="96" width="196" height="24" rx="12" fill="#dcfce7"/>
  <text x="588" y="112" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">With @power-seo/preview</text>

  <text x="490" y="152" class="font-ui" font-size="13" fill="#0f172a">1.  Write title and meta description</text>
  <line x1="502" y1="164" x2="502" y2="184" stroke="#e2e8f0" stroke-width="2"/>
  <text x="490" y="200" class="font-ui" font-size="13" fill="#0f172a">2.  Preview instantly in the editor or CI</text>
  <line x1="502" y1="212" x2="502" y2="232" stroke="#e2e8f0" stroke-width="2"/>
  <text x="490" y="248" class="font-ui" font-size="13" fill="#0f172a">3.  Fix flagged truncation before publishing</text>
  <line x1="502" y1="260" x2="502" y2="280" stroke="#e2e8f0" stroke-width="2"/>
  <text x="490" y="296" class="font-ui" font-size="13" fill="#0f172a">4.  Publish once — snippet displays in full</text>

  <rect x="490" y="316" width="350" height="56" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="506" y="340" class="font-mono" font-size="12" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> serp = <tspan fill="#2563eb">generateSerpPreview</tspan>(page);</text>
  <text x="506" y="360" class="font-mono" font-size="12" fill="#0f172a"><tspan fill="#7c3aed">if</tspan> (serp.titleTruncated) <tspan fill="#94a3b8">/* warn */</tspan></text>

  <rect x="490" y="384" width="350" height="54" rx="6" fill="#dcfce7" opacity="0.5"/>
  <text x="506" y="408" class="font-ui" font-size="16" fill="#2563eb">TypeScript SEO Tooling: Complete Guide</text>
  <text x="506" y="428" class="font-ui" font-size="12" fill="#16a34a">Fits within 580px — verified before publishing ✓</text>
</svg>
