<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>power-seo preview header showing a Google SERP snippet preview and an Open Graph card preview generated by the TypeScript library with pixel budgets of 580 and 920 pixels</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- hero copy -->
  <rect x="544" y="48" width="112" height="24" rx="12" fill="#dbeafe"/>
  <text x="600" y="64" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">@power-seo</text>
  <text x="600" y="116" class="font-ui" font-size="40" font-weight="700" fill="#0f172a" text-anchor="middle">@power-seo/preview</text>
  <text x="600" y="150" class="font-ui" font-size="16" fill="#64748b" text-anchor="middle">See exactly how your pages look in Google, Facebook, and Twitter/X — before you publish.</text>

  <!-- SERP preview card (left) -->
  <rect x="80" y="196" width="640" height="240" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="104" y="228" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Google SERP Preview</text>
  <rect x="560" y="212" width="136" height="22" rx="11" fill="#dbeafe"/>
  <text x="628" y="227" class="font-mono" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">generateSerpPreview</text>

  <circle cx="116" cy="262" r="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="136" y="266" class="font-ui" font-size="13" fill="#64748b">example.com › blog › my-post</text>
  <text x="104" y="300" class="font-ui" font-size="19" fill="#2563eb">Complete Guide to TypeScript SEO Tooling for Modern Web...</text>
  <text x="104" y="328" class="font-ui" font-size="13" fill="#64748b">Learn how to generate metadata, structured data, and sitemaps in a type-safe</text>
  <text x="104" y="346" class="font-ui" font-size="13" fill="#64748b">pipeline that runs in Node.js, the Edge, and every modern framework.</text>

  <line x1="104" y1="370" x2="696" y2="370" stroke="#e2e8f0"/>
  <text x="104" y="398" class="font-mono" font-size="12" fill="#94a3b8">title: 580px max</text>
  <rect x="238" y="384" width="88" height="20" rx="10" fill="#fef3c7"/>
  <text x="282" y="398" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">truncated</text>
  <text x="356" y="398" class="font-mono" font-size="12" fill="#94a3b8">description: 920px max</text>
  <rect x="540" y="384" width="60" height="20" rx="10" fill="#dcfce7"/>
  <text x="570" y="398" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">fits ✓</text>

  <!-- OG preview card (right) -->
  <rect x="744" y="196" width="376" height="240" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="768" y="228" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Open Graph Card</text>
  <rect x="990" y="212" width="106" height="22" rx="11" fill="#dbeafe"/>
  <text x="1043" y="227" class="font-mono" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">1200 × 630</text>

  <rect x="768" y="244" width="328" height="110" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="932" cy="288" r="18" fill="#dbeafe"/>
  <path d="M925 288 l5 6 8 -12" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="932" y="330" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">og:image · 1200 × 630 px</text>
  <text x="768" y="380" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Complete Guide to TypeScript SEO</text>
  <text x="768" y="400" class="font-ui" font-size="12" fill="#64748b">example.com</text>
  <rect x="990" y="384" width="106" height="22" rx="11" fill="#dcfce7"/>
  <text x="1043" y="399" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">image valid ✓</text>

  <!-- bottom strip: API surface -->
  <rect x="80" y="472" width="1040" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="600" y="504" class="font-ui" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Four tree-shakeable generators · Zero runtime dependencies</text>
  <rect x="152" y="524" width="196" height="32" rx="16" fill="#f1f5f9"/>
  <text x="250" y="544" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">generateSerpPreview()</text>
  <rect x="368" y="524" width="184" height="32" rx="16" fill="#f1f5f9"/>
  <text x="460" y="544" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">generateOgPreview()</text>
  <rect x="572" y="524" width="216" height="32" rx="16" fill="#f1f5f9"/>
  <text x="680" y="544" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">generateTwitterPreview()</text>
  <rect x="808" y="524" width="212" height="32" rx="16" fill="#f1f5f9"/>
  <text x="914" y="544" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">truncateAtPixelWidth()</text>
</svg>
