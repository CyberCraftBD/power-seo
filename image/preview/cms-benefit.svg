<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>CMS editor screen with SEO title and meta description fields feeding a live Google SERP preview panel powered by generateSerpPreview from power-seo preview</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Live SERP Preview Inside Your CMS</text>

  <!-- left: CMS form -->
  <rect x="40" y="64" width="400" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="94" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Edit Post — SEO</text>
  <rect x="336" y="76" width="84" height="24" rx="12" fill="#dbeafe"/>
  <text x="378" y="92" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Draft</text>

  <text x="60" y="128" class="font-ui" font-size="12" font-weight="600" fill="#64748b">SEO TITLE</text>
  <rect x="60" y="138" width="360" height="36" rx="6" fill="#f1f5f9"/>
  <text x="72" y="161" class="font-ui" font-size="13" fill="#0f172a">Headless CMS SEO: A Field Guide for Editors</text>
  <text x="60" y="192" class="font-ui" font-size="11" fill="#94a3b8">43 / 60 characters · 402px of 580px</text>

  <text x="60" y="222" class="font-ui" font-size="12" font-weight="600" fill="#64748b">META DESCRIPTION</text>
  <rect x="60" y="232" width="360" height="64" rx="6" fill="#f1f5f9"/>
  <text x="72" y="254" class="font-ui" font-size="13" fill="#0f172a">Practical metadata rules editors can apply</text>
  <text x="72" y="272" class="font-ui" font-size="13" fill="#0f172a">without engineering help, from titles to OG</text>
  <text x="72" y="290" class="font-ui" font-size="13" fill="#0f172a">images, with live feedback on every field.</text>
  <text x="60" y="314" class="font-ui" font-size="11" fill="#94a3b8">128 / 160 characters · 806px of 920px</text>

  <text x="60" y="344" class="font-ui" font-size="12" font-weight="600" fill="#64748b">SLUG</text>
  <rect x="60" y="352" width="270" height="30" rx="6" fill="#f1f5f9"/>
  <text x="72" y="371" class="font-mono" font-size="12" fill="#64748b">/blog/headless-cms-seo</text>
  <rect x="344" y="352" width="76" height="30" rx="6" fill="#2563eb"/>
  <text x="382" y="371" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Save</text>

  <!-- connector -->
  <line x1="446" y1="228" x2="458" y2="228" stroke="#2563eb" stroke-width="3"/>
  <path d="M454 220 l12 8 -12 8 z" fill="#2563eb"/>

  <!-- right: live preview -->
  <rect x="476" y="64" width="384" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="496" y="94" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Live Preview</text>
  <rect x="712" y="78" width="128" height="22" rx="11" fill="#f1f5f9"/>
  <text x="776" y="93" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">generateSerpPreview()</text>

  <rect x="496" y="112" width="344" height="150" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="522" cy="140" r="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="540" y="144" class="font-ui" font-size="11" fill="#64748b">example.com › blog › headless-cms-seo</text>
  <text x="512" y="176" class="font-ui" font-size="15" fill="#2563eb">Headless CMS SEO: A Field Guide for Editors</text>
  <text x="512" y="200" class="font-ui" font-size="12" fill="#64748b">Practical metadata rules editors can apply without</text>
  <text x="512" y="217" class="font-ui" font-size="12" fill="#64748b">engineering help, from titles to OG images, with live</text>
  <text x="512" y="234" class="font-ui" font-size="12" fill="#64748b">feedback on every field.</text>

  <rect x="496" y="278" width="164" height="24" rx="12" fill="#dcfce7"/>
  <text x="578" y="294" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">titleTruncated: false ✓</text>
  <rect x="672" y="278" width="168" height="24" rx="12" fill="#dcfce7"/>
  <text x="756" y="294" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">description fits 920px ✓</text>

  <text x="496" y="332" class="font-ui" font-size="12" font-weight="600" fill="#64748b">RETURNED DATA</text>
  <rect x="496" y="340" width="344" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="508" y="358" class="font-mono" font-size="11" fill="#0f172a">displayUrl: <tspan fill="#16a34a">'example.com › blog › headless-cms-seo'</tspan></text>
  <text x="508" y="374" class="font-mono" font-size="11" fill="#0f172a">titleValidation: <tspan fill="#16a34a">{ valid: true }</tspan></text>

  <!-- bottom flow -->
  <rect x="40" y="418" width="820" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="130" y="449" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">CMS fields</text>
  <line x1="212" y1="444" x2="264" y2="444" stroke="#94a3b8" stroke-width="2"/>
  <path d="M260 438 l10 6 -10 6 z" fill="#94a3b8"/>
  <text x="404" y="449" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">generateSerpPreview(input)</text>
  <line x1="548" y1="444" x2="600" y2="444" stroke="#94a3b8" stroke-width="2"/>
  <path d="M596 438 l10 6 -10 6 z" fill="#94a3b8"/>
  <text x="712" y="449" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">editor preview — before publish</text>
</svg>
