<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Pixel-width truncation accuracy chart showing two 60-character titles measured against the 580 pixel Google SERP limit, one fitting and one overflowing, with the truncateAtPixelWidth code sample</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Character Count Lies. Pixels Don't.</text>

  <!-- measurement card -->
  <rect x="40" y="66" width="820" height="226" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="94" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Same 60 characters — different pixel widths</text>

  <!-- ruler -->
  <line x1="60" y1="118" x2="820" y2="118" stroke="#e2e8f0"/>
  <text x="60" y="112" class="font-ui" font-size="11" fill="#94a3b8">0px</text>
  <text x="424" y="112" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">320px</text>
  <line x1="700" y1="104" x2="700" y2="270" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="700" y="98" class="font-mono" font-size="11" font-weight="600" fill="#ef4444" text-anchor="middle">TITLE_MAX_PIXELS = 580</text>

  <!-- bar 1: narrow title, fits -->
  <text x="60" y="146" class="font-ui" font-size="12" fill="#64748b">"initial site visit intent" style — narrow letters (i, l, t)</text>
  <rect x="60" y="154" width="640" height="16" rx="4" fill="#e2e8f0"/>
  <rect x="60" y="154" width="546" height="16" rx="4" fill="#16a34a"/>
  <text x="618" y="167" class="font-mono" font-size="11" fill="#16a34a">494px</text>
  <rect x="726" y="152" width="94" height="20" rx="10" fill="#dcfce7"/>
  <text x="773" y="166" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">fits — kept</text>

  <!-- bar 2: wide title, overflows -->
  <text x="60" y="204" class="font-ui" font-size="12" fill="#64748b">"MAXIMUM WEBSITE GROWTH" style — wide letters (M, W, caps)</text>
  <rect x="60" y="212" width="640" height="16" rx="4" fill="#e2e8f0"/>
  <rect x="60" y="212" width="640" height="16" rx="4" fill="#f59e0b"/>
  <rect x="700" y="212" width="52" height="16" fill="#fee2e2"/>
  <text x="760" y="225" class="font-mono" font-size="11" fill="#ef4444">647px</text>
  <rect x="726" y="240" width="94" height="20" rx="10" fill="#fef3c7"/>
  <text x="773" y="254" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">truncated</text>
  <text x="60" y="256" class="font-ui" font-size="12" fill="#94a3b8">Both titles pass a 60-character check — only pixel measurement catches the overflow.</text>

  <!-- code card -->
  <rect x="40" y="312" width="820" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="340" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Per-character width lookup from @power-seo/core</text>
  <rect x="60" y="352" width="780" height="92" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="376" class="font-mono" font-size="12" fill="#0f172a"><tspan fill="#7c3aed">import</tspan> { truncateAtPixelWidth } <tspan fill="#7c3aed">from</tspan> <tspan fill="#16a34a">'@power-seo/preview'</tspan>;</text>
  <text x="76" y="398" class="font-mono" font-size="12" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> result = <tspan fill="#2563eb">truncateAtPixelWidth</tspan>(title, <tspan fill="#0891b2">580</tspan>);</text>
  <text x="76" y="420" class="font-mono" font-size="12" fill="#94a3b8">// { text: 'MAXIMUM WEBSITE GROWTH: The Complete...', truncated: true }</text>
  <text x="76" y="438" class="font-mono" font-size="11" fill="#94a3b8">// CHAR_PIXEL_WIDTHS lookup table · DEFAULT_CHAR_WIDTH = 6.67 · ellipsis cost included</text>
</svg>
