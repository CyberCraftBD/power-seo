<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>power-seo preview banner: pixel-accurate SERP, Open Graph and Twitter Card preview generators for TypeScript with a live Google search snippet example</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- left: branding -->
  <rect x="60" y="52" width="112" height="24" rx="12" fill="#dbeafe"/>
  <text x="116" y="68" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">@power-seo</text>
  <text x="60" y="118" class="font-ui" font-size="36" font-weight="700" fill="#0f172a">@power-seo/preview</text>
  <text x="60" y="150" class="font-ui" font-size="15" fill="#64748b">Pixel-accurate SERP, Open Graph &amp; Twitter/X Card previews — no browser, no canvas.</text>

  <!-- function pills -->
  <rect x="60" y="176" width="180" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="150" y="195" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">generateSerpPreview()</text>
  <rect x="252" y="176" width="170" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="337" y="195" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">generateOgPreview()</text>
  <rect x="434" y="176" width="204" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="536" y="195" class="font-mono" font-size="12" fill="#2563eb" text-anchor="middle">generateTwitterPreview()</text>
  <text x="60" y="234" class="font-ui" font-size="12" fill="#94a3b8">Zero runtime dependencies · Tree-shakeable · Edge runtime safe</text>

  <!-- right: SERP snippet vignette -->
  <rect x="740" y="40" width="480" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="764" y="70" class="font-ui" font-size="12" font-weight="600" fill="#64748b">GOOGLE SERP PREVIEW</text>
  <rect x="1116" y="54" width="84" height="22" rx="11" fill="#dcfce7"/>
  <text x="1158" y="69" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">✓ 580px</text>

  <circle cx="774" cy="96" r="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="792" y="100" class="font-ui" font-size="12" fill="#64748b">example.com › blog › my-post</text>
  <text x="764" y="130" class="font-ui" font-size="17" fill="#2563eb">How We Cut Page Load Time in Half with Next.js...</text>
  <text x="764" y="154" class="font-ui" font-size="13" fill="#64748b">A practical walkthrough of the image, font, and script optimizations that</text>
  <text x="764" y="172" class="font-ui" font-size="13" fill="#64748b">doubled our Core Web Vitals scores across every template.</text>

  <line x1="764" y1="190" x2="1196" y2="190" stroke="#e2e8f0"/>
  <text x="764" y="214" class="font-mono" font-size="11" fill="#94a3b8">titleTruncated: true</text>
  <text x="920" y="214" class="font-mono" font-size="11" fill="#94a3b8">descriptionTruncated: false</text>
  <text x="1150" y="214" class="font-mono" font-size="11" fill="#16a34a">valid ✓</text>
</svg>
