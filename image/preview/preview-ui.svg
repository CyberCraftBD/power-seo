<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Preview panel app interface showing SERP, Open Graph, and Twitter Card previews generated from page metadata with truncation and image validation badges</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <text x="20" y="34" class="font-ui" font-size="14" font-weight="700" fill="#0f172a">power-seo</text>
  <rect x="12" y="56" width="156" height="30" rx="6" fill="#dbeafe"/>
  <text x="24" y="76" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">SERP Preview</text>
  <text x="24" y="114" class="font-ui" font-size="13" fill="#64748b">Open Graph</text>
  <text x="24" y="150" class="font-ui" font-size="13" fill="#64748b">Twitter Card</text>
  <text x="24" y="186" class="font-ui" font-size="13" fill="#64748b">Truncation</text>
  <text x="24" y="222" class="font-ui" font-size="13" fill="#64748b">Settings</text>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Preview Panel</text>
  <rect x="756" y="11" width="120" height="30" rx="6" fill="#2563eb"/>
  <text x="816" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Generate Preview</text>

  <!-- SERP card -->
  <rect x="204" y="72" width="672" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="100" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Google Search Result</text>
  <rect x="700" y="84" width="156" height="22" rx="11" fill="#f1f5f9"/>
  <text x="778" y="99" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">generateSerpPreview()</text>

  <circle cx="234" cy="130" r="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="252" y="134" class="font-ui" font-size="12" fill="#64748b">acme.dev › docs › getting-started</text>
  <text x="224" y="164" class="font-ui" font-size="17" fill="#2563eb">Getting Started with Acme — Install, Configure, Deploy...</text>
  <text x="224" y="188" class="font-ui" font-size="13" fill="#64748b">Install the CLI, scaffold your first project, and ship to production in under ten</text>
  <text x="224" y="206" class="font-ui" font-size="13" fill="#64748b">minutes with sensible defaults for every framework.</text>
  <rect x="224" y="220" width="118" height="20" rx="10" fill="#fef3c7"/>
  <text x="283" y="234" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">title &gt; 580px — cut</text>
  <rect x="352" y="220" width="140" height="20" rx="10" fill="#dcfce7"/>
  <text x="422" y="234" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">description ≤ 920px ✓</text>

  <!-- OG card -->
  <rect x="204" y="272" width="324" height="204" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="300" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Open Graph</text>
  <rect x="224" y="314" width="284" height="88" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="366" y="362" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">og:image · 1200 × 630</text>
  <text x="224" y="426" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Getting Started with Acme</text>
  <text x="224" y="444" class="font-ui" font-size="11" fill="#64748b">acme.dev</text>
  <rect x="418" y="412" width="90" height="20" rx="10" fill="#dcfce7"/>
  <text x="463" y="426" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">valid: true</text>

  <!-- Twitter card -->
  <rect x="552" y="272" width="324" height="204" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="572" y="300" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Twitter / X Card</text>
  <rect x="572" y="314" width="284" height="88" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="714" y="362" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">summary_large_image · 800 × 418 min</text>
  <text x="572" y="426" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Getting Started with Acme</text>
  <text x="572" y="444" class="font-ui" font-size="11" fill="#64748b">domain: acme</text>
  <rect x="766" y="412" width="90" height="20" rx="10" fill="#dcfce7"/>
  <text x="811" y="426" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">valid: true</text>
</svg>
