<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Diagram showing how power-seo ai stays LLM-agnostic: prompt builders produce a PromptTemplate, any provider runs it, parsers return typed results</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">LLM-agnostic by design</text>
  <text x="32" y="68" class="font-ui" font-size="13" fill="#64748b">No SDK bundled, no API keys managed, no network calls — swap providers without changing SEO logic</text>
  <!-- step 1: build -->
  <rect x="32" y="100" width="256" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="52" y="120" width="60" height="22" rx="11" fill="#dbeafe"/>
  <text x="82" y="135" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">STEP 1</text>
  <text x="52" y="168" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Build the prompt</text>
  <g class="font-mono" font-size="11.5" fill="#2563eb">
    <text x="52" y="196">buildMetaDescriptionPrompt()</text>
    <text x="52" y="216">buildTitlePrompt()</text>
    <text x="52" y="236">buildContentSuggestionsPrompt()</text>
    <text x="52" y="256">buildSerpPredictionPrompt()</text>
  </g>
  <rect x="52" y="276" width="216" height="128" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="11.5">
    <text x="66" y="300" fill="#94a3b8">// PromptTemplate</text>
    <text x="66" y="320" fill="#0f172a">{</text>
    <text x="66" y="340" fill="#0f172a">  system: <tspan fill="#16a34a">string</tspan>,</text>
    <text x="66" y="360" fill="#0f172a">  user: <tspan fill="#16a34a">string</tspan>,</text>
    <text x="66" y="380" fill="#0f172a">  maxTokens?: <tspan fill="#16a34a">number</tspan></text>
    <text x="66" y="398" fill="#0f172a">}</text>
  </g>
  <!-- arrow 1 -->
  <line x1="292" y1="265" x2="322" y2="265" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M322 265 l-7 -4 v8 z" fill="#94a3b8"/>
  <!-- step 2: your client -->
  <rect x="326" y="100" width="248" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="346" y="120" width="60" height="22" rx="11" fill="#dbeafe"/>
  <text x="376" y="135" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">STEP 2</text>
  <text x="346" y="168" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Your LLM client runs it</text>
  <text x="346" y="190" class="font-ui" font-size="12" fill="#64748b">Any provider, any SDK, any model:</text>
  <g class="font-ui" font-size="12" font-weight="600" fill="#0f172a">
    <rect x="346" y="206" width="208" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="450" y="225" text-anchor="middle">OpenAI GPT-4o</text>
    <rect x="346" y="244" width="208" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="450" y="263" text-anchor="middle">Anthropic Claude</text>
    <rect x="346" y="282" width="208" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="450" y="301" text-anchor="middle">Google Gemini</text>
    <rect x="346" y="320" width="208" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="450" y="339" text-anchor="middle">Mistral / Cohere</text>
    <rect x="346" y="358" width="208" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="450" y="377" text-anchor="middle">Local Ollama models</text>
  </g>
  <text x="346" y="414" class="font-ui" font-size="11" fill="#94a3b8">Returns a raw text response</text>
  <!-- arrow 2 -->
  <line x1="578" y1="265" x2="608" y2="265" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M608 265 l-7 -4 v8 z" fill="#94a3b8"/>
  <!-- step 3: parse -->
  <rect x="612" y="100" width="256" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="632" y="120" width="60" height="22" rx="11" fill="#dcfce7"/>
  <text x="662" y="135" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">STEP 3</text>
  <text x="632" y="168" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Parse into typed results</text>
  <g class="font-mono" font-size="11.5" fill="#2563eb">
    <text x="632" y="196">parseMetaDescriptionResponse()</text>
    <text x="632" y="216">parseTitleResponse()</text>
    <text x="632" y="236">parseContentSuggestionsResponse()</text>
    <text x="632" y="256">parseSerpPredictionResponse()</text>
  </g>
  <g class="font-ui" font-size="12" fill="#0f172a">
    <text x="648" y="290"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  <tspan class="font-mono" font-size="11.5">MetaDescriptionResult</tspan></text>
    <text x="648" y="314"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  <tspan class="font-mono" font-size="11.5">TitleResult</tspan></text>
    <text x="648" y="338"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  <tspan class="font-mono" font-size="11.5">ContentSuggestion[]</tspan></text>
    <text x="648" y="362"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  <tspan class="font-mono" font-size="11.5">SerpFeaturePrediction[]</tspan></text>
  </g>
  <text x="632" y="398" class="font-ui" font-size="11" fill="#94a3b8">With charCount, pixelWidth and</text>
  <text x="632" y="414" class="font-ui" font-size="11" fill="#94a3b8">validation status where relevant</text>
  <!-- footer note -->
  <rect x="32" y="446" width="836" height="34" rx="8" fill="#dcfce7"/>
  <text x="450" y="468" class="font-ui" font-size="12.5" font-weight="600" fill="#16a34a" text-anchor="middle">Bonus: analyzeSerpEligibility() is fully rule-based — no LLM call, no cost, deterministic output for CI pipelines</text>
</svg>
