<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix of power-seo ai versus LangChain, Vercel AI SDK, and hand-written custom prompts</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">How @power-seo/ai compares</text>
  <text x="32" y="68" class="font-ui" font-size="13" fill="#64748b">SEO-focused prompting and parsing vs. general-purpose AI toolkits</text>
  <!-- table card -->
  <rect x="32" y="88" width="836" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- header row -->
  <path d="M32 96 a8 8 0 0 1 8 -8 h820 a8 8 0 0 1 8 8 v32 h-836 z" fill="#f8fafc"/>
  <line x1="32" y1="128" x2="868" y2="128" stroke="#e2e8f0"/>
  <g class="font-ui" font-size="12" font-weight="600" fill="#64748b">
    <text x="48" y="113">FEATURE</text>
    <text x="406" y="113" text-anchor="middle" fill="#2563eb">@power-seo/ai</text>
    <text x="538" y="113" text-anchor="middle">LangChain</text>
    <text x="670" y="113" text-anchor="middle">Vercel AI SDK</text>
    <text x="802" y="113" text-anchor="middle">Custom prompts</text>
  </g>
  <!-- column highlight -->
  <rect x="342" y="128" width="128" height="336" fill="#dbeafe" opacity="0.25"/>
  <!-- row separators -->
  <g stroke="#e2e8f0">
    <line x1="32" y1="170" x2="868" y2="170"/>
    <line x1="32" y1="212" x2="868" y2="212"/>
    <line x1="32" y1="254" x2="868" y2="254"/>
    <line x1="32" y1="296" x2="868" y2="296"/>
    <line x1="32" y1="338" x2="868" y2="338"/>
    <line x1="32" y1="380" x2="868" y2="380"/>
    <line x1="32" y1="422" x2="868" y2="422"/>
  </g>
  <!-- feature labels -->
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="48" y="154">Provider-agnostic prompt builders</text>
    <text x="48" y="196">SEO-specific prompt templates</text>
    <text x="48" y="238">Structured response parsers</text>
    <text x="48" y="280">Rule-based SERP eligibility</text>
    <text x="48" y="322">Char + pixel width metadata</text>
    <text x="48" y="364">Zero SDK dependencies</text>
    <text x="48" y="406">TypeScript-first</text>
    <text x="48" y="448">Tree-shakeable</text>
  </g>
  <!-- @power-seo/ai column: all checks -->
  <g class="font-ui" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">
    <text x="406" y="155">&#10003;</text>
    <text x="406" y="197">&#10003;</text>
    <text x="406" y="239">&#10003;</text>
    <text x="406" y="281">&#10003;</text>
    <text x="406" y="323">&#10003;</text>
    <text x="406" y="365">&#10003;</text>
    <text x="406" y="407">&#10003;</text>
    <text x="406" y="449">&#10003;</text>
  </g>
  <!-- LangChain column -->
  <g class="font-ui" font-size="12" text-anchor="middle">
    <text x="538" y="154" fill="#b45309" font-weight="600">Partial</text>
    <text x="538" y="196" fill="#94a3b8">&#8212;</text>
    <text x="538" y="238" fill="#b45309" font-weight="600">Partial</text>
    <text x="538" y="280" fill="#94a3b8">&#8212;</text>
    <text x="538" y="322" fill="#94a3b8">&#8212;</text>
    <text x="538" y="364" fill="#94a3b8">&#8212;</text>
    <text x="538" y="406" fill="#b45309" font-weight="600">Partial</text>
    <text x="538" y="448" fill="#94a3b8">&#8212;</text>
  </g>
  <!-- Vercel AI SDK column -->
  <g class="font-ui" font-size="12" text-anchor="middle">
    <text x="670" y="154" fill="#94a3b8">&#8212;</text>
    <text x="670" y="196" fill="#94a3b8">&#8212;</text>
    <text x="670" y="238" fill="#b45309" font-weight="600">Partial</text>
    <text x="670" y="280" fill="#94a3b8">&#8212;</text>
    <text x="670" y="322" fill="#94a3b8">&#8212;</text>
    <text x="670" y="364" fill="#94a3b8">&#8212;</text>
    <text x="670" y="407" fill="#16a34a" font-size="15" font-weight="700">&#10003;</text>
    <text x="670" y="448" fill="#b45309" font-weight="600">Partial</text>
  </g>
  <!-- Custom prompts column -->
  <g class="font-ui" font-size="12" text-anchor="middle">
    <text x="802" y="154" fill="#94a3b8">&#8212;</text>
    <text x="802" y="196" fill="#64748b">Manual</text>
    <text x="802" y="238" fill="#64748b">Manual</text>
    <text x="802" y="280" fill="#94a3b8">&#8212;</text>
    <text x="802" y="322" fill="#94a3b8">&#8212;</text>
    <text x="802" y="365" fill="#16a34a" font-size="15" font-weight="700">&#10003;</text>
    <text x="802" y="406" fill="#94a3b8">&#8212;</text>
    <text x="802" y="448" fill="#94a3b8">&#8212;</text>
  </g>
</svg>
