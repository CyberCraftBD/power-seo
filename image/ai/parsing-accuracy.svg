<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Illustration of power-seo ai parsers handling messy LLM output variations like markdown code fences and quoted strings, returning validated typed data</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Robust structured-output parsing</text>
  <text x="32" y="68" class="font-ui" font-size="13" fill="#64748b">Parsers accept the raw text LLMs actually return — fenced, quoted, or clean — and validate every field</text>
  <!-- left: messy inputs -->
  <text x="32" y="106" class="font-ui" font-size="12" font-weight="600" fill="#64748b">RAW LLM RESPONSES</text>
  <!-- input 1: fenced -->
  <rect x="32" y="118" width="330" height="104" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="11.5">
    <text x="48" y="140" fill="#94a3b8">```json</text>
    <text x="48" y="160" fill="#0f172a">[{ <tspan fill="#2563eb">"type"</tspan>: <tspan fill="#16a34a">"heading"</tspan>,</text>
    <text x="48" y="180" fill="#0f172a">   <tspan fill="#2563eb">"priority"</tspan>: 5, ... }]</text>
    <text x="48" y="200" fill="#94a3b8">```</text>
  </g>
  <rect x="252" y="126" width="102" height="20" rx="10" fill="#fef3c7"/>
  <text x="303" y="140" class="font-ui" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">markdown fence</text>
  <!-- input 2: quoted -->
  <rect x="32" y="234" width="330" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="11.5">
    <text x="48" y="258" fill="#0f172a">"Ship faster with typed SEO</text>
    <text x="48" y="278" fill="#0f172a"> prompts. Try @power-seo/ai."</text>
  </g>
  <rect x="238" y="242" width="116" height="20" rx="10" fill="#fef3c7"/>
  <text x="296" y="256" class="font-ui" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">surrounding quotes</text>
  <!-- input 3: malformed -->
  <rect x="32" y="332" width="330" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="11.5">
    <text x="48" y="356" fill="#0f172a">Sure! Here are the results:</text>
    <text x="48" y="376" fill="#0f172a">[{ "feature": "how-to", ...</text>
  </g>
  <rect x="262" y="340" width="92" height="20" rx="10" fill="#fee2e2"/>
  <text x="308" y="354" class="font-ui" font-size="10.5" font-weight="600" fill="#b91c1c" text-anchor="middle">invalid JSON</text>
  <!-- center: parser -->
  <line x1="366" y1="268" x2="396" y2="268" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M396 268 l-7 -4 v8 z" fill="#94a3b8"/>
  <rect x="400" y="180" width="180" height="176" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="210" class="font-ui" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Parsers</text>
  <g class="font-mono" font-size="10.5" fill="#2563eb" text-anchor="middle">
    <text x="490" y="236">parseMetaDescription</text>
    <text x="490" y="252">Response()</text>
    <text x="490" y="276">parseContentSuggestions</text>
    <text x="490" y="292">Response()</text>
    <text x="490" y="316">parseSerpPrediction</text>
    <text x="490" y="332">Response()</text>
  </g>
  <line x1="584" y1="268" x2="614" y2="268" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M614 268 l-7 -4 v8 z" fill="#94a3b8"/>
  <!-- right: validated output -->
  <text x="618" y="106" class="font-ui" font-size="12" font-weight="600" fill="#64748b">VALIDATED OUTPUT</text>
  <rect x="618" y="118" width="250" height="238" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <g class="font-ui" font-size="12" fill="#0f172a">
    <text x="634" y="146"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  Strips ``` code fences</text>
    <text x="634" y="174"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  Strips surrounding quotes</text>
    <text x="634" y="202"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  Type-checks every field</text>
    <text x="634" y="230"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  Filters malformed items</text>
    <text x="634" y="258"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  Validates length + pixelWidth</text>
    <text x="634" y="286"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  Never throws — returns []</text>
    <text x="653" y="304" fill="#64748b" font-size="11.5">on unparseable responses</text>
  </g>
  <rect x="634" y="318" width="118" height="24" rx="12" fill="#dcfce7"/>
  <text x="693" y="334" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Safe by default</text>
  <!-- bottom: result sample -->
  <rect x="400" y="386" width="468" height="88" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="11.5">
    <text x="416" y="410" fill="#94a3b8">// MetaDescriptionResult</text>
    <text x="416" y="430" fill="#0f172a">{ description, charCount: <tspan fill="#2563eb">152</tspan>, pixelWidth: <tspan fill="#2563eb">918</tspan>,</text>
    <text x="416" y="450" fill="#0f172a">  isValid: <tspan fill="#16a34a">true</tspan>, validationMessage: <tspan fill="#7c3aed">undefined</tspan> }</text>
  </g>
  <text x="32" y="452" class="font-ui" font-size="12" fill="#64748b">Every parser is unit-tested against</text>
  <text x="32" y="470" class="font-ui" font-size="12" fill="#64748b">common LLM output variations.</text>
</svg>
