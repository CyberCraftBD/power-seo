<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>power-seo ai banner: LLM-agnostic SEO prompt builders and structured response parsers for any provider</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>
  <!-- left: branding -->
  <rect x="56" y="50" width="44" height="44" rx="10" fill="#2563eb"/>
  <path d="M70 82 L78 62 L86 82 M72.5 76 L83.5 76" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="81" class="font-ui" font-size="30" font-weight="700" fill="#0f172a">@power-seo/ai</text>
  <text x="56" y="134" class="font-ui" font-size="17" fill="#64748b">LLM-agnostic SEO prompt builders and structured response parsers.</text>
  <text x="56" y="160" class="font-ui" font-size="17" fill="#64748b">Bring your own provider — OpenAI, Claude, Gemini, Mistral, Ollama.</text>
  <!-- feature pills -->
  <rect x="56" y="190" width="140" height="26" rx="13" fill="#dbeafe"/>
  <text x="126" y="207" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Prompt builders</text>
  <rect x="206" y="190" width="120" height="26" rx="13" fill="#dcfce7"/>
  <text x="266" y="207" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Typed parsers</text>
  <rect x="336" y="190" width="200" height="26" rx="13" fill="#fef3c7"/>
  <text x="436" y="207" class="font-ui" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Rule-based SERP eligibility</text>
  <rect x="546" y="190" width="160" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="626" y="207" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Zero dependencies</text>
  <!-- right: code vignette -->
  <rect x="792" y="36" width="432" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M792 44 a8 8 0 0 1 8 -8 h416 a8 8 0 0 1 8 8 v28 h-432 z" fill="#f8fafc"/>
  <line x1="792" y1="72" x2="1224" y2="72" stroke="#e2e8f0"/>
  <text x="812" y="58" class="font-mono" font-size="12" fill="#64748b">generate-meta.ts</text>
  <text x="812" y="98" class="font-mono" font-size="12.5"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { buildMetaDescriptionPrompt }</tspan></text>
  <text x="812" y="118" class="font-mono" font-size="12.5"><tspan fill="#7c3aed">  from</tspan><tspan fill="#16a34a"> '@power-seo/ai'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="812" y="146" class="font-mono" font-size="12.5"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> prompt = </tspan><tspan fill="#2563eb">buildMetaDescriptionPrompt</tspan><tspan fill="#0f172a">({</tspan></text>
  <text x="812" y="166" class="font-mono" font-size="12.5"><tspan fill="#0f172a">  title, content, focusKeyphrase</tspan></text>
  <text x="812" y="186" class="font-mono" font-size="12.5"><tspan fill="#0f172a">});</tspan><tspan fill="#94a3b8"> // { system, user, maxTokens }</tspan></text>
  <text x="812" y="214" class="font-mono" font-size="12.5"><tspan fill="#94a3b8">// pass to any LLM client you already use</tspan></text>
</svg>
