<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>App mockup of an AI content suggestions panel powered by power-seo ai, listing typed heading, keyword, link and paragraph suggestions with priorities</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <rect x="16" y="18" width="24" height="24" rx="6" fill="#2563eb"/>
  <path d="M23 36 L28 24 L33 36 M24.5 32.5 L31.5 32.5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="35" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">power-seo</text>
  <g class="font-ui" font-size="13">
    <text x="28" y="86" fill="#64748b">Dashboard</text>
    <text x="28" y="122" fill="#64748b">Content Analysis</text>
    <rect x="12" y="140" width="156" height="30" rx="6" fill="#dbeafe"/>
    <text x="28" y="160" fill="#2563eb" font-weight="600">AI Suggestions</text>
    <text x="28" y="196" fill="#64748b">SERP Features</text>
    <text x="28" y="232" fill="#64748b">Settings</text>
  </g>
  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">AI Content Suggestions</text>
  <rect x="756" y="11" width="120" height="30" rx="6" fill="#2563eb"/>
  <text x="816" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Generate</text>
  <!-- context bar -->
  <rect x="204" y="68" width="672" height="36" rx="6" fill="#f1f5f9"/>
  <text x="220" y="91" class="font-ui" font-size="12" fill="#64748b">Page: <tspan fill="#0f172a">/blog/react-seo-guide</tspan>   &#183;   Focus keyphrase: <tspan class="font-mono" fill="#0f172a">react seo</tspan>   &#183;   4 suggestions</text>
  <!-- suggestions card -->
  <rect x="204" y="118" width="672" height="306" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M204 126 a8 8 0 0 1 8 -8 h656 a8 8 0 0 1 8 8 v26 h-672 z" fill="#f8fafc"/>
  <line x1="204" y1="152" x2="876" y2="152" stroke="#e2e8f0"/>
  <g class="font-ui" font-size="12" font-weight="600" fill="#64748b">
    <text x="224" y="140">TYPE</text>
    <text x="318" y="140">SUGGESTION</text>
    <text x="796" y="140">PRIORITY</text>
  </g>
  <!-- row 1: heading -->
  <rect x="220" y="166" width="72" height="22" rx="11" fill="#dbeafe"/>
  <text x="256" y="181" class="font-mono" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">heading</text>
  <text x="318" y="180" class="font-ui" font-size="13" fill="#0f172a">Add an H2 that includes the focus keyphrase &#8220;react seo&#8221;</text>
  <text x="318" y="198" class="font-ui" font-size="11.5" fill="#64748b">Reason: keyphrase missing from all subheadings</text>
  <rect x="796" y="168" width="52" height="20" rx="10" fill="#fee2e2"/>
  <text x="822" y="182" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">5 / 5</text>
  <line x1="204" y1="216" x2="876" y2="216" stroke="#e2e8f0"/>
  <!-- row 2: keyword -->
  <rect x="220" y="230" width="72" height="22" rx="11" fill="#dcfce7"/>
  <text x="256" y="245" class="font-mono" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">keyword</text>
  <text x="318" y="244" class="font-ui" font-size="13" fill="#0f172a">Use the keyphrase within the first paragraph of the intro</text>
  <text x="318" y="262" class="font-ui" font-size="11.5" fill="#64748b">Reason: first mention appears below the fold</text>
  <rect x="796" y="232" width="52" height="20" rx="10" fill="#fef3c7"/>
  <text x="822" y="246" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">4 / 5</text>
  <line x1="204" y1="280" x2="876" y2="280" stroke="#e2e8f0"/>
  <!-- row 3: link -->
  <rect x="220" y="294" width="72" height="22" rx="11" fill="#fef3c7"/>
  <text x="256" y="309" class="font-mono" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">link</text>
  <text x="318" y="308" class="font-ui" font-size="13" fill="#0f172a">Add an internal link to your structured data guide</text>
  <text x="318" y="326" class="font-ui" font-size="11.5" fill="#64748b">Reason: related article has no inbound links from this page</text>
  <rect x="796" y="296" width="52" height="20" rx="10" fill="#fef3c7"/>
  <text x="822" y="310" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">3 / 5</text>
  <line x1="204" y1="344" x2="876" y2="344" stroke="#e2e8f0"/>
  <!-- row 4: paragraph -->
  <rect x="220" y="358" width="80" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="260" y="373" class="font-mono" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">paragraph</text>
  <text x="318" y="372" class="font-ui" font-size="13" fill="#0f172a">Expand the intro to directly answer &#8220;what is React SEO&#8221;</text>
  <text x="318" y="390" class="font-ui" font-size="11.5" fill="#64748b">Reason: improves featured snippet eligibility</text>
  <rect x="796" y="360" width="52" height="20" rx="10" fill="#dcfce7"/>
  <text x="822" y="374" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">2 / 5</text>
  <!-- footer code hint -->
  <rect x="204" y="438" width="672" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="220" y="462" class="font-mono" font-size="12"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> suggestions = </tspan><tspan fill="#2563eb">parseContentSuggestionsResponse</tspan><tspan fill="#0f172a">(llmText); </tspan><tspan fill="#94a3b8">// ContentSuggestion[]</tspan></text>
</svg>
