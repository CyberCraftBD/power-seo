<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>power-seo ai header: provider-agnostic SEO prompts for meta descriptions, titles, content suggestions and SERP feature prediction</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- left column: branding -->
  <rect x="72" y="96" width="52" height="52" rx="12" fill="#2563eb"/>
  <path d="M88 132 L98 108 L108 132 M91 125 L105 125" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="132" class="font-ui" font-size="38" font-weight="700" fill="#0f172a">@power-seo/ai</text>
  <text x="72" y="196" class="font-ui" font-size="20" fill="#64748b">AI-assisted SEO without vendor lock-in. Prompt builders return a plain</text>
  <text x="72" y="226" class="font-ui" font-size="20" fill="#64748b">PromptTemplate; parsers turn raw LLM text into typed results.</text>
  <!-- capability list -->
  <g class="font-ui" font-size="15" fill="#0f172a">
    <circle cx="80" cy="280" r="4" fill="#2563eb"/>
    <text x="96" y="285">Meta descriptions — <tspan class="font-mono" font-size="13" fill="#2563eb">buildMetaDescriptionPrompt()</tspan></text>
    <circle cx="80" cy="316" r="4" fill="#2563eb"/>
    <text x="96" y="321">Title tag variants — <tspan class="font-mono" font-size="13" fill="#2563eb">buildTitlePrompt()</tspan></text>
    <circle cx="80" cy="352" r="4" fill="#2563eb"/>
    <text x="96" y="357">Content improvements — <tspan class="font-mono" font-size="13" fill="#2563eb">buildContentSuggestionsPrompt()</tspan></text>
    <circle cx="80" cy="388" r="4" fill="#2563eb"/>
    <text x="96" y="393">SERP feature prediction — <tspan class="font-mono" font-size="13" fill="#2563eb">buildSerpPredictionPrompt()</tspan></text>
    <circle cx="80" cy="424" r="4" fill="#16a34a"/>
    <text x="96" y="429">No LLM needed — <tspan class="font-mono" font-size="13" fill="#16a34a">analyzeSerpEligibility()</tspan> is fully deterministic</text>
  </g>
  <!-- provider pills -->
  <text x="72" y="482" class="font-ui" font-size="13" font-weight="600" fill="#64748b">WORKS WITH ANY PROVIDER</text>
  <g class="font-ui" font-size="12" font-weight="600">
    <rect x="72" y="496" width="72" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="108" y="513" fill="#0f172a" text-anchor="middle">OpenAI</text>
    <rect x="152" y="496" width="70" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="187" y="513" fill="#0f172a" text-anchor="middle">Claude</text>
    <rect x="230" y="496" width="70" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="265" y="513" fill="#0f172a" text-anchor="middle">Gemini</text>
    <rect x="308" y="496" width="70" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="513" fill="#0f172a" text-anchor="middle">Mistral</text>
    <rect x="386" y="496" width="70" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="421" y="513" fill="#0f172a" text-anchor="middle">Ollama</text>
  </g>
  <!-- right column: code card -->
  <rect x="668" y="252" width="464" height="300" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M668 260 a8 8 0 0 1 8 -8 h448 a8 8 0 0 1 8 8 v30 h-464 z" fill="#f8fafc"/>
  <line x1="668" y1="290" x2="1132" y2="290" stroke="#e2e8f0"/>
  <text x="688" y="276" class="font-mono" font-size="12" fill="#64748b">seo-titles.ts</text>
  <g class="font-mono" font-size="13">
    <text x="688" y="318"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { buildTitlePrompt, parseTitleResponse }</tspan></text>
    <text x="688" y="338"><tspan fill="#7c3aed">  from</tspan><tspan fill="#16a34a"> '@power-seo/ai'</tspan><tspan fill="#0f172a">;</tspan></text>
    <text x="688" y="370"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> prompt = </tspan><tspan fill="#2563eb">buildTitlePrompt</tspan><tspan fill="#0f172a">({</tspan></text>
    <text x="688" y="390"><tspan fill="#0f172a">  content,</tspan></text>
    <text x="688" y="410"><tspan fill="#0f172a">  focusKeyphrase: </tspan><tspan fill="#16a34a">'react seo'</tspan><tspan fill="#0f172a">,</tspan></text>
    <text x="688" y="430"><tspan fill="#0f172a">});</tspan></text>
    <text x="688" y="462"><tspan fill="#94a3b8">// call your LLM with prompt.system / prompt.user</tspan></text>
    <text x="688" y="490"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> titles = </tspan><tspan fill="#2563eb">parseTitleResponse</tspan><tspan fill="#0f172a">(text);</tspan></text>
    <text x="688" y="510"><tspan fill="#94a3b8">// [{ title, charCount, pixelWidth }, ...]</tspan></text>
  </g>
  <!-- badge top-right -->
  <rect x="668" y="128" width="220" height="30" rx="15" fill="#dcfce7"/>
  <text x="778" y="148" class="font-ui" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="900" y="128" width="150" height="30" rx="15" fill="#dbeafe"/>
  <text x="975" y="148" class="font-ui" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript-first</text>
</svg>
