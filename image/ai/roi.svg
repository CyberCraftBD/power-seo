<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Before and after workflow comparison: manual SEO copywriting versus an automated pipeline built with power-seo ai prompt builders and parsers</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="32" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">From manual copywriting to a repeatable pipeline</text>
  <text x="32" y="68" class="font-ui" font-size="13" fill="#64748b">The same SEO tasks, before and after adopting @power-seo/ai</text>
  <!-- before panel -->
  <rect x="32" y="92" width="400" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="52" y="112" width="118" height="24" rx="12" fill="#fee2e2"/>
  <text x="111" y="128" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">MANUAL PROCESS</text>
  <text x="52" y="164" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Without @power-seo/ai</text>
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="52" y="202"><tspan fill="#ef4444" font-weight="700">&#215;</tspan>  Write each meta description by hand</text>
    <text x="52" y="238"><tspan fill="#ef4444" font-weight="700">&#215;</tspan>  Count characters in a separate tool</text>
    <text x="52" y="274"><tspan fill="#ef4444" font-weight="700">&#215;</tspan>  Guess title tag variants one at a time</text>
    <text x="52" y="310"><tspan fill="#ef4444" font-weight="700">&#215;</tspan>  Re-prompt when the model adds fences</text>
    <text x="71" y="328" fill="#64748b" font-size="12">or extra chatter around the JSON</text>
    <text x="52" y="364"><tspan fill="#ef4444" font-weight="700">&#215;</tspan>  Rewrite prompts for every provider SDK</text>
    <text x="52" y="400"><tspan fill="#ef4444" font-weight="700">&#215;</tspan>  Check SERP feature eligibility manually</text>
    <text x="52" y="436"><tspan fill="#ef4444" font-weight="700">&#215;</tspan>  No validation before publishing</text>
  </g>
  <!-- arrow -->
  <circle cx="450" cy="284" r="22" fill="#2563eb"/>
  <path d="M441 284 h14 m-5 -6 l6 6 l-6 6" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- after panel -->
  <rect x="468" y="92" width="400" height="384" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="488" y="112" width="150" height="24" rx="12" fill="#dcfce7"/>
  <text x="563" y="128" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">AUTOMATED PIPELINE</text>
  <text x="488" y="164" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">With @power-seo/ai</text>
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="488" y="202"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  <tspan class="font-mono" font-size="12" fill="#2563eb">buildMetaDescriptionPrompt()</tspan> per page</text>
    <text x="488" y="238"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  charCount + pixelWidth returned</text>
    <text x="507" y="256" fill="#64748b" font-size="12">with every parsed candidate</text>
    <text x="488" y="292"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  <tspan class="font-mono" font-size="12" fill="#2563eb">parseTitleResponse()</tspan> gives variants</text>
    <text x="488" y="328"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  Parsers strip fences and quotes for you</text>
    <text x="488" y="364"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  One PromptTemplate works on any LLM</text>
    <text x="488" y="400"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  <tspan class="font-mono" font-size="12" fill="#2563eb">analyzeSerpEligibility()</tspan> in CI, no LLM</text>
    <text x="488" y="436"><tspan fill="#16a34a" font-weight="700">&#10003;</tspan>  isValid + validationMessage built in</text>
  </g>
</svg>
