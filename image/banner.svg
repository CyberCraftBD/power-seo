<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>power-seo ecosystem banner: a production-grade SEO toolkit for TypeScript, React and Node.js, shown beside a light SEO dashboard with a 92 score ring and passing title, meta and schema checks</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>

  <!-- canvas -->
  <rect width="1280" height="280" rx="12" fill="#f8fafc"/>

  <!-- ===== left: wordmark + tagline ===== -->
  <rect x="72" y="112" width="6" height="56" rx="3" fill="#2563eb"/>
  <text x="96" y="150" class="font-ui" font-size="56" font-weight="700" letter-spacing="-2" fill="#0f172a">power-seo</text>
  <text x="98" y="192" class="font-ui" font-size="19" font-weight="400" fill="#64748b">Production-Grade SEO Toolkit for TypeScript, React &amp; Node.js</text>

  <!-- badges -->
  <rect x="98" y="210" width="104" height="26" rx="13" fill="#dbeafe"/>
  <text x="150" y="227" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">17 packages</text>

  <rect x="212" y="210" width="112" height="26" rx="13" fill="#dcfce7"/>
  <text x="268" y="227" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">TypeScript-first</text>

  <rect x="334" y="210" width="90" height="26" rx="13" fill="#f1f5f9"/>
  <text x="379" y="227" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">ESM + CJS</text>

  <!-- ===== right: light SEO dashboard vignette ===== -->
  <!-- dashboard panel -->
  <rect x="672" y="36" width="536" height="208" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- panel top bar -->
  <line x1="672" y1="76" x2="1208" y2="76" stroke="#e2e8f0"/>
  <text x="696" y="62" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">SEO Audit</text>
  <rect x="1108" y="46" width="80" height="24" rx="6" fill="#2563eb"/>
  <text x="1148" y="62" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run</text>

  <!-- score ring card -->
  <rect x="696" y="96" width="168" height="128" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="716" y="122" class="font-ui" font-size="12" font-weight="600" fill="#64748b">Overall Score</text>
  <circle cx="780" cy="172" r="34" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <path d="M 780 138 A 34 34 0 1 1 750.6 189" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <text x="780" y="180" class="font-ui" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">92</text>
  <rect x="810" y="112" width="42" height="20" rx="10" fill="#dcfce7"/>
  <text x="831" y="126" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Good</text>

  <!-- checklist card -->
  <rect x="880" y="96" width="304" height="128" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- check row 1 -->
  <circle cx="908" cy="122" r="8" fill="#dcfce7"/>
  <path d="M 904 122 l 3 3 l 5 -6" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="924" y="126" class="font-ui" font-size="12" fill="#0f172a">Title length within 50 characters</text>
  <rect x="1120" y="114" width="48" height="18" rx="9" fill="#dcfce7"/>
  <text x="1144" y="127" class="font-ui" font-size="10" font-weight="600" fill="#16a34a" text-anchor="middle">Pass</text>

  <!-- check row 2 -->
  <circle cx="908" cy="150" r="8" fill="#dcfce7"/>
  <path d="M 904 150 l 3 3 l 5 -6" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="924" y="154" class="font-ui" font-size="12" fill="#0f172a">Meta description present</text>
  <rect x="1120" y="142" width="48" height="18" rx="9" fill="#dcfce7"/>
  <text x="1144" y="155" class="font-ui" font-size="10" font-weight="600" fill="#16a34a" text-anchor="middle">Pass</text>

  <!-- check row 3 -->
  <circle cx="908" cy="178" r="8" fill="#dcfce7"/>
  <path d="M 904 178 l 3 3 l 5 -6" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="924" y="182" class="font-ui" font-size="12" fill="#0f172a">JSON-LD schema valid</text>
  <rect x="1120" y="170" width="48" height="18" rx="9" fill="#dcfce7"/>
  <text x="1144" y="183" class="font-ui" font-size="10" font-weight="600" fill="#16a34a" text-anchor="middle">Pass</text>

  <!-- check row 4 (warning) -->
  <circle cx="908" cy="206" r="8" fill="#fef3c7"/>
  <text x="908" y="210" class="font-ui" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">!</text>
  <text x="924" y="210" class="font-ui" font-size="12" fill="#0f172a">Keyphrase density 2.7% (target 0.5-2.5%)</text>
  <rect x="1108" y="198" width="60" height="18" rx="9" fill="#fef3c7"/>
  <text x="1138" y="211" class="font-ui" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">Warn</text>
</svg>
