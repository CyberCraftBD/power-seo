<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Hero graphic for @power-seo/links — the internal linking intelligence layer with a link graph, orphan detection and equity scoring preview</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- headline -->
  <text x="600" y="120" class="font-mono" font-size="44" font-weight="700" fill="#0f172a" text-anchor="middle">@power-seo/<tspan fill="#2563eb">links</tspan></text>
  <text x="600" y="164" class="font-ui" font-size="19" fill="#64748b" text-anchor="middle">Internal linking intelligence — link graph, orphans, suggestions, equity scoring</text>
  <!-- badges -->
  <rect x="440" y="188" width="136" height="28" rx="14" fill="#dcfce7"/>
  <text x="508" y="207" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Zero dependencies</text>
  <rect x="588" y="188" width="122" height="28" rx="14" fill="#dbeafe"/>
  <text x="649" y="207" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript-first</text>
  <!-- left card: code -->
  <rect x="80" y="250" width="500" height="320" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="104" y="282" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Four functions, one graph</text>
  <rect x="104" y="298" width="452" height="248" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="12">
    <text x="122" y="326" fill="#7c3aed">import<tspan fill="#0f172a"> { buildLinkGraph, findOrphanPages,</tspan></text>
    <text x="122" y="344" fill="#0f172a">  suggestLinks, analyzeLinkEquity }</text>
    <text x="122" y="362" fill="#7c3aed">from<tspan fill="#16a34a"> '@power-seo/links'</tspan><tspan fill="#0f172a">;</tspan></text>
    <text x="122" y="392" fill="#7c3aed">const<tspan fill="#0f172a"> graph = </tspan><tspan fill="#2563eb">buildLinkGraph</tspan><tspan fill="#0f172a">(pages);</tspan></text>
    <text x="122" y="410" fill="#7c3aed">const<tspan fill="#0f172a"> orphans = </tspan><tspan fill="#2563eb">findOrphanPages</tspan><tspan fill="#0f172a">(graph);</tspan></text>
    <text x="122" y="428" fill="#7c3aed">const<tspan fill="#0f172a"> equity = </tspan><tspan fill="#2563eb">analyzeLinkEquity</tspan><tspan fill="#0f172a">(graph, {</tspan></text>
    <text x="122" y="446" fill="#0f172a">  damping: <tspan fill="#2563eb">0.85</tspan>, iterations: <tspan fill="#2563eb">20</tspan>,</text>
    <text x="122" y="464" fill="#0f172a">});</text>
    <text x="122" y="494" fill="#94a3b8">// LinkEquityScore[] sorted by score desc</text>
    <text x="122" y="512" fill="#94a3b8">// { url, score, inboundCount }</text>
  </g>
  <!-- right card: graph vignette -->
  <rect x="620" y="250" width="500" height="320" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="644" y="282" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Directed link graph</text>
  <rect x="1004" y="264" width="96" height="22" rx="11" fill="#dbeafe"/>
  <text x="1052" y="279" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">totalLinks: 9</text>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="740" y1="420" x2="860" y2="350"/>
    <line x1="740" y1="420" x2="860" y2="490"/>
    <line x1="860" y1="350" x2="980" y2="350"/>
    <line x1="860" y1="490" x2="980" y2="490"/>
    <line x1="860" y1="350" x2="860" y2="490"/>
    <line x1="980" y1="350" x2="980" y2="490"/>
  </g>
  <!-- nodes -->
  <circle cx="740" cy="420" r="26" fill="#2563eb"/>
  <text x="740" y="426" class="font-ui" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">/</text>
  <text x="740" y="464" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">score 1.000</text>
  <circle cx="860" cy="350" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="860" y="322" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">/blog · 0.62</text>
  <circle cx="860" cy="490" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="860" y="528" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">/about · 0.41</text>
  <circle cx="980" cy="350" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1004" y="354" class="font-mono" font-size="11" fill="#64748b">/post-1</text>
  <circle cx="980" cy="490" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1004" y="494" class="font-mono" font-size="11" fill="#64748b">/post-2</text>
  <!-- orphan -->
  <circle cx="1070" cy="420" r="17" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1070" y="425" class="font-ui" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">0 in</text>
  <text x="1070" y="456" class="font-ui" font-size="11" fill="#b91c1c" text-anchor="middle">orphan</text>
</svg>
