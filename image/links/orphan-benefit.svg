<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Orphan page detection with findOrphanPages — pages with zero inbound links are invisible to crawlers until surfaced and linked</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Orphan Page Detection — findOrphanPages()</text>
  <!-- left card: the graph with orphans -->
  <rect x="40" y="68" width="400" height="402" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="98" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">The problem</text>
  <text x="64" y="120" class="font-ui" font-size="12" fill="#64748b">Pages with inboundCount: 0 can't be reached by</text>
  <text x="64" y="138" class="font-ui" font-size="12" fill="#64748b">crawlers following links from the homepage.</text>
  <!-- linked cluster -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="150" y1="230" x2="250" y2="190"/>
    <line x1="150" y1="230" x2="250" y2="270"/>
    <line x1="250" y1="190" x2="350" y2="190"/>
    <line x1="250" y1="270" x2="350" y2="270"/>
    <line x1="250" y1="190" x2="250" y2="270"/>
  </g>
  <circle cx="150" cy="230" r="22" fill="#2563eb"/>
  <text x="150" y="235" class="font-ui" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">/</text>
  <circle cx="250" cy="190" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="250" cy="270" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="350" cy="190" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="350" cy="270" r="13" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="150" y="268" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">home</text>
  <text x="250" y="164" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">/blog</text>
  <!-- orphan zone -->
  <rect x="64" y="316" width="352" height="132" rx="8" fill="#fee2e2" opacity="0.5"/>
  <text x="80" y="342" class="font-ui" font-size="12" font-weight="600" fill="#b91c1c">Unreachable — no inbound links</text>
  <circle cx="130" cy="392" r="15" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="426" class="font-mono" font-size="10" fill="#b91c1c" text-anchor="middle">/old-landing</text>
  <circle cx="250" cy="392" r="15" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="250" y="426" class="font-mono" font-size="10" fill="#b91c1c" text-anchor="middle">/promo-2024</text>
  <circle cx="366" cy="392" r="15" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="366" y="426" class="font-mono" font-size="10" fill="#b91c1c" text-anchor="middle">/guide/draft</text>
  <!-- right card: detection output -->
  <rect x="464" y="68" width="396" height="402" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="488" y="98" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">The one-call fix</text>
  <rect x="488" y="112" width="348" height="118" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="12">
    <text x="504" y="138" fill="#7c3aed">const<tspan fill="#0f172a"> graph = </tspan><tspan fill="#2563eb">buildLinkGraph</tspan><tspan fill="#0f172a">(pages);</tspan></text>
    <text x="504" y="160" fill="#7c3aed">const<tspan fill="#0f172a"> orphans = </tspan><tspan fill="#2563eb">findOrphanPages</tspan><tspan fill="#0f172a">(</tspan></text>
    <text x="504" y="182" fill="#0f172a">  graph,</text>
    <text x="504" y="204" fill="#0f172a">  [<tspan fill="#16a34a">'https://example.com/'</tspan>] <tspan fill="#94a3b8">// entryPoints</tspan></text>
    <text x="504" y="222" fill="#0f172a">);</text>
  </g>
  <!-- result table -->
  <text x="488" y="262" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">OrphanPage[] result</text>
  <rect x="488" y="274" width="348" height="26" fill="#f8fafc"/>
  <text x="500" y="292" class="font-ui" font-size="11" font-weight="600" fill="#64748b">URL</text>
  <text x="730" y="292" class="font-ui" font-size="11" font-weight="600" fill="#64748b">outboundCount</text>
  <line x1="488" y1="300" x2="836" y2="300" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="12" fill="#0f172a">
    <text x="500" y="322">/guide/draft</text>
    <text x="500" y="352">/promo-2024</text>
    <text x="500" y="382">/old-landing</text>
  </g>
  <g class="font-mono" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="776" y="322">6</text>
    <text x="776" y="352">2</text>
    <text x="776" y="382">0</text>
  </g>
  <line x1="488" y1="332" x2="836" y2="332" stroke="#e2e8f0"/>
  <line x1="488" y1="362" x2="836" y2="362" stroke="#e2e8f0"/>
  <line x1="488" y1="392" x2="836" y2="392" stroke="#e2e8f0"/>
  <rect x="488" y="412" width="348" height="42" rx="8" fill="#dcfce7"/>
  <text x="504" y="430" class="font-ui" font-size="11" font-weight="600" fill="#16a34a">Sorted by outboundCount desc — pages that link out</text>
  <text x="504" y="446" class="font-ui" font-size="11" font-weight="600" fill="#16a34a">but receive nothing are the highest priority to fix.</text>
</svg>
