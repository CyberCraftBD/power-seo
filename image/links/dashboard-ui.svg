<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Internal links dashboard built with @power-seo/links showing orphan pages, link equity scores and link suggestions for a site of 128 pages</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <text x="20" y="34" class="font-mono" font-size="13" font-weight="700" fill="#0f172a">power-seo</text>
  <text x="20" y="76" class="font-ui" font-size="13" fill="#64748b">Overview</text>
  <text x="20" y="110" class="font-ui" font-size="13" fill="#64748b">Content</text>
  <rect x="10" y="126" width="160" height="30" rx="6" fill="#dbeafe"/>
  <text x="20" y="146" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Internal Links</text>
  <text x="20" y="182" class="font-ui" font-size="13" fill="#64748b">Sitemap</text>
  <text x="20" y="216" class="font-ui" font-size="13" fill="#64748b">Audit</text>
  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Internal Links</text>
  <rect x="762" y="11" width="118" height="30" rx="6" fill="#2563eb"/>
  <text x="821" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Rebuild Graph</text>
  <!-- stat cards -->
  <rect x="204" y="72" width="216" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="96" class="font-ui" font-size="12" fill="#64748b">totalPages</text>
  <text x="220" y="130" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">128</text>
  <rect x="432" y="72" width="216" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="448" y="96" class="font-ui" font-size="12" fill="#64748b">totalLinks</text>
  <text x="448" y="130" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">947</text>
  <rect x="660" y="72" width="220" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="676" y="96" class="font-ui" font-size="12" fill="#64748b">Orphan pages</text>
  <text x="676" y="130" class="font-ui" font-size="24" font-weight="700" fill="#ef4444">4</text>
  <rect x="808" y="86" width="58" height="20" rx="10" fill="#fee2e2"/>
  <text x="837" y="100" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Fix</text>
  <!-- equity table card -->
  <rect x="204" y="164" width="420" height="316" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="192" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Link Equity — analyzeLinkEquity()</text>
  <rect x="204" y="206" width="420" height="28" fill="#f8fafc"/>
  <text x="220" y="225" class="font-ui" font-size="12" font-weight="600" fill="#64748b">URL</text>
  <text x="470" y="225" class="font-ui" font-size="12" font-weight="600" fill="#64748b">SCORE</text>
  <text x="560" y="225" class="font-ui" font-size="12" font-weight="600" fill="#64748b">INBOUND</text>
  <g class="font-mono" font-size="12" fill="#0f172a">
    <text x="220" y="258">/</text>
    <text x="220" y="298">/blog</text>
    <text x="220" y="338">/pricing</text>
    <text x="220" y="378">/guide/react-seo</text>
    <text x="220" y="418">/guide/meta-tags</text>
    <text x="220" y="458">/blog/post-42</text>
  </g>
  <g class="font-mono" font-size="12" fill="#0f172a">
    <text x="470" y="258">1.000</text>
    <text x="470" y="298">0.734</text>
    <text x="470" y="338">0.512</text>
    <text x="470" y="378">0.288</text>
    <text x="470" y="418">0.204</text>
    <text x="470" y="458">0.061</text>
  </g>
  <g class="font-ui" font-size="12" fill="#64748b">
    <text x="580" y="258">86</text>
    <text x="580" y="298">61</text>
    <text x="580" y="338">44</text>
    <text x="580" y="378">19</text>
    <text x="580" y="418">14</text>
    <text x="580" y="458">3</text>
  </g>
  <g fill="#e2e8f0">
    <rect x="220" y="266" width="384" height="6" rx="3"/>
    <rect x="220" y="306" width="384" height="6" rx="3"/>
    <rect x="220" y="346" width="384" height="6" rx="3"/>
    <rect x="220" y="386" width="384" height="6" rx="3"/>
    <rect x="220" y="426" width="384" height="6" rx="3"/>
    <rect x="220" y="466" width="384" height="6" rx="3"/>
  </g>
  <g fill="#2563eb">
    <rect x="220" y="266" width="384" height="6" rx="3"/>
    <rect x="220" y="306" width="282" height="6" rx="3"/>
    <rect x="220" y="346" width="197" height="6" rx="3"/>
    <rect x="220" y="386" width="111" height="6" rx="3"/>
    <rect x="220" y="426" width="78" height="6" rx="3"/>
    <rect x="220" y="466" width="23" height="6" rx="3"/>
  </g>
  <!-- suggestions card -->
  <rect x="640" y="164" width="240" height="316" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="656" y="192" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">suggestLinks()</text>
  <text x="656" y="212" class="font-ui" font-size="11" fill="#94a3b8">minRelevance: 0.1</text>
  <line x1="640" y1="224" x2="880" y2="224" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="11" fill="#0f172a">
    <text x="656" y="248">/guide/react-seo →</text>
    <text x="656" y="264">/guide/meta-tags</text>
    <text x="656" y="316">/blog/post-42 →</text>
    <text x="656" y="332">/pricing</text>
    <text x="656" y="384">/guide/meta-tags →</text>
    <text x="656" y="400">/guide/react-seo</text>
  </g>
  <g class="font-ui" font-size="11" fill="#64748b">
    <text x="656" y="284">anchor: "meta tags"</text>
    <text x="656" y="352">anchor: "pricing plans"</text>
    <text x="656" y="420">anchor: "react seo"</text>
  </g>
  <rect x="800" y="234" width="66" height="18" rx="9" fill="#dcfce7"/>
  <text x="833" y="247" class="font-ui" font-size="10" font-weight="600" fill="#16a34a" text-anchor="middle">0.42</text>
  <rect x="800" y="302" width="66" height="18" rx="9" fill="#dcfce7"/>
  <text x="833" y="315" class="font-ui" font-size="10" font-weight="600" fill="#16a34a" text-anchor="middle">0.31</text>
  <rect x="800" y="370" width="66" height="18" rx="9" fill="#fef3c7"/>
  <text x="833" y="383" class="font-ui" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">0.18</text>
  <text x="656" y="460" class="font-ui" font-size="11" fill="#94a3b8">3 of 20 suggestions shown</text>
</svg>
