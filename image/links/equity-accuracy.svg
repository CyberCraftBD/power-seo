<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>How analyzeLinkEquity computes PageRank-style scores — the iterative formula with damping 0.85 and the resulting normalized equity ranking</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">analyzeLinkEquity() — PageRank-Style Scoring</text>
  <!-- left card: algorithm -->
  <rect x="40" y="68" width="400" height="402" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="98" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">The algorithm</text>
  <rect x="64" y="114" width="352" height="128" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="12">
    <text x="80" y="140" fill="#94a3b8">// initial score = 1/N for all pages</text>
    <text x="80" y="162" fill="#94a3b8">// each iteration:</text>
    <text x="80" y="184" fill="#0f172a">score = (1-d)/N</text>
    <text x="80" y="202" fill="#0f172a">  + d * Σ(inbound score / outboundCount)</text>
    <text x="80" y="226" fill="#94a3b8">// normalized 0–1, sorted descending</text>
  </g>
  <!-- defaults -->
  <text x="64" y="278" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Defaults (LinkEquityOptions)</text>
  <rect x="64" y="292" width="168" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="80" y="314" class="font-ui" font-size="12" fill="#64748b">damping</text>
  <text x="80" y="340" class="font-mono" font-size="18" font-weight="700" fill="#2563eb">0.85</text>
  <rect x="248" y="292" width="168" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="264" y="314" class="font-ui" font-size="12" fill="#64748b">iterations</text>
  <text x="264" y="340" class="font-mono" font-size="18" font-weight="700" fill="#2563eb">20</text>
  <!-- return type -->
  <text x="64" y="392" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Returns LinkEquityScore[]</text>
  <g class="font-mono" font-size="12" fill="#64748b">
    <text x="64" y="416">{ url: string,</text>
    <text x="64" y="434">  score: number,   <tspan fill="#94a3b8">// 0–1 normalized</tspan></text>
    <text x="64" y="452">  inboundCount: number }</text>
  </g>
  <!-- right card: result bars -->
  <rect x="464" y="68" width="396" height="402" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="488" y="98" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Equity ranking (sorted descending)</text>
  <rect x="754" y="82" width="88" height="22" rx="11" fill="#dbeafe"/>
  <text x="798" y="97" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">6 pages</text>
  <g class="font-mono" font-size="12" fill="#0f172a">
    <text x="488" y="140">/</text>
    <text x="488" y="196">/blog</text>
    <text x="488" y="252">/pricing</text>
    <text x="488" y="308">/guide/react-seo</text>
    <text x="488" y="364">/guide/meta-tags</text>
    <text x="488" y="420">/blog/post-42</text>
  </g>
  <g fill="#e2e8f0">
    <rect x="488" y="150" width="280" height="10" rx="4"/>
    <rect x="488" y="206" width="280" height="10" rx="4"/>
    <rect x="488" y="262" width="280" height="10" rx="4"/>
    <rect x="488" y="318" width="280" height="10" rx="4"/>
    <rect x="488" y="374" width="280" height="10" rx="4"/>
    <rect x="488" y="430" width="280" height="10" rx="4"/>
  </g>
  <g fill="#2563eb">
    <rect x="488" y="150" width="280" height="10" rx="4"/>
    <rect x="488" y="206" width="206" height="10" rx="4"/>
    <rect x="488" y="262" width="143" height="10" rx="4"/>
    <rect x="488" y="318" width="81" height="10" rx="4"/>
    <rect x="488" y="374" width="57" height="10" rx="4"/>
    <rect x="488" y="430" width="17" height="10" rx="4"/>
  </g>
  <g class="font-mono" font-size="12" fill="#64748b" text-anchor="end">
    <text x="836" y="159">1.000</text>
    <text x="836" y="215">0.734</text>
    <text x="836" y="271">0.512</text>
    <text x="836" y="327">0.288</text>
    <text x="836" y="383">0.204</text>
    <text x="836" y="439">0.061</text>
  </g>
  <text x="488" y="462" class="font-ui" font-size="11" fill="#94a3b8">Pages with many high-quality inbound links accumulate the most equity</text>
</svg>
