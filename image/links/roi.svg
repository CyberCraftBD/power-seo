<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Internal link workflow before and after adopting @power-seo/links — manual spreadsheet auditing replaced by an automated graph pipeline</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Internal Linking Workflow — Before &amp; After</text>
  <!-- before panel -->
  <rect x="40" y="68" width="400" height="402" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="64" y="86" width="120" height="24" rx="12" fill="#fee2e2"/>
  <text x="124" y="103" class="font-ui" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Manual process</text>
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="100" y="152">Export crawl to spreadsheet</text>
    <text x="100" y="212">Cross-reference links by hand</text>
    <text x="100" y="272">Spot orphans by scanning rows</text>
    <text x="100" y="332">Guess which pages to link</text>
    <text x="100" y="392">Repeat after every publish</text>
  </g>
  <g class="font-ui" font-size="12" fill="#64748b">
    <text x="100" y="171">Static snapshot, stale immediately</text>
    <text x="100" y="231">Error-prone at any real site size</text>
    <text x="100" y="291">Easy to miss zero-inbound pages</text>
    <text x="100" y="351">No relevance signal for anchors</text>
    <text x="100" y="411">Whole cycle starts over</text>
  </g>
  <!-- x icons -->
  <g fill="#fee2e2">
    <circle cx="78" cy="148" r="9"/><circle cx="78" cy="208" r="9"/><circle cx="78" cy="268" r="9"/><circle cx="78" cy="328" r="9"/><circle cx="78" cy="388" r="9"/>
  </g>
  <g stroke="#ef4444" stroke-width="1.8" stroke-linecap="round">
    <path d="M74 144 l8 8 M82 144 l-8 8"/>
    <path d="M74 204 l8 8 M82 204 l-8 8"/>
    <path d="M74 264 l8 8 M82 264 l-8 8"/>
    <path d="M74 324 l8 8 M82 324 l-8 8"/>
    <path d="M74 384 l8 8 M82 384 l-8 8"/>
  </g>
  <!-- arrow between panels -->
  <line x1="448" y1="270" x2="452" y2="270" stroke="#2563eb" stroke-width="2"/>
  <path d="M444 262 l12 8 l-12 8 z" fill="#2563eb"/>
  <!-- after panel -->
  <rect x="464" y="68" width="396" height="402" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="488" y="86" width="176" height="24" rx="12" fill="#dcfce7"/>
  <text x="576" y="103" class="font-mono" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">with @power-seo/links</text>
  <!-- pipeline steps -->
  <g class="font-mono" font-size="13" font-weight="600" fill="#2563eb">
    <text x="522" y="152">buildLinkGraph(pages)</text>
    <text x="522" y="222">findOrphanPages(graph)</text>
    <text x="522" y="292">suggestLinks(pages)</text>
    <text x="522" y="362">analyzeLinkEquity(graph)</text>
  </g>
  <g class="font-ui" font-size="12" fill="#64748b">
    <text x="522" y="171">Directed graph with inbound/outbound sets</text>
    <text x="522" y="241">Every zero-inbound page, sorted by priority</text>
    <text x="522" y="311">Anchor text + relevanceScore per pair</text>
    <text x="522" y="381">Normalized 0–1 equity for every page</text>
  </g>
  <!-- check icons -->
  <g fill="#dcfce7">
    <circle cx="500" cy="148" r="9"/><circle cx="500" cy="218" r="9"/><circle cx="500" cy="288" r="9"/><circle cx="500" cy="358" r="9"/>
  </g>
  <g stroke="#16a34a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M496 148 l3 3 l6 -6"/>
    <path d="M496 218 l3 3 l6 -6"/>
    <path d="M496 288 l3 3 l6 -6"/>
    <path d="M496 358 l3 3 l6 -6"/>
  </g>
  <!-- connectors -->
  <g stroke="#e2e8f0" stroke-width="2">
    <line x1="500" y1="157" x2="500" y2="209"/>
    <line x1="500" y1="227" x2="500" y2="279"/>
    <line x1="500" y1="297" x2="500" y2="349"/>
  </g>
  <rect x="488" y="404" width="348" height="48" rx="8" fill="#dbeafe"/>
  <text x="504" y="424" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8">Runs in CI/CD or after every publish — pure in-memory</text>
  <text x="504" y="441" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8">computation, zero dependencies, no crawler licence.</text>
</svg>
