<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>Banner for the @power-seo/links package showing internal link graph analysis with orphan detection and link equity scoring</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>
  <!-- left: branding -->
  <text x="72" y="104" class="font-mono" font-size="34" font-weight="700" fill="#0f172a">@power-seo/<tspan fill="#2563eb">links</tspan></text>
  <text x="72" y="142" class="font-ui" font-size="16" fill="#64748b">Directed link graph, orphan page detection, keyword-overlap suggestions</text>
  <text x="72" y="166" class="font-ui" font-size="16" fill="#64748b">and PageRank-style link equity scoring — zero dependencies.</text>
  <!-- feature pills -->
  <rect x="72" y="192" width="132" height="26" rx="13" fill="#dbeafe"/>
  <text x="138" y="209" class="font-mono" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">buildLinkGraph()</text>
  <rect x="214" y="192" width="144" height="26" rx="13" fill="#dcfce7"/>
  <text x="286" y="209" class="font-mono" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">findOrphanPages()</text>
  <rect x="368" y="192" width="122" height="26" rx="13" fill="#f1f5f9"/>
  <text x="429" y="209" class="font-mono" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">suggestLinks()</text>
  <rect x="500" y="192" width="156" height="26" rx="13" fill="#f1f5f9"/>
  <text x="578" y="209" class="font-mono" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">analyzeLinkEquity()</text>
  <!-- right: link graph vignette card -->
  <rect x="770" y="34" width="440" height="212" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="794" y="64" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Link Graph</text>
  <rect x="1116" y="48" width="72" height="20" rx="10" fill="#dbeafe"/>
  <text x="1152" y="62" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">6 pages</text>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="866" y1="140" x2="964" y2="102"/>
    <line x1="866" y1="140" x2="964" y2="178"/>
    <line x1="964" y1="102" x2="1062" y2="102"/>
    <line x1="964" y1="178" x2="1062" y2="178"/>
    <line x1="964" y1="102" x2="964" y2="178"/>
  </g>
  <!-- nodes -->
  <circle cx="866" cy="140" r="18" fill="#2563eb"/>
  <text x="866" y="145" class="font-ui" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">/</text>
  <circle cx="964" cy="102" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="964" cy="178" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="1062" cy="102" r="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1062" cy="178" r="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- orphan node (no inbound edges) -->
  <circle cx="1148" cy="140" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1148" y="144" class="font-ui" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">0</text>
  <text x="1148" y="172" class="font-ui" font-size="10" fill="#b91c1c" text-anchor="middle">orphan</text>
  <!-- labels -->
  <text x="866" y="174" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">home</text>
  <text x="964" y="88" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">/blog</text>
  <text x="964" y="210" class="font-mono" font-size="10" fill="#64748b" text-anchor="middle">/about</text>
  <text x="794" y="230" class="font-mono" font-size="11" fill="#94a3b8">inboundCount: 0 → returned by findOrphanPages()</text>
</svg>
