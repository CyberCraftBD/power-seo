<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>@power-seo/redirects header: a framework-agnostic redirect rule engine for TypeScript with a createRedirectEngine quick-start example and Next.js, Remix, and Express adapters</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- left column: branding -->
  <rect x="60" y="118" width="150" height="28" rx="14" fill="#dbeafe"/>
  <text x="135" y="137" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">power-seo toolkit</text>

  <text x="60" y="204" class="font-ui" font-size="44" font-weight="700" fill="#0f172a">@power-seo/</text>
  <text x="60" y="256" class="font-ui" font-size="44" font-weight="700" fill="#2563eb">redirects</text>

  <text x="60" y="304" class="font-ui" font-size="17" fill="#64748b">Define redirect rules once &#8212; apply them in Next.js, Remix,</text>
  <text x="60" y="330" class="font-ui" font-size="17" fill="#64748b">and Express with typed exact, glob, and regex URL matching.</text>

  <!-- adapter chips -->
  <rect x="60" y="360" width="146" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="133" y="380" class="font-mono" font-size="12" fill="#0f172a" text-anchor="middle">toNextRedirects</text>
  <rect x="216" y="360" width="216" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="324" y="380" class="font-mono" font-size="12" fill="#0f172a" text-anchor="middle">createRemixRedirectHandler</text>
  <rect x="60" y="400" width="248" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="184" y="420" class="font-mono" font-size="12" fill="#0f172a" text-anchor="middle">createExpressRedirectMiddleware</text>

  <!-- install button -->
  <rect x="60" y="466" width="316" height="44" rx="8" fill="#2563eb"/>
  <text x="218" y="493" class="font-mono" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">npm install @power-seo/redirects</text>

  <text x="60" y="548" class="font-ui" font-size="13" fill="#94a3b8">Zero runtime dependencies &#183; tree-shakeable &#183; edge-compatible</text>

  <!-- right column: quick-start code card -->
  <rect x="560" y="96" width="580" height="438" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="560" y="96" width="580" height="44" rx="8" fill="#f8fafc"/>
  <line x1="560" y1="140" x2="1140" y2="140" stroke="#e2e8f0"/>
  <text x="584" y="124" class="font-mono" font-size="13" font-weight="600" fill="#0f172a">redirects.config.ts</text>
  <rect x="1042" y="106" width="78" height="24" rx="12" fill="#dcfce7"/>
  <text x="1081" y="122" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">TypeScript</text>

  <text x="584" y="176" class="font-mono" font-size="13"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { </tspan><tspan fill="#2563eb">createRedirectEngine</tspan><tspan fill="#0f172a"> } </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#16a34a"> '@power-seo/redirects'</tspan><tspan fill="#0f172a">;</tspan></text>

  <text x="584" y="216" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> engine = </tspan><tspan fill="#2563eb">createRedirectEngine</tspan><tspan fill="#0f172a">([</tspan></text>
  <text x="604" y="244" class="font-mono" font-size="13"><tspan fill="#0f172a">{ source: </tspan><tspan fill="#16a34a">'/old-about'</tspan><tspan fill="#0f172a">, destination: </tspan><tspan fill="#16a34a">'/about'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="620" y="270" class="font-mono" font-size="13"><tspan fill="#0f172a">statusCode: </tspan><tspan fill="#2563eb">301</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="604" y="298" class="font-mono" font-size="13"><tspan fill="#0f172a">{ source: </tspan><tspan fill="#16a34a">'/blog/:slug'</tspan><tspan fill="#0f172a">, destination: </tspan><tspan fill="#16a34a">'/articles/:slug'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="620" y="324" class="font-mono" font-size="13"><tspan fill="#0f172a">statusCode: </tspan><tspan fill="#2563eb">301</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="604" y="352" class="font-mono" font-size="13"><tspan fill="#0f172a">{ source: </tspan><tspan fill="#16a34a">'/docs/*'</tspan><tspan fill="#0f172a">, destination: </tspan><tspan fill="#16a34a">'/documentation/*'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="620" y="378" class="font-mono" font-size="13"><tspan fill="#0f172a">statusCode: </tspan><tspan fill="#2563eb">302</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="584" y="406" class="font-mono" font-size="13" fill="#0f172a">]);</text>

  <text x="584" y="446" class="font-mono" font-size="13"><tspan fill="#0f172a">engine.</tspan><tspan fill="#2563eb">match</tspan><tspan fill="#0f172a">(</tspan><tspan fill="#16a34a">'/blog/my-seo-guide'</tspan><tspan fill="#0f172a">);</tspan></text>
  <text x="584" y="472" class="font-mono" font-size="13" fill="#94a3b8">// { resolvedDestination: '/articles/my-seo-guide',</text>
  <text x="584" y="496" class="font-mono" font-size="13" fill="#94a3b8">//   statusCode: 301 }</text>

  <!-- result badge -->
  <rect x="960" y="432" width="160" height="26" rx="13" fill="#dcfce7"/>
  <text x="1040" y="449" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">First match wins &#8594; 301</text>
</svg>
