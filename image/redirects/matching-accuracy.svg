<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Pattern matching in @power-seo/redirects: matchExact, matchGlob with named params, and matchRegex with capture groups, plus the isDestinationSafe open-redirect guard</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Three Typed Matchers, One Engine</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Every rule is evaluated top-to-bottom &#8212; first match wins</text>

  <!-- card 1: matchExact -->
  <rect x="40" y="90" width="260" height="270" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="122" class="font-mono" font-size="14" font-weight="600" fill="#2563eb">matchExact()</text>
  <rect x="212" y="104" width="68" height="22" rx="11" fill="#dbeafe"/>
  <text x="246" y="119" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">exact</text>
  <line x1="40" y1="138" x2="300" y2="138" stroke="#e2e8f0"/>
  <text x="64" y="164" class="font-ui" font-size="11" fill="#94a3b8">SOURCE</text>
  <rect x="64" y="172" width="212" height="30" rx="6" fill="#f1f5f9"/>
  <text x="76" y="192" class="font-mono" font-size="12" fill="#0f172a">/old-about</text>
  <text x="64" y="228" class="font-ui" font-size="11" fill="#94a3b8">URL TESTED</text>
  <rect x="64" y="236" width="212" height="30" rx="6" fill="#f1f5f9"/>
  <text x="76" y="256" class="font-mono" font-size="12" fill="#0f172a">/Old-About/</text>
  <rect x="64" y="286" width="130" height="24" rx="12" fill="#dcfce7"/>
  <text x="129" y="302" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">matched: true</text>
  <text x="64" y="338" class="font-ui" font-size="11" fill="#64748b">trailingSlash: 'remove' (default)</text>
  <text x="64" y="354" class="font-ui" font-size="11" fill="#64748b">caseSensitive: false (default)</text>

  <!-- card 2: matchGlob -->
  <rect x="320" y="90" width="260" height="270" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="344" y="122" class="font-mono" font-size="14" font-weight="600" fill="#2563eb">matchGlob()</text>
  <rect x="492" y="104" width="68" height="22" rx="11" fill="#dbeafe"/>
  <text x="526" y="119" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">:param / *</text>
  <line x1="320" y1="138" x2="580" y2="138" stroke="#e2e8f0"/>
  <text x="344" y="164" class="font-ui" font-size="11" fill="#94a3b8">PATTERN</text>
  <rect x="344" y="172" width="212" height="30" rx="6" fill="#f1f5f9"/>
  <text x="356" y="192" class="font-mono" font-size="12" fill="#0f172a">/users/<tspan fill="#7c3aed">:id</tspan></text>
  <text x="344" y="228" class="font-ui" font-size="11" fill="#94a3b8">URL TESTED</text>
  <rect x="344" y="236" width="212" height="30" rx="6" fill="#f1f5f9"/>
  <text x="356" y="256" class="font-mono" font-size="12" fill="#0f172a">/users/123</text>
  <rect x="344" y="286" width="176" height="24" rx="12" fill="#dcfce7"/>
  <text x="432" y="302" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">params: { id: '123' }</text>
  <text x="344" y="338" class="font-ui" font-size="11" fill="#64748b">/blog/* matches nested paths;</text>
  <text x="344" y="354" class="font-ui" font-size="11" fill="#64748b">substituteParams() fills the destination</text>

  <!-- card 3: matchRegex -->
  <rect x="600" y="90" width="260" height="270" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="624" y="122" class="font-mono" font-size="14" font-weight="600" fill="#2563eb">matchRegex()</text>
  <rect x="772" y="104" width="68" height="22" rx="11" fill="#dbeafe"/>
  <text x="806" y="119" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">regex</text>
  <line x1="600" y1="138" x2="860" y2="138" stroke="#e2e8f0"/>
  <text x="624" y="164" class="font-ui" font-size="11" fill="#94a3b8">PATTERN &#8594; DESTINATION</text>
  <rect x="624" y="172" width="212" height="30" rx="6" fill="#f1f5f9"/>
  <text x="636" y="192" class="font-mono" font-size="12" fill="#0f172a">/old/(.*) &#8594; /new/<tspan fill="#7c3aed">$1</tspan></text>
  <text x="624" y="228" class="font-ui" font-size="11" fill="#94a3b8">URL TESTED</text>
  <rect x="624" y="236" width="212" height="30" rx="6" fill="#f1f5f9"/>
  <text x="636" y="256" class="font-mono" font-size="12" fill="#0f172a">/old/hello</text>
  <rect x="624" y="286" width="196" height="24" rx="12" fill="#dcfce7"/>
  <text x="722" y="302" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">destination: '/new/hello'</text>
  <text x="624" y="338" class="font-ui" font-size="11" fill="#64748b">Anchored ^pattern$ with capture</text>
  <text x="624" y="354" class="font-ui" font-size="11" fill="#64748b">group substitution ($1, $2, &#8230;)</text>

  <!-- safety strip -->
  <rect x="40" y="384" width="820" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="80" cy="426" r="16" fill="#dcfce7"/>
  <path d="M 73 426 L 78 431 L 88 420" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="418" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">isDestinationSafe() &#8212; open-redirect guard on every match</text>
  <text x="112" y="442" class="font-ui" font-size="12" fill="#64748b">Blocks javascript:, data:, vbscript: and file: schemes; capture groups cannot turn a relative destination external unless allowExternalRedirects is set.</text>
  <rect x="734" y="402" width="104" height="22" rx="11" fill="#fee2e2"/>
  <text x="786" y="417" class="font-mono" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">javascript: &#10007;</text>
</svg>
