<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison: manually duplicated redirect configs versus one typed rule file with compile-time checks and unit-testable matching in @power-seo/redirects</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Redirect Workflow, Before and After</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Broken 301s lose link equity during migrations &#8212; catch them before deploy</text>

  <!-- BEFORE panel -->
  <rect x="40" y="90" width="395" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Manual process</text>
  <rect x="330" y="104" width="86" height="24" rx="12" fill="#fee2e2"/>
  <text x="373" y="120" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">error-prone</text>
  <line x1="40" y1="138" x2="435" y2="138" stroke="#e2e8f0"/>

  <text x="88" y="168" class="font-ui" font-size="13" fill="#0f172a">Rules duplicated per platform</text>
  <text x="88" y="188" class="font-mono" font-size="11" fill="#94a3b8">next.config.js &#183; vercel.json &#183; nginx.conf</text>
  <text x="64" y="168" class="font-ui" font-size="13" font-weight="700" fill="#ef4444">&#10007;</text>

  <text x="88" y="224" class="font-ui" font-size="13" fill="#0f172a">Status code typos ship to production</text>
  <text x="88" y="244" class="font-mono" font-size="11" fill="#94a3b8">"statusCode": 310  // caught at runtime</text>
  <text x="64" y="224" class="font-ui" font-size="13" font-weight="700" fill="#ef4444">&#10007;</text>

  <text x="88" y="280" class="font-ui" font-size="13" fill="#0f172a">Deploy to verify each redirect</text>
  <text x="88" y="300" class="font-ui" font-size="11" fill="#94a3b8">edit config &#8594; deploy &#8594; click &#8594; repeat</text>
  <text x="64" y="280" class="font-ui" font-size="13" font-weight="700" fill="#ef4444">&#10007;</text>

  <text x="88" y="336" class="font-ui" font-size="13" fill="#0f172a">Configs drift apart over time</text>
  <text x="88" y="356" class="font-ui" font-size="11" fill="#94a3b8">a rule fixed in one file, forgotten in another</text>
  <text x="64" y="336" class="font-ui" font-size="13" font-weight="700" fill="#ef4444">&#10007;</text>

  <text x="88" y="392" class="font-ui" font-size="13" fill="#0f172a">Redirect loops found in production</text>
  <text x="88" y="412" class="font-mono" font-size="11" fill="#94a3b8">ERR_TOO_MANY_REDIRECTS</text>
  <text x="64" y="392" class="font-ui" font-size="13" font-weight="700" fill="#ef4444">&#10007;</text>

  <!-- arrow between panels -->
  <circle cx="450" cy="280" r="22" fill="#dbeafe"/>
  <path d="M 441 280 L 459 280 M 452 273 L 459 280 L 452 287" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AFTER panel -->
  <rect x="465" y="90" width="395" height="380" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="489" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">With @power-seo/redirects</text>
  <rect x="775" y="104" width="66" height="24" rx="12" fill="#dcfce7"/>
  <text x="808" y="120" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">typed</text>
  <line x1="465" y1="138" x2="860" y2="138" stroke="#e2e8f0"/>

  <text x="513" y="168" class="font-ui" font-size="13" fill="#0f172a">One RedirectRule[] source of truth</text>
  <text x="513" y="188" class="font-mono" font-size="11" fill="#94a3b8">redirects.config.ts &#8594; every framework</text>
  <text x="489" y="168" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">&#10003;</text>

  <text x="513" y="224" class="font-ui" font-size="13" fill="#0f172a">RedirectStatusCode checked at compile time</text>
  <text x="513" y="244" class="font-mono" font-size="11" fill="#94a3b8">statusCode: 301 | 302 &#8212; typos never build</text>
  <text x="489" y="224" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">&#10003;</text>

  <text x="513" y="280" class="font-ui" font-size="13" fill="#0f172a">engine.match() in unit tests</text>
  <text x="513" y="300" class="font-ui" font-size="11" fill="#94a3b8">synchronous, zero-cost &#8212; no deploy needed</text>
  <text x="489" y="280" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">&#10003;</text>

  <text x="513" y="336" class="font-ui" font-size="13" fill="#0f172a">Adapters generate each target</text>
  <text x="513" y="356" class="font-mono" font-size="11" fill="#94a3b8">toNextRedirects &#183; Remix loader &#183; Express</text>
  <text x="489" y="336" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">&#10003;</text>

  <text x="513" y="392" class="font-ui" font-size="13" fill="#0f172a">Chains resolved, loops throw early</text>
  <text x="513" y="412" class="font-mono" font-size="11" fill="#94a3b8">A &#8594; B &#8594; C resolves to C; A &#8594; A throws</text>
  <text x="489" y="392" class="font-ui" font-size="13" font-weight="700" fill="#16a34a">&#10003;</text>

  <rect x="489" y="430" width="347" height="26" rx="13" fill="#dbeafe"/>
  <text x="662" y="447" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Correct 301s preserve link equity through every migration</text>
</svg>
