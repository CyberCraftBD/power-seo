  <text x="60" y="161" class="font-ui" font-size="13" fill="#0f172a">Works in Next.js</text>
  <text x="60" y="203" class="font-ui" font-size="13" fill="#0f172a">Works in Remix</text>
  <text x="60" y="245" class="font-ui" font-size="13" fill="#0f172a">Works in Express</text>
  <text x="60" y="287" class="font-ui" font-size="13" fill="#0f172a">Typed TypeScript API</text>
  <text x="60" y="329" class="font-ui" font-size="13" fill="#0f172a">Named :param substitution</text>
