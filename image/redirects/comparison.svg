  <text x="810" y="117" class="font-mono" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">nginx</text>

  <!-- highlight column -->
  <rect x="420" y="135" width="110" height="336" fill="#dbeafe" opacity="0.35"/>

