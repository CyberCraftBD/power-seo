<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix showing @power-seo/redirects versus next.config.js redirects, vercel.json, and nginx rewrite rules</title>
