  <line x1="40" y1="177" x2="860" y2="177" stroke="#e2e8f0"/>
  <line x1="40" y1="219" x2="860" y2="219" stroke="#e2e8f0"/>
  <line x1="40" y1="261" x2="860" y2="261" stroke="#e2e8f0"/>
