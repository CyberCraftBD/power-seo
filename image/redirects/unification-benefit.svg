<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>One shared RedirectRule array feeding the Next.js, Remix, and Express adapters of @power-seo/redirects from a single typed config file</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">One Rule Set. Three Frameworks.</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Tree-shakeable adapters &#8212; import only the framework you target</text>

  <!-- source card -->
  <rect x="48" y="150" width="310" height="220" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <rect x="49" y="151" width="308" height="40" rx="8" fill="#f8fafc"/>
  <line x1="48" y1="191" x2="358" y2="191" stroke="#e2e8f0"/>
  <text x="70" y="176" class="font-mono" font-size="13" font-weight="600" fill="#0f172a">redirects.config.ts</text>
  <rect x="256" y="161" width="88" height="21" rx="10" fill="#dbeafe"/>
  <text x="300" y="176" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">RedirectRule[]</text>

  <text x="70" y="220" class="font-mono" font-size="12"><tspan fill="#7c3aed">export const</tspan><tspan fill="#0f172a"> rules = [</tspan></text>
  <text x="84" y="244" class="font-mono" font-size="12"><tspan fill="#0f172a">{ source: </tspan><tspan fill="#16a34a">'/old-about'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="98" y="266" class="font-mono" font-size="12"><tspan fill="#0f172a">destination: </tspan><tspan fill="#16a34a">'/about'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="98" y="288" class="font-mono" font-size="12"><tspan fill="#0f172a">statusCode: </tspan><tspan fill="#2563eb">301</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="84" y="312" class="font-mono" font-size="12"><tspan fill="#0f172a">{ source: </tspan><tspan fill="#16a34a">'/blog/:slug'</tspan><tspan fill="#0f172a">, &#8230; },</tspan></text>
  <text x="70" y="336" class="font-mono" font-size="12" fill="#0f172a">];</text>
  <text x="70" y="358" class="font-mono" font-size="11" fill="#94a3b8">// one file &#8212; imported everywhere</text>

  <!-- connectors -->
  <path d="M 358 260 C 420 260 420 130 480 130" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <path d="M 473 124 L 480 130 L 473 136" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <path d="M 358 260 L 480 260" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <path d="M 473 254 L 480 260 L 473 266" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <path d="M 358 260 C 420 260 420 390 480 390" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <path d="M 473 384 L 480 390 L 473 396" stroke="#2563eb" stroke-width="1.6" fill="none"/>

  <!-- Next.js card -->
  <rect x="490" y="86" width="362" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="512" y="116" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Next.js</text>
  <rect x="746" y="99" width="88" height="22" rx="11" fill="#dcfce7"/>
  <text x="790" y="114" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">next.config.js</text>
  <rect x="512" y="130" width="318" height="30" rx="6" fill="#f1f5f9"/>
  <text x="524" y="150" class="font-mono" font-size="12"><tspan fill="#2563eb">toNextRedirects</tspan><tspan fill="#0f172a">(rules)</tspan></text>
  <text x="512" y="180" class="font-ui" font-size="11" fill="#94a3b8">statusCode: 301 maps to permanent: true automatically</text>

  <!-- Remix card -->
  <rect x="490" y="212" width="362" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="512" y="242" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Remix</text>
  <rect x="762" y="225" width="72" height="22" rx="11" fill="#dcfce7"/>
  <text x="798" y="240" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">loader</text>
  <rect x="512" y="256" width="318" height="30" rx="6" fill="#f1f5f9"/>
  <text x="524" y="276" class="font-mono" font-size="12"><tspan fill="#2563eb">createRemixRedirectHandler</tspan><tspan fill="#0f172a">(rules)</tspan></text>
  <text x="512" y="306" class="font-ui" font-size="11" fill="#94a3b8">Returns a Remix-compatible loader function</text>

  <!-- Express card -->
  <rect x="490" y="338" width="362" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="512" y="368" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Express</text>
  <rect x="742" y="351" width="92" height="22" rx="11" fill="#dcfce7"/>
  <text x="788" y="366" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">middleware</text>
  <rect x="512" y="382" width="318" height="30" rx="6" fill="#f1f5f9"/>
  <text x="524" y="402" class="font-mono" font-size="12"><tspan fill="#2563eb">createExpressRedirectMiddleware</tspan><tspan fill="#0f172a">(rules)</tspan></text>
  <text x="512" y="432" class="font-ui" font-size="11" fill="#94a3b8">Returns an Express RequestHandler for app.use()</text>

  <!-- footer note -->
  <text x="48" y="452" class="font-ui" font-size="12" fill="#64748b">Fix a rule once in redirects.config.ts &#8212; every framework picks it up on the next build. No config drift.</text>
</svg>
