<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>@power-seo/redirects banner: define redirect rules once and apply them in Next.js, Remix, and Express with typed exact, glob, and regex matching</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- left: branding -->
  <text x="64" y="96" class="font-ui" font-size="34" font-weight="700" fill="#0f172a">@power-seo/redirects</text>
  <text x="64" y="132" class="font-ui" font-size="16" fill="#64748b">One typed RedirectRule[] &#8212; Next.js, Remix and Express adapters from a single source of truth.</text>

  <!-- install pill -->
  <rect x="64" y="158" width="330" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="82" y="183" class="font-mono" font-size="13" fill="#64748b">$ npm install @power-seo/redirects</text>

  <!-- feature badges -->
  <rect x="64" y="216" width="110" height="24" rx="12" fill="#dbeafe"/>
  <text x="119" y="232" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript-first</text>
  <rect x="182" y="216" width="120" height="24" rx="12" fill="#dcfce7"/>
  <text x="242" y="232" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Zero dependencies</text>
  <rect x="310" y="216" width="112" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="366" y="232" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Edge-compatible</text>

  <!-- right: redirect rules vignette card -->
  <rect x="720" y="40" width="496" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="744" y="70" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Redirect Rules</text>
  <rect x="1122" y="52" width="72" height="24" rx="12" fill="#dcfce7"/>
  <text x="1158" y="68" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">3 active</text>
  <line x1="720" y1="84" x2="1216" y2="84" stroke="#e2e8f0"/>

  <!-- rule row 1 -->
  <text x="744" y="112" class="font-mono" font-size="13" fill="#0f172a">/old-about</text>
  <path d="M 890 107 L 920 107 M 913 101 L 920 107 L 913 113" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <text x="934" y="112" class="font-mono" font-size="13" fill="#0f172a">/about</text>
  <rect x="1140" y="97" width="44" height="22" rx="11" fill="#dbeafe"/>
  <text x="1162" y="112" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">301</text>
  <line x1="736" y1="128" x2="1200" y2="128" stroke="#e2e8f0"/>

  <!-- rule row 2 -->
  <text x="744" y="156" class="font-mono" font-size="13" fill="#0f172a">/blog/<tspan fill="#7c3aed">:slug</tspan></text>
  <path d="M 890 151 L 920 151 M 913 145 L 920 151 L 913 157" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <text x="934" y="156" class="font-mono" font-size="13" fill="#0f172a">/articles/<tspan fill="#7c3aed">:slug</tspan></text>
  <rect x="1140" y="141" width="44" height="22" rx="11" fill="#dbeafe"/>
  <text x="1162" y="156" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">301</text>
  <line x1="736" y1="172" x2="1200" y2="172" stroke="#e2e8f0"/>

  <!-- rule row 3 -->
  <text x="744" y="200" class="font-mono" font-size="13" fill="#0f172a">/docs/<tspan fill="#7c3aed">*</tspan></text>
  <path d="M 890 195 L 920 195 M 913 189 L 920 195 L 913 201" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <text x="934" y="200" class="font-mono" font-size="13" fill="#0f172a">/documentation/<tspan fill="#7c3aed">*</tspan></text>
  <rect x="1140" y="185" width="44" height="22" rx="11" fill="#fef3c7"/>
  <text x="1162" y="200" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">302</text>

  <!-- footer strip inside card -->
  <line x1="720" y1="214" x2="1216" y2="214" stroke="#e2e8f0"/>
  <text x="744" y="232" class="font-ui" font-size="11" fill="#94a3b8">First match wins &#183; exact, glob and regex patterns</text>
</svg>
