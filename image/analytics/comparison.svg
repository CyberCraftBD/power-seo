<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix of @power-seo/analytics versus Looker Studio, GA4, and custom scripts for GSC merge, correlation, trends, anomalies, and ranking analysis</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
