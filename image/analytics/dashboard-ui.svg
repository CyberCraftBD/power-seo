<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>SEO analytics dashboard built from buildDashboardData output, showing overview metrics, a weekly clicks trend line, and top queries with position buckets</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <rect x="16" y="18" width="22" height="22" rx="6" fill="#2563eb"/>
  <path d="M21 34 L26 27 L29 30 L33 23" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="34" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">power-seo</text>
  <rect x="12" y="64" width="156" height="32" rx="6" fill="#dbeafe"/>
  <text x="26" y="84" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Analytics</text>
  <text x="26" y="122" class="font-ui" font-size="13" fill="#64748b">Audit</text>
  <text x="26" y="156" class="font-ui" font-size="13" fill="#64748b">Rankings</text>
  <text x="26" y="190" class="font-ui" font-size="13" fill="#64748b">Trends</text>
  <text x="26" y="224" class="font-ui" font-size="13" fill="#64748b">Anomalies</text>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Search Performance</text>
  <rect x="756" y="11" width="120" height="30" rx="6" fill="#2563eb"/>
  <text x="816" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Rebuild Data</text>

  <!-- kpi cards -->
  <rect x="204" y="72" width="158" height="82" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="98" class="font-ui" font-size="11" fill="#94a3b8">TOTAL CLICKS</text>
  <text x="220" y="130" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">1,675</text>
  <rect x="374" y="72" width="158" height="82" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="390" y="98" class="font-ui" font-size="11" fill="#94a3b8">IMPRESSIONS</text>
  <text x="390" y="130" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">30,800</text>
  <rect x="544" y="72" width="158" height="82" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="560" y="98" class="font-ui" font-size="11" fill="#94a3b8">AVG POSITION</text>
  <text x="560" y="130" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">10.7</text>
  <rect x="714" y="72" width="162" height="82" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="730" y="98" class="font-ui" font-size="11" fill="#94a3b8">AVG AUDIT SCORE</text>
  <text x="730" y="130" class="font-ui" font-size="24" font-weight="700" fill="#16a34a">67.7</text>

  <!-- trend chart card -->
  <rect x="204" y="170" width="416" height="212" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="222" y="198" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Weekly clicks</text>
  <rect x="486" y="182" width="116" height="22" rx="11" fill="#dcfce7"/>
  <text x="544" y="197" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">improving +32.5%</text>
  <line x1="228" y1="352" x2="600" y2="352" stroke="#e2e8f0"/>
  <line x1="228" y1="312" x2="600" y2="312" stroke="#e2e8f0"/>
  <line x1="228" y1="272" x2="600" y2="272" stroke="#e2e8f0"/>
  <line x1="228" y1="232" x2="600" y2="232" stroke="#e2e8f0"/>
  <text x="222" y="356" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">1.2k</text>
  <text x="222" y="236" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">1.6k</text>
  <path d="M228 352 L302 337 L376 344 L450 324 L524 310 L600 313 L600 352 Z" fill="#2563eb" opacity="0.12"/>
  <path d="M228 352 L302 337 L376 344 L450 324 L524 310 L600 313" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="600" cy="313" r="4" fill="#2563eb"/>
  <text x="228" y="374" class="font-ui" font-size="11" fill="#94a3b8">2026-01-05</text>
  <text x="600" y="374" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">2026-02-09</text>

  <!-- ranking buckets card -->
  <rect x="636" y="170" width="240" height="212" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="654" y="198" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Position buckets</text>
  <text x="654" y="228" class="font-ui" font-size="12" fill="#64748b">1-3</text>
  <rect x="702" y="218" width="140" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="702" y="218" width="28" height="8" rx="4" fill="#16a34a"/>
  <text x="858" y="228" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">1</text>
  <text x="654" y="262" class="font-ui" font-size="12" fill="#64748b">4-10</text>
  <rect x="702" y="252" width="140" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="702" y="252" width="28" height="8" rx="4" fill="#2563eb"/>
  <text x="858" y="262" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">1</text>
  <text x="654" y="296" class="font-ui" font-size="12" fill="#64748b">11-20</text>
  <rect x="702" y="286" width="140" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="702" y="286" width="28" height="8" rx="4" fill="#f59e0b"/>
  <text x="858" y="296" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">1</text>
  <text x="654" y="330" class="font-ui" font-size="12" fill="#64748b">21-100</text>
  <rect x="702" y="320" width="140" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="702" y="320" width="56" height="8" rx="4" fill="#ef4444"/>
  <text x="858" y="330" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">2</text>
  <text x="654" y="364" class="font-ui" font-size="11" fill="#94a3b8">analyzeQueryRankings()</text>

  <!-- top pages table -->
  <rect x="204" y="398" width="672" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="205" y="399" width="670" height="24" rx="7" fill="#f8fafc"/>
  <text x="222" y="416" class="font-ui" font-size="11" font-weight="600" fill="#64748b">TOP PAGES</text>
  <text x="600" y="416" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">CLICKS</text>
  <text x="720" y="416" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">POSITION</text>
  <text x="856" y="416" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">SCORE</text>
  <text x="222" y="444" class="font-mono" font-size="12" fill="#0f172a">/blog/react-seo</text>
  <text x="600" y="444" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">1,240</text>
  <text x="720" y="444" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">4.2</text>
  <text x="856" y="444" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="end">88</text>
  <line x1="222" y1="454" x2="858" y2="454" stroke="#e2e8f0"/>
  <text x="222" y="472" class="font-mono" font-size="12" fill="#0f172a">/blog/meta-tags</text>
  <text x="600" y="472" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">380</text>
  <text x="720" y="472" class="font-ui" font-size="12" fill="#0f172a" text-anchor="end">8.7</text>
  <text x="856" y="472" class="font-ui" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="end">71</text>
</svg>
