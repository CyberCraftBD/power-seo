<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Social header for @power-seo/analytics showing the SEO data intelligence layer: Search Console merge, Pearson correlation, trend analysis, and dashboard aggregation</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- branding -->
  <rect x="80" y="88" width="56" height="56" rx="12" fill="#2563eb"/>
  <path d="M93 130 L103 114 L111 122 L123 102" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="126" class="font-mono" font-size="34" font-weight="700" fill="#0f172a">@power-seo/analytics</text>
  <text x="80" y="192" class="font-ui" font-size="20" fill="#64748b">The data intelligence layer of the power-seo ecosystem. Does a better</text>
  <text x="80" y="222" class="font-ui" font-size="20" fill="#64748b">audit score actually mean more organic traffic? Verify it empirically.</text>

  <!-- badges -->
  <rect x="80" y="252" width="204" height="32" rx="16" fill="#dcfce7"/>
  <text x="182" y="273" class="font-ui" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="296" y="252" width="140" height="32" rx="16" fill="#dbeafe"/>
  <text x="366" y="273" class="font-ui" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript-first</text>
  <rect x="448" y="252" width="152" height="32" rx="16" fill="#f1f5f9"/>
  <text x="524" y="273" class="font-ui" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Edge runtime safe</text>

  <!-- code card -->
  <rect x="80" y="320" width="520" height="222" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="100" y="342" width="480" height="178" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="118" y="372" class="font-mono" font-size="13" fill="#7c3aed">import<tspan fill="#0f172a"> { </tspan><tspan fill="#2563eb">buildDashboardData</tspan><tspan fill="#0f172a"> }</tspan></text>
  <text x="118" y="394" class="font-mono" font-size="13" fill="#7c3aed">  from<tspan fill="#16a34a"> '@power-seo/analytics'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="118" y="426" class="font-mono" font-size="13" fill="#0f172a">const dashboard = <tspan fill="#2563eb">buildDashboardData</tspan>({</text>
  <text x="118" y="448" class="font-mono" font-size="13" fill="#0f172a">  gscPages, gscQueries, auditResults,</text>
  <text x="118" y="470" class="font-mono" font-size="13" fill="#0f172a">});</text>
  <text x="118" y="502" class="font-mono" font-size="13" fill="#94a3b8">// dashboard.overview.totalClicks → 1675</text>

  <!-- right: dashboard vignette -->
  <rect x="648" y="112" width="472" height="430" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="648" y="112" width="472" height="52" rx="8" fill="#ffffff"/>
  <line x1="648" y1="164" x2="1120" y2="164" stroke="#e2e8f0"/>
  <text x="672" y="144" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">SEO Dashboard</text>
  <rect x="1004" y="124" width="96" height="30" rx="6" fill="#2563eb"/>
  <text x="1052" y="143" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Refresh</text>

  <!-- kpi row -->
  <rect x="672" y="184" width="136" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="688" y="210" class="font-ui" font-size="11" fill="#94a3b8">TOTAL CLICKS</text>
  <text x="688" y="240" class="font-ui" font-size="22" font-weight="700" fill="#0f172a">1,675</text>
  <rect x="816" y="184" width="136" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="832" y="210" class="font-ui" font-size="11" fill="#94a3b8">IMPRESSIONS</text>
  <text x="832" y="240" class="font-ui" font-size="22" font-weight="700" fill="#0f172a">30,800</text>
  <rect x="960" y="184" width="136" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="976" y="210" class="font-ui" font-size="11" fill="#94a3b8">PEARSON r</text>
  <text x="976" y="240" class="font-ui" font-size="22" font-weight="700" fill="#16a34a">0.741</text>

  <!-- chart -->
  <text x="672" y="296" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Weekly clicks — analyzeTrend</text>
  <rect x="988" y="282" width="108" height="22" rx="11" fill="#dcfce7"/>
  <text x="1042" y="297" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">improving +32.5%</text>
  <line x1="672" y1="420" x2="1096" y2="420" stroke="#e2e8f0"/>
  <line x1="672" y1="380" x2="1096" y2="380" stroke="#e2e8f0"/>
  <line x1="672" y1="340" x2="1096" y2="340" stroke="#e2e8f0"/>
  <path d="M672 404 L757 392 L842 398 L927 376 L1012 360 L1096 364 L1096 420 L672 420 Z" fill="#2563eb" opacity="0.12"/>
  <path d="M672 404 L757 392 L842 398 L927 376 L1012 360 L1096 364" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="672" y="438" class="font-ui" font-size="11" fill="#94a3b8">Jan 05</text>
  <text x="1096" y="438" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">Feb 09</text>

  <!-- top query rows -->
  <line x1="672" y1="456" x2="1096" y2="456" stroke="#e2e8f0"/>
  <text x="672" y="480" class="font-ui" font-size="13" fill="#0f172a">react seo guide</text>
  <text x="1096" y="480" class="font-mono" font-size="12" fill="#64748b" text-anchor="end">820 clicks · pos 3.1</text>
  <line x1="672" y1="492" x2="1096" y2="492" stroke="#e2e8f0"/>
  <text x="672" y="516" class="font-ui" font-size="13" fill="#0f172a">meta tags react</text>
  <text x="1096" y="516" class="font-mono" font-size="12" fill="#64748b" text-anchor="end">290 clicks · pos 7.4</text>
</svg>
