<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>How mergeGscWithAudit joins Google Search Console page data with audit results by normalized URL to produce PageInsight objects and a Pearson correlation</title>
  <defs>
    <style>
      .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Two data sources, one insight</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">mergeGscWithAudit(gscPages, auditResults) joins both dimensions by normalized URL</text>

  <!-- GSC card -->
  <rect x="48" y="100" width="272" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="68" y="128" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Google Search Console</text>
  <rect x="244" y="112" width="58" height="20" rx="10" fill="#dbeafe"/>
  <text x="273" y="126" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">GSC</text>
  <text x="68" y="156" class="font-mono" font-size="12" fill="#0f172a">GscPageData[]</text>
  <text x="68" y="180" class="font-mono" font-size="11" fill="#64748b">/blog/react-seo</text>
  <text x="302" y="180" class="font-mono" font-size="11" fill="#64748b" text-anchor="end">1,240 clicks</text>
  <text x="68" y="202" class="font-mono" font-size="11" fill="#64748b">ctr: 0.067</text>
  <text x="302" y="202" class="font-mono" font-size="11" fill="#64748b" text-anchor="end">pos 4.2</text>
  <text x="68" y="224" class="font-mono" font-size="11" fill="#64748b">impressions: 18,500</text>

  <!-- audit card -->
  <rect x="48" y="278" width="272" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="68" y="306" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">@power-seo/audit</text>
  <rect x="244" y="290" width="58" height="20" rx="10" fill="#dcfce7"/>
  <text x="273" y="304" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Audit</text>
  <text x="68" y="334" class="font-mono" font-size="12" fill="#0f172a">auditResults[]</text>
  <text x="68" y="358" class="font-mono" font-size="11" fill="#64748b">/blog/react-seo</text>
  <text x="302" y="358" class="font-mono" font-size="11" fill="#16a34a" text-anchor="end">score: 88</text>
  <text x="68" y="380" class="font-mono" font-size="11" fill="#64748b">seo: 91 · performance: 88</text>
  <text x="68" y="402" class="font-mono" font-size="11" fill="#64748b">recommendations: []</text>

  <!-- merge node -->
  <line x1="320" y1="175" x2="392" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="353" x2="392" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396" y="238" width="196" height="52" rx="8" fill="#2563eb"/>
  <text x="494" y="260" class="font-mono" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">mergeGscWithAudit()</text>
  <text x="494" y="278" class="font-ui" font-size="11" fill="#dbeafe" text-anchor="middle">normalized URL matching</text>
  <line x1="592" y1="264" x2="640" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result card -->
  <rect x="644" y="132" width="216" height="264" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="664" y="160" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">PageInsight[]</text>
  <line x1="664" y1="174" x2="840" y2="174" stroke="#e2e8f0"/>
  <text x="664" y="198" class="font-mono" font-size="11" fill="#64748b">url:</text>
  <text x="840" y="198" class="font-mono" font-size="11" fill="#0f172a" text-anchor="end">/blog/react-seo</text>
  <text x="664" y="220" class="font-mono" font-size="11" fill="#64748b">clicks:</text>
  <text x="840" y="220" class="font-mono" font-size="11" fill="#0f172a" text-anchor="end">1,240</text>
  <text x="664" y="242" class="font-mono" font-size="11" fill="#64748b">position:</text>
  <text x="840" y="242" class="font-mono" font-size="11" fill="#0f172a" text-anchor="end">4.2</text>
  <text x="664" y="264" class="font-mono" font-size="11" fill="#64748b">auditScore:</text>
  <text x="840" y="264" class="font-mono" font-size="11" font-weight="600" fill="#16a34a" text-anchor="end">88</text>
  <text x="664" y="286" class="font-mono" font-size="11" fill="#64748b">opportunities:</text>
  <text x="840" y="286" class="font-mono" font-size="11" fill="#0f172a" text-anchor="end">[...]</text>
  <line x1="664" y1="302" x2="840" y2="302" stroke="#e2e8f0"/>
  <text x="664" y="326" class="font-ui" font-size="12" font-weight="600" fill="#0f172a">correlateScoreAndTraffic</text>
  <rect x="664" y="340" width="120" height="24" rx="12" fill="#dcfce7"/>
  <text x="724" y="356" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Pearson r = 0.741</text>
  <text x="664" y="384" class="font-ui" font-size="11" fill="#64748b">+ topOpportunities: high</text>
  <text x="664" y="399" class="font-ui" font-size="11" fill="#64748b">traffic, low audit score</text>

  <text x="450" y="472" class="font-ui" font-size="12" fill="#94a3b8" text-anchor="middle">Trailing slashes, protocol differences, and query strings are normalized so GSC and audit URLs match.</text>
</svg>
