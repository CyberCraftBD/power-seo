<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison: manual SEO reporting with spreadsheets versus one automated buildDashboardData call from @power-seo/analytics</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">SEO reporting, before and after</text>

  <!-- BEFORE panel -->
  <rect x="48" y="76" width="386" height="388" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="68" y="94" width="122" height="24" rx="12" fill="#fee2e2"/>
  <text x="129" y="110" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Manual process</text>

  <text x="98" y="152" class="font-ui" font-size="13" fill="#0f172a">Export GSC pages and queries to CSV</text>
  <circle cx="80" cy="148" r="4" fill="#ef4444"/>
  <text x="98" y="188" class="font-ui" font-size="13" fill="#0f172a">Run audits in a separate tool</text>
  <circle cx="80" cy="184" r="4" fill="#ef4444"/>
  <text x="98" y="224" class="font-ui" font-size="13" fill="#0f172a">VLOOKUP URLs across spreadsheets</text>
  <circle cx="80" cy="220" r="4" fill="#ef4444"/>
  <text x="98" y="260" class="font-ui" font-size="13" fill="#0f172a">Mismatched URLs (slashes, protocols)</text>
  <circle cx="80" cy="256" r="4" fill="#ef4444"/>
  <text x="98" y="296" class="font-ui" font-size="13" fill="#0f172a">Eyeball charts for trends and spikes</text>
  <circle cx="80" cy="292" r="4" fill="#ef4444"/>
  <text x="98" y="332" class="font-ui" font-size="13" fill="#0f172a">Rebuild the report every month</text>
  <circle cx="80" cy="328" r="4" fill="#ef4444"/>

  <rect x="68" y="360" width="346" height="82" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="88" y="388" class="font-ui" font-size="12" font-weight="600" fill="#64748b">Result</text>
  <text x="88" y="410" class="font-ui" font-size="12" fill="#64748b">Fragile spreadsheets, no correlation between</text>
  <text x="88" y="428" class="font-ui" font-size="12" fill="#64748b">audit scores and traffic, findings go stale.</text>

  <!-- AFTER panel -->
  <rect x="466" y="76" width="386" height="388" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <rect x="486" y="94" width="204" height="24" rx="12" fill="#dbeafe"/>
  <text x="588" y="110" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">With @power-seo/analytics</text>

  <rect x="486" y="134" width="346" height="112" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="504" y="162" class="font-mono" font-size="12" fill="#0f172a">const dashboard = <tspan fill="#2563eb">buildDashboardData</tspan>({</text>
  <text x="504" y="184" class="font-mono" font-size="12" fill="#0f172a">  gscPages, gscQueries,</text>
  <text x="504" y="206" class="font-mono" font-size="12" fill="#0f172a">  auditResults, auditHistory,</text>
  <text x="504" y="228" class="font-mono" font-size="12" fill="#0f172a">});</text>

  <text x="516" y="280" class="font-ui" font-size="13" fill="#0f172a">URLs merged automatically by normalization</text>
  <path d="M496 276 L500 280 L508 271" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="312" class="font-ui" font-size="13" fill="#0f172a">Pearson correlation of score vs clicks</text>
  <path d="M496 308 L500 312 L508 303" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="344" class="font-ui" font-size="13" fill="#0f172a">Trends, anomalies, and ranking buckets built in</text>
  <path d="M496 340 L500 344 L508 335" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="376" class="font-ui" font-size="13" fill="#0f172a">One typed DashboardData object for any chart lib</text>
  <path d="M496 372 L500 376 L508 367" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="486" y="396" width="346" height="46" rx="8" fill="#dcfce7"/>
  <text x="659" y="416" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Repeatable, automated reporting pipeline —</text>
  <text x="659" y="433" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">re-run any time, zero runtime dependencies</text>
</svg>
