<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Trend analysis chart showing analyzeTrend linear regression on daily impressions with detectAnomalies flagging a spike and a drop beyond two standard deviations</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Trend analysis with anomaly detection</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">analyzeTrend() fits a linear regression · detectAnomalies(points, 2.0) flags values beyond 2 standard deviations</text>

  <!-- chart card -->
  <rect x="48" y="90" width="560" height="374" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="120" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Daily impressions — 2026-02-01 to 2026-02-08</text>

  <!-- gridlines -->
  <line x1="112" y1="410" x2="580" y2="410" stroke="#e2e8f0"/>
  <line x1="112" y1="340" x2="580" y2="340" stroke="#e2e8f0"/>
  <line x1="112" y1="270" x2="580" y2="270" stroke="#e2e8f0"/>
  <line x1="112" y1="200" x2="580" y2="200" stroke="#e2e8f0"/>
  <line x1="112" y1="150" x2="580" y2="150" stroke="#e2e8f0"/>
  <text x="104" y="414" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">0</text>
  <text x="104" y="344" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">8k</text>
  <text x="104" y="274" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">16k</text>
  <text x="104" y="204" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">24k</text>

  <!-- series: 8500 8900 8700 8600 24800 9100 2100 8800; y = 410 - v/8000*70 -->
  <path d="M124 336 L188 332 L252 334 L316 335 L380 193 L444 330 L508 392 L572 333 L572 410 L124 410 Z" fill="#2563eb" opacity="0.12"/>
  <path d="M124 336 L188 332 L252 334 L316 335 L380 193 L444 330 L508 392 L572 333" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="124" cy="336" r="3.5" fill="#2563eb"/>
  <circle cx="188" cy="332" r="3.5" fill="#2563eb"/>
  <circle cx="252" cy="334" r="3.5" fill="#2563eb"/>
  <circle cx="316" cy="335" r="3.5" fill="#2563eb"/>
  <circle cx="444" cy="330" r="3.5" fill="#2563eb"/>
  <circle cx="572" cy="333" r="3.5" fill="#2563eb"/>

  <!-- anomalies -->
  <circle cx="380" cy="193" r="6" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="330" y="152" width="100" height="24" rx="12" fill="#fee2e2"/>
  <text x="380" y="168" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">spike · 24,800</text>
  <circle cx="508" cy="392" r="6" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="470" y="422" width="92" height="24" rx="12" fill="#fee2e2"/>
  <text x="516" y="438" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">drop · 2,100</text>

  <!-- regression line -->
  <line x1="124" y1="326" x2="572" y2="318" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- x labels -->
  <text x="124" y="430" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Feb 01</text>
  <text x="380" y="430" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Feb 05</text>
  <text x="572" y="430" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Feb 08</text>

  <!-- side panel -->
  <rect x="628" y="90" width="224" height="374" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="648" y="120" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">TrendAnalysis</text>
  <line x1="648" y1="134" x2="832" y2="134" stroke="#e2e8f0"/>
  <text x="648" y="158" class="font-mono" font-size="12" fill="#64748b">metric:</text>
  <text x="832" y="158" class="font-mono" font-size="12" fill="#0f172a" text-anchor="end">'value'</text>
  <text x="648" y="182" class="font-mono" font-size="12" fill="#64748b">trend:</text>
  <rect x="762" y="168" width="70" height="20" rx="10" fill="#f1f5f9"/>
  <text x="797" y="182" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">stable</text>
  <text x="648" y="208" class="font-mono" font-size="12" fill="#64748b">change:</text>
  <text x="832" y="208" class="font-mono" font-size="12" fill="#0f172a" text-anchor="end">+3.53%</text>

  <line x1="648" y1="226" x2="832" y2="226" stroke="#e2e8f0"/>
  <text x="648" y="250" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">detectAnomalies</text>
  <text x="648" y="272" class="font-mono" font-size="11" fill="#94a3b8">threshold = 2.0 std dev</text>
  <rect x="648" y="286" width="184" height="30" rx="6" fill="#fee2e2"/>
  <text x="660" y="305" class="font-mono" font-size="11" fill="#b91c1c">2026-02-05 · 24,800 ▲</text>
  <rect x="648" y="324" width="184" height="30" rx="6" fill="#fee2e2"/>
  <text x="660" y="343" class="font-mono" font-size="11" fill="#b91c1c">2026-02-07 · 2,100 ▼</text>

  <line x1="648" y1="372" x2="832" y2="372" stroke="#e2e8f0"/>
  <text x="648" y="396" class="font-ui" font-size="12" fill="#64748b">Trend directions:</text>
  <rect x="648" y="408" width="72" height="20" rx="10" fill="#dcfce7"/>
  <text x="684" y="422" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">improving</text>
  <rect x="728" y="408" width="70" height="20" rx="10" fill="#fee2e2"/>
  <text x="763" y="422" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">declining</text>
  <rect x="648" y="434" width="56" height="20" rx="10" fill="#f1f5f9"/>
  <text x="676" y="448" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">stable</text>
</svg>
