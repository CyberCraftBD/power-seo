<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison showing manual Semrush and Ahrefs API integration steps versus the automated workflow with @power-seo/integrations</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">From hand-rolled HTTP calls to one typed client</text>
  <!-- left: manual -->
  <rect x="40" y="70" width="395" height="392" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="102" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Manual integration</text>
  <rect x="330" y="84" width="84" height="24" rx="12" fill="#fee2e2"/>
  <text x="372" y="100" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">error-prone</text>
  <g class="font-ui" font-size="13" fill="#64748b">
    <circle cx="74" cy="136" r="4" fill="#ef4444"/>
    <text x="92" y="141">Read two different API docs (Semrush + Ahrefs)</text>
    <circle cx="74" cy="176" r="4" fill="#ef4444"/>
    <text x="92" y="181">Write and maintain a raw fetch wrapper per API</text>
    <circle cx="74" cy="216" r="4" fill="#ef4444"/>
    <text x="92" y="221">Hand-roll throttling to avoid HTTP 429 bans</text>
    <circle cx="74" cy="256" r="4" fill="#ef4444"/>
    <text x="92" y="261">Track limit/offset pagination cursors yourself</text>
    <circle cx="74" cy="296" r="4" fill="#ef4444"/>
    <text x="92" y="301">Parse two different error formats</text>
    <circle cx="74" cy="336" r="4" fill="#ef4444"/>
    <text x="92" y="341">Declare response types by hand — or use any</text>
  </g>
  <rect x="64" y="368" width="347" height="70" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="82" y="394" class="font-mono" font-size="11.5" fill="#94a3b8">// per provider, per endpoint:</text>
  <text x="82" y="412" class="font-mono" font-size="11.5" fill="#0f172a">fetch(url); throttle(); paginate(); parse();</text>
  <text x="82" y="428" class="font-mono" font-size="11.5" fill="#0f172a">retryOn429(); mapErrors(); declareTypes();</text>
  <!-- arrow -->
  <line x1="443" y1="266" x2="457" y2="266" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M453 259 L461 266 L453 273" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right: with package -->
  <rect x="465" y="70" width="395" height="392" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="489" y="102" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">With @power-seo/integrations</text>
  <rect x="768" y="84" width="72" height="24" rx="12" fill="#dcfce7"/>
  <text x="804" y="100" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">built-in</text>
  <g class="font-ui" font-size="13" fill="#64748b">
    <text x="489" y="141" fill="#16a34a" font-weight="700">✓</text>
    <text x="509" y="141">One import — createSemrushClient / createAhrefsClient</text>
    <text x="489" y="181" fill="#16a34a" font-weight="700">✓</text>
    <text x="509" y="181">Shared createHttpClient() base for both providers</text>
    <text x="489" y="221" fill="#16a34a" font-weight="700">✓</text>
    <text x="509" y="221">rateLimitPerMinute window + retry on 429/5xx</text>
    <text x="489" y="261" fill="#16a34a" font-weight="700">✓</text>
    <text x="509" y="261">Typed PaginatedResponse — page via offset</text>
    <text x="489" y="301" fill="#16a34a" font-weight="700">✓</text>
    <text x="509" y="301">IntegrationApiError: status, provider, retryable</text>
    <text x="489" y="341" fill="#16a34a" font-weight="700">✓</text>
    <text x="509" y="341">Full TypeScript types for every endpoint</text>
  </g>
  <rect x="489" y="368" width="347" height="70" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="507" y="394" class="font-mono" font-size="11.5"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> kws = </tspan><tspan fill="#7c3aed">await</tspan><tspan fill="#0f172a"> semrush.</tspan><tspan fill="#2563eb">getOrganicKeywords</tspan><tspan fill="#0f172a">(</tspan></text>
  <text x="523" y="412" class="font-mono" font-size="11.5"><tspan fill="#16a34a">'example.com'</tspan><tspan fill="#0f172a">);</tspan></text>
  <text x="507" y="428" class="font-mono" font-size="11.5" fill="#94a3b8">// throttled, typed — page via offset</text>
</svg>
