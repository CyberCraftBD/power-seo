<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Diagram of the built-in token bucket rate limiter in @power-seo/integrations spacing API requests and retrying HTTP 429 responses automatically</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Built-in rate limiting — never trip the provider's limit</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">createHttpClient() uses a per-minute token bucket and retries retryable errors (429 and 5xx)</text>
  <!-- config card -->
  <rect x="40" y="90" width="380" height="176" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="120" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Configuration</text>
  <rect x="64" y="134" width="332" height="112" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="82" y="158" class="font-mono" font-size="12"><tspan fill="#2563eb">createHttpClient</tspan><tspan fill="#0f172a">({</tspan></text>
  <text x="100" y="178" class="font-mono" font-size="12" fill="#0f172a">rateLimitPerMinute: <tspan fill="#16a34a">10</tspan>,  <tspan fill="#94a3b8">// default 600</tspan></text>
  <text x="100" y="198" class="font-mono" font-size="12" fill="#0f172a">maxRetries: <tspan fill="#16a34a">3</tspan>,</text>
  <text x="100" y="218" class="font-mono" font-size="12" fill="#0f172a">timeoutMs: <tspan fill="#16a34a">30_000</tspan>,</text>
  <text x="82" y="238" class="font-mono" font-size="12" fill="#0f172a">});</text>
  <!-- retryable card -->
  <rect x="40" y="290" width="380" height="170" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="320" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">IntegrationApiError.retryable</text>
  <text x="64" y="346" class="font-mono" font-size="12" fill="#0f172a">retryable = status === <tspan fill="#16a34a">429</tspan> || status &gt;= <tspan fill="#16a34a">500</tspan></text>
  <rect x="64" y="364" width="122" height="24" rx="12" fill="#fef3c7"/>
  <text x="125" y="380" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">429 → retried</text>
  <rect x="196" y="364" width="122" height="24" rx="12" fill="#fef3c7"/>
  <text x="257" y="380" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">5xx → retried</text>
  <rect x="64" y="398" width="150" height="24" rx="12" fill="#fee2e2"/>
  <text x="139" y="414" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">4xx → thrown to caller</text>
  <text x="64" y="446" class="font-ui" font-size="12" fill="#64748b">Errors carry status, provider, and message.</text>
  <!-- timeline card -->
  <rect x="444" y="90" width="416" height="370" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="468" y="120" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Request timeline (rateLimitPerMinute: 10)</text>
  <!-- axis -->
  <line x1="468" y1="404" x2="836" y2="404" stroke="#e2e8f0"/>
  <text x="468" y="424" class="font-ui" font-size="11" fill="#94a3b8">0s</text>
  <text x="644" y="424" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">30s</text>
  <text x="836" y="424" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">60s</text>
  <!-- request bars: evenly spaced tokens -->
  <g fill="#2563eb">
    <rect x="468" y="360" width="18" height="44" rx="3"/>
    <rect x="505" y="360" width="18" height="44" rx="3"/>
    <rect x="542" y="360" width="18" height="44" rx="3"/>
    <rect x="579" y="360" width="18" height="44" rx="3"/>
    <rect x="616" y="360" width="18" height="44" rx="3"/>
  </g>
  <!-- throttled request: waits for token -->
  <rect x="653" y="360" width="18" height="44" rx="3" fill="#f59e0b"/>
  <g fill="#2563eb">
    <rect x="690" y="360" width="18" height="44" rx="3"/>
    <rect x="727" y="360" width="18" height="44" rx="3"/>
    <rect x="764" y="360" width="18" height="44" rx="3"/>
    <rect x="801" y="360" width="18" height="44" rx="3"/>
  </g>
  <!-- annotations -->
  <rect x="468" y="150" width="112" height="24" rx="12" fill="#dbeafe"/>
  <text x="524" y="166" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">consumeToken()</text>
  <line x1="524" y1="174" x2="514" y2="356" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <rect x="600" y="196" width="150" height="24" rx="12" fill="#fef3c7"/>
  <text x="675" y="212" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">getWaitTime() → sleep()</text>
  <line x1="662" y1="220" x2="662" y2="356" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <!-- legend -->
  <rect x="468" y="252" width="12" height="12" rx="3" fill="#2563eb"/>
  <text x="488" y="262" class="font-ui" font-size="12" fill="#64748b">Sent immediately — token available</text>
  <rect x="468" y="276" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="488" y="286" class="font-ui" font-size="12" fill="#64748b">Queued — waits for the next window slot</text>
  <text x="468" y="318" class="font-ui" font-size="12" fill="#64748b">Every request passes the token bucket first, so</text>
  <text x="468" y="336" class="font-ui" font-size="12" fill="#64748b">bursts are smoothed to your configured limit.</text>
</svg>
