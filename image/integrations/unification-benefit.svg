<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Diagram showing how @power-seo/integrations unifies the Semrush and Ahrefs APIs behind one shared HTTP client with consistent types and errors</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Two providers, one consistent interface</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Both clients are built on the same createHttpClient() base — same pagination, same errors, same types</text>
  <!-- provider cards -->
  <rect x="60" y="96" width="360" height="128" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="126" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">createSemrushClient(apiKey)</text>
  <rect x="322" y="110" width="76" height="22" rx="11" fill="#dbeafe"/>
  <text x="360" y="125" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Semrush</text>
  <g class="font-mono" font-size="11.5" fill="#64748b">
    <text x="84" y="152">getDomainOverview · getOrganicKeywords</text>
    <text x="84" y="172">getBacklinks · getKeywordDifficulty</text>
    <text x="84" y="192">getRelatedKeywords</text>
  </g>
  <text x="84" y="214" class="font-ui" font-size="11" fill="#94a3b8">auth: query parameter · database e.g. 'us'</text>
  <rect x="480" y="96" width="360" height="128" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="504" y="126" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">createAhrefsClient(apiToken)</text>
  <rect x="750" y="110" width="66" height="22" rx="11" fill="#dbeafe"/>
  <text x="783" y="125" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Ahrefs</text>
  <g class="font-mono" font-size="11.5" fill="#64748b">
    <text x="504" y="152">getSiteOverview · getOrganicKeywords</text>
    <text x="504" y="172">getBacklinks · getKeywordDifficulty</text>
    <text x="504" y="192">getReferringDomains</text>
  </g>
  <text x="504" y="214" class="font-ui" font-size="11" fill="#94a3b8">auth: bearer token · Domain Rating, traffic value</text>
  <!-- connectors -->
  <line x1="240" y1="224" x2="240" y2="258" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="660" y1="224" x2="660" y2="258" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="240" y1="258" x2="450" y2="258" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="660" y1="258" x2="450" y2="258" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <line x1="450" y1="258" x2="450" y2="276" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <path d="M444 270 L450 278 L456 270" stroke="#94a3b8" fill="none" stroke-width="1.5"/>
  <!-- shared client card -->
  <rect x="150" y="282" width="600" height="88" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="450" y="312" class="font-ui" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">createHttpClient({ baseUrl, auth, rateLimitPerMinute, maxRetries, timeoutMs })</text>
  <g class="font-ui" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="286" y="344">Token-bucket rate limiter</text>
    <text x="450" y="344">Retry on 429 / 5xx</text>
    <text x="614" y="344">Timeout + JSON parsing</text>
  </g>
  <!-- shared outputs -->
  <line x1="450" y1="370" x2="450" y2="392" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <path d="M444 386 L450 394 L456 386" stroke="#94a3b8" fill="none" stroke-width="1.5"/>
  <rect x="60" y="398" width="248" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="184" y="426" class="font-mono" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">PaginatedResponse&lt;T&gt;</text>
  <text x="184" y="450" class="font-ui" font-size="11.5" fill="#64748b" text-anchor="middle">data · total · offset · limit · hasMore</text>
  <rect x="326" y="398" width="248" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="450" y="426" class="font-mono" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">IntegrationApiError</text>
  <text x="450" y="450" class="font-ui" font-size="11.5" fill="#64748b" text-anchor="middle">status · provider · retryable</text>
  <rect x="592" y="398" width="248" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="716" y="426" class="font-mono" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">Typed responses</text>
  <text x="716" y="450" class="font-ui" font-size="11.5" fill="#64748b" text-anchor="middle">SemrushKeywordData · AhrefsBacklink ...</text>
</svg>
