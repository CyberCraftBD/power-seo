<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix showing @power-seo/integrations against a raw Semrush API client, a raw Ahrefs API client, and a custom fetch implementation</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Why @power-seo/integrations?</text>
  <!-- table card -->
  <rect x="40" y="66" width="820" height="398" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- header row -->
  <rect x="40" y="66" width="820" height="44" rx="8" fill="#f8fafc"/>
  <line x1="40" y1="110" x2="860" y2="110" stroke="#e2e8f0"/>
  <text x="64" y="93" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FEATURE</text>
  <rect x="374" y="74" width="150" height="28" rx="6" fill="#dbeafe"/>
  <text x="449" y="93" class="font-ui" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">@power-seo/integrations</text>
  <text x="594" y="93" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Raw Semrush API</text>
  <text x="712" y="93" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Raw Ahrefs API</text>
  <text x="812" y="93" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">custom fetch</text>
  <!-- row separators (8 rows, 44px each starting y=110) -->
  <line x1="40" y1="154" x2="860" y2="154" stroke="#e2e8f0"/>
  <line x1="40" y1="198" x2="860" y2="198" stroke="#e2e8f0"/>
  <line x1="40" y1="242" x2="860" y2="242" stroke="#e2e8f0"/>
  <line x1="40" y1="286" x2="860" y2="286" stroke="#e2e8f0"/>
  <line x1="40" y1="330" x2="860" y2="330" stroke="#e2e8f0"/>
  <line x1="40" y1="374" x2="860" y2="374" stroke="#e2e8f0"/>
  <line x1="40" y1="418" x2="860" y2="418" stroke="#e2e8f0"/>
  <!-- highlight column -->
  <rect x="374" y="110" width="150" height="354" fill="#dbeafe" opacity="0.25"/>
  <!-- feature labels -->
  <text x="64" y="137" class="font-ui" font-size="13" fill="#0f172a">Semrush API client</text>
  <text x="64" y="181" class="font-ui" font-size="13" fill="#0f172a">Ahrefs API client</text>
  <text x="64" y="225" class="font-ui" font-size="13" fill="#0f172a">Rate limiting (per-minute window)</text>
  <text x="64" y="269" class="font-ui" font-size="13" fill="#0f172a">Typed PaginatedResponse (page via offset)</text>
  <text x="64" y="313" class="font-ui" font-size="13" fill="#0f172a">Shared HTTP client (createHttpClient)</text>
  <text x="64" y="357" class="font-ui" font-size="13" fill="#0f172a">Consistent errors (IntegrationApiError)</text>
  <text x="64" y="401" class="font-ui" font-size="13" fill="#0f172a">TypeScript-first (typed responses)</text>
  <text x="64" y="445" class="font-ui" font-size="13" fill="#0f172a">Tree-shakeable named exports</text>
  <!-- marks: col centers 449 / 594 / 712 / 812; row text baselines 137..445 -->
  <!-- @power-seo column: all checks -->
  <g class="font-ui" font-size="15" font-weight="700" text-anchor="middle" fill="#16a34a">
    <text x="449" y="138">✓</text><text x="449" y="182">✓</text><text x="449" y="226">✓</text>
    <text x="449" y="270">✓</text><text x="449" y="314">✓</text><text x="449" y="358">✓</text>
    <text x="449" y="402">✓</text><text x="449" y="446">✓</text>
  </g>
  <!-- Raw Semrush API: ✓ — partial — — partial — — -->
  <g class="font-ui" font-size="14" text-anchor="middle">
    <text x="594" y="138" font-weight="700" fill="#16a34a">✓</text>
    <text x="594" y="182" fill="#94a3b8">—</text>
    <text x="594" y="226" fill="#b45309" font-size="12" font-weight="600">partial</text>
    <text x="594" y="270" fill="#94a3b8">—</text>
    <text x="594" y="314" fill="#94a3b8">—</text>
    <text x="594" y="358" fill="#b45309" font-size="12" font-weight="600">partial</text>
    <text x="594" y="402" fill="#94a3b8">—</text>
    <text x="594" y="446" fill="#94a3b8">—</text>
  </g>
  <!-- Raw Ahrefs API: — partial — — — — — — -->
  <g class="font-ui" font-size="14" text-anchor="middle">
    <text x="712" y="138" fill="#94a3b8">—</text>
    <text x="712" y="182" fill="#b45309" font-size="12" font-weight="600">partial</text>
    <text x="712" y="226" fill="#94a3b8">—</text>
    <text x="712" y="270" fill="#94a3b8">—</text>
    <text x="712" y="314" fill="#94a3b8">—</text>
    <text x="712" y="358" fill="#94a3b8">—</text>
    <text x="712" y="402" fill="#94a3b8">—</text>
    <text x="712" y="446" fill="#94a3b8">—</text>
  </g>
  <!-- custom fetch: manual everywhere -->
  <g class="font-ui" font-size="12" font-weight="600" text-anchor="middle" fill="#b45309">
    <text x="812" y="138">manual</text><text x="812" y="182">manual</text><text x="812" y="226">manual</text>
    <text x="812" y="270">manual</text><text x="812" y="314" fill="#94a3b8" font-weight="400" font-size="14">—</text>
    <text x="812" y="358">manual</text><text x="812" y="402" fill="#94a3b8" font-weight="400" font-size="14">—</text>
    <text x="812" y="446" fill="#94a3b8" font-weight="400" font-size="14">—</text>
  </g>
</svg>
