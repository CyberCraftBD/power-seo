<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>Banner for @power-seo/integrations, typed Semrush and Ahrefs API clients with built-in rate limiting and typed paginated responses</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>
  <!-- left: branding -->
  <rect x="56" y="52" width="44" height="44" rx="10" fill="#2563eb"/>
  <path d="M69 82 L78 66 L84 76 L91 62" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="82" class="font-ui" font-size="30" font-weight="700" fill="#0f172a">@power-seo/integrations</text>
  <text x="56" y="136" class="font-ui" font-size="16" fill="#64748b">Typed Semrush &amp; Ahrefs API clients — rate limiting, retries, and typed paginated responses.</text>
  <!-- pills -->
  <rect x="56" y="164" width="118" height="26" rx="13" fill="#dbeafe"/>
  <text x="115" y="181" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Typed pagination</text>
  <rect x="184" y="164" width="106" height="26" rx="13" fill="#dcfce7"/>
  <text x="237" y="181" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Rate limiting</text>
  <rect x="300" y="164" width="112" height="26" rx="13" fill="#f1f5f9"/>
  <text x="356" y="181" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">TypeScript-first</text>
  <rect x="422" y="164" width="118" height="26" rx="13" fill="#f1f5f9"/>
  <text x="481" y="181" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Tree-shakeable</text>
  <text x="56" y="228" class="font-mono" font-size="13" fill="#64748b">npm install @power-seo/integrations</text>
  <!-- right: code card vignette -->
  <rect x="708" y="34" width="516" height="212" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="708" y="34" width="516" height="36" rx="8" fill="#f8fafc"/>
  <line x1="708" y1="70" x2="1224" y2="70" stroke="#e2e8f0"/>
  <text x="728" y="57" class="font-mono" font-size="12" fill="#64748b">research.ts</text>
  <text x="728" y="96" class="font-mono" font-size="12.5"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { </tspan><tspan fill="#2563eb">createSemrushClient</tspan><tspan fill="#0f172a"> } </tspan><tspan fill="#7c3aed">from</tspan> <tspan fill="#16a34a">'@power-seo/integrations'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="728" y="126" class="font-mono" font-size="12.5"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> semrush = </tspan><tspan fill="#2563eb">createSemrushClient</tspan><tspan fill="#0f172a">(apiKey,</tspan></text>
  <text x="746" y="144" class="font-mono" font-size="12.5" fill="#0f172a">{ rateLimitPerMinute: <tspan fill="#16a34a">10</tspan>, maxRetries: <tspan fill="#16a34a">3</tspan> });</text>
  <text x="728" y="174" class="font-mono" font-size="12.5"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> overview = </tspan><tspan fill="#7c3aed">await</tspan><tspan fill="#0f172a"> semrush.</tspan><tspan fill="#2563eb">getDomainOverview</tspan><tspan fill="#0f172a">(</tspan></text>
  <text x="746" y="192" class="font-mono" font-size="12.5"><tspan fill="#16a34a">'example.com'</tspan><tspan fill="#0f172a">, </tspan><tspan fill="#16a34a">'us'</tspan><tspan fill="#0f172a">);</tspan></text>
  <text x="728" y="222" class="font-mono" font-size="12.5" fill="#94a3b8">// { organicTraffic, organicKeywords, authorityScore, ... }</text>
</svg>
