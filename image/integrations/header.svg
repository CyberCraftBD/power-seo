<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Hero graphic for @power-seo/integrations showing the Semrush and Ahrefs client APIs unified behind one shared TypeScript HTTP client</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- headline -->
  <rect x="80" y="70" width="48" height="48" rx="12" fill="#2563eb"/>
  <path d="M94 103 L104 85 L110 96 L118 80" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="102" class="font-ui" font-size="34" font-weight="700" fill="#0f172a">@power-seo/integrations</text>
  <text x="80" y="158" class="font-ui" font-size="17" fill="#64748b">One typed interface for Semrush and Ahrefs — domain overviews, keywords, backlinks,</text>
  <text x="80" y="182" class="font-ui" font-size="17" fill="#64748b">and keyword difficulty with automatic rate limiting and typed paginated responses.</text>
  <!-- left: code card -->
  <rect x="80" y="222" width="540" height="340" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="80" y="222" width="540" height="40" rx="8" fill="#f8fafc"/>
  <line x1="80" y1="262" x2="620" y2="262" stroke="#e2e8f0"/>
  <text x="102" y="247" class="font-mono" font-size="12" fill="#64748b">keyword-research.ts</text>
  <text x="102" y="292" class="font-mono" font-size="13"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { </tspan><tspan fill="#2563eb">createSemrushClient</tspan><tspan fill="#0f172a">, </tspan><tspan fill="#2563eb">createAhrefsClient</tspan><tspan fill="#0f172a"> }</tspan></text>
  <text x="122" y="312" class="font-mono" font-size="13"><tspan fill="#7c3aed">from</tspan> <tspan fill="#16a34a">'@power-seo/integrations'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="102" y="344" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> semrush = </tspan><tspan fill="#2563eb">createSemrushClient</tspan><tspan fill="#0f172a">(apiKey);</tspan></text>
  <text x="102" y="364" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> ahrefs = </tspan><tspan fill="#2563eb">createAhrefsClient</tspan><tspan fill="#0f172a">(apiToken);</tspan></text>
  <text x="102" y="396" class="font-mono" font-size="13" fill="#94a3b8">// typed PaginatedResponse — page via offset</text>
  <text x="102" y="416" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> keywords = </tspan><tspan fill="#7c3aed">await</tspan><tspan fill="#0f172a"> semrush.</tspan><tspan fill="#2563eb">getOrganicKeywords</tspan><tspan fill="#0f172a">(</tspan></text>
  <text x="122" y="436" class="font-mono" font-size="13"><tspan fill="#16a34a">'example.com'</tspan><tspan fill="#0f172a">, { limit: </tspan><tspan fill="#16a34a">100</tspan><tspan fill="#0f172a"> });</tspan></text>
  <text x="102" y="468" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> site = </tspan><tspan fill="#7c3aed">await</tspan><tspan fill="#0f172a"> ahrefs.</tspan><tspan fill="#2563eb">getSiteOverview</tspan><tspan fill="#0f172a">(</tspan><tspan fill="#16a34a">'example.com'</tspan><tspan fill="#0f172a">);</tspan></text>
  <text x="102" y="500" class="font-mono" font-size="13" fill="#0f172a">console.log(site.domainRating);  <tspan fill="#94a3b8">// 47</tspan></text>
  <text x="102" y="520" class="font-mono" font-size="13" fill="#0f172a">console.log(site.organicTraffic); <tspan fill="#94a3b8">// 9_800</tspan></text>
  <!-- right: result cards -->
  <rect x="660" y="222" width="460" height="156" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="684" y="252" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Semrush · getDomainOverview()</text>
  <rect x="964" y="236" width="132" height="22" rx="11" fill="#dbeafe"/>
  <text x="1030" y="251" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">SemrushDomainOverview</text>
  <text x="684" y="286" class="font-ui" font-size="12" fill="#64748b">Organic traffic</text>
  <text x="684" y="310" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">12,400</text>
  <text x="844" y="286" class="font-ui" font-size="12" fill="#64748b">Organic keywords</text>
  <text x="844" y="310" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">834</text>
  <text x="1004" y="286" class="font-ui" font-size="12" fill="#64748b">Authority Score</text>
  <text x="1004" y="310" class="font-ui" font-size="20" font-weight="700" fill="#16a34a">54</text>
  <rect x="684" y="330" width="412" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="684" y="330" width="222" height="8" rx="4" fill="#2563eb"/>
  <text x="684" y="360" class="font-ui" font-size="11" fill="#94a3b8">Backlinks 21,506 · Paid keywords 12</text>
  <rect x="660" y="406" width="460" height="156" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="684" y="436" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Ahrefs · getSiteOverview()</text>
  <rect x="984" y="420" width="112" height="22" rx="11" fill="#dbeafe"/>
  <text x="1040" y="435" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">AhrefsSiteOverview</text>
  <text x="684" y="470" class="font-ui" font-size="12" fill="#64748b">Domain Rating</text>
  <text x="684" y="494" class="font-ui" font-size="20" font-weight="700" fill="#16a34a">47</text>
  <text x="844" y="470" class="font-ui" font-size="12" fill="#64748b">Organic traffic</text>
  <text x="844" y="494" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">9,800</text>
  <text x="1004" y="470" class="font-ui" font-size="12" fill="#64748b">Referring domains</text>
  <text x="1004" y="494" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">1,208</text>
  <rect x="684" y="514" width="412" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="684" y="514" width="194" height="8" rx="4" fill="#16a34a"/>
  <text x="684" y="544" class="font-ui" font-size="11" fill="#94a3b8">Backlinks 18,340 · Traffic value $4,120</text>
  <!-- footer strip -->
  <text x="80" y="602" class="font-mono" font-size="13" fill="#64748b">npm install @power-seo/integrations</text>
  <rect x="980" y="584" width="140" height="26" rx="13" fill="#dcfce7"/>
  <text x="1050" y="601" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Node 18+ · Deno · Bun</text>
</svg>
