<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280">
  <title>@power-seo/content-analysis banner: Yoast-style SEO content scoring library showing an analysis panel with passing keyphrase density and meta description checks</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- badge -->
  <rect x="72" y="52" width="268" height="24" rx="12" fill="#dbeafe"/>
  <text x="206" y="68" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript &#183; zero external runtime deps</text>

  <!-- package name + value prop -->
  <text x="72" y="130" class="font-mono" font-size="30" font-weight="700" fill="#0f172a">@power-seo/content-analysis</text>
  <text x="72" y="166" class="font-ui" font-size="16" fill="#64748b">Keyword-focused content analysis with real-time scoring &#8212; like Yoast SEO, anywhere.</text>

  <!-- capability pills -->
  <g class="font-ui" font-size="12" font-weight="600">
    <rect x="72" y="192" width="92" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="118" y="209" fill="#64748b" text-anchor="middle">SEO checks</text>
    <rect x="176" y="192" width="96" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="224" y="209" fill="#64748b" text-anchor="middle">Readability</text>
    <rect x="284" y="192" width="76" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="322" y="209" fill="#64748b" text-anchor="middle">E-E-A-T</text>
    <rect x="372" y="192" width="110" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="427" y="209" fill="#64748b" text-anchor="middle">Search intent</text>
    <rect x="494" y="192" width="58" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="523" y="209" fill="#64748b" text-anchor="middle">AEO</text>
  </g>

  <!-- analysis vignette card -->
  <rect x="852" y="40" width="364" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="876" y="70" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">SEO Analysis</text>
  <rect x="1132" y="54" width="60" height="20" rx="10" fill="#dcfce7"/>
  <text x="1162" y="68" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>

  <!-- score ring -->
  <circle cx="920" cy="156" r="36" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <circle cx="920" cy="156" r="36" fill="none" stroke="#16a34a" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="187.7 226.2" transform="rotate(-90 920 156)"/>
  <text x="920" y="163" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">83</text>

  <!-- check rows -->
  <g class="font-ui" font-size="13">
    <circle cx="996" cy="112" r="4" fill="#16a34a"/>
    <text x="1010" y="117" fill="#0f172a">Keyphrase density</text>
    <rect x="1140" y="102" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="1166" y="116" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>

    <circle cx="996" cy="152" r="4" fill="#16a34a"/>
    <text x="1010" y="157" fill="#0f172a">Meta description</text>
    <rect x="1140" y="142" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="1166" y="156" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>

    <circle cx="996" cy="192" r="4" fill="#f59e0b"/>
    <text x="1010" y="197" fill="#0f172a">Word count</text>
    <rect x="1140" y="182" width="52" height="20" rx="10" fill="#fef3c7"/>
    <text x="1166" y="196" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">ok</text>
  </g>
</svg>
