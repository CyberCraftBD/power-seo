<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Content editor app mockup: post fields on the left and a live @power-seo/content-analysis SEO panel with a score of 41 out of 55 and per-check good, ok and poor badges</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <text x="24" y="34" class="font-ui" font-size="14" font-weight="700" fill="#0f172a">power-seo</text>
  <rect x="12" y="56" width="156" height="32" rx="6" fill="#dbeafe"/>
  <g class="font-ui" font-size="13">
    <text x="24" y="77" font-weight="600" fill="#2563eb">Editor</text>
    <text x="24" y="116" fill="#64748b">Analysis</text>
    <text x="24" y="148" fill="#64748b">Readability</text>
    <text x="24" y="180" fill="#64748b">E-E-A-T</text>
    <text x="24" y="212" fill="#64748b">Search intent</text>
    <text x="24" y="244" fill="#64748b">AEO</text>
  </g>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Content Editor</text>
  <rect x="792" y="11" width="84" height="30" rx="6" fill="#2563eb"/>
  <text x="834" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Analyze</text>

  <!-- left card: post fields -->
  <rect x="196" y="68" width="348" height="412" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <g class="font-ui">
    <text x="216" y="96" font-size="11" font-weight="600" fill="#64748b">TITLE</text>
    <rect x="216" y="104" width="308" height="30" rx="6" fill="#f1f5f9"/>
    <text x="226" y="123" font-size="13" fill="#0f172a">Best Running Shoes for Beginners</text>

    <text x="216" y="162" font-size="11" font-weight="600" fill="#64748b">SLUG</text>
    <rect x="216" y="170" width="308" height="30" rx="6" fill="#f1f5f9"/>
    <text x="226" y="189" class="font-mono" font-size="12" fill="#0f172a">/running-shoes-for-beginners</text>

    <text x="216" y="228" font-size="11" font-weight="600" fill="#64748b">META DESCRIPTION</text>
    <rect x="216" y="236" width="308" height="50" rx="6" fill="#f1f5f9"/>
    <text x="226" y="255" font-size="12" fill="#0f172a">Discover the best running shoes for</text>
    <text x="226" y="272" font-size="12" fill="#0f172a">beginners with our expert guide.</text>
    <text x="524" y="302" font-size="11" font-weight="600" fill="#16a34a" text-anchor="end">142 / 160</text>

    <text x="216" y="330" font-size="11" font-weight="600" fill="#64748b">FOCUS KEYPHRASE</text>
    <rect x="216" y="338" width="308" height="30" rx="6" fill="#f1f5f9"/>
    <text x="226" y="357" font-size="13" fill="#0f172a">running shoes for beginners</text>

    <text x="216" y="398" font-size="11" font-weight="600" fill="#64748b">CONTENT</text>
    <rect x="216" y="408" width="308" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="216" y="426" width="266" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="216" y="444" width="290" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- right card: SEO analysis -->
  <rect x="560" y="68" width="316" height="412" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="580" y="96" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">SEO Analysis</text>

  <circle cx="630" cy="164" r="34" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <circle cx="630" cy="164" r="34" fill="none" stroke="#16a34a" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="159.2 213.6" transform="rotate(-90 630 164)"/>
  <text x="630" y="164" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">41</text>
  <text x="630" y="180" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">of 55</text>

  <g class="font-ui" font-size="12">
    <circle cx="694" cy="140" r="4" fill="#16a34a"/>
    <text x="706" y="144" fill="#64748b">8 good</text>
    <circle cx="694" cy="164" r="4" fill="#f59e0b"/>
    <text x="706" y="168" fill="#64748b">3 ok</text>
    <circle cx="694" cy="188" r="4" fill="#ef4444"/>
    <text x="706" y="192" fill="#64748b">2 poor</text>
  </g>

  <line x1="580" y1="216" x2="856" y2="216" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="13">
    <text x="580" y="246" fill="#0f172a">Keyphrase density</text>
    <text x="580" y="262" font-size="11" fill="#94a3b8">1.4% &#8212; within 0.5&#8211;2.5%</text>
    <rect x="804" y="232" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="830" y="246" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
    <line x1="580" y1="276" x2="856" y2="276" stroke="#e2e8f0"/>

    <text x="580" y="304" fill="#0f172a">Keyphrase in title</text>
    <rect x="804" y="290" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="830" y="304" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
    <line x1="580" y1="320" x2="856" y2="320" stroke="#e2e8f0"/>

    <text x="580" y="348" fill="#0f172a">Meta description</text>
    <rect x="804" y="334" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="830" y="348" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
    <line x1="580" y1="364" x2="856" y2="364" stroke="#e2e8f0"/>

    <text x="580" y="392" fill="#0f172a">Word count</text>
    <text x="580" y="408" font-size="11" fill="#94a3b8">612 words &#8212; aim for 1,000+</text>
    <rect x="804" y="378" width="52" height="20" rx="10" fill="#fef3c7"/>
    <text x="830" y="392" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">ok</text>
    <line x1="580" y1="422" x2="856" y2="422" stroke="#e2e8f0"/>

    <text x="580" y="450" fill="#0f172a">Image alt text</text>
    <text x="580" y="466" font-size="11" fill="#94a3b8">2 images missing alt attributes</text>
    <rect x="804" y="436" width="52" height="20" rx="10" fill="#fee2e2"/>
    <text x="830" y="450" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">poor</text>
  </g>
</svg>
