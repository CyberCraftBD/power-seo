<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison: manual content review by hand versus automated per-check scoring with analyzeContent from @power-seo/content-analysis</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="44" class="font-ui" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Content review workflow &#8212; before and after</text>

  <!-- left panel: manual -->
  <rect x="48" y="80" width="370" height="368" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="116" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Manual review</text>
  <rect x="322" y="100" width="72" height="22" rx="11" fill="#f1f5f9"/>
  <text x="358" y="115" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">by hand</text>
  <line x1="48" y1="134" x2="418" y2="134" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="72" y="170" fill="#ef4444" font-weight="700">&#10007;</text>
    <text x="96" y="170">Eye-check every title and meta tag</text>
    <text x="72" y="218" fill="#ef4444" font-weight="700">&#10007;</text>
    <text x="96" y="218">Grep the copy for keyword usage</text>
    <text x="72" y="266" fill="#ef4444" font-weight="700">&#10007;</text>
    <text x="96" y="266">Count words and headings by hand</text>
    <text x="72" y="314" fill="#ef4444" font-weight="700">&#10007;</text>
    <text x="96" y="314">Missed H1 and image alt issues</text>
    <text x="72" y="362" fill="#ef4444" font-weight="700">&#10007;</text>
    <text x="96" y="362">SEO score is guesswork</text>
    <text x="72" y="410" fill="#ef4444" font-weight="700">&#10007;</text>
    <text x="96" y="410">Feedback arrives after publishing</text>
  </g>

  <!-- arrow -->
  <line x1="426" y1="264" x2="466" y2="264" stroke="#2563eb" stroke-width="2"/>
  <polygon points="466,258 478,264 466,270" fill="#2563eb"/>

  <!-- right panel: automated -->
  <rect x="486" y="80" width="370" height="368" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="486" y="80" width="370" height="4" rx="2" fill="#2563eb"/>
  <text x="510" y="116" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">With @power-seo/content-analysis</text>
  <rect x="756" y="100" width="76" height="22" rx="11" fill="#dbeafe"/>
  <text x="794" y="115" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">automated</text>
  <line x1="486" y1="134" x2="856" y2="134" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="510" y="170" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="534" y="170"><tspan class="font-mono" font-size="12">analyzeContent()</tspan> runs every check</text>
    <text x="510" y="218" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="534" y="218">Per-check good / ok / poor feedback</text>
    <text x="510" y="266" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="534" y="266">Density scored against 0.5&#8211;2.5%</text>
    <text x="510" y="314" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="534" y="314">Meta length validated at 120&#8211;160 chars</text>
    <text x="510" y="362" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="534" y="362">Aggregate score with max-score breakdown</text>
    <text x="510" y="410" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="534" y="410">Same engine in the editor and in CI</text>
  </g>

  <text x="450" y="482" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Qualitative workflow illustration &#8212; results depend on your content and configuration</text>
</svg>
