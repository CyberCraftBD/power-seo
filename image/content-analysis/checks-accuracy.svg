<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Table of @power-seo/content-analysis check IDs with the real thresholds each one scores against, such as keyphrase density 0.5 to 2.5 percent and meta description 120 to 160 characters</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Deterministic checks with published thresholds</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Every result is scored against real constants from @power-seo/core &#8212; no black box</text>

  <!-- table card -->
  <rect x="40" y="88" width="820" height="322" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M41,124 v-28 a7,7 0 0 1 7,-7 h804 a7,7 0 0 1 7,7 v28 z" fill="#f8fafc"/>
  <line x1="41" y1="124" x2="859" y2="124" stroke="#e2e8f0"/>
  <g class="font-ui" font-size="11" font-weight="600" fill="#64748b">
    <text x="64" y="110">CHECK ID</text>
    <text x="350" y="110">THRESHOLD</text>
    <text x="640" y="110">SCORING</text>
  </g>

  <!-- rows h=46, first baseline 152 -->
  <g class="font-mono" font-size="12" fill="#2563eb">
    <text x="64" y="152">keyphrase-density</text>
    <text x="64" y="198">meta-description-presence</text>
    <text x="64" y="244">word-count</text>
    <text x="64" y="290">image-alt</text>
    <text x="64" y="336">internal-links</text>
    <text x="64" y="382">heading-structure</text>
  </g>
  <g class="font-ui" font-size="12" fill="#0f172a">
    <text x="350" y="152">0.5% &#8211; 2.5% (KEYWORD_DENSITY)</text>
    <text x="350" y="198">120&#8211;160 characters</text>
    <text x="350" y="244">&#8805; 300 words &#183; 1,000+ ideal</text>
    <text x="350" y="290">alt text on every image</text>
    <text x="350" y="336">at least one internal link</text>
    <text x="350" y="382">single H1, ordered subheadings</text>
  </g>
  <g class="font-ui" font-size="12" fill="#64748b">
    <text x="640" y="152">good in range, poor outside</text>
    <text x="640" y="198">good valid, ok too short / long</text>
    <text x="640" y="244">poor under 300 words</text>
    <text x="640" y="290">poor if any alt is missing</text>
    <text x="640" y="336">good when present</text>
    <text x="640" y="382">good when hierarchy intact</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="41" y1="168" x2="859" y2="168"/>
    <line x1="41" y1="214" x2="859" y2="214"/>
    <line x1="41" y1="260" x2="859" y2="260"/>
    <line x1="41" y1="306" x2="859" y2="306"/>
    <line x1="41" y1="352" x2="859" y2="352"/>
  </g>

  <!-- status legend -->
  <g class="font-ui" font-size="12">
    <rect x="140" y="436" width="52" height="22" rx="11" fill="#dcfce7"/>
    <text x="166" y="451" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>
    <text x="202" y="451" fill="#64748b">check fully passes</text>

    <rect x="356" y="436" width="40" height="22" rx="11" fill="#fef3c7"/>
    <text x="376" y="451" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">ok</text>
    <text x="406" y="451" fill="#64748b">partially passes</text>

    <rect x="546" y="436" width="52" height="22" rx="11" fill="#fee2e2"/>
    <text x="572" y="451" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">poor</text>
    <text x="608" y="451" fill="#64748b">check fails</text>
  </g>
</svg>
