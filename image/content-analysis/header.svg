<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>@power-seo/content-analysis header: content editor mockup with title, meta description and focus keyphrase inputs next to a live SEO score of 41 out of 55</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- badge -->
  <rect x="80" y="52" width="240" height="24" rx="12" fill="#dbeafe"/>
  <text x="200" y="68" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">SEO scoring engine &#183; TypeScript</text>

  <!-- hero copy -->
  <text x="80" y="122" class="font-ui" font-size="36" font-weight="700" fill="#0f172a">Content analysis for any stack</text>
  <text x="80" y="158" class="font-ui" font-size="16" fill="#64748b">Keyphrase, readability, E-E-A-T, search-intent and AEO checks with good / ok / poor scoring.</text>

  <!-- install command -->
  <rect x="80" y="180" width="380" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="96" y="202" class="font-mono" font-size="13" fill="#0f172a">npm install @power-seo/content-analysis</text>

  <!-- mockup card -->
  <rect x="80" y="240" width="1040" height="336" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="80" y1="288" x2="1120" y2="288" stroke="#e2e8f0"/>
  <text x="104" y="270" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Content Analysis</text>
  <rect x="1012" y="252" width="88" height="28" rx="6" fill="#2563eb"/>
  <text x="1056" y="270" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Analyze</text>

  <!-- left: editor fields -->
  <g class="font-ui">
    <text x="104" y="318" font-size="11" font-weight="600" fill="#64748b">TITLE</text>
    <rect x="104" y="326" width="480" height="32" rx="6" fill="#f1f5f9"/>
    <text x="116" y="346" font-size="13" fill="#0f172a">Best Running Shoes for Beginners</text>

    <text x="104" y="386" font-size="11" font-weight="600" fill="#64748b">META DESCRIPTION</text>
    <rect x="104" y="394" width="480" height="52" rx="6" fill="#f1f5f9"/>
    <text x="116" y="414" font-size="13" fill="#0f172a">Discover the best running shoes for beginners with</text>
    <text x="116" y="432" font-size="13" fill="#0f172a">our expert buying guide and fit tips.</text>
    <text x="584" y="462" font-size="11" font-weight="600" fill="#16a34a" text-anchor="end">142 / 160</text>

    <text x="104" y="490" font-size="11" font-weight="600" fill="#64748b">FOCUS KEYPHRASE</text>
    <rect x="104" y="498" width="480" height="32" rx="6" fill="#f1f5f9"/>
    <text x="116" y="518" font-size="13" fill="#0f172a">running shoes for beginners</text>
  </g>

  <!-- right: score ring -->
  <circle cx="700" cy="380" r="40" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <circle cx="700" cy="380" r="40" fill="none" stroke="#16a34a" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="187.3 251.3" transform="rotate(-90 700 380)"/>
  <text x="700" y="380" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">41</text>
  <text x="700" y="396" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">of 55</text>
  <text x="700" y="446" class="font-mono" font-size="12" fill="#64748b" text-anchor="middle">analyzeContent()</text>

  <!-- right: check results -->
  <g class="font-mono" font-size="12">
    <circle cx="790" cy="322" r="4" fill="#16a34a"/>
    <text x="804" y="326" fill="#0f172a">title-presence</text>
    <rect x="1030" y="312" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="1056" y="326" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>

    <circle cx="790" cy="360" r="4" fill="#16a34a"/>
    <text x="804" y="364" fill="#0f172a">keyphrase-density</text>
    <rect x="1030" y="350" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="1056" y="364" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>

    <circle cx="790" cy="398" r="4" fill="#16a34a"/>
    <text x="804" y="402" fill="#0f172a">meta-description-presence</text>
    <rect x="1030" y="388" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="1056" y="402" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">good</text>

    <circle cx="790" cy="436" r="4" fill="#f59e0b"/>
    <text x="804" y="440" fill="#0f172a">word-count</text>
    <rect x="1030" y="426" width="52" height="20" rx="10" fill="#fef3c7"/>
    <text x="1056" y="440" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">ok</text>

    <circle cx="790" cy="474" r="4" fill="#ef4444"/>
    <text x="804" y="478" fill="#0f172a">image-alt</text>
    <rect x="1030" y="464" width="52" height="20" rx="10" fill="#fee2e2"/>
    <text x="1056" y="478" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">poor</text>
  </g>

  <!-- right: category bars -->
  <g class="font-ui" font-size="11">
    <text x="790" y="516" fill="#64748b">SEO</text>
    <rect x="900" y="508" width="182" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="900" y="508" width="150" height="8" rx="4" fill="#2563eb"/>
    <text x="790" y="544" fill="#64748b">Readability</text>
    <rect x="900" y="536" width="182" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="900" y="536" width="128" height="8" rx="4" fill="#16a34a"/>
  </g>
</svg>
