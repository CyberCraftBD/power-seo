<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Yoast-style content analysis outside WordPress: @power-seo/content-analysis runs the same keyphrase and meta checks as a standalone TypeScript library in Next.js, Remix, Vite, Node.js and Edge</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="44" class="font-ui" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Yoast-style analysis &#8212; outside WordPress</text>

  <!-- left card: WordPress plugins -->
  <rect x="48" y="76" width="380" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="112" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">WordPress SEO plugins</text>
  <rect x="318" y="96" width="86" height="22" rx="11" fill="#f1f5f9"/>
  <text x="361" y="111" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">PHP plugin</text>
  <line x1="48" y1="130" x2="428" y2="130" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="72" y="168" fill="#94a3b8" font-weight="700">&#8212;</text>
    <text x="96" y="168">Runs only inside wp-admin</text>
    <text x="72" y="212" fill="#94a3b8" font-weight="700">&#8212;</text>
    <text x="96" y="212">Coupled to the plugin runtime</text>
    <text x="72" y="256" fill="#94a3b8" font-weight="700">&#8212;</text>
    <text x="96" y="256">Scores locked in the plugin UI</text>
    <text x="72" y="300" fill="#94a3b8" font-weight="700">&#8212;</text>
    <text x="96" y="300">No use in CI or headless stacks</text>
    <text x="72" y="344" fill="#94a3b8" font-weight="700">&#8212;</text>
    <text x="96" y="344">Checks not individually reusable</text>
  </g>

  <!-- wp-admin frame sketch -->
  <rect x="72" y="376" width="332" height="56" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="88" y="398" class="font-ui" font-size="11" font-weight="600" fill="#64748b">wp-admin &#8250; Posts &#8250; Edit</text>
  <rect x="88" y="408" width="180" height="8" rx="4" fill="#e2e8f0"/>

  <!-- right card: @power-seo/content-analysis -->
  <rect x="472" y="76" width="380" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="472" y="76" width="380" height="4" rx="2" fill="#2563eb"/>
  <text x="496" y="112" class="font-mono" font-size="13" font-weight="700" fill="#2563eb">@power-seo/content-analysis</text>
  <line x1="472" y1="130" x2="852" y2="130" stroke="#e2e8f0"/>

  <!-- code block -->
  <rect x="496" y="146" width="332" height="82" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="12">
    <text x="512" y="170"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { </tspan><tspan fill="#2563eb">analyzeContent</tspan><tspan fill="#0f172a"> }</tspan></text>
    <text x="512" y="188"><tspan fill="#7c3aed">  from</tspan><tspan fill="#16a34a"> '@power-seo/content-analysis'</tspan><tspan fill="#0f172a">;</tspan></text>
    <text x="512" y="212"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> { score, results } = </tspan><tspan fill="#2563eb">analyzeContent</tspan><tspan fill="#0f172a">(input);</tspan></text>
  </g>

  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="496" y="262" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="520" y="262">Standalone TypeScript library</text>
    <text x="496" y="298" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="520" y="298">Same keyphrase, meta and heading checks</text>
    <text x="496" y="334" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="520" y="334">Tree-shakeable &#8212; import single checks</text>
    <text x="496" y="370" fill="#16a34a" font-weight="700">&#10003;</text>
    <text x="520" y="370">Runs in the editor, on the server, in CI</text>
  </g>

  <!-- framework pills -->
  <g class="font-ui" font-size="11" font-weight="600">
    <rect x="496" y="396" width="60" height="24" rx="12" fill="#dbeafe"/>
    <text x="526" y="412" fill="#1d4ed8" text-anchor="middle">Next.js</text>
    <rect x="564" y="396" width="56" height="24" rx="12" fill="#dbeafe"/>
    <text x="592" y="412" fill="#1d4ed8" text-anchor="middle">Remix</text>
    <rect x="628" y="396" width="46" height="24" rx="12" fill="#dbeafe"/>
    <text x="651" y="412" fill="#1d4ed8" text-anchor="middle">Vite</text>
    <rect x="682" y="396" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="713" y="412" fill="#1d4ed8" text-anchor="middle">Node.js</text>
    <rect x="752" y="396" width="48" height="24" rx="12" fill="#dbeafe"/>
    <text x="776" y="412" fill="#1d4ed8" text-anchor="middle">Edge</text>
  </g>
</svg>
