<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix: @power-seo/content-analysis versus Yoast SEO, next-seo and seo-analyzer across keyphrase, meta, heading and scoring capabilities</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="44" class="font-ui" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">How @power-seo/content-analysis compares</text>

  <!-- table card -->
  <rect x="40" y="72" width="820" height="392" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- header row -->
  <path d="M41,119 v-39 a7,7 0 0 1 7,-7 h804 a7,7 0 0 1 7,7 v39 z" fill="#f8fafc"/>
  <line x1="41" y1="119" x2="859" y2="119" stroke="#e2e8f0"/>
  <!-- highlight our column -->
  <rect x="408" y="119" width="96" height="344" fill="#dbeafe" opacity="0.25"/>

  <g class="font-ui" font-size="11" font-weight="600">
    <text x="60" y="100" fill="#64748b">FEATURE</text>
    <text x="456" y="93" fill="#2563eb" text-anchor="middle">@power-seo/</text>
    <text x="456" y="107" fill="#2563eb" text-anchor="middle">content-analysis</text>
    <text x="576" y="100" fill="#64748b" text-anchor="middle">Yoast SEO</text>
    <text x="686" y="100" fill="#64748b" text-anchor="middle">next-seo</text>
    <text x="796" y="100" fill="#64748b" text-anchor="middle">seo-analyzer</text>
  </g>

  <!-- rows: y baselines every 38px starting 143 -->
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="60" y="143">Keyphrase density check</text>
    <text x="60" y="181">Title + meta validation</text>
    <text x="60" y="219">Heading structure check</text>
    <text x="60" y="257">Image alt + keyphrase check</text>
    <text x="60" y="295">Aggregate SEO score</text>
    <text x="60" y="333">Per-check disable config</text>
    <text x="60" y="371">Works outside WordPress</text>
    <text x="60" y="409">TypeScript-first</text>
    <text x="60" y="447">Tree-shakeable</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="41" y1="157" x2="859" y2="157"/>
    <line x1="41" y1="195" x2="859" y2="195"/>
    <line x1="41" y1="233" x2="859" y2="233"/>
    <line x1="41" y1="271" x2="859" y2="271"/>
    <line x1="41" y1="309" x2="859" y2="309"/>
    <line x1="41" y1="347" x2="859" y2="347"/>
    <line x1="41" y1="385" x2="859" y2="385"/>
    <line x1="41" y1="423" x2="859" y2="423"/>
  </g>

  <!-- marks: check = green tick, dash = grey, Partial = amber text -->
  <g class="font-ui" font-size="14" font-weight="700" text-anchor="middle">
    <!-- @power-seo/content-analysis column: all ticks -->
    <g fill="#16a34a">
      <text x="456" y="144">&#10003;</text><text x="456" y="182">&#10003;</text>
      <text x="456" y="220">&#10003;</text><text x="456" y="258">&#10003;</text>
      <text x="456" y="296">&#10003;</text><text x="456" y="334">&#10003;</text>
      <text x="456" y="372">&#10003;</text><text x="456" y="410">&#10003;</text>
      <text x="456" y="448">&#10003;</text>
    </g>
    <!-- Yoast SEO -->
    <g fill="#16a34a">
      <text x="576" y="144">&#10003;</text><text x="576" y="182">&#10003;</text>
      <text x="576" y="220">&#10003;</text><text x="576" y="258">&#10003;</text>
      <text x="576" y="296">&#10003;</text>
    </g>
    <g fill="#94a3b8">
      <text x="576" y="334">&#8212;</text><text x="576" y="372">&#8212;</text>
      <text x="576" y="410">&#8212;</text><text x="576" y="448">&#8212;</text>
    </g>
    <!-- next-seo -->
    <g fill="#94a3b8">
      <text x="686" y="144">&#8212;</text><text x="686" y="182">&#8212;</text>
      <text x="686" y="220">&#8212;</text><text x="686" y="258">&#8212;</text>
      <text x="686" y="296">&#8212;</text><text x="686" y="334">&#8212;</text>
    </g>
    <text x="686" y="372" fill="#16a34a">&#10003;</text>
    <text x="686" y="410" fill="#b45309" font-size="11" font-weight="600">Partial</text>
    <text x="686" y="448" fill="#b45309" font-size="11" font-weight="600">Partial</text>
    <!-- seo-analyzer -->
    <text x="796" y="144" fill="#b45309" font-size="11" font-weight="600">Partial</text>
    <text x="796" y="182" fill="#b45309" font-size="11" font-weight="600">Partial</text>
    <g fill="#94a3b8">
      <text x="796" y="220">&#8212;</text><text x="796" y="258">&#8212;</text>
    </g>
    <text x="796" y="296" fill="#b45309" font-size="11" font-weight="600">Partial</text>
    <g fill="#94a3b8">
      <text x="796" y="334">&#8212;</text>
    </g>
    <text x="796" y="372" fill="#16a34a">&#10003;</text>
    <g fill="#94a3b8">
      <text x="796" y="410">&#8212;</text><text x="796" y="448">&#8212;</text>
    </g>
  </g>

  <text x="450" y="486" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Feature availability as documented in each project&#8217;s public docs</text>
</svg>
