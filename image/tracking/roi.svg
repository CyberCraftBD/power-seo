<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison: manual per-provider analytics setup versus a consent-gated, typed workflow with @power-seo/tracking</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Analytics Setup Workflow — Manual vs @power-seo/tracking</text>

  <!-- left panel: manual -->
  <rect x="40" y="66" width="395" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="96" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Manual setup</text>
  <rect x="343" y="80" width="68" height="20" rx="10" fill="#fee2e2"/>
  <text x="377" y="94" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">risky</text>
  <line x1="40" y1="110" x2="435" y2="110" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="16" fill="#ef4444">
    <text x="64" y="146">✕</text>
    <text x="64" y="202">✕</text>
    <text x="64" y="258">✕</text>
    <text x="64" y="314">✕</text>
    <text x="64" y="370">✕</text>
  </g>
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="90" y="142">Paste raw &lt;script&gt; snippets per provider</text>
    <text x="90" y="198">Scripts load in &lt;head&gt; before any consent</text>
    <text x="90" y="254">Hand-rolled consent state in every project</text>
    <text x="90" y="310">Separate SDK &amp; docs for each reporting API</text>
    <text x="90" y="366">Untyped config objects — typos ship to prod</text>
  </g>
  <g class="font-ui" font-size="11" fill="#94a3b8">
    <text x="90" y="160">five different init snippets to maintain</text>
    <text x="90" y="216">tracking fires before the user opts in</text>
    <text x="90" y="272">banner state, storage and callbacks by hand</text>
    <text x="90" y="328">GA4, Clarity, PostHog, Plausible, Fathom</text>
    <text x="90" y="384">no compiler check on measurement IDs</text>
  </g>

  <!-- arrow -->
  <line x1="440" y1="246" x2="458" y2="246" stroke="#2563eb" stroke-width="2"/>
  <path d="M458 240 L468 246 L458 252 Z" fill="#2563eb"/>

  <!-- right panel: with package -->
  <rect x="465" y="66" width="395" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="489" y="96" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">With @power-seo/tracking</text>
  <rect x="758" y="80" width="78" height="20" rx="10" fill="#dcfce7"/>
  <text x="797" y="94" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">compliant</text>
  <line x1="465" y1="110" x2="860" y2="110" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="16" font-weight="700" fill="#16a34a">
    <text x="489" y="146">✓</text>
    <text x="489" y="202">✓</text>
    <text x="489" y="258">✓</text>
    <text x="489" y="314">✓</text>
    <text x="489" y="370">✓</text>
  </g>
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="515" y="142">One typed builder per provider</text>
    <text x="515" y="198">shouldLoad(consentState) gates every tag</text>
    <text x="515" y="254">createConsentManager() — one consent store</text>
    <text x="515" y="310">Typed API clients for all five providers</text>
    <text x="515" y="366">Full TypeScript config &amp; response types</text>
  </g>
  <g class="font-mono" font-size="11" fill="#94a3b8">
    <text x="515" y="160">buildGA4Script … buildFathomScript</text>
    <text x="515" y="216">nothing loads before consent is granted</text>
    <text x="515" y="272">grant / revoke / onChange subscription</text>
    <text x="515" y="328">createGA4Client … createFathomClient</text>
    <text x="515" y="384">ScriptConfig, ConsentState, GA4Config</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="444" width="820" height="34" rx="8" fill="#dbeafe"/>
  <text x="450" y="466" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Same five analytics platforms — one consent-gated, tree-shakeable, zero-dependency toolkit instead of five manual integrations.</text>
</svg>
