  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Analytics Tooling Comparison</text>

  <!-- table card -->
  <rect x="40" y="68" width="820" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- power-seo column highlight -->
  <rect x="360" y="68" width="128" height="384" fill="#dbeafe" opacity="0.35"/>

  <!-- header row -->
  <rect x="40" y="68" width="820" height="44" rx="8" fill="#f8fafc"/>
  <rect x="40" y="100" width="820" height="12" fill="#f8fafc"/>
  <line x1="40" y1="112" x2="860" y2="112" stroke="#e2e8f0"/>
  <g class="font-ui" font-size="12" font-weight="600" fill="#64748b">
