    <text x="424" y="102" text-anchor="middle" fill="#1d4ed8">tracking</text>
    <text x="551" y="88" text-anchor="middle">@next/</text>
    <text x="551" y="102" text-anchor="middle">third-parties</text>
    <text x="675" y="95" text-anchor="middle">Partytown</text>
    <text x="795" y="95" text-anchor="middle">Cookiebot</text>
  </g>

  <!-- row separators -->
