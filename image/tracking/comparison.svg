<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix: @power-seo/tracking versus @next/third-parties, Partytown and Cookiebot across script builders, consent management, API clients and TypeScript support</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
