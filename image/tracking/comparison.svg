    <line x1="40" y1="160" x2="860" y2="160"/>
    <line x1="40" y1="208" x2="860" y2="208"/>
    <line x1="40" y1="256" x2="860" y2="256"/>
    <line x1="40" y1="304" x2="860" y2="304"/>
    <line x1="40" y1="352" x2="860" y2="352"/>
    <line x1="40" y1="400" x2="860" y2="400"/>
