<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>GDPR opt-in by default: createConsentManager starts with only necessary consent granted, exposes grant, revoke and onChange, and reactively updates AnalyticsScript rendering</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">GDPR Opt-In by Default — createConsentManager()</text>

  <!-- card 1: default state -->
  <rect x="40" y="66" width="260" height="300" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="94" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Default ConsentState</text>
  <line x1="40" y1="108" x2="300" y2="108" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="13" fill="#0f172a">
    <text x="60" y="140">necessary</text>
    <text x="60" y="180">analytics</text>
    <text x="60" y="220">marketing</text>
    <text x="60" y="260">preferences</text>
  </g>
  <g class="font-mono" font-size="13" text-anchor="end">
    <text x="280" y="140" fill="#16a34a">true</text>
    <text x="280" y="180" fill="#b91c1c">false</text>
    <text x="280" y="220" fill="#b91c1c">false</text>
    <text x="280" y="260" fill="#b91c1c">false</text>
  </g>
  <rect x="60" y="284" width="220" height="60" rx="6" fill="#fef3c7"/>
  <text x="72" y="308" class="font-ui" font-size="11" font-weight="600" fill="#b45309">necessary is always true —</text>
  <text x="72" y="324" class="font-ui" font-size="11" fill="#b45309">revoke('necessary') is a no-op,</text>
  <text x="72" y="338" class="font-ui" font-size="11" fill="#b45309">initial overrides are ignored.</text>

  <!-- card 2: API -->
  <rect x="320" y="66" width="260" height="300" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="340" y="94" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">ConsentManager API</text>
  <line x1="320" y1="108" x2="580" y2="108" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="12.5" fill="#0f172a">
    <text x="340" y="138"><tspan fill="#2563eb">getState</tspan>()</text>
    <text x="340" y="170"><tspan fill="#2563eb">grant</tspan>(<tspan fill="#16a34a">'analytics'</tspan>)</text>
    <text x="340" y="202"><tspan fill="#2563eb">revoke</tspan>(<tspan fill="#16a34a">'marketing'</tspan>)</text>
    <text x="340" y="234"><tspan fill="#2563eb">grantAll</tspan>() / <tspan fill="#2563eb">revokeAll</tspan>()</text>
    <text x="340" y="266"><tspan fill="#2563eb">isGranted</tspan>(<tspan fill="#16a34a">'analytics'</tspan>)</text>
    <text x="340" y="298"><tspan fill="#2563eb">onChange</tspan>(callback)</text>
  </g>
  <text x="340" y="330" class="font-ui" font-size="11" fill="#94a3b8">onChange returns an unsubscribe fn</text>

  <!-- card 3: reactive flow -->
  <rect x="600" y="66" width="260" height="300" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="620" y="94" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Reactive loading</text>
  <line x1="600" y1="108" x2="860" y2="108" stroke="#e2e8f0"/>

  <rect x="620" y="124" width="220" height="40" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="730" y="149" class="font-mono" font-size="12" fill="#0f172a" text-anchor="middle">grant('analytics')</text>
  <line x1="730" y1="164" x2="730" y2="182" stroke="#2563eb" stroke-width="2"/>
  <path d="M724 182 L730 192 L736 182 Z" fill="#2563eb"/>

  <rect x="620" y="194" width="220" height="40" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="730" y="219" class="font-mono" font-size="12" fill="#0f172a" text-anchor="middle">onChange(state) fires</text>
  <line x1="730" y1="234" x2="730" y2="252" stroke="#2563eb" stroke-width="2"/>
  <path d="M724 252 L730 262 L736 252 Z" fill="#2563eb"/>

  <rect x="620" y="264" width="220" height="40" rx="6" fill="#dbeafe"/>
  <text x="730" y="289" class="font-mono" font-size="12" fill="#1d4ed8" text-anchor="middle">&lt;AnalyticsScript&gt; renders</text>

  <rect x="620" y="318" width="150" height="22" rx="11" fill="#dcfce7"/>
  <text x="695" y="333" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">consented scripts only</text>

  <!-- bottom strip -->
  <rect x="40" y="388" width="820" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="416" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Why it matters</text>
  <text x="64" y="440" class="font-ui" font-size="13" fill="#64748b">Analytics, marketing and preferences categories start revoked, so no tracking script can load before the user</text>
  <text x="64" y="456" class="font-ui" font-size="13" fill="#64748b">opts in — GDPR-compliant behaviour without writing custom consent state for every project.</text>
</svg>
