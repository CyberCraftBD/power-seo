<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>@power-seo/tracking banner: consent-aware analytics script builders and GDPR consent manager for GA4, Microsoft Clarity, PostHog, Plausible and Fathom</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- left: branding -->
  <rect x="60" y="46" width="160" height="24" rx="12" fill="#dbeafe"/>
  <text x="140" y="62" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">GDPR-READY ANALYTICS</text>

  <text x="60" y="118" class="font-ui" font-size="36" font-weight="700" fill="#0f172a">@power-seo/tracking</text>
  <text x="60" y="150" class="font-ui" font-size="15" fill="#64748b">Consent-aware script builders, a typed consent manager, and API clients for five analytics platforms.</text>

  <!-- provider pills -->
  <g class="font-ui" font-size="12" font-weight="600">
    <rect x="60" y="172" width="52" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="86" y="189" fill="#0f172a" text-anchor="middle">GA4</text>
    <rect x="120" y="172" width="66" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="153" y="189" fill="#0f172a" text-anchor="middle">Clarity</text>
    <rect x="194" y="172" width="76" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="232" y="189" fill="#0f172a" text-anchor="middle">PostHog</text>
    <rect x="278" y="172" width="80" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="318" y="189" fill="#0f172a" text-anchor="middle">Plausible</text>
    <rect x="366" y="172" width="70" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="401" y="189" fill="#0f172a" text-anchor="middle">Fathom</text>
  </g>

  <!-- code chip -->
  <rect x="60" y="216" width="360" height="30" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="74" y="235" class="font-mono" font-size="12" fill="#0f172a"><tspan fill="#2563eb">shouldLoad</tspan>(consentState) gates every script</text>

  <!-- right vignette: ConsentState card -->
  <rect x="880" y="36" width="340" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="900" y="64" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">ConsentState</text>
  <rect x="1136" y="46" width="64" height="20" rx="10" fill="#dcfce7"/>
  <text x="1168" y="60" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">opt-in</text>
  <line x1="900" y1="76" x2="1200" y2="76" stroke="#e2e8f0"/>

  <g class="font-mono" font-size="13" fill="#0f172a">
    <text x="900" y="104">necessary</text>
    <text x="900" y="140">analytics</text>
    <text x="900" y="176">marketing</text>
    <text x="900" y="212">preferences</text>
  </g>
  <g class="font-ui" font-size="11" fill="#94a3b8" text-anchor="end">
    <text x="1146" y="104">always on</text>
    <text x="1146" y="140">granted</text>
    <text x="1146" y="176">revoked</text>
    <text x="1146" y="212">revoked</text>
  </g>
  <!-- toggles: on = blue, off = grey -->
  <rect x="1160" y="92" width="40" height="20" rx="10" fill="#2563eb"/>
  <circle cx="1190" cy="102" r="7" fill="#ffffff"/>
  <rect x="1160" y="128" width="40" height="20" rx="10" fill="#2563eb"/>
  <circle cx="1190" cy="138" r="7" fill="#ffffff"/>
  <rect x="1160" y="164" width="40" height="20" rx="10" fill="#e2e8f0"/>
  <circle cx="1170" cy="174" r="7" fill="#ffffff"/>
  <rect x="1160" y="200" width="40" height="20" rx="10" fill="#e2e8f0"/>
  <circle cx="1170" cy="210" r="7" fill="#ffffff"/>
</svg>
