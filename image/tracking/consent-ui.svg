<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Privacy settings app mockup built with @power-seo/tracking: ConsentBanner with Accept all and Reject all, per-category toggles, and live provider script status</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <text x="20" y="34" class="font-ui" font-size="14" font-weight="700" fill="#0f172a">power-seo</text>
  <g class="font-ui" font-size="13" fill="#64748b">
    <text x="20" y="80">Dashboard</text>
    <rect x="10" y="98" width="160" height="30" rx="6" fill="#dbeafe"/>
    <text x="20" y="118" fill="#2563eb" font-weight="600">Consent</text>
    <text x="20" y="152">Scripts</text>
    <text x="20" y="184">Providers</text>
    <text x="20" y="216">Reports</text>
  </g>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Privacy &amp; Consent</text>
  <rect x="756" y="11" width="120" height="30" rx="6" fill="#2563eb"/>
  <text x="816" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Save preferences</text>

  <!-- ConsentBanner preview card -->
  <rect x="204" y="72" width="672" height="112" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="100" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">&lt;ConsentBanner&gt;</text>
  <text x="224" y="124" class="font-ui" font-size="13" fill="#64748b">We use cookies for analytics and marketing. Choose which categories you allow.</text>
  <rect x="224" y="140" width="96" height="30" rx="6" fill="#2563eb"/>
  <text x="272" y="159" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Accept all</text>
  <rect x="330" y="140" width="96" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="378" y="159" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Reject all</text>
  <text x="444" y="159" class="font-mono" font-size="11" fill="#94a3b8">grantAll() / revokeAll()</text>

  <!-- categories card -->
  <rect x="204" y="200" width="324" height="276" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="228" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Consent categories</text>
  <line x1="204" y1="242" x2="528" y2="242" stroke="#e2e8f0"/>
  <g class="font-mono" font-size="13" fill="#0f172a">
    <text x="224" y="274">necessary</text>
    <text x="224" y="322">analytics</text>
    <text x="224" y="370">marketing</text>
    <text x="224" y="418">preferences</text>
  </g>
  <g class="font-ui" font-size="10" fill="#94a3b8">
    <text x="224" y="290">always on — cannot be revoked</text>
    <text x="224" y="338">GA4, Clarity, PostHog, Plausible, Fathom</text>
    <text x="224" y="386">ad &amp; remarketing tags</text>
    <text x="224" y="434">UI personalisation</text>
  </g>
  <rect x="464" y="260" width="40" height="20" rx="10" fill="#2563eb"/>
  <circle cx="494" cy="270" r="7" fill="#ffffff"/>
  <rect x="464" y="308" width="40" height="20" rx="10" fill="#2563eb"/>
  <circle cx="494" cy="318" r="7" fill="#ffffff"/>
  <rect x="464" y="356" width="40" height="20" rx="10" fill="#e2e8f0"/>
  <circle cx="474" cy="366" r="7" fill="#ffffff"/>
  <rect x="464" y="404" width="40" height="20" rx="10" fill="#e2e8f0"/>
  <circle cx="474" cy="414" r="7" fill="#ffffff"/>

  <!-- script status card -->
  <rect x="552" y="200" width="324" height="276" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="572" y="228" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">&lt;AnalyticsScript&gt; status</text>
  <line x1="552" y1="242" x2="876" y2="242" stroke="#e2e8f0"/>
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="572" y="272">GA4</text>
    <text x="572" y="308">Microsoft Clarity</text>
    <text x="572" y="344">PostHog</text>
    <text x="572" y="380">Plausible</text>
    <text x="572" y="416">Fathom</text>
  </g>
  <g class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">
    <rect x="786" y="257" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="821" y="271">Loaded</text>
    <rect x="786" y="293" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="821" y="307">Loaded</text>
    <rect x="786" y="329" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="821" y="343">Loaded</text>
    <rect x="786" y="365" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="821" y="379">Loaded</text>
    <rect x="786" y="401" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="821" y="415">Loaded</text>
  </g>
  <text x="572" y="452" class="font-mono" font-size="11" fill="#94a3b8">consentCategory: 'analytics' — granted</text>
</svg>
