<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>@power-seo/tracking hero: TypeScript code using createConsentManager and buildGA4Script next to a live consent and script-status panel</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- hero copy -->
  <rect x="60" y="52" width="230" height="26" rx="13" fill="#dbeafe"/>
  <text x="175" y="69" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">CONSENT-AWARE ANALYTICS TOOLKIT</text>
  <text x="60" y="126" class="font-ui" font-size="40" font-weight="700" fill="#0f172a">@power-seo/tracking</text>
  <text x="60" y="160" class="font-ui" font-size="16" fill="#64748b">Typed script builders for GA4, Clarity, PostHog, Plausible &amp; Fathom — every script gated by shouldLoad(consentState).</text>

  <!-- left: code card -->
  <rect x="60" y="196" width="640" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="60" y="196" width="640" height="40" rx="8" fill="#f8fafc"/>
  <line x1="60" y1="236" x2="700" y2="236" stroke="#e2e8f0"/>
  <text x="84" y="221" class="font-mono" font-size="12" font-weight="600" fill="#64748b">analytics.ts</text>

  <g class="font-mono" font-size="13">
    <text x="84" y="266" fill="#0f172a"><tspan fill="#7c3aed">import</tspan> { createConsentManager, buildGA4Script }</text>
    <text x="84" y="288" fill="#0f172a">  <tspan fill="#7c3aed">from</tspan> <tspan fill="#16a34a">'@power-seo/tracking'</tspan>;</text>
    <text x="84" y="326" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> consent = <tspan fill="#2563eb">createConsentManager</tspan>();</text>
    <text x="84" y="348" fill="#94a3b8">// { necessary: true, analytics: false, marketing: false, ... }</text>
    <text x="84" y="386" fill="#0f172a">consent.<tspan fill="#2563eb">grant</tspan>(<tspan fill="#16a34a">'analytics'</tspan>);</text>
    <text x="84" y="424" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> scripts = <tspan fill="#2563eb">buildGA4Script</tspan>({</text>
    <text x="84" y="446" fill="#0f172a">  measurementId: <tspan fill="#16a34a">'G-XXXXXXXXXX'</tspan>,</text>
    <text x="84" y="468" fill="#0f172a">  consentModeV2: <tspan fill="#7c3aed">true</tspan>,</text>
    <text x="84" y="490" fill="#0f172a">});</text>
    <text x="84" y="528" fill="#0f172a">scripts.<tspan fill="#2563eb">every</tspan>((s) =&gt; s.<tspan fill="#2563eb">shouldLoad</tspan>(consent.<tspan fill="#2563eb">getState</tspan>()));</text>
    <text x="84" y="550" fill="#94a3b8">// true — analytics consent granted</text>
  </g>

  <!-- right: consent + script status card -->
  <rect x="730" y="196" width="410" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="754" y="228" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Consent categories</text>
  <line x1="730" y1="242" x2="1140" y2="242" stroke="#e2e8f0"/>

  <g class="font-mono" font-size="13" fill="#0f172a">
    <text x="754" y="270">necessary</text>
    <text x="754" y="302">analytics</text>
    <text x="754" y="334">marketing</text>
  </g>
  <rect x="1076" y="258" width="40" height="20" rx="10" fill="#2563eb"/>
  <circle cx="1106" cy="268" r="7" fill="#ffffff"/>
  <rect x="1076" y="290" width="40" height="20" rx="10" fill="#2563eb"/>
  <circle cx="1106" cy="300" r="7" fill="#ffffff"/>
  <rect x="1076" y="322" width="40" height="20" rx="10" fill="#e2e8f0"/>
  <circle cx="1086" cy="332" r="7" fill="#ffffff"/>

  <text x="754" y="382" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Script status</text>
  <line x1="730" y1="396" x2="1140" y2="396" stroke="#e2e8f0"/>

  <g class="font-mono" font-size="13" fill="#0f172a">
    <text x="754" y="426">buildGA4Script</text>
    <text x="754" y="458">buildClarityScript</text>
    <text x="754" y="490">buildPostHogScript</text>
    <text x="754" y="522">buildPlausibleScript</text>
    <text x="754" y="554">buildFathomScript</text>
  </g>
  <g class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">
    <rect x="1054" y="412" width="62" height="20" rx="10" fill="#dcfce7"/>
    <text x="1085" y="426">Loaded</text>
    <rect x="1054" y="444" width="62" height="20" rx="10" fill="#dcfce7"/>
    <text x="1085" y="458">Loaded</text>
    <rect x="1054" y="476" width="62" height="20" rx="10" fill="#dcfce7"/>
    <text x="1085" y="490">Loaded</text>
    <rect x="1054" y="508" width="62" height="20" rx="10" fill="#dcfce7"/>
    <text x="1085" y="522">Loaded</text>
    <rect x="1054" y="540" width="62" height="20" rx="10" fill="#dcfce7"/>
    <text x="1085" y="554">Loaded</text>
  </g>

  <!-- footer note -->
  <text x="60" y="606" class="font-ui" font-size="12" fill="#94a3b8">Zero runtime dependencies · Tree-shakeable · React 18+ components: &lt;AnalyticsScript&gt; and &lt;ConsentBanner&gt;</text>
</svg>
