<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>shouldLoad(consentState) accuracy: all five analytics script builders stay blocked with default consent and load only after consent.grant('analytics')</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">shouldLoad(consentState) — Scripts Load Only With Matching Consent</text>

  <!-- left panel: before opt-in -->
  <rect x="40" y="66" width="395" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="96" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Before opt-in — manager defaults</text>
  <line x1="40" y1="110" x2="435" y2="110" stroke="#e2e8f0"/>
  <rect x="64" y="124" width="347" height="26" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="141" class="font-mono" font-size="12" fill="#0f172a">{ analytics: <tspan fill="#b91c1c">false</tspan>, marketing: <tspan fill="#b91c1c">false</tspan> }</text>

  <g class="font-mono" font-size="13" fill="#0f172a">
    <text x="64" y="184">buildGA4Script</text>
    <text x="64" y="224">buildClarityScript</text>
    <text x="64" y="264">buildPostHogScript</text>
    <text x="64" y="304">buildPlausibleScript</text>
    <text x="64" y="344">buildFathomScript</text>
  </g>
  <g class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">
    <rect x="340" y="169" width="70" height="20" rx="10" fill="#fee2e2"/>
    <text x="375" y="183">Blocked</text>
    <rect x="340" y="209" width="70" height="20" rx="10" fill="#fee2e2"/>
    <text x="375" y="223">Blocked</text>
    <rect x="340" y="249" width="70" height="20" rx="10" fill="#fee2e2"/>
    <text x="375" y="263">Blocked</text>
    <rect x="340" y="289" width="70" height="20" rx="10" fill="#fee2e2"/>
    <text x="375" y="303">Blocked</text>
    <rect x="340" y="329" width="70" height="20" rx="10" fill="#fee2e2"/>
    <text x="375" y="343">Blocked</text>
  </g>
  <text x="64" y="378" class="font-mono" font-size="12" fill="#64748b">shouldLoad(state) → <tspan fill="#b91c1c">false</tspan></text>

  <!-- arrow between panels -->
  <line x1="440" y1="231" x2="458" y2="231" stroke="#2563eb" stroke-width="2"/>
  <path d="M458 225 L468 231 L458 237 Z" fill="#2563eb"/>

  <!-- right panel: after grant -->
  <rect x="465" y="66" width="395" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="489" y="96" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">After consent.grant('analytics')</text>
  <line x1="465" y1="110" x2="860" y2="110" stroke="#e2e8f0"/>
  <rect x="489" y="124" width="347" height="26" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="501" y="141" class="font-mono" font-size="12" fill="#0f172a">{ analytics: <tspan fill="#16a34a">true</tspan>, marketing: <tspan fill="#b91c1c">false</tspan> }</text>

  <g class="font-mono" font-size="13" fill="#0f172a">
    <text x="489" y="184">buildGA4Script</text>
    <text x="489" y="224">buildClarityScript</text>
    <text x="489" y="264">buildPostHogScript</text>
    <text x="489" y="304">buildPlausibleScript</text>
    <text x="489" y="344">buildFathomScript</text>
  </g>
  <g class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">
    <rect x="765" y="169" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="800" y="183">Loaded</text>
    <rect x="765" y="209" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="800" y="223">Loaded</text>
    <rect x="765" y="249" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="800" y="263">Loaded</text>
    <rect x="765" y="289" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="800" y="303">Loaded</text>
    <rect x="765" y="329" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="800" y="343">Loaded</text>
  </g>
  <text x="489" y="378" class="font-mono" font-size="12" fill="#64748b">shouldLoad(state) → <tspan fill="#16a34a">true</tspan></text>

  <!-- bottom code strip -->
  <rect x="40" y="416" width="820" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="64" y="438" class="font-mono" font-size="12" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> visible = scripts.<tspan fill="#2563eb">filter</tspan>((s) =&gt; s.<tspan fill="#2563eb">shouldLoad</tspan>(consent.<tspan fill="#2563eb">getState</tspan>()));</text>
  <text x="64" y="458" class="font-ui" font-size="12" fill="#64748b">Every ScriptConfig carries a consentCategory — no script tag is emitted without a matching granted category.</text>
</svg>
