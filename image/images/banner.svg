<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>power-seo images package banner: image SEO audits for alt text, lazy loading, modern formats and image sitemaps</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- brand pill -->
  <rect x="72" y="52" width="112" height="24" rx="12" fill="#dbeafe"/>
  <text x="128" y="68" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">@power-seo</text>

  <!-- title + value prop -->
  <text x="72" y="122" class="font-ui" font-size="34" font-weight="700" fill="#0f172a">@power-seo/images</text>
  <text x="72" y="152" class="font-ui" font-size="15" fill="#64748b">Image SEO audits — alt text quality, lazy-loading, WebP/AVIF format checks, image sitemaps.</text>

  <!-- function pills -->
  <rect x="72" y="180" width="136" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="140" y="198" class="font-mono" font-size="11" fill="#2563eb" text-anchor="middle">analyzeAltText()</text>
  <rect x="216" y="180" width="150" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="291" y="198" class="font-mono" font-size="11" fill="#2563eb" text-anchor="middle">auditLazyLoading()</text>
  <rect x="374" y="180" width="172" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="460" y="198" class="font-mono" font-size="11" fill="#2563eb" text-anchor="middle">analyzeImageFormats()</text>
  <rect x="554" y="180" width="180" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="644" y="198" class="font-mono" font-size="11" fill="#2563eb" text-anchor="middle">generateImageSitemap()</text>

  <!-- right vignette: audited image card -->
  <rect x="880" y="36" width="330" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="900" y="56" width="96" height="72" rx="6" fill="#dbeafe"/>
  <path d="M908 118 l24 -26 l16 16 l14 -14 l26 24 z" fill="#2563eb" opacity="0.55"/>
  <circle cx="924" cy="74" r="7" fill="#2563eb" opacity="0.55"/>
  <text x="1012" y="70" class="font-mono" font-size="12" fill="#0f172a">hero.webp</text>
  <text x="1012" y="90" class="font-ui" font-size="11" fill="#64748b">alt="Trail runner at sunrise"</text>
  <rect x="1012" y="102" width="52" height="20" rx="10" fill="#dcfce7"/>
  <text x="1038" y="116" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>

  <line x1="900" y1="144" x2="1190" y2="144" stroke="#e2e8f0"/>
  <circle cx="910" cy="164" r="6" fill="#dcfce7"/>
  <path d="M907 164 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="924" y="168" class="font-ui" font-size="12" fill="#0f172a">Good alt text — descriptive, under 125 characters</text>
  <circle cx="910" cy="190" r="6" fill="#dcfce7"/>
  <path d="M907 190 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="924" y="194" class="font-ui" font-size="12" fill="#0f172a">Modern format: webp</text>
  <circle cx="910" cy="216" r="6" fill="#dcfce7"/>
  <path d="M907 216 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="924" y="220" class="font-ui" font-size="12" fill="#0f172a">loading="lazy" only below the fold</text>
</svg>
