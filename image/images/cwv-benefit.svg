<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Core Web Vitals protection: auditLazyLoading flags above-fold lazy images that delay LCP and missing dimensions that cause CLS</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="36" y="46" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Core Web Vitals protection with <tspan class="font-mono" fill="#2563eb">auditLazyLoading()</tspan></text>
  <text x="36" y="70" class="font-ui" font-size="13" fill="#64748b">Every image is checked against loading, decoding, dimension and srcset rules that affect LCP and CLS.</text>

  <!-- LCP card -->
  <rect x="36" y="92" width="410" height="176" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="120" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Largest Contentful Paint (LCP)</text>
  <rect x="374" y="104" width="54" height="20" rx="10" fill="#fee2e2"/>
  <text x="401" y="118" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">error</text>
  <rect x="56" y="134" width="370" height="52" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="70" y="155" class="font-mono" font-size="11" fill="#b91c1c">id: 'lazy-above-fold'</text>
  <text x="70" y="174" class="font-ui" font-size="12" fill="#0f172a">Above-fold image uses loading="lazy" — delays LCP</text>
  <circle cx="64" cy="212" r="6" fill="#dcfce7"/>
  <path d="M61 212 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="80" y="216" class="font-ui" font-size="12" fill="#0f172a">Fix: remove loading="lazy" from above-fold images</text>
  <circle cx="64" cy="238" r="6" fill="#dcfce7"/>
  <path d="M61 238 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="80" y="242" class="font-ui" font-size="12" fill="#0f172a">Add decoding="async" for non-blocking decode</text>

  <!-- CLS card -->
  <rect x="466" y="92" width="398" height="176" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="486" y="120" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Cumulative Layout Shift (CLS)</text>
  <rect x="776" y="104" width="70" height="20" rx="10" fill="#fef3c7"/>
  <text x="811" y="118" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <rect x="486" y="134" width="358" height="52" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="500" y="155" class="font-mono" font-size="11" fill="#b45309">id: 'dimensions-missing'</text>
  <text x="500" y="174" class="font-ui" font-size="12" fill="#0f172a">No explicit width/height — layout shifts on load</text>
  <circle cx="494" cy="212" r="6" fill="#dcfce7"/>
  <path d="M491 212 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="510" y="216" class="font-ui" font-size="12" fill="#0f172a">Fix: add width and height attributes to reserve space</text>
  <circle cx="494" cy="238" r="6" fill="#dcfce7"/>
  <path d="M491 238 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="510" y="242" class="font-ui" font-size="12" fill="#0f172a">Add sizes when srcset is present so browsers pick right</text>

  <!-- audit output code card -->
  <rect x="36" y="288" width="828" height="130" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="56" y="316" class="font-mono" font-size="12"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> audit = </tspan><tspan fill="#2563eb">auditLazyLoading</tspan><tspan fill="#0f172a">(images);</tspan></text>
  <text x="56" y="340" class="font-mono" font-size="12"><tspan fill="#94a3b8">// audit.issues →</tspan></text>
  <text x="56" y="364" class="font-mono" font-size="12"><tspan fill="#0f172a">[ { id: </tspan><tspan fill="#16a34a">'lazy-above-fold'</tspan><tspan fill="#0f172a">, severity: </tspan><tspan fill="#16a34a">'error'</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="56" y="388" class="font-mono" font-size="12"><tspan fill="#0f172a">  { id: </tspan><tspan fill="#16a34a">'dimensions-missing'</tspan><tspan fill="#0f172a">, severity: </tspan><tspan fill="#16a34a">'warning'</tspan><tspan fill="#0f172a"> }, { id: </tspan><tspan fill="#16a34a">'sizes-missing'</tspan><tspan fill="#0f172a">, severity: </tspan><tspan fill="#16a34a">'warning'</tspan><tspan fill="#0f172a"> } ]</tspan></text>

  <!-- footer chips -->
  <rect x="36" y="438" width="250" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="161" y="457" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Below-fold images get loading="lazy"</text>
  <rect x="298" y="438" width="256" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="426" y="457" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Wide images (&gt;600px) get srcset advice</text>
  <rect x="566" y="438" width="238" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="685" y="457" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Typed LazyLoadingAuditResult</text>
</svg>
