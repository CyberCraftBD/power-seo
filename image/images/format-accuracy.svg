<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Format detection table showing detectFormat and analyzeImageFormats classifying webp, avif and svg as modern with WebP or AVIF recommendations for legacy formats</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="36" y="46" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Accurate format detection with <tspan class="font-mono" fill="#2563eb">detectFormat()</tspan></text>
  <text x="36" y="70" class="font-ui" font-size="13" fill="#64748b">Query strings and hashes are stripped before extension lookup. Modern formats: webp, avif, svg.</text>

  <!-- summary cards -->
  <rect x="36" y="90" width="262" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="114" class="font-ui" font-size="12" font-weight="600" fill="#64748b">totalImages</text>
  <text x="56" y="146" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">5</text>
  <rect x="318" y="90" width="262" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="338" y="114" class="font-ui" font-size="12" font-weight="600" fill="#64748b">modernFormatCount</text>
  <text x="338" y="146" class="font-ui" font-size="24" font-weight="700" fill="#16a34a">3</text>
  <rect x="600" y="90" width="264" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="620" y="114" class="font-ui" font-size="12" font-weight="600" fill="#64748b">legacyFormatCount</text>
  <text x="620" y="146" class="font-ui" font-size="24" font-weight="700" fill="#f59e0b">2</text>

  <!-- results table -->
  <rect x="36" y="182" width="828" height="242" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="37" y="183" width="826" height="32" rx="7" fill="#f8fafc"/>
  <text x="56" y="204" class="font-ui" font-size="12" font-weight="600" fill="#64748b">SRC</text>
  <text x="286" y="204" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FORMAT</text>
  <text x="386" y="204" class="font-ui" font-size="12" font-weight="600" fill="#64748b">MODERN</text>
  <text x="486" y="204" class="font-ui" font-size="12" font-weight="600" fill="#64748b">RECOMMENDATION</text>

  <line x1="37" y1="215" x2="863" y2="215" stroke="#e2e8f0"/>
  <text x="56" y="240" class="font-mono" font-size="12" fill="#0f172a">/img/hero.jpg</text>
  <text x="286" y="240" class="font-mono" font-size="12" fill="#0f172a">jpeg</text>
  <text x="386" y="240" class="font-ui" font-size="13" fill="#94a3b8">—</text>
  <text x="486" y="240" class="font-ui" font-size="12" fill="#64748b">Convert to WebP or AVIF for 25-50% smaller file sizes.</text>

  <line x1="37" y1="256" x2="863" y2="256" stroke="#e2e8f0"/>
  <text x="56" y="281" class="font-mono" font-size="12" fill="#0f172a">/img/logo.svg</text>
  <text x="286" y="281" class="font-mono" font-size="12" fill="#0f172a">svg</text>
  <text x="386" y="282" class="font-ui" font-size="14" font-weight="700" fill="#16a34a">✓</text>
  <text x="486" y="281" class="font-ui" font-size="12" fill="#94a3b8">—</text>

  <line x1="37" y1="297" x2="863" y2="297" stroke="#e2e8f0"/>
  <text x="56" y="322" class="font-mono" font-size="12" fill="#0f172a">/img/team.webp</text>
  <text x="286" y="322" class="font-mono" font-size="12" fill="#0f172a">webp</text>
  <text x="386" y="323" class="font-ui" font-size="14" font-weight="700" fill="#16a34a">✓</text>
  <text x="486" y="322" class="font-ui" font-size="12" fill="#94a3b8">—</text>

  <line x1="37" y1="338" x2="863" y2="338" stroke="#e2e8f0"/>
  <text x="56" y="363" class="font-mono" font-size="12" fill="#0f172a">/img/chart.png?v=2</text>
  <text x="286" y="363" class="font-mono" font-size="12" fill="#0f172a">png</text>
  <text x="386" y="363" class="font-ui" font-size="13" fill="#94a3b8">—</text>
  <text x="486" y="363" class="font-ui" font-size="12" fill="#64748b">Convert to WebP or AVIF. For simple graphics, consider SVG.</text>

  <line x1="37" y1="379" x2="863" y2="379" stroke="#e2e8f0"/>
  <text x="56" y="404" class="font-mono" font-size="12" fill="#0f172a">/img/promo.avif</text>
  <text x="286" y="404" class="font-mono" font-size="12" fill="#0f172a">avif</text>
  <text x="386" y="405" class="font-ui" font-size="14" font-weight="700" fill="#16a34a">✓</text>
  <text x="486" y="404" class="font-ui" font-size="12" fill="#94a3b8">—</text>

  <!-- footer recommendation -->
  <rect x="36" y="440" width="828" height="36" rx="8" fill="#dbeafe"/>
  <text x="56" y="463" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8">analyzeImageFormats(): "2 of 5 images use legacy formats. Convert to WebP or AVIF for better performance."</text>
</svg>
