<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison: manual image review steps versus a single automated pass with power-seo images functions</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="36" y="46" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">From manual review to one automated pass</text>
  <text x="36" y="70" class="font-ui" font-size="13" fill="#64748b">The same image SEO checks, made repeatable and CI-friendly.</text>

  <!-- left panel: manual -->
  <rect x="36" y="92" width="380" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Manual image review</text>
  <rect x="326" y="106" width="70" height="20" rx="10" fill="#f1f5f9"/>
  <text x="361" y="120" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">before</text>

  <circle cx="66" cy="156" r="6" fill="#fef3c7"/>
  <text x="66" y="160" class="font-ui" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">!</text>
  <text x="82" y="160" class="font-ui" font-size="13" fill="#0f172a">Open every page, inspect each &lt;img&gt; by hand</text>
  <circle cx="66" cy="192" r="6" fill="#fef3c7"/>
  <text x="66" y="196" class="font-ui" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">!</text>
  <text x="82" y="196" class="font-ui" font-size="13" fill="#0f172a">Judge alt text quality case by case</text>
  <circle cx="66" cy="228" r="6" fill="#fef3c7"/>
  <text x="66" y="232" class="font-ui" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">!</text>
  <text x="82" y="232" class="font-ui" font-size="13" fill="#0f172a">Easy to miss lazy-loaded hero images</text>
  <circle cx="66" cy="264" r="6" fill="#fef3c7"/>
  <text x="66" y="268" class="font-ui" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">!</text>
  <text x="82" y="268" class="font-ui" font-size="13" fill="#0f172a">Track legacy JPEG/PNG usage in a spreadsheet</text>
  <circle cx="66" cy="300" r="6" fill="#fef3c7"/>
  <text x="66" y="304" class="font-ui" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">!</text>
  <text x="82" y="304" class="font-ui" font-size="13" fill="#0f172a">Hand-write image sitemap XML entries</text>
  <circle cx="66" cy="336" r="6" fill="#fef3c7"/>
  <text x="66" y="340" class="font-ui" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">!</text>
  <text x="82" y="340" class="font-ui" font-size="13" fill="#0f172a">Repeat the whole pass after every release</text>
  <line x1="56" y1="368" x2="396" y2="368" stroke="#e2e8f0"/>
  <text x="56" y="396" class="font-ui" font-size="12" fill="#64748b">Slow, inconsistent, hard to keep up to date.</text>

  <!-- arrow -->
  <path d="M430 250 h26" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M452 242 l12 8 l-12 8 z" fill="#2563eb"/>

  <!-- right panel: automated -->
  <rect x="484" y="92" width="380" height="330" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="504" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">With @power-seo/images</text>
  <rect x="782" y="106" width="62" height="20" rx="10" fill="#dbeafe"/>
  <text x="813" y="120" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">after</text>

  <circle cx="514" cy="156" r="6" fill="#dcfce7"/>
  <path d="M511 156 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="530" y="160" class="font-mono" font-size="12"><tspan fill="#2563eb">analyzeAltText</tspan><tspan fill="#0f172a">(images)</tspan></text>
  <text x="530" y="177" class="font-ui" font-size="11" fill="#64748b">scored issues + recommendations per image</text>

  <circle cx="514" cy="208" r="6" fill="#dcfce7"/>
  <path d="M511 208 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="530" y="212" class="font-mono" font-size="12"><tspan fill="#2563eb">auditLazyLoading</tspan><tspan fill="#0f172a">(images)</tspan></text>
  <text x="530" y="229" class="font-ui" font-size="11" fill="#64748b">LCP and CLS risks flagged automatically</text>

  <circle cx="514" cy="260" r="6" fill="#dcfce7"/>
  <path d="M511 260 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="530" y="264" class="font-mono" font-size="12"><tspan fill="#2563eb">analyzeImageFormats</tspan><tspan fill="#0f172a">(images)</tspan></text>
  <text x="530" y="281" class="font-ui" font-size="11" fill="#64748b">WebP / AVIF recommendations for legacy formats</text>

  <circle cx="514" cy="312" r="6" fill="#dcfce7"/>
  <path d="M511 312 l2.2 2.4 l4 -4.6" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="530" y="316" class="font-mono" font-size="12"><tspan fill="#2563eb">generateImageSitemap</tspan><tspan fill="#0f172a">(pages)</tspan></text>
  <text x="530" y="333" class="font-ui" font-size="11" fill="#64748b">ready-to-serve Google image sitemap XML</text>

  <line x1="504" y1="360" x2="844" y2="360" stroke="#e2e8f0"/>
  <rect x="504" y="376" width="200" height="24" rx="12" fill="#dcfce7"/>
  <text x="604" y="392" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Deterministic, typed, CI-friendly</text>
  <text x="716" y="392" class="font-ui" font-size="12" fill="#64748b">runs on every build</text>

  <!-- footer -->
  <text x="36" y="462" class="font-ui" font-size="12" fill="#94a3b8">Four pure functions with fully typed results — same checks on every commit.</text>
</svg>
