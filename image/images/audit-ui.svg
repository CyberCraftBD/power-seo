<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Image audit dashboard showing analyzeAltText results with a 33 of 40 score and per-image alt text issues</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <text x="20" y="34" class="font-ui" font-size="14" font-weight="700" fill="#0f172a">power-seo</text>
  <text x="20" y="72" class="font-ui" font-size="13" fill="#64748b">Overview</text>
  <rect x="10" y="88" width="160" height="30" rx="6" fill="#dbeafe"/>
  <text x="20" y="108" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Alt Text</text>
  <text x="20" y="146" class="font-ui" font-size="13" fill="#64748b">Lazy Loading</text>
  <text x="20" y="180" class="font-ui" font-size="13" fill="#64748b">Formats</text>
  <text x="20" y="214" class="font-ui" font-size="13" fill="#64748b">Image Sitemap</text>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Image Audit</text>
  <text x="310" y="32" class="font-mono" font-size="12" fill="#64748b">analyzeAltText(images)</text>
  <rect x="776" y="11" width="100" height="30" rx="6" fill="#2563eb"/>
  <text x="826" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run Audit</text>

  <!-- score card -->
  <rect x="204" y="72" width="324" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="100" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Alt Text Score</text>
  <rect x="446" y="86" width="62" height="20" rx="10" fill="#dcfce7"/>
  <text x="477" y="100" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">4 images</text>
  <text x="224" y="138" class="font-ui" font-size="26" font-weight="700" fill="#16a34a">33<tspan font-size="14" fill="#64748b" font-weight="600"> / 40</tspan></text>
  <rect x="224" y="154" width="284" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="224" y="154" width="234" height="8" rx="4" fill="#16a34a"/>

  <!-- severity summary card -->
  <rect x="548" y="72" width="328" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="568" y="100" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Issues by Severity</text>
  <circle cx="576" cy="126" r="5" fill="#ef4444"/>
  <text x="590" y="130" class="font-ui" font-size="12" fill="#0f172a">1 error</text>
  <circle cx="576" cy="150" r="5" fill="#f59e0b"/>
  <text x="590" y="154" class="font-ui" font-size="12" fill="#0f172a">1 warning</text>
  <circle cx="700" cy="126" r="5" fill="#16a34a"/>
  <text x="714" y="130" class="font-ui" font-size="12" fill="#0f172a">2 pass</text>
  <circle cx="700" cy="150" r="5" fill="#2563eb"/>
  <text x="714" y="154" class="font-ui" font-size="12" fill="#0f172a">1 info</text>

  <!-- issues table -->
  <rect x="204" y="198" width="672" height="212" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="205" y="199" width="670" height="32" rx="7" fill="#f8fafc"/>
  <text x="224" y="220" class="font-ui" font-size="12" font-weight="600" fill="#64748b">IMAGE</text>
  <text x="400" y="220" class="font-ui" font-size="12" font-weight="600" fill="#64748b">ISSUE</text>
  <text x="770" y="220" class="font-ui" font-size="12" font-weight="600" fill="#64748b">SEVERITY</text>

  <line x1="205" y1="231" x2="875" y2="231" stroke="#e2e8f0"/>
  <text x="224" y="258" class="font-mono" font-size="12" fill="#0f172a">banner.png</text>
  <text x="400" y="258" class="font-ui" font-size="13" fill="#0f172a">Missing alt attribute</text>
  <rect x="762" y="242" width="54" height="20" rx="10" fill="#fee2e2"/>
  <text x="789" y="256" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">error</text>

  <line x1="205" y1="276" x2="875" y2="276" stroke="#e2e8f0"/>
  <text x="224" y="303" class="font-mono" font-size="12" fill="#0f172a">team.jpg</text>
  <text x="400" y="303" class="font-ui" font-size="13" fill="#0f172a">Redundant alt text prefix — starts with "photo of"</text>
  <rect x="762" y="287" width="70" height="20" rx="10" fill="#fef3c7"/>
  <text x="797" y="301" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>

  <line x1="205" y1="321" x2="875" y2="321" stroke="#e2e8f0"/>
  <text x="224" y="348" class="font-mono" font-size="12" fill="#0f172a">divider.svg</text>
  <text x="400" y="348" class="font-ui" font-size="13" fill="#0f172a">Decorative image — empty alt is valid</text>
  <rect x="762" y="332" width="54" height="20" rx="10" fill="#dcfce7"/>
  <text x="789" y="346" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>

  <line x1="205" y1="366" x2="875" y2="366" stroke="#e2e8f0"/>
  <text x="224" y="393" class="font-mono" font-size="12" fill="#0f172a">hero.webp</text>
  <text x="400" y="393" class="font-ui" font-size="13" fill="#0f172a">Good alt text</text>
  <rect x="762" y="377" width="54" height="20" rx="10" fill="#dcfce7"/>
  <text x="789" y="391" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>

  <!-- recommendations -->
  <rect x="204" y="426" width="672" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="448" class="font-ui" font-size="12" font-weight="600" fill="#64748b">RECOMMENDATIONS</text>
  <text x="224" y="468" class="font-ui" font-size="12" fill="#0f172a">Fix 1 critical alt text issue(s): missing alt attributes. Address 1 alt text warning(s) to improve accessibility and SEO.</text>
</svg>
