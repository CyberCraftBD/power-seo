<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>power-seo images hero: TypeScript toolkit for image SEO with alt text analysis, lazy loading audits, format recommendations and image sitemap generation</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- brand pill -->
  <rect x="90" y="88" width="112" height="26" rx="13" fill="#dbeafe"/>
  <text x="146" y="105" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">@power-seo</text>

  <!-- headline -->
  <text x="90" y="168" class="font-ui" font-size="44" font-weight="700" fill="#0f172a">@power-seo/images</text>
  <text x="90" y="210" class="font-ui" font-size="18" fill="#64748b">Audit every image on your pages: alt text quality, lazy-loading correctness,</text>
  <text x="90" y="236" class="font-ui" font-size="18" fill="#64748b">modern format adoption, and Google image sitemap XML — fully typed.</text>

  <!-- code card -->
  <rect x="90" y="272" width="560" height="196" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="114" y="306" class="font-mono" font-size="13"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { analyzeAltText, auditLazyLoading }</tspan></text>
  <text x="114" y="328" class="font-mono" font-size="13"><tspan fill="#0f172a">  </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#16a34a"> '@power-seo/images'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="114" y="362" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> result = </tspan><tspan fill="#2563eb">analyzeAltText</tspan><tspan fill="#0f172a">(images, </tspan><tspan fill="#16a34a">'trail shoes'</tspan><tspan fill="#0f172a">);</tspan></text>
  <text x="114" y="384" class="font-mono" font-size="13"><tspan fill="#94a3b8">// result.score / result.maxScore → 19 / 30</tspan></text>
  <text x="114" y="418" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> lazy = </tspan><tspan fill="#2563eb">auditLazyLoading</tspan><tspan fill="#0f172a">(images);</tspan></text>
  <text x="114" y="440" class="font-mono" font-size="13"><tspan fill="#94a3b8">// flags loading="lazy" on above-fold images (LCP)</tspan></text>

  <!-- feature chips under code -->
  <rect x="90" y="496" width="176" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="178" y="515" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Alt text scoring</text>
  <rect x="276" y="496" width="196" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="374" y="515" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">LCP / CLS protection</text>
  <rect x="482" y="496" width="212" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="588" y="515" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">WebP / AVIF recommendations</text>
  <rect x="704" y="496" width="176" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="792" y="515" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Image sitemap XML</text>

  <!-- right vignette: audit result card -->
  <rect x="700" y="120" width="410" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="724" y="152" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Image Audit</text>
  <rect x="1016" y="134" width="70" height="22" rx="11" fill="#dcfce7"/>
  <text x="1051" y="149" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">3 images</text>

  <!-- score ring -->
  <circle cx="768" cy="220" r="34" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <path d="M768 186 A34 34 0 1 1 743.2 243.3" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <text x="768" y="228" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">19</text>
  <text x="824" y="212" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Alt text score</text>
  <text x="824" y="232" class="font-ui" font-size="12" fill="#64748b">19 of 30 (10 per image)</text>

  <!-- issue rows -->
  <line x1="724" y1="272" x2="1086" y2="272" stroke="#e2e8f0"/>
  <rect x="724" y="286" width="54" height="20" rx="10" fill="#dcfce7"/>
  <text x="751" y="300" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>
  <text x="790" y="300" class="font-ui" font-size="13" fill="#0f172a">Good alt text — hero.webp</text>

  <rect x="724" y="322" width="70" height="20" rx="10" fill="#fef3c7"/>
  <text x="759" y="336" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <text x="806" y="336" class="font-ui" font-size="13" fill="#0f172a">Redundant alt text prefix — "photo of ..."</text>

  <rect x="724" y="358" width="54" height="20" rx="10" fill="#fee2e2"/>
  <text x="751" y="372" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">error</text>
  <text x="790" y="372" class="font-ui" font-size="13" fill="#0f172a">Missing alt attribute — banner.png</text>

  <line x1="724" y1="392" x2="1086" y2="392" stroke="#e2e8f0"/>
  <text x="724" y="418" class="font-ui" font-size="12" font-weight="600" fill="#64748b">RECOMMENDATION</text>
  <text x="724" y="438" class="font-ui" font-size="12" fill="#64748b">Fix 1 critical alt text issue(s): missing alt attributes.</text>
</svg>
