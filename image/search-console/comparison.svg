<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix of @power-seo/search-console versus google-auth-library, googleapis, and custom fetch code for Google Search Console access</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="40" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Search Console client comparison</text>
  <text x="40" y="68" class="font-ui" font-size="13" fill="#64748b">Feature coverage across common approaches to the Google Search Console API</text>

  <!-- table card -->
  <rect x="40" y="88" width="820" height="376" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- highlight column -->
  <rect x="716" y="89" width="127" height="374" fill="#dbeafe" opacity="0.35"/>

  <!-- header row -->
  <path d="M40 96 a8 8 0 0 1 8-8 h804 a8 8 0 0 1 8 8 v34 h-820 z" fill="#f8fafc"/>
  <line x1="40" y1="130" x2="860" y2="130" stroke="#e2e8f0"/>
  <text x="60" y="115" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FEATURE</text>
  <text x="452" y="109" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">google-auth-</text>
  <text x="452" y="122" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">library</text>
  <text x="562" y="115" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">googleapis</text>
  <text x="668" y="115" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">custom fetch</text>
  <text x="780" y="109" class="font-ui" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">@power-seo/</text>
  <text x="780" y="122" class="font-ui" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">search-console</text>

  <!-- rows: y baseline start 156, step 41 -->
  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="60" y="160">OAuth2 token auto-refresh</text>
    <text x="60" y="201">Service account JWT signing</text>
    <text x="60" y="242">Auto-paginated analytics fetch</text>
    <text x="60" y="283">Typed GSC response shapes</text>
    <text x="60" y="324">URL inspection support</text>
    <text x="60" y="365">Sitemap management</text>
    <text x="60" y="406">Zero runtime dependencies</text>
    <text x="60" y="447">TypeScript-first API</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="40" y1="171" x2="860" y2="171"/>
    <line x1="40" y1="212" x2="860" y2="212"/>
    <line x1="40" y1="253" x2="860" y2="253"/>
    <line x1="40" y1="294" x2="860" y2="294"/>
    <line x1="40" y1="335" x2="860" y2="335"/>
    <line x1="40" y1="376" x2="860" y2="376"/>
    <line x1="40" y1="417" x2="860" y2="417"/>
  </g>

  <!-- google-auth-library column: check, check, dash, dash, dash, dash, dash, dash -->
  <g text-anchor="middle" class="font-ui" font-size="14" font-weight="700">
    <text x="452" y="161" fill="#16a34a">✓</text>
    <text x="452" y="202" fill="#16a34a">✓</text>
    <text x="452" y="243" fill="#94a3b8">—</text>
    <text x="452" y="284" fill="#94a3b8">—</text>
    <text x="452" y="325" fill="#94a3b8">—</text>
    <text x="452" y="366" fill="#94a3b8">—</text>
    <text x="452" y="407" fill="#94a3b8">—</text>
    <text x="452" y="448" fill="#94a3b8">—</text>
  </g>
  <!-- googleapis: check, check, dash, partial, partial, partial, dash, partial -->
  <g text-anchor="middle" class="font-ui" font-size="14" font-weight="700">
    <text x="562" y="161" fill="#16a34a">✓</text>
    <text x="562" y="202" fill="#16a34a">✓</text>
    <text x="562" y="243" fill="#94a3b8">—</text>
    <text x="562" y="284" fill="#b45309" font-size="11" font-weight="600">partial</text>
    <text x="562" y="325" fill="#b45309" font-size="11" font-weight="600">partial</text>
    <text x="562" y="366" fill="#b45309" font-size="11" font-weight="600">partial</text>
    <text x="562" y="407" fill="#94a3b8">—</text>
    <text x="562" y="448" fill="#b45309" font-size="11" font-weight="600">partial</text>
  </g>
  <!-- custom fetch: dash x4... zero deps check -->
  <g text-anchor="middle" class="font-ui" font-size="14" font-weight="700">
    <text x="668" y="161" fill="#94a3b8">—</text>
    <text x="668" y="202" fill="#94a3b8">—</text>
    <text x="668" y="243" fill="#94a3b8">—</text>
    <text x="668" y="284" fill="#94a3b8">—</text>
    <text x="668" y="325" fill="#94a3b8">—</text>
    <text x="668" y="366" fill="#94a3b8">—</text>
    <text x="668" y="407" fill="#16a34a">✓</text>
    <text x="668" y="448" fill="#94a3b8">—</text>
  </g>
  <!-- power-seo: all checks -->
  <g text-anchor="middle" class="font-ui" font-size="14" font-weight="700" fill="#16a34a">
    <text x="780" y="161">✓</text>
    <text x="780" y="202">✓</text>
    <text x="780" y="243">✓</text>
    <text x="780" y="284">✓</text>
    <text x="780" y="325">✓</text>
    <text x="780" y="366">✓</text>
    <text x="780" y="407">✓</text>
    <text x="780" y="448">✓</text>
  </g>

  <text x="40" y="486" class="font-ui" font-size="11" fill="#94a3b8">partial = possible with extra setup or untyped endpoints · APIs: createTokenManager, querySearchAnalyticsAll, inspectUrl, submitSitemap</text>
</svg>
