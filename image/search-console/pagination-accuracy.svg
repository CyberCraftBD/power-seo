<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Illustration of querySearchAnalyticsAll auto-pagination in @power-seo/search-console merging every page of Google Search Console data past the 25,000-row API limit</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="40" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Complete data, not just the first page</text>
  <text x="40" y="68" class="font-ui" font-size="13" fill="#64748b">The GSC API caps each request at MAX_ROW_LIMIT = 25,000 rows — querySearchAnalyticsAll() pages through all of them</text>

  <!-- Left panel: single request -->
  <rect x="40" y="92" width="400" height="290" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Single request</text>
  <rect x="292" y="106" width="128" height="22" rx="11" fill="#fef3c7"/>
  <text x="356" y="121" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">truncated dataset</text>
  <text x="60" y="148" class="font-mono" font-size="12" fill="#2563eb">querySearchAnalytics<tspan fill="#64748b">(client, req)</tspan></text>

  <text x="60" y="180" class="font-ui" font-size="12" fill="#64748b">Rows returned</text>
  <rect x="60" y="190" width="360" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="60" y="190" width="131" height="10" rx="5" fill="#f59e0b"/>
  <text x="60" y="220" class="font-mono" font-size="12" fill="#0f172a">25,000 <tspan fill="#94a3b8">of 68,540 total rows</tspan></text>

  <rect x="60" y="240" width="360" height="120" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="264" class="font-mono" font-size="12" fill="#94a3b8">// manual pagination boilerplate</text>
  <text x="76" y="284" class="font-mono" font-size="12" fill="#0f172a"><tspan fill="#7c3aed">while</tspan> (moreRows) {</text>
  <text x="76" y="304" class="font-mono" font-size="12" fill="#0f172a">  req.startRow += rows.length;</text>
  <text x="76" y="324" class="font-mono" font-size="12" fill="#0f172a">  all.push(...rows); <tspan fill="#94a3b8">// easy to get wrong</tspan></text>
  <text x="76" y="344" class="font-mono" font-size="12" fill="#0f172a">}</text>

  <!-- Right panel: auto-paginated -->
  <rect x="460" y="92" width="400" height="290" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="480" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Auto-paginated</text>
  <rect x="736" y="106" width="104" height="22" rx="11" fill="#dcfce7"/>
  <text x="788" y="121" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">complete dataset</text>
  <text x="480" y="148" class="font-mono" font-size="12" fill="#2563eb">querySearchAnalyticsAll<tspan fill="#64748b">(client, req)</tspan></text>

  <text x="480" y="180" class="font-ui" font-size="12" fill="#64748b">Rows returned</text>
  <rect x="480" y="190" width="360" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="480" y="190" width="360" height="10" rx="5" fill="#16a34a"/>
  <text x="480" y="220" class="font-mono" font-size="12" fill="#0f172a">68,540 <tspan fill="#94a3b8">of 68,540 total rows</tspan></text>

  <!-- page chips -->
  <rect x="480" y="240" width="108" height="52" rx="8" fill="#dbeafe"/>
  <text x="534" y="262" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Page 1</text>
  <text x="534" y="280" class="font-mono" font-size="11" fill="#1d4ed8" text-anchor="middle">startRow: 0</text>
  <rect x="606" y="240" width="108" height="52" rx="8" fill="#dbeafe"/>
  <text x="660" y="262" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Page 2</text>
  <text x="660" y="280" class="font-mono" font-size="11" fill="#1d4ed8" text-anchor="middle">startRow: 25000</text>
  <rect x="732" y="240" width="108" height="52" rx="8" fill="#dbeafe"/>
  <text x="786" y="262" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Page 3</text>
  <text x="786" y="280" class="font-mono" font-size="11" fill="#1d4ed8" text-anchor="middle">startRow: 50000</text>

  <path d="M534 292 v18 h252 v-18" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M660 310 v14" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M660 330 l-5 -9 h10 z" fill="#94a3b8"/>
  <rect x="560" y="332" width="200" height="34" rx="8" fill="#dcfce7"/>
  <text x="660" y="354" class="font-mono" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">SearchAnalyticsRow[]</text>

  <!-- bottom summary -->
  <rect x="40" y="404" width="820" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="431" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Loop stops when a page returns fewer than 25,000 rows — no missed rows, no duplicates</text>
  <text x="60" y="453" class="font-mono" font-size="12" fill="#94a3b8">rowLimit and startRow are managed internally · every row keeps keys, clicks, impressions, ctr, position</text>
</svg>
