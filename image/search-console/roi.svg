<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison showing a manual Google Search Console reporting process versus an automated pipeline built with @power-seo/search-console</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="40" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">From manual exports to an automated pipeline</text>
  <text x="40" y="68" class="font-ui" font-size="13" fill="#64748b">The same weekly SEO report — done by hand vs. scripted with @power-seo/search-console</text>

  <!-- Left: manual process -->
  <rect x="40" y="92" width="400" height="376" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Manual process</text>
  <rect x="342" y="106" width="78" height="22" rx="11" fill="#fee2e2"/>
  <text x="381" y="121" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">repetitive</text>

  <g class="font-ui" font-size="13" fill="#0f172a">
    <circle cx="72" cy="152" r="10" fill="#f1f5f9" stroke="#e2e8f0"/><text x="72" y="156" font-size="11" fill="#64748b" text-anchor="middle">1</text>
    <text x="94" y="157">Log into Search Console UI</text>
    <circle cx="72" cy="196" r="10" fill="#f1f5f9" stroke="#e2e8f0"/><text x="72" y="200" font-size="11" fill="#64748b" text-anchor="middle">2</text>
    <text x="94" y="201">Set date range and filters by hand</text>
    <circle cx="72" cy="240" r="10" fill="#f1f5f9" stroke="#e2e8f0"/><text x="72" y="244" font-size="11" fill="#64748b" text-anchor="middle">3</text>
    <text x="94" y="245">Export CSV (capped rows per export)</text>
    <circle cx="72" cy="284" r="10" fill="#f1f5f9" stroke="#e2e8f0"/><text x="72" y="288" font-size="11" fill="#64748b" text-anchor="middle">4</text>
    <text x="94" y="289">Merge spreadsheets across properties</text>
    <circle cx="72" cy="328" r="10" fill="#f1f5f9" stroke="#e2e8f0"/><text x="72" y="332" font-size="11" fill="#64748b" text-anchor="middle">5</text>
    <text x="94" y="333">Check indexing page by page in the UI</text>
    <circle cx="72" cy="372" r="10" fill="#f1f5f9" stroke="#e2e8f0"/><text x="72" y="376" font-size="11" fill="#64748b" text-anchor="middle">6</text>
    <text x="94" y="377">Repeat every week, per property</text>
  </g>
  <g stroke="#e2e8f0"><line x1="72" y1="164" x2="72" y2="184"/><line x1="72" y1="208" x2="72" y2="228"/><line x1="72" y1="252" x2="72" y2="272"/><line x1="72" y1="296" x2="72" y2="316"/><line x1="72" y1="340" x2="72" y2="360"/></g>
  <rect x="60" y="404" width="360" height="44" rx="8" fill="#f1f5f9"/>
  <text x="76" y="431" class="font-ui" font-size="12" fill="#64748b">Error-prone copy-paste · partial data · hard to schedule</text>

  <!-- Right: automated -->
  <rect x="460" y="92" width="400" height="376" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="480" y="122" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">With @power-seo/search-console</text>
  <rect x="742" y="106" width="98" height="22" rx="11" fill="#dcfce7"/>
  <text x="791" y="121" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">automated</text>

  <g class="font-ui" font-size="13" fill="#0f172a">
    <circle cx="492" cy="152" r="10" fill="#dbeafe"/><text x="492" y="156" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">1</text>
    <text x="514" y="157">Authenticate once — <tspan class="font-mono" font-size="12" fill="#2563eb">createTokenManager()</tspan></text>
    <circle cx="492" cy="196" r="10" fill="#dbeafe"/><text x="492" y="200" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">2</text>
    <text x="514" y="201">Fetch all rows — <tspan class="font-mono" font-size="12" fill="#2563eb">querySearchAnalyticsAll()</tspan></text>
    <circle cx="492" cy="240" r="10" fill="#dbeafe"/><text x="492" y="244" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">3</text>
    <text x="514" y="245">Verify indexing — <tspan class="font-mono" font-size="12" fill="#2563eb">inspectUrl()</tspan></text>
    <circle cx="492" cy="284" r="10" fill="#dbeafe"/><text x="492" y="288" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">4</text>
    <text x="514" y="289">Keep sitemaps fresh — <tspan class="font-mono" font-size="12" fill="#2563eb">submitSitemap()</tspan></text>
    <circle cx="492" cy="328" r="10" fill="#dbeafe"/><text x="492" y="332" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">5</text>
    <text x="514" y="333">Run on a schedule in CI/CD or a cron job</text>
  </g>
  <g stroke="#e2e8f0"><line x1="492" y1="164" x2="492" y2="184"/><line x1="492" y1="208" x2="492" y2="228"/><line x1="492" y1="252" x2="492" y2="272"/><line x1="492" y1="296" x2="492" y2="316"/></g>

  <rect x="480" y="356" width="360" height="92" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="496" y="380" class="font-mono" font-size="12" fill="#94a3b8"># runs unattended every Monday</text>
  <text x="496" y="400" class="font-mono" font-size="12" fill="#0f172a">$ node weekly-gsc-report.js</text>
  <text x="496" y="420" class="font-mono" font-size="12" fill="#16a34a">✓ 68,540 rows · 3 properties · report saved</text>
  <text x="496" y="438" class="font-mono" font-size="11" fill="#94a3b8">typed errors via GSCApiError — safe to automate</text>
</svg>
