<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>SEO dashboard mockup built with @power-seo/search-console showing search analytics rows, clicks, impressions, CTR, and average position from the Google Search Console API</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <rect x="16" y="16" width="24" height="24" rx="6" fill="#2563eb"/>
  <path d="M23 27 a4.5 4.5 0 1 1 6.4 4.1 M31 34 l4 4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="48" y="33" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">GSC Console</text>

  <rect x="12" y="64" width="156" height="30" rx="6" fill="#dbeafe"/>
  <text x="24" y="84" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Search Analytics</text>
  <text x="24" y="122" class="font-ui" font-size="13" fill="#64748b">URL Inspection</text>
  <text x="24" y="158" class="font-ui" font-size="13" fill="#64748b">Sitemaps</text>
  <text x="24" y="194" class="font-ui" font-size="13" fill="#64748b">Properties</text>
  <text x="24" y="230" class="font-ui" font-size="13" fill="#64748b">Settings</text>

  <rect x="12" y="440" width="156" height="44" rx="6" fill="#f1f5f9"/>
  <text x="24" y="458" class="font-ui" font-size="10" font-weight="600" fill="#94a3b8">PROPERTY</text>
  <text x="24" y="474" class="font-mono" font-size="11" fill="#0f172a">sc-domain:example.com</text>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Search Analytics</text>
  <rect x="586" y="11" width="172" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="600" y="30" class="font-ui" font-size="12" fill="#64748b">2026-01-01 → 2026-01-31</text>
  <rect x="770" y="11" width="106" height="30" rx="6" fill="#2563eb"/>
  <text x="823" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Fetch all rows</text>

  <!-- metric cards -->
  <rect x="204" y="72" width="212" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="96" class="font-ui" font-size="12" fill="#64748b">Total clicks</text>
  <text x="220" y="128" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">24,318</text>
  <rect x="424" y="72" width="212" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="440" y="96" class="font-ui" font-size="12" fill="#64748b">Total impressions</text>
  <text x="440" y="128" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">612,940</text>
  <rect x="644" y="72" width="232" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="660" y="96" class="font-ui" font-size="12" fill="#64748b">Avg. position</text>
  <text x="660" y="128" class="font-ui" font-size="24" font-weight="700" fill="#0f172a">7.9</text>
  <rect x="792" y="86" width="70" height="20" rx="10" fill="#dcfce7"/>
  <text x="827" y="100" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">CTR 4.0%</text>

  <!-- table card -->
  <rect x="204" y="172" width="672" height="304" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="220" y="198" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Top queries</text>
  <text x="220" y="216" class="font-mono" font-size="11" fill="#94a3b8">querySearchAnalyticsAll(client, { dimensions: ['query', 'page'] })</text>
  <rect x="760" y="184" width="102" height="22" rx="11" fill="#dbeafe"/>
  <text x="811" y="199" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">68,540 rows</text>

  <rect x="204" y="228" width="672" height="28" fill="#f8fafc"/>
  <text x="220" y="247" class="font-ui" font-size="11" font-weight="600" fill="#64748b">QUERY</text>
  <text x="500" y="247" class="font-ui" font-size="11" font-weight="600" fill="#64748b">PAGE</text>
  <text x="702" y="247" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">CLICKS</text>
  <text x="770" y="247" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">CTR</text>
  <text x="856" y="247" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">POSITION</text>
  <line x1="204" y1="256" x2="876" y2="256" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="13" fill="#0f172a">
    <text x="220" y="281">nextjs seo checklist</text>
    <text x="500" y="281" fill="#64748b" font-size="12">/blog/nextjs-seo</text>
    <text x="702" y="281" text-anchor="end">1,284</text>
    <text x="770" y="281" text-anchor="end">6.1%</text>
    <text x="856" y="281" text-anchor="end" fill="#16a34a">3.2</text>

    <text x="220" y="318">react meta tags</text>
    <text x="500" y="318" fill="#64748b" font-size="12">/guides/meta-tags</text>
    <text x="702" y="318" text-anchor="end">946</text>
    <text x="770" y="318" text-anchor="end">4.8%</text>
    <text x="856" y="318" text-anchor="end" fill="#16a34a">4.7</text>

    <text x="220" y="355">json-ld generator</text>
    <text x="500" y="355" fill="#64748b" font-size="12">/tools/schema</text>
    <text x="702" y="355" text-anchor="end">713</text>
    <text x="770" y="355" text-anchor="end">3.9%</text>
    <text x="856" y="355" text-anchor="end" fill="#f59e0b">8.4</text>

    <text x="220" y="392">xml sitemap best practices</text>
    <text x="500" y="392" fill="#64748b" font-size="12">/blog/sitemaps</text>
    <text x="702" y="392" text-anchor="end">522</text>
    <text x="770" y="392" text-anchor="end">2.7%</text>
    <text x="856" y="392" text-anchor="end" fill="#f59e0b">11.6</text>

    <text x="220" y="429">core web vitals guide</text>
    <text x="500" y="429" fill="#64748b" font-size="12">/blog/cwv</text>
    <text x="702" y="429" text-anchor="end">417</text>
    <text x="770" y="429" text-anchor="end">2.1%</text>
    <text x="856" y="429" text-anchor="end" fill="#f59e0b">14.3</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="204" y1="293" x2="876" y2="293"/>
    <line x1="204" y1="330" x2="876" y2="330"/>
    <line x1="204" y1="367" x2="876" y2="367"/>
    <line x1="204" y1="404" x2="876" y2="404"/>
  </g>
  <text x="220" y="460" class="font-ui" font-size="11" fill="#94a3b8">searchType: web · dataState: all · auto-paginated past the 25,000-row limit</text>
</svg>
