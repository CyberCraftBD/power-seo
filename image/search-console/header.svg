<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Hero header for @power-seo/search-console showing the typed Google Search Console API client with search analytics, URL inspection, and sitemap management</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Top branding -->
  <rect x="80" y="72" width="48" height="48" rx="12" fill="#2563eb"/>
  <path d="M96 96 a9 9 0 1 1 12.7 8.2 M111 108 l8 8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="144" y="103" class="font-ui" font-size="17" font-weight="600" fill="#64748b">@power-seo</text>
  <text x="80" y="182" class="font-ui" font-size="46" font-weight="700" fill="#0f172a">search-console</text>
  <text x="80" y="222" class="font-ui" font-size="19" fill="#64748b">Google Search Console API for TypeScript — zero boilerplate, zero dependencies.</text>

  <rect x="80" y="248" width="150" height="28" rx="14" fill="#dbeafe"/>
  <text x="155" y="266" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">OAuth2 + service account</text>
  <rect x="240" y="248" width="152" height="28" rx="14" fill="#dcfce7"/>
  <text x="316" y="266" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Auto-paginated analytics</text>
  <rect x="402" y="248" width="118" height="28" rx="14" fill="#f1f5f9"/>
  <text x="461" y="266" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">URL inspection</text>
  <rect x="530" y="248" width="150" height="28" rx="14" fill="#f1f5f9"/>
  <text x="605" y="266" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Sitemap management</text>

  <!-- Left card: code -->
  <rect x="80" y="310" width="540" height="264" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M80 318 a8 8 0 0 1 8-8 h524 a8 8 0 0 1 8 8 v26 h-540 z" fill="#f8fafc"/>
  <line x1="80" y1="344" x2="620" y2="344" stroke="#e2e8f0"/>
  <text x="100" y="330" class="font-mono" font-size="12" fill="#64748b">quick-start.ts</text>

  <text x="100" y="370" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">import</tspan> { createTokenManager, createGSCClient,</text>
  <text x="100" y="389" class="font-mono" font-size="13" fill="#0f172a">  querySearchAnalyticsAll } <tspan fill="#7c3aed">from</tspan> <tspan fill="#16a34a">'@power-seo/search-console'</tspan>;</text>
  <text x="100" y="416" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> client = <tspan fill="#2563eb">createGSCClient</tspan>({</text>
  <text x="100" y="435" class="font-mono" font-size="13" fill="#0f172a">  siteUrl: <tspan fill="#16a34a">'sc-domain:example.com'</tspan>,</text>
  <text x="100" y="454" class="font-mono" font-size="13" fill="#0f172a">  auth: tokenManager,</text>
  <text x="100" y="473" class="font-mono" font-size="13" fill="#0f172a">});</text>
  <text x="100" y="500" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> rows = <tspan fill="#7c3aed">await</tspan> <tspan fill="#2563eb">querySearchAnalyticsAll</tspan>(client, {</text>
  <text x="100" y="519" class="font-mono" font-size="13" fill="#0f172a">  startDate: <tspan fill="#16a34a">'2026-01-01'</tspan>, endDate: <tspan fill="#16a34a">'2026-01-31'</tspan>,</text>
  <text x="100" y="538" class="font-mono" font-size="13" fill="#0f172a">  dimensions: [<tspan fill="#16a34a">'query'</tspan>, <tspan fill="#16a34a">'page'</tspan>] });</text>
  <text x="100" y="562" class="font-mono" font-size="12" fill="#94a3b8">// SearchAnalyticsRow[] — keys, clicks, impressions, ctr, position</text>

  <!-- Right card: results table -->
  <rect x="648" y="310" width="472" height="264" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="668" y="338" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Search Analytics</text>
  <rect x="1004" y="322" width="98" height="22" rx="11" fill="#dcfce7"/>
  <text x="1053" y="337" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">68,540 rows</text>
  <rect x="648" y="352" width="472" height="28" fill="#f8fafc"/>
  <text x="668" y="371" class="font-ui" font-size="12" font-weight="600" fill="#64748b">QUERY</text>
  <text x="900" y="371" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">CLICKS</text>
  <text x="990" y="371" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">CTR</text>
  <text x="1096" y="371" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">POSITION</text>
  <line x1="648" y1="380" x2="1120" y2="380" stroke="#e2e8f0"/>
  <text x="668" y="404" class="font-ui" font-size="13" fill="#0f172a">nextjs seo checklist</text>
  <text x="900" y="404" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">1,284</text>
  <text x="990" y="404" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">6.1%</text>
  <text x="1096" y="404" class="font-ui" font-size="13" fill="#16a34a" text-anchor="end">3.2</text>
  <line x1="648" y1="414" x2="1120" y2="414" stroke="#e2e8f0"/>
  <text x="668" y="438" class="font-ui" font-size="13" fill="#0f172a">react meta tags</text>
  <text x="900" y="438" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">946</text>
  <text x="990" y="438" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">4.8%</text>
  <text x="1096" y="438" class="font-ui" font-size="13" fill="#16a34a" text-anchor="end">4.7</text>
  <line x1="648" y1="448" x2="1120" y2="448" stroke="#e2e8f0"/>
  <text x="668" y="472" class="font-ui" font-size="13" fill="#0f172a">json-ld generator</text>
  <text x="900" y="472" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">713</text>
  <text x="990" y="472" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">3.9%</text>
  <text x="1096" y="472" class="font-ui" font-size="13" fill="#f59e0b" text-anchor="end">8.4</text>
  <line x1="648" y1="482" x2="1120" y2="482" stroke="#e2e8f0"/>
  <text x="668" y="506" class="font-ui" font-size="13" fill="#0f172a">xml sitemap best practices</text>
  <text x="900" y="506" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">522</text>
  <text x="990" y="506" class="font-ui" font-size="13" fill="#0f172a" text-anchor="end">2.7%</text>
  <text x="1096" y="506" class="font-ui" font-size="13" fill="#f59e0b" text-anchor="end">11.6</text>
  <line x1="648" y1="516" x2="1120" y2="516" stroke="#e2e8f0"/>
  <text x="668" y="546" class="font-ui" font-size="12" fill="#94a3b8">Jan 1 – Jan 31, 2026 · dimensions: query, page · searchType: web</text>
</svg>
