<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>Banner for @power-seo/search-console, a typed Google Search Console API client with OAuth2, service account auth, and auto-paginated search analytics</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- Left: branding -->
  <rect x="56" y="52" width="44" height="44" rx="10" fill="#2563eb"/>
  <path d="M70 74 a8 8 0 1 1 11.3 7.3 M84 84 l7 7" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="114" y="80" class="font-ui" font-size="15" font-weight="600" fill="#64748b">@power-seo</text>
  <text x="56" y="146" class="font-ui" font-size="38" font-weight="700" fill="#0f172a">search-console</text>
  <text x="56" y="178" class="font-ui" font-size="16" fill="#64748b">Typed Google Search Console client — OAuth2, service accounts,</text>
  <text x="56" y="200" class="font-ui" font-size="16" fill="#64748b">auto-paginated analytics, URL inspection, sitemap management.</text>

  <rect x="56" y="220" width="182" height="26" rx="13" fill="#dbeafe"/>
  <text x="147" y="237" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="248" y="220" width="116" height="26" rx="13" fill="#dcfce7"/>
  <text x="306" y="237" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">TypeScript-first</text>
  <rect x="374" y="220" width="118" height="26" rx="13" fill="#f1f5f9"/>
  <text x="433" y="237" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Node.js 18+</text>

  <!-- Right: code card vignette -->
  <rect x="700" y="36" width="524" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M700 44 a8 8 0 0 1 8-8 h508 a8 8 0 0 1 8 8 v28 h-524 z" fill="#f8fafc"/>
  <line x1="700" y1="72" x2="1224" y2="72" stroke="#e2e8f0"/>
  <text x="720" y="59" class="font-mono" font-size="12" fill="#64748b">gsc-report.ts</text>
  <rect x="1152" y="44" width="56" height="20" rx="10" fill="#dcfce7"/>
  <text x="1180" y="58" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">typed</text>

  <text x="720" y="96" class="font-mono" font-size="12.5" fill="#0f172a"><tspan fill="#7c3aed">import</tspan> { createGSCClient, querySearchAnalyticsAll }</text>
  <text x="720" y="114" class="font-mono" font-size="12.5" fill="#0f172a">  <tspan fill="#7c3aed">from</tspan> <tspan fill="#16a34a">'@power-seo/search-console'</tspan>;</text>
  <text x="720" y="140" class="font-mono" font-size="12.5" fill="#0f172a"><tspan fill="#7c3aed">const</tspan> rows = <tspan fill="#7c3aed">await</tspan> <tspan fill="#2563eb">querySearchAnalyticsAll</tspan>(client, {</text>
  <text x="720" y="158" class="font-mono" font-size="12.5" fill="#0f172a">  startDate: <tspan fill="#16a34a">'2026-01-01'</tspan>, endDate: <tspan fill="#16a34a">'2026-01-31'</tspan>,</text>
  <text x="720" y="176" class="font-mono" font-size="12.5" fill="#0f172a">  dimensions: [<tspan fill="#16a34a">'query'</tspan>, <tspan fill="#16a34a">'page'</tspan>],</text>
  <text x="720" y="194" class="font-mono" font-size="12.5" fill="#0f172a">});</text>
  <text x="720" y="220" class="font-mono" font-size="12.5" fill="#94a3b8">// all pages merged past the 25,000-row API limit</text>
</svg>
