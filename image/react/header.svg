<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>power-seo react header graphic showing a JSX SEO component compiled into complete document head tags with DefaultSEO title template merging</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- hero heading -->
  <rect x="60" y="56" width="44" height="44" rx="10" fill="#2563eb"/>
  <text x="82" y="85" class="font-mono" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  <text x="118" y="80" class="font-ui" font-size="32" font-weight="700" fill="#0f172a">@power-seo/react</text>
  <text x="60" y="136" class="font-ui" font-size="17" fill="#64748b">One composable component API for every SEO head tag — no react-helmet, no lock-in.</text>

  <!-- feature badges -->
  <rect x="60" y="158" width="184" height="26" rx="13" fill="#dcfce7"/>
  <text x="152" y="176" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Zero third-party dependencies</text>
  <rect x="252" y="158" width="150" height="26" rx="13" fill="#dbeafe"/>
  <text x="327" y="176" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">React 19 native hoisting</text>
  <rect x="410" y="158" width="128" height="26" rx="13" fill="#dbeafe"/>
  <text x="474" y="176" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript-first</text>
  <rect x="546" y="158" width="122" height="26" rx="13" fill="#dbeafe"/>
  <text x="607" y="176" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Tree-shakeable</text>

  <!-- left card: app code -->
  <rect x="60" y="212" width="520" height="370" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="242" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">App.tsx</text>
  <rect x="494" y="226" width="66" height="22" rx="11" fill="#f1f5f9"/>
  <text x="527" y="241" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">JSX</text>
  <line x1="60" y1="256" x2="580" y2="256" stroke="#e2e8f0"/>
  <text x="84" y="284" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">import</tspan> { DefaultSEO, SEO } <tspan fill="#7c3aed">from</tspan> <tspan fill="#16a34a">'@power-seo/react'</tspan>;</text>
  <text x="84" y="314" class="font-mono" font-size="13" fill="#0f172a">&lt;<tspan fill="#2563eb">DefaultSEO</tspan></text>
  <text x="104" y="336" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">titleTemplate</tspan>=<tspan fill="#16a34a">"%s | My Site"</tspan></text>
  <text x="104" y="358" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">defaultTitle</tspan>=<tspan fill="#16a34a">"My Site"</tspan></text>
  <text x="104" y="380" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">openGraph</tspan>={{ <tspan fill="#7c3aed">type</tspan>: <tspan fill="#16a34a">'website'</tspan>, <tspan fill="#7c3aed">siteName</tspan>: <tspan fill="#16a34a">'My Site'</tspan> }}</text>
  <text x="104" y="402" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">twitter</tspan>={{ <tspan fill="#7c3aed">cardType</tspan>: <tspan fill="#16a34a">'summary_large_image'</tspan> }}&gt;</text>
  <text x="84" y="432" class="font-mono" font-size="13" fill="#0f172a">  &lt;<tspan fill="#2563eb">SEO</tspan></text>
  <text x="118" y="454" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">title</tspan>=<tspan fill="#16a34a">"Pricing"</tspan></text>
  <text x="118" y="476" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">description</tspan>=<tspan fill="#16a34a">"Plans that scale with you."</tspan></text>
  <text x="118" y="498" class="font-mono" font-size="13" fill="#0f172a"><tspan fill="#7c3aed">canonical</tspan>=<tspan fill="#16a34a">"https://example.com/pricing"</tspan> /&gt;</text>
  <text x="84" y="528" class="font-mono" font-size="13" fill="#0f172a">&lt;/<tspan fill="#2563eb">DefaultSEO</tspan>&gt;</text>
  <text x="84" y="560" class="font-mono" font-size="12" fill="#94a3b8">// page config merges over site-wide defaults</text>

  <!-- arrow between cards -->
  <line x1="592" y1="397" x2="632" y2="397" stroke="#2563eb" stroke-width="2"/>
  <path d="M 632 397 l -8 -5 v 10 z" fill="#2563eb"/>

  <!-- right card: rendered head -->
  <rect x="644" y="212" width="496" height="370" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="668" y="242" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Rendered &lt;head&gt;</text>
  <rect x="1032" y="226" width="88" height="22" rx="11" fill="#dcfce7"/>
  <text x="1076" y="241" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">All tags set</text>
  <line x1="644" y1="256" x2="1140" y2="256" stroke="#e2e8f0"/>

  <text x="668" y="286" class="font-mono" font-size="13" fill="#0f172a">&lt;title&gt;<tspan fill="#2563eb">Pricing | My Site</tspan>&lt;/title&gt;</text>
  <text x="668" y="314" class="font-mono" font-size="13" fill="#0f172a">&lt;meta name="description"</text>
  <text x="690" y="334" class="font-mono" font-size="13" fill="#64748b">content="Plans that scale with you."&gt;</text>
  <text x="668" y="362" class="font-mono" font-size="13" fill="#0f172a">&lt;link rel="canonical"</text>
  <text x="690" y="382" class="font-mono" font-size="13" fill="#64748b">href="https://example.com/pricing"&gt;</text>
  <text x="668" y="410" class="font-mono" font-size="13" fill="#0f172a">&lt;meta property="og:site_name" content="My Site"&gt;</text>
  <text x="668" y="438" class="font-mono" font-size="13" fill="#0f172a">&lt;meta property="og:type" content="website"&gt;</text>
  <text x="668" y="466" class="font-mono" font-size="13" fill="#0f172a">&lt;meta name="twitter:card"</text>
  <text x="690" y="486" class="font-mono" font-size="13" fill="#64748b">content="summary_large_image"&gt;</text>

  <line x1="668" y1="508" x2="1116" y2="508" stroke="#e2e8f0"/>
  <circle cx="676" cy="534" r="7" fill="#dcfce7"/>
  <path d="M 672.5 534 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="692" y="538" class="font-ui" font-size="12" fill="#64748b">Title resolved via resolveTitle() with titleTemplate</text>
  <circle cx="676" cy="560" r="7" fill="#dcfce7"/>
  <path d="M 672.5 560 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="692" y="564" class="font-ui" font-size="12" fill="#64748b">Meta and link tags built by buildMetaTags() / buildLinkTags()</text>
</svg>
