<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>App mockup of a head tag inspector showing the SEO component props on the left and each rendered meta and link tag with its source prop on the right</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <rect x="16" y="16" width="24" height="24" rx="6" fill="#2563eb"/>
  <text x="28" y="33" class="font-mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  <text x="48" y="33" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">power-seo</text>
  <text x="16" y="72" class="font-ui" font-size="13" fill="#64748b">Overview</text>
  <rect x="8" y="86" width="164" height="30" rx="6" fill="#dbeafe"/>
  <text x="16" y="106" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Head Tags</text>
  <text x="16" y="140" class="font-ui" font-size="13" fill="#64748b">Open Graph</text>
  <text x="16" y="170" class="font-ui" font-size="13" fill="#64748b">Twitter Card</text>
  <text x="16" y="200" class="font-ui" font-size="13" fill="#64748b">Hreflang</text>
  <text x="16" y="230" class="font-ui" font-size="13" fill="#64748b">Breadcrumbs</text>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Head Tag Inspector</text>
  <rect x="756" y="11" width="120" height="30" rx="6" fill="#2563eb"/>
  <text x="816" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Inspect &lt;head&gt;</text>

  <!-- left card: component props -->
  <rect x="204" y="72" width="308" height="404" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="222" y="100" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">&lt;SEO&gt; props</text>
  <rect x="428" y="84" width="66" height="22" rx="11" fill="#f1f5f9"/>
  <text x="461" y="99" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">page.tsx</text>
  <line x1="204" y1="112" x2="512" y2="112" stroke="#e2e8f0"/>

  <text x="222" y="140" class="font-ui" font-size="11" font-weight="600" fill="#64748b">TITLE</text>
  <rect x="222" y="150" width="272" height="30" rx="6" fill="#f1f5f9"/>
  <text x="232" y="169" class="font-ui" font-size="13" fill="#0f172a">Summer Collection 2026</text>

  <text x="222" y="204" class="font-ui" font-size="11" font-weight="600" fill="#64748b">TITLE TEMPLATE (DefaultSEO)</text>
  <rect x="222" y="214" width="272" height="30" rx="6" fill="#f1f5f9"/>
  <text x="232" y="233" class="font-mono" font-size="12" fill="#64748b">%s | Northwind Store</text>

  <text x="222" y="268" class="font-ui" font-size="11" font-weight="600" fill="#64748b">DESCRIPTION</text>
  <rect x="222" y="278" width="272" height="30" rx="6" fill="#f1f5f9"/>
  <text x="232" y="297" class="font-ui" font-size="12" fill="#64748b">New arrivals for the 2026 season.</text>

  <text x="222" y="332" class="font-ui" font-size="11" font-weight="600" fill="#64748b">CANONICAL</text>
  <rect x="222" y="342" width="272" height="30" rx="6" fill="#f1f5f9"/>
  <text x="232" y="361" class="font-mono" font-size="11" fill="#64748b">https://northwind.shop/summer</text>

  <text x="222" y="396" class="font-ui" font-size="11" font-weight="600" fill="#64748b">ROBOTS</text>
  <rect x="222" y="406" width="106" height="26" rx="13" fill="#dcfce7"/>
  <text x="275" y="423" class="font-mono" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">index, follow</text>
  <rect x="336" y="406" width="130" height="26" rx="13" fill="#f1f5f9"/>
  <text x="401" y="423" class="font-mono" font-size="11" fill="#64748b" text-anchor="middle">max-snippet: 160</text>
  <text x="222" y="460" class="font-mono" font-size="11" fill="#94a3b8">// merged via useDefaultSEO()</text>

  <!-- right card: rendered tags table -->
  <rect x="532" y="72" width="344" height="404" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="550" y="100" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Rendered in &lt;head&gt;</text>
  <rect x="784" y="84" width="74" height="22" rx="11" fill="#dcfce7"/>
  <text x="821" y="99" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">7 tags</text>
  <line x1="532" y1="112" x2="876" y2="112" stroke="#e2e8f0"/>

  <circle cx="556" cy="136" r="7" fill="#dcfce7"/>
  <path d="M 552.5 136 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="572" y="133" class="font-mono" font-size="11" fill="#0f172a">&lt;title&gt;Summer Collection 2026 |</text>
  <text x="572" y="147" class="font-mono" font-size="11" fill="#0f172a">Northwind Store&lt;/title&gt;</text>
  <line x1="550" y1="160" x2="858" y2="160" stroke="#e2e8f0"/>

  <circle cx="556" cy="184" r="7" fill="#dcfce7"/>
  <path d="M 552.5 184 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="572" y="181" class="font-mono" font-size="11" fill="#0f172a">&lt;meta name="description"</text>
  <text x="572" y="195" class="font-mono" font-size="11" fill="#64748b">content="New arrivals for..."&gt;</text>
  <line x1="550" y1="208" x2="858" y2="208" stroke="#e2e8f0"/>

  <circle cx="556" cy="232" r="7" fill="#dcfce7"/>
  <path d="M 552.5 232 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="572" y="229" class="font-mono" font-size="11" fill="#0f172a">&lt;link rel="canonical"</text>
  <text x="572" y="243" class="font-mono" font-size="11" fill="#64748b">href="https://northwind.shop/summer"&gt;</text>
  <line x1="550" y1="256" x2="858" y2="256" stroke="#e2e8f0"/>

  <circle cx="556" cy="280" r="7" fill="#dcfce7"/>
  <path d="M 552.5 280 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="572" y="277" class="font-mono" font-size="11" fill="#0f172a">&lt;meta name="robots" content=</text>
  <text x="572" y="291" class="font-mono" font-size="11" fill="#64748b">"index, follow, max-snippet:160"&gt;</text>
  <line x1="550" y1="304" x2="858" y2="304" stroke="#e2e8f0"/>

  <circle cx="556" cy="328" r="7" fill="#dcfce7"/>
  <path d="M 552.5 328 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="572" y="325" class="font-mono" font-size="11" fill="#0f172a">&lt;meta property="og:title"</text>
  <text x="572" y="339" class="font-mono" font-size="11" fill="#64748b">content="Summer Collection 2026"&gt;</text>
  <line x1="550" y1="352" x2="858" y2="352" stroke="#e2e8f0"/>

  <circle cx="556" cy="376" r="7" fill="#dcfce7"/>
  <path d="M 552.5 376 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="572" y="373" class="font-mono" font-size="11" fill="#0f172a">&lt;meta property="og:image"</text>
  <text x="572" y="387" class="font-mono" font-size="11" fill="#64748b">content=".../summer-og.jpg"&gt;</text>
  <line x1="550" y1="400" x2="858" y2="400" stroke="#e2e8f0"/>

  <circle cx="556" cy="424" r="7" fill="#dcfce7"/>
  <path d="M 552.5 424 l 2.5 2.5 l 4.5 -5" stroke="#16a34a" stroke-width="1.6" fill="none"/>
  <text x="572" y="421" class="font-mono" font-size="11" fill="#0f172a">&lt;meta name="twitter:card"</text>
  <text x="572" y="435" class="font-mono" font-size="11" fill="#64748b">content="summary_large_image"&gt;</text>

  <text x="550" y="464" class="font-ui" font-size="11" fill="#94a3b8">Built by buildMetaTags() and buildLinkTags() from @power-seo/core</text>
</svg>
