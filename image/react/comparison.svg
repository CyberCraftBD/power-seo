<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix of power-seo react against next-seo, react-helmet and react-helmet-async covering robots directives, hreflang, JSON-LD breadcrumbs and React 19 support</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">React SEO Library Comparison</text>

  <!-- table card -->
  <rect x="40" y="64" width="820" height="404" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- header row -->
  <rect x="41" y="65" width="818" height="42" rx="7" fill="#f8fafc"/>
  <line x1="40" y1="107" x2="860" y2="107" stroke="#e2e8f0"/>
  <text x="64" y="91" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FEATURE</text>
  <rect x="330" y="74" width="146" height="24" rx="12" fill="#dbeafe"/>
  <text x="403" y="90" class="font-ui" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">@power-seo/react</text>
  <text x="547" y="91" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">next-seo</text>
  <text x="672" y="91" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">react-helmet</text>
  <text x="792" y="91" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">helmet-async</text>

  <!-- highlight column -->
  <rect x="343" y="107" width="120" height="360" fill="#dbeafe" opacity="0.25"/>

  <!-- row separators -->
  <line x1="40" y1="152" x2="860" y2="152" stroke="#e2e8f0"/>
  <line x1="40" y1="197" x2="860" y2="197" stroke="#e2e8f0"/>
  <line x1="40" y1="242" x2="860" y2="242" stroke="#e2e8f0"/>
  <line x1="40" y1="287" x2="860" y2="287" stroke="#e2e8f0"/>
  <line x1="40" y1="332" x2="860" y2="332" stroke="#e2e8f0"/>
  <line x1="40" y1="377" x2="860" y2="377" stroke="#e2e8f0"/>
  <line x1="40" y1="422" x2="860" y2="422" stroke="#e2e8f0"/>

  <!-- row labels -->
  <text x="64" y="134" class="font-ui" font-size="13" fill="#0f172a">Typed robots directives</text>
  <text x="64" y="179" class="font-ui" font-size="13" fill="#0f172a">DefaultSEO context pattern</text>
  <text x="64" y="224" class="font-ui" font-size="13" fill="#0f172a">Hreflang alternates + x-default</text>
  <text x="64" y="269" class="font-ui" font-size="13" fill="#0f172a">Breadcrumb with JSON-LD</text>
  <text x="64" y="314" class="font-ui" font-size="13" fill="#0f172a">No third-party runtime deps</text>
  <text x="64" y="359" class="font-ui" font-size="13" fill="#0f172a">React 19 native head hoisting</text>
  <text x="64" y="404" class="font-ui" font-size="13" fill="#0f172a">Tree-shakeable</text>
  <text x="64" y="449" class="font-ui" font-size="13" fill="#0f172a">Works in Vite / Gatsby / CRA</text>

  <!-- marks: col centers 403, 547, 672, 792 ; row baselines 134,179,224,269,314,359,404,449 -->
  <!-- power-seo column: all check -->
  <g stroke="#16a34a" stroke-width="2.2" fill="none">
    <path d="M 396 128 l 5 5 l 9 -10"/>
    <path d="M 396 173 l 5 5 l 9 -10"/>
    <path d="M 396 218 l 5 5 l 9 -10"/>
    <path d="M 396 263 l 5 5 l 9 -10"/>
    <path d="M 396 308 l 5 5 l 9 -10"/>
    <path d="M 396 353 l 5 5 l 9 -10"/>
    <path d="M 396 398 l 5 5 l 9 -10"/>
    <path d="M 396 443 l 5 5 l 9 -10"/>
  </g>
  <!-- next-seo -->
  <g stroke="#16a34a" stroke-width="2.2" fill="none">
    <path d="M 540 128 l 5 5 l 9 -10"/>
    <path d="M 540 173 l 5 5 l 9 -10"/>
    <path d="M 540 218 l 5 5 l 9 -10"/>
    <path d="M 540 263 l 5 5 l 9 -10"/>
  </g>
  <text x="547" y="314" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="547" y="359" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="547" y="403" class="font-ui" font-size="12" fill="#b45309" text-anchor="middle">Partial</text>
  <text x="547" y="449" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <!-- react-helmet -->
  <text x="672" y="134" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="672" y="179" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="672" y="224" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="672" y="269" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="672" y="314" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="672" y="359" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="672" y="404" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <path d="M 665 443 l 5 5 l 9 -10" stroke="#16a34a" stroke-width="2.2" fill="none"/>
  <!-- react-helmet-async -->
  <text x="792" y="134" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="792" y="179" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="792" y="224" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="792" y="269" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="792" y="314" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="792" y="359" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <text x="792" y="404" class="font-ui" font-size="14" fill="#94a3b8" text-anchor="middle">—</text>
  <path d="M 785 443 l 5 5 l 9 -10" stroke="#16a34a" stroke-width="2.2" fill="none"/>

  <text x="450" y="490" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Robots directives include max-snippet, max-image-preview, max-video-preview and unavailable_after</text>
</svg>
