<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Grid of the eight power-seo react components showing the exact head tags each one renders, from SEO and DefaultSEO to Breadcrumb with JSON-LD</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Eight components. Every SEO head tag.</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Import only what you use — each component renders real tags straight to the DOM.</text>

  <!-- row 1 -->
  <rect x="40" y="88" width="196" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="58" y="116" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;SEO /&gt;</text>
  <text x="58" y="140" class="font-ui" font-size="12" fill="#64748b">All-in-one: title, meta,</text>
  <text x="58" y="156" class="font-ui" font-size="12" fill="#64748b">canonical, OG, Twitter</text>
  <rect x="58" y="172" width="160" height="48" rx="6" fill="#f1f5f9"/>
  <text x="66" y="190" class="font-mono" font-size="10" fill="#0f172a">&lt;title&gt;...&lt;/title&gt;</text>
  <text x="66" y="206" class="font-mono" font-size="10" fill="#0f172a">&lt;meta name="description"&gt;</text>

  <rect x="252" y="88" width="196" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="270" y="116" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;DefaultSEO&gt;</text>
  <text x="270" y="140" class="font-ui" font-size="12" fill="#64748b">Site-wide defaults via</text>
  <text x="270" y="156" class="font-ui" font-size="12" fill="#64748b">SEOContext at app root</text>
  <rect x="270" y="172" width="160" height="48" rx="6" fill="#f1f5f9"/>
  <text x="278" y="190" class="font-mono" font-size="10" fill="#0f172a">titleTemplate=</text>
  <text x="278" y="206" class="font-mono" font-size="10" fill="#16a34a">"%s | My Site"</text>

  <rect x="464" y="88" width="196" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="482" y="116" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;OpenGraph /&gt;</text>
  <text x="482" y="140" class="font-ui" font-size="12" fill="#64748b">og:title, og:image with</text>
  <text x="482" y="156" class="font-ui" font-size="12" fill="#64748b">width/height/alt, article:*</text>
  <rect x="482" y="172" width="160" height="48" rx="6" fill="#f1f5f9"/>
  <text x="490" y="190" class="font-mono" font-size="10" fill="#0f172a">&lt;meta property="og:image"</text>
  <text x="490" y="206" class="font-mono" font-size="10" fill="#0f172a">content="...jpg"&gt;</text>

  <rect x="676" y="88" width="184" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="694" y="116" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;TwitterCard /&gt;</text>
  <text x="694" y="140" class="font-ui" font-size="12" fill="#64748b">summary, summary_large_</text>
  <text x="694" y="156" class="font-ui" font-size="12" fill="#64748b">image, app, player</text>
  <rect x="694" y="172" width="148" height="48" rx="6" fill="#f1f5f9"/>
  <text x="702" y="190" class="font-mono" font-size="10" fill="#0f172a">&lt;meta name=</text>
  <text x="702" y="206" class="font-mono" font-size="10" fill="#0f172a">"twitter:card" ...&gt;</text>

  <!-- row 2 -->
  <rect x="40" y="254" width="196" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="58" y="282" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;Canonical /&gt;</text>
  <text x="58" y="306" class="font-ui" font-size="12" fill="#64748b">Base URL resolution and</text>
  <text x="58" y="322" class="font-ui" font-size="12" fill="#64748b">trailing slash control</text>
  <rect x="58" y="338" width="160" height="48" rx="6" fill="#f1f5f9"/>
  <text x="66" y="356" class="font-mono" font-size="10" fill="#0f172a">&lt;link rel="canonical"</text>
  <text x="66" y="372" class="font-mono" font-size="10" fill="#0f172a">href="https://..."&gt;</text>

  <rect x="252" y="254" width="196" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="270" y="282" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;Robots /&gt;</text>
  <text x="270" y="306" class="font-ui" font-size="12" fill="#64748b">All 10 directives as typed</text>
  <text x="270" y="322" class="font-ui" font-size="12" fill="#64748b">props — no string typos</text>
  <rect x="270" y="338" width="160" height="48" rx="6" fill="#f1f5f9"/>
  <text x="278" y="356" class="font-mono" font-size="10" fill="#0f172a">noindex, nosnippet,</text>
  <text x="278" y="372" class="font-mono" font-size="10" fill="#0f172a">max-image-preview ...</text>

  <rect x="464" y="254" width="196" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="482" y="282" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;Hreflang /&gt;</text>
  <text x="482" y="306" class="font-ui" font-size="12" fill="#64748b">Alternate links per locale</text>
  <text x="482" y="322" class="font-ui" font-size="12" fill="#64748b">including x-default</text>
  <rect x="482" y="338" width="160" height="48" rx="6" fill="#f1f5f9"/>
  <text x="490" y="356" class="font-mono" font-size="10" fill="#0f172a">&lt;link rel="alternate"</text>
  <text x="490" y="372" class="font-mono" font-size="10" fill="#0f172a">hreflang="de-DE" ...&gt;</text>

  <rect x="676" y="254" width="184" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="694" y="282" class="font-mono" font-size="13" font-weight="600" fill="#2563eb">&lt;Breadcrumb /&gt;</text>
  <text x="694" y="306" class="font-ui" font-size="12" fill="#64748b">Visible nav + embedded</text>
  <text x="694" y="322" class="font-ui" font-size="12" fill="#64748b">BreadcrumbList JSON-LD</text>
  <rect x="694" y="338" width="148" height="48" rx="6" fill="#f1f5f9"/>
  <text x="702" y="356" class="font-mono" font-size="10" fill="#0f172a">&lt;script type=</text>
  <text x="702" y="372" class="font-mono" font-size="10" fill="#0f172a">"application/ld+json"&gt;</text>

  <!-- footer -->
  <rect x="40" y="424" width="820" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="66" cy="448" r="8" fill="#dcfce7"/>
  <path d="M 62 448 l 3 3 l 5 -6" stroke="#16a34a" stroke-width="1.8" fill="none"/>
  <text x="84" y="453" class="font-ui" font-size="12" fill="#64748b">Utilities <tspan class="font-mono" fill="#2563eb">renderMetaTags()</tspan> and <tspan class="font-mono" fill="#2563eb">renderLinkTags()</tspan> convert @power-seo/core tag arrays into React elements</text>
</svg>
