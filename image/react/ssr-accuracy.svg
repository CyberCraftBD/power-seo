<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Server-side rendering accuracy illustration showing power-seo react head tags present in the raw HTML response before any JavaScript executes</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">SEO tags in the HTML — before JavaScript runs</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Components render plain &lt;title&gt;, &lt;meta&gt; and &lt;link&gt; elements, so SSR output contains every tag.</text>

  <!-- left: server response -->
  <rect x="40" y="88" width="440" height="382" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="116" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Server response</text>
  <rect x="352" y="98" width="110" height="24" rx="12" fill="#dbeafe"/>
  <text x="407" y="114" class="font-mono" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">view-source</text>
  <line x1="40" y1="130" x2="480" y2="130" stroke="#e2e8f0"/>

  <rect x="60" y="146" width="400" height="304" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="172" class="font-mono" font-size="12" fill="#94a3b8">1  &lt;!doctype html&gt;</text>
  <text x="76" y="194" class="font-mono" font-size="12" fill="#94a3b8">2  &lt;html lang="en"&gt;</text>
  <text x="76" y="216" class="font-mono" font-size="12" fill="#94a3b8">3  &lt;head&gt;</text>
  <rect x="68" y="226" width="384" height="20" rx="4" fill="#dbeafe" opacity="0.5"/>
  <text x="76" y="240" class="font-mono" font-size="12" fill="#0f172a">4    &lt;title&gt;Docs | Acme&lt;/title&gt;</text>
  <rect x="68" y="250" width="384" height="20" rx="4" fill="#dbeafe" opacity="0.5"/>
  <text x="76" y="264" class="font-mono" font-size="12" fill="#0f172a">5    &lt;meta name="description" ...&gt;</text>
  <rect x="68" y="274" width="384" height="20" rx="4" fill="#dbeafe" opacity="0.5"/>
  <text x="76" y="288" class="font-mono" font-size="12" fill="#0f172a">6    &lt;link rel="canonical" ...&gt;</text>
  <rect x="68" y="298" width="384" height="20" rx="4" fill="#dbeafe" opacity="0.5"/>
  <text x="76" y="312" class="font-mono" font-size="12" fill="#0f172a">7    &lt;meta property="og:title" ...&gt;</text>
  <rect x="68" y="322" width="384" height="20" rx="4" fill="#dbeafe" opacity="0.5"/>
  <text x="76" y="336" class="font-mono" font-size="12" fill="#0f172a">8    &lt;meta name="twitter:card" ...&gt;</text>
  <rect x="68" y="346" width="384" height="20" rx="4" fill="#dbeafe" opacity="0.5"/>
  <text x="76" y="360" class="font-mono" font-size="12" fill="#0f172a">9    &lt;link rel="alternate" hreflang ...&gt;</text>
  <text x="76" y="384" class="font-mono" font-size="12" fill="#94a3b8">10 &lt;/head&gt;</text>
  <text x="76" y="406" class="font-mono" font-size="12" fill="#94a3b8">11 &lt;body&gt;...</text>
  <text x="76" y="434" class="font-mono" font-size="11" fill="#16a34a">// all SEO tags present in raw HTML</text>

  <!-- right: how it works -->
  <rect x="500" y="88" width="360" height="382" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="520" y="116" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Why it stays accurate</text>
  <line x1="500" y1="130" x2="860" y2="130" stroke="#e2e8f0"/>

  <circle cx="532" cy="160" r="9" fill="#dcfce7"/>
  <path d="M 527.5 160 l 3 3 l 6 -7" stroke="#16a34a" stroke-width="1.8" fill="none"/>
  <text x="552" y="156" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Plain DOM elements</text>
  <text x="552" y="174" class="font-ui" font-size="12" fill="#64748b">No react-helmet side-effect store —</text>
  <text x="552" y="190" class="font-ui" font-size="12" fill="#64748b">tags are regular React output</text>

  <circle cx="532" cy="226" r="9" fill="#dcfce7"/>
  <path d="M 527.5 226 l 3 3 l 6 -7" stroke="#16a34a" stroke-width="1.8" fill="none"/>
  <text x="552" y="222" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">React 19 native hoisting</text>
  <text x="552" y="240" class="font-ui" font-size="12" fill="#64748b">&lt;title&gt;, &lt;meta&gt;, &lt;link&gt; hoist to</text>
  <text x="552" y="256" class="font-ui" font-size="12" fill="#64748b">&lt;head&gt; automatically on the server</text>

  <circle cx="532" cy="292" r="9" fill="#dcfce7"/>
  <path d="M 527.5 292 l 3 3 l 6 -7" stroke="#16a34a" stroke-width="1.8" fill="none"/>
  <text x="552" y="288" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">React 18 framework Heads</text>
  <text x="552" y="306" class="font-ui" font-size="12" fill="#64748b">Works inside next/head and other</text>
  <text x="552" y="322" class="font-ui" font-size="12" fill="#64748b">framework Head components</text>

  <circle cx="532" cy="358" r="9" fill="#dcfce7"/>
  <path d="M 527.5 358 l 3 3 l 6 -7" stroke="#16a34a" stroke-width="1.8" fill="none"/>
  <text x="552" y="354" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">No hydration mismatch</text>
  <text x="552" y="372" class="font-ui" font-size="12" fill="#64748b">Same buildMetaTags() output on</text>
  <text x="552" y="388" class="font-ui" font-size="12" fill="#64748b">server and client</text>

  <rect x="520" y="412" width="320" height="38" rx="6" fill="#dcfce7"/>
  <text x="680" y="435" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Crawlers read every tag without executing JS</text>
</svg>
