<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>@power-seo/schema banner: type-safe JSON-LD structured data builders and React components for schema.org markup</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- left: branding -->
  <rect x="56" y="52" width="44" height="44" rx="10" fill="#2563eb"/>
  <text x="78" y="82" class="font-mono" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">{ }</text>
  <text x="114" y="83" class="font-ui" font-size="30" font-weight="700" fill="#0f172a">@power-seo/schema</text>

  <text x="58" y="134" class="font-ui" font-size="17" fill="#64748b">Type-safe JSON-LD structured data for TypeScript and React —</text>
  <text x="58" y="160" class="font-ui" font-size="17" fill="#64748b">23 schema.org builders, 22 React components, @graph support, field validation.</text>

  <!-- feature pills -->
  <rect x="58" y="188" width="132" height="26" rx="13" fill="#dbeafe"/>
  <text x="124" y="205" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">23 schema types</text>
  <rect x="200" y="188" width="128" height="26" rx="13" fill="#dcfce7"/>
  <text x="264" y="205" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">validateSchema()</text>
  <rect x="338" y="188" width="118" height="26" rx="13" fill="#dbeafe"/>
  <text x="397" y="205" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">schemaGraph()</text>
  <rect x="466" y="188" width="118" height="26" rx="13" fill="#f1f5f9"/>
  <text x="525" y="205" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Tree-shakeable</text>

  <!-- right: code card vignette -->
  <rect x="700" y="36" width="524" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M700 44 a8 8 0 0 1 8-8 h508 a8 8 0 0 1 8 8 v28 h-524 z" fill="#f8fafc"/>
  <line x1="700" y1="72" x2="1224" y2="72" stroke="#e2e8f0"/>
  <text x="720" y="59" class="font-mono" font-size="12" fill="#64748b">article.ts</text>
  <rect x="1128" y="44" width="82" height="20" rx="10" fill="#dcfce7"/>
  <text x="1169" y="58" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">valid: true</text>

  <text x="720" y="98" class="font-mono" font-size="13"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { article, toJsonLdString } </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#16a34a"> '@power-seo/schema'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="720" y="124" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> schema = </tspan><tspan fill="#2563eb">article</tspan><tspan fill="#0f172a">({</tspan></text>
  <text x="740" y="150" class="font-mono" font-size="13"><tspan fill="#0f172a">headline: </tspan><tspan fill="#16a34a">'My Blog Post'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="740" y="176" class="font-mono" font-size="13"><tspan fill="#0f172a">datePublished: </tspan><tspan fill="#16a34a">'2026-01-15'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="740" y="202" class="font-mono" font-size="13"><tspan fill="#0f172a">author: { name: </tspan><tspan fill="#16a34a">'Jane Doe'</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="720" y="228" class="font-mono" font-size="13"><tspan fill="#0f172a">}); </tspan><tspan fill="#94a3b8">// fully typed, tree-shakeable</tspan></text>
</svg>
