<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Google rich result previews produced by @power-seo/schema builders: product stars, FAQ accordion, and breadcrumb trail</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">From builder function to rich result</text>
  <text x="450" y="66" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Each schema type unlocks a different search result enhancement</text>

  <!-- left column: builders -->
  <rect x="40" y="92" width="260" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="58" y="120" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Builder functions</text>
  <line x1="40" y1="132" x2="300" y2="132" stroke="#e2e8f0"/>

  <rect x="58" y="150" width="224" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="72" y="172" class="font-mono" font-size="12"><tspan fill="#2563eb">product</tspan><tspan fill="#0f172a">({ offers, rating })</tspan></text>
  <rect x="58" y="256" width="224" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="72" y="278" class="font-mono" font-size="12"><tspan fill="#2563eb">faqPage</tspan><tspan fill="#0f172a">(questions)</tspan></text>
  <rect x="58" y="376" width="224" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="72" y="398" class="font-mono" font-size="12"><tspan fill="#2563eb">breadcrumbList</tspan><tspan fill="#0f172a">(items)</tspan></text>

  <text x="58" y="446" class="font-ui" font-size="12" fill="#94a3b8">+ 20 more: recipe, event, howTo,</text>
  <text x="58" y="464" class="font-ui" font-size="12" fill="#94a3b8">jobPosting, videoObject, course…</text>

  <!-- connector arrows -->
  <line x1="286" y1="167" x2="330" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 167 l-8 -5 v10 z" fill="#94a3b8"/>
  <line x1="286" y1="273" x2="330" y2="273" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 273 l-8 -5 v10 z" fill="#94a3b8"/>
  <line x1="286" y1="393" x2="330" y2="393" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 393 l-8 -5 v10 z" fill="#94a3b8"/>

  <!-- right: SERP previews -->
  <!-- product rich result -->
  <rect x="346" y="92" width="514" height="132" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="762" y="104" width="82" height="20" rx="10" fill="#dbeafe"/>
  <text x="803" y="118" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Product</text>
  <text x="364" y="120" class="font-ui" font-size="12" fill="#64748b">example.com › shop › headphones</text>
  <text x="364" y="146" class="font-ui" font-size="16" font-weight="600" fill="#2563eb">Wireless Headphones — Example Store</text>
  <g fill="#f59e0b">
    <path d="M369 160 l2.8 5.7 6.3 0.9 -4.6 4.4 1.1 6.2 -5.6 -3 -5.6 3 1.1 -6.2 -4.6 -4.4 6.3 -0.9 z"/>
    <path d="M394 160 l2.8 5.7 6.3 0.9 -4.6 4.4 1.1 6.2 -5.6 -3 -5.6 3 1.1 -6.2 -4.6 -4.4 6.3 -0.9 z"/>
    <path d="M419 160 l2.8 5.7 6.3 0.9 -4.6 4.4 1.1 6.2 -5.6 -3 -5.6 3 1.1 -6.2 -4.6 -4.4 6.3 -0.9 z"/>
    <path d="M444 160 l2.8 5.7 6.3 0.9 -4.6 4.4 1.1 6.2 -5.6 -3 -5.6 3 1.1 -6.2 -4.6 -4.4 6.3 -0.9 z"/>
    <path d="M469 160 l2.8 5.7 6.3 0.9 -4.6 4.4 1.1 6.2 -5.6 -3 -5.6 3 1.1 -6.2 -4.6 -4.4 6.3 -0.9 z" opacity="0.35"/>
  </g>
  <text x="486" y="173" class="font-ui" font-size="12" fill="#64748b">4.7 · 312 reviews · $149.99 · In stock</text>
  <text x="364" y="200" class="font-ui" font-size="12" fill="#64748b">Premium noise-cancelling headphones with 40-hour battery life…</text>

  <!-- FAQ rich result -->
  <rect x="346" y="240" width="514" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="776" y="252" width="68" height="20" rx="10" fill="#dbeafe"/>
  <text x="810" y="266" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">FAQPage</text>
  <text x="364" y="268" class="font-ui" font-size="14" font-weight="600" fill="#2563eb">Frequently asked questions</text>
  <line x1="364" y1="282" x2="842" y2="282" stroke="#e2e8f0"/>
  <text x="364" y="306" class="font-ui" font-size="13" fill="#0f172a">What is JSON-LD?</text>
  <text x="836" y="306" class="font-ui" font-size="13" fill="#94a3b8" text-anchor="end">⌄</text>
  <line x1="364" y1="318" x2="842" y2="318" stroke="#e2e8f0"/>
  <text x="364" y="342" class="font-ui" font-size="13" fill="#0f172a">Do I need React?</text>
  <text x="836" y="342" class="font-ui" font-size="13" fill="#94a3b8" text-anchor="end">⌄</text>

  <!-- breadcrumb rich result -->
  <rect x="346" y="374" width="514" height="98" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="742" y="386" width="102" height="20" rx="10" fill="#dbeafe"/>
  <text x="793" y="400" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">BreadcrumbList</text>
  <text x="364" y="404" class="font-ui" font-size="12"><tspan fill="#64748b">example.com</tspan><tspan fill="#94a3b8"> › </tspan><tspan fill="#64748b">Home</tspan><tspan fill="#94a3b8"> › </tspan><tspan fill="#64748b">Blog</tspan><tspan fill="#94a3b8"> › </tspan><tspan fill="#0f172a">My Post</tspan></text>
  <text x="364" y="430" class="font-ui" font-size="16" font-weight="600" fill="#2563eb">My Post — Example Blog</text>
  <text x="364" y="454" class="font-ui" font-size="12" fill="#64748b">A readable breadcrumb trail replaces the raw URL in search results.</text>
</svg>
