<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>@power-seo/schema hero: builder function code producing validated JSON-LD structured data with a Google rich result preview</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- headline -->
  <rect x="60" y="56" width="40" height="40" rx="10" fill="#2563eb"/>
  <text x="80" y="83" class="font-mono" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">{ }</text>
  <text x="112" y="84" class="font-ui" font-size="32" font-weight="700" fill="#0f172a">@power-seo/schema</text>
  <text x="62" y="130" class="font-ui" font-size="18" fill="#64748b">Google-compliant schema.org markup with compile-time type checking — from builder</text>
  <text x="62" y="156" class="font-ui" font-size="18" fill="#64748b">function to rich result, validated before your pages go live.</text>

  <!-- left: code panel -->
  <rect x="60" y="196" width="560" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M60 204 a8 8 0 0 1 8-8 h544 a8 8 0 0 1 8 8 v28 h-560 z" fill="#f8fafc"/>
  <line x1="60" y1="232" x2="620" y2="232" stroke="#e2e8f0"/>
  <text x="80" y="219" class="font-mono" font-size="12" fill="#64748b">product.ts</text>
  <rect x="524" y="203" width="82" height="20" rx="10" fill="#dbeafe"/>
  <text x="565" y="217" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">TypeScript</text>

  <text x="80" y="262" class="font-mono" font-size="13"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { product, validateSchema } </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#16a34a"> '@power-seo/schema'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="80" y="294" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> schema = </tspan><tspan fill="#2563eb">product</tspan><tspan fill="#0f172a">({</tspan></text>
  <text x="100" y="320" class="font-mono" font-size="13"><tspan fill="#0f172a">name: </tspan><tspan fill="#16a34a">'Wireless Headphones'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="100" y="346" class="font-mono" font-size="13"><tspan fill="#0f172a">offers: { price: </tspan><tspan fill="#0891b2">149.99</tspan><tspan fill="#0f172a">, priceCurrency: </tspan><tspan fill="#16a34a">'USD'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="120" y="372" class="font-mono" font-size="13"><tspan fill="#0f172a">availability: </tspan><tspan fill="#16a34a">'InStock'</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="100" y="398" class="font-mono" font-size="13"><tspan fill="#0f172a">aggregateRating: { ratingValue: </tspan><tspan fill="#0891b2">4.7</tspan><tspan fill="#0f172a">, reviewCount: </tspan><tspan fill="#0891b2">312</tspan><tspan fill="#0f172a"> },</tspan></text>
  <text x="80" y="424" class="font-mono" font-size="13" fill="#0f172a">});</text>
  <text x="80" y="456" class="font-mono" font-size="13"><tspan fill="#2563eb">validateSchema</tspan><tspan fill="#0f172a">(schema);</tspan></text>
  <text x="80" y="482" class="font-mono" font-size="13"><tspan fill="#94a3b8">// → { valid: true, issues: [] }</tspan></text>
  <rect x="80" y="504" width="200" height="30" rx="15" fill="#dcfce7"/>
  <text x="180" y="524" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">✓ Rich Results eligible</text>

  <!-- arrow -->
  <line x1="636" y1="386" x2="676" y2="386" stroke="#94a3b8" stroke-width="2"/>
  <path d="M676 386 l-8 -5 v10 z" fill="#94a3b8"/>

  <!-- right: rich result preview card -->
  <rect x="692" y="196" width="448" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="712" y="228" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Search result preview</text>
  <rect x="1028" y="210" width="92" height="22" rx="11" fill="#dbeafe"/>
  <text x="1074" y="225" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">Product</text>
  <line x1="692" y1="244" x2="1140" y2="244" stroke="#e2e8f0"/>

  <text x="712" y="276" class="font-ui" font-size="12" fill="#64748b">example.com › shop › headphones</text>
  <text x="712" y="304" class="font-ui" font-size="17" font-weight="600" fill="#2563eb">Wireless Headphones — Example Store</text>
  <!-- stars -->
  <g fill="#f59e0b">
    <path d="M718 318 l3.2 6.5 7.2 1 -5.2 5.1 1.2 7.1 -6.4 -3.4 -6.4 3.4 1.2 -7.1 -5.2 -5.1 7.2 -1 z"/>
    <path d="M746 318 l3.2 6.5 7.2 1 -5.2 5.1 1.2 7.1 -6.4 -3.4 -6.4 3.4 1.2 -7.1 -5.2 -5.1 7.2 -1 z"/>
    <path d="M774 318 l3.2 6.5 7.2 1 -5.2 5.1 1.2 7.1 -6.4 -3.4 -6.4 3.4 1.2 -7.1 -5.2 -5.1 7.2 -1 z"/>
    <path d="M802 318 l3.2 6.5 7.2 1 -5.2 5.1 1.2 7.1 -6.4 -3.4 -6.4 3.4 1.2 -7.1 -5.2 -5.1 7.2 -1 z"/>
    <path d="M830 318 l3.2 6.5 7.2 1 -5.2 5.1 1.2 7.1 -6.4 -3.4 -6.4 3.4 1.2 -7.1 -5.2 -5.1 7.2 -1 z" opacity="0.35"/>
  </g>
  <text x="852" y="332" class="font-ui" font-size="13" fill="#64748b">4.7 · 312 reviews · $149.99 · In stock</text>
  <text x="712" y="366" class="font-ui" font-size="13" fill="#64748b">Premium noise-cancelling headphones with 40-hour battery</text>
  <text x="712" y="386" class="font-ui" font-size="13" fill="#64748b">life, USB-C fast charging, and multipoint Bluetooth.</text>

  <line x1="712" y1="410" x2="1120" y2="410" stroke="#e2e8f0"/>
  <text x="712" y="440" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Rendered by the same package</text>
  <rect x="712" y="456" width="408" height="94" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="728" y="482" class="font-mono" font-size="12"><tspan fill="#0f172a">&lt;</tspan><tspan fill="#2563eb">script</tspan><tspan fill="#7c3aed"> type</tspan><tspan fill="#0f172a">=</tspan><tspan fill="#16a34a">"application/ld+json"</tspan><tspan fill="#0f172a">&gt;</tspan></text>
  <text x="728" y="504" class="font-mono" font-size="12"><tspan fill="#0f172a">{"@context":"https://schema.org",</tspan></text>
  <text x="728" y="524" class="font-mono" font-size="12"><tspan fill="#0f172a"> "@type":"Product", ... }</tspan></text>
  <text x="728" y="544" class="font-mono" font-size="12"><tspan fill="#0f172a">&lt;/</tspan><tspan fill="#2563eb">script</tspan><tspan fill="#0f172a">&gt;</tspan></text>
</svg>
