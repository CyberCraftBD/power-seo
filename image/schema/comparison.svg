    <text x="608" y="321" font-size="15" font-weight="700" fill="#16a34a">✓</text>
    <text x="608" y="366" font-size="15" font-weight="700" fill="#16a34a">✓</text>
    <text x="608" y="411" font-size="15" font-weight="700" fill="#16a34a">✓</text>
    <text x="608" y="456" font-size="15" font-weight="700" fill="#16a34a">✓</text>
