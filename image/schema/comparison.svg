  <!-- header row -->
  <path d="M40 76 a8 8 0 0 1 8-8 h804 a8 8 0 0 1 8 8 v36 h-820 z" fill="#f8fafc"/>
  <line x1="40" y1="112" x2="860" y2="112" stroke="#e2e8f0"/>
