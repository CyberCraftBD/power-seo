  <text x="812" y="105" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">schemaorg</text>

  <!-- highlight column -->
  <rect x="342" y="112" width="100" height="360" fill="#dbeafe" opacity="0.35"/>

  <!-- row separators -->
  <line x1="40" y1="157" x2="860" y2="157" stroke="#e2e8f0"/>
  <line x1="40" y1="202" x2="860" y2="202" stroke="#e2e8f0"/>
  <line x1="40" y1="247" x2="860" y2="247" stroke="#e2e8f0"/>
  <line x1="40" y1="292" x2="860" y2="292" stroke="#e2e8f0"/>
  <line x1="40" y1="337" x2="860" y2="337" stroke="#e2e8f0"/>
  <line x1="40" y1="382" x2="860" y2="382" stroke="#e2e8f0"/>
  <line x1="40" y1="427" x2="860" y2="427" stroke="#e2e8f0"/>

  <!-- feature labels -->
  <text x="60" y="140" class="font-ui" font-size="13" fill="#0f172a">Typed builder functions</text>
  <text x="60" y="185" class="font-ui" font-size="13" fill="#0f172a">Ready-to-use React components</text>
  <text x="60" y="230" class="font-ui" font-size="13" fill="#0f172a">@graph support (schemaGraph)</text>
  <text x="60" y="275" class="font-ui" font-size="13" fill="#0f172a">Built-in field validation</text>
  <text x="60" y="320" class="font-ui" font-size="13" fill="#0f172a">Works without React</text>
  <text x="60" y="365" class="font-ui" font-size="13" fill="#0f172a">23 schema types</text>
  <text x="60" y="410" class="font-ui" font-size="13" fill="#0f172a">Zero runtime dependencies</text>
  <text x="60" y="455" class="font-ui" font-size="13" fill="#0f172a">Tree-shakeable</text>

