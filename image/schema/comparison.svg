    <text x="716" y="231" font-size="15" font-weight="700" fill="#16a34a">✓</text>
    <text x="716" y="276" font-size="14" fill="#94a3b8">—</text>
    <text x="716" y="321" font-size="15" font-weight="700" fill="#16a34a">✓</text>
