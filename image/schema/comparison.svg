<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix: @power-seo/schema versus next-seo, schema-dts, json-ld.js, and react-schemaorg</title>
  <defs><style>
