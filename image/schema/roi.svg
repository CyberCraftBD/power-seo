<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison: hand-written JSON-LD with silent failures versus typed, validated schemas with @power-seo/schema</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Structured data workflow, before and after</text>

  <!-- BEFORE panel -->
  <rect x="40" y="72" width="396" height="400" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="102" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">Hand-written JSON-LD</text>
  <rect x="330" y="86" width="88" height="22" rx="11" fill="#fee2e2"/>
  <text x="374" y="101" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Error-prone</text>
  <line x1="40" y1="116" x2="436" y2="116" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="13" fill="#64748b">
    <circle cx="70" cy="146" r="4" fill="#ef4444"/>
    <text x="86" y="151">Copy schema.org docs into raw JSON strings</text>
    <circle cx="70" cy="182" r="4" fill="#ef4444"/>
    <text x="86" y="187">Typos in field names fail silently</text>
    <circle cx="70" cy="218" r="4" fill="#ef4444"/>
    <text x="86" y="223">Missing required fields found only after</text>
    <text x="86" y="241">Google drops the rich result</text>
    <circle cx="70" cy="272" r="4" fill="#ef4444"/>
    <text x="86" y="277">Manual dangerouslySetInnerHTML boilerplate</text>
    <circle cx="70" cy="308" r="4" fill="#ef4444"/>
    <text x="86" y="313">Separate script tags per schema — Google</text>
    <text x="86" y="331">may miss some</text>
  </g>

  <rect x="60" y="356" width="356" height="94" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="382" class="font-mono" font-size="12"><tspan fill="#0f172a">"datePublised": </tspan><tspan fill="#16a34a">"2026-01-15"</tspan></text>
  <text x="76" y="404" class="font-mono" font-size="11" fill="#b91c1c">▲ typo — no compiler error, no warning,</text>
  <text x="90" y="424" class="font-mono" font-size="11" fill="#b91c1c">rich result silently lost</text>

  <!-- arrow between panels -->
  <line x1="440" y1="272" x2="458" y2="272" stroke="#94a3b8" stroke-width="2"/>
  <path d="M462 272 l-8 -5 v10 z" fill="#94a3b8"/>

  <!-- AFTER panel -->
  <rect x="464" y="72" width="396" height="400" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="484" y="102" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">With @power-seo/schema</text>
  <rect x="756" y="86" width="86" height="22" rx="11" fill="#dcfce7"/>
  <text x="799" y="101" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Type-safe</text>
  <line x1="464" y1="116" x2="860" y2="116" stroke="#e2e8f0"/>

  <g class="font-ui" font-size="13" fill="#64748b">
    <text x="494" y="151" fill="#16a34a" font-weight="700">✓</text>
    <text x="512" y="151">Typed builders — misspelled fields fail</text>
    <text x="512" y="169">at compile time</text>
    <text x="494" y="200" fill="#16a34a" font-weight="700">✓</text>
    <text x="512" y="200">validateSchema() flags missing required</text>
    <text x="512" y="218">fields before deploy</text>
    <text x="494" y="249" fill="#16a34a" font-weight="700">✓</text>
    <text x="512" y="249">One-line React components render the</text>
    <text x="512" y="267">script tag for you</text>
    <text x="494" y="298" fill="#16a34a" font-weight="700">✓</text>
    <text x="512" y="298">schemaGraph() merges every schema into</text>
    <text x="512" y="316">a single @graph document</text>
  </g>

  <rect x="484" y="356" width="356" height="94" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="500" y="382" class="font-mono" font-size="12"><tspan fill="#0f172a">datePublised: </tspan><tspan fill="#16a34a">'2026-01-15'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="500" y="404" class="font-mono" font-size="11" fill="#b45309">~~~~~~~~~~~~</text>
  <text x="500" y="426" class="font-mono" font-size="11"><tspan fill="#2563eb">ts(2561)</tspan><tspan fill="#64748b"> Did you mean 'datePublished'?</tspan></text>
</svg>
