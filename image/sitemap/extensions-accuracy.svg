<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Illustration of accurate sitemap extension output: image, video, and news tags with smart namespace detection that only declares namespaces actually used</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="30" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Image / Video / News extensions — spec-accurate</text>
  <text x="30" y="68" class="font-ui" font-size="13" fill="#64748b">generateSitemap() declares an XML namespace only when that extension is actually used</text>

  <!-- namespace card -->
  <rect x="30" y="88" width="840" height="88" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="52" y="116" class="font-mono" font-size="13"><tspan fill="#2563eb">&lt;urlset</tspan><tspan fill="#0f172a"> xmlns=</tspan><tspan fill="#16a34a">"http://www.sitemaps.org/schemas/sitemap/0.9"</tspan></text>
  <text x="106" y="140" class="font-mono" font-size="13"><tspan fill="#0f172a">xmlns:image=</tspan><tspan fill="#16a34a">"http://www.google.com/schemas/sitemap-image/1.1"</tspan><tspan fill="#2563eb">&gt;</tspan></text>
  <text x="52" y="164" class="font-mono" font-size="12" fill="#94a3b8">// urls contain images only — video and news namespaces are omitted automatically</text>

  <!-- image card -->
  <rect x="30" y="196" width="272" height="252" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="214" width="120" height="22" rx="11" fill="#dbeafe"/>
  <text x="110" y="229" class="font-mono" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">SitemapImage</text>
  <g class="font-mono" font-size="11">
    <text x="50" y="262" fill="#2563eb">&lt;image:image&gt;</text>
    <text x="62" y="284" fill="#0f172a">&lt;image:loc&gt;</text>
    <text x="62" y="304" fill="#16a34a">/img/product.jpg</text>
    <text x="62" y="326" fill="#0f172a">&lt;image:caption&gt;</text>
    <text x="62" y="348" fill="#0f172a">&lt;image:title&gt;</text>
    <text x="62" y="370" fill="#0f172a">&lt;image:geo_location&gt;</text>
    <text x="62" y="392" fill="#0f172a">&lt;image:license&gt;</text>
    <text x="50" y="418" fill="#2563eb">&lt;/image:image&gt;</text>
  </g>

  <!-- video card -->
  <rect x="314" y="196" width="272" height="252" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="334" y="214" width="120" height="22" rx="11" fill="#dcfce7"/>
  <text x="394" y="229" class="font-mono" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">SitemapVideo</text>
  <g class="font-mono" font-size="11">
    <text x="334" y="262" fill="#2563eb">&lt;video:video&gt;</text>
    <text x="346" y="284" fill="#0f172a">&lt;video:title&gt;</text>
    <text x="346" y="306" fill="#0f172a">&lt;video:description&gt;</text>
    <text x="346" y="328" fill="#0f172a">&lt;video:thumbnail_loc&gt;</text>
    <text x="346" y="350" fill="#0f172a">&lt;video:duration&gt;</text>
    <text x="346" y="372" fill="#16a34a">372</text>
    <text x="346" y="394" fill="#0f172a">&lt;video:rating&gt;</text>
    <text x="334" y="418" fill="#2563eb">&lt;/video:video&gt;</text>
  </g>

  <!-- news card -->
  <rect x="598" y="196" width="272" height="252" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="618" y="214" width="112" height="22" rx="11" fill="#fef3c7"/>
  <text x="674" y="229" class="font-mono" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">SitemapNews</text>
  <g class="font-mono" font-size="11">
    <text x="618" y="262" fill="#2563eb">&lt;news:news&gt;</text>
    <text x="630" y="284" fill="#0f172a">&lt;news:publication&gt;</text>
    <text x="642" y="306" fill="#0f172a">&lt;news:name&gt;</text>
    <text x="642" y="328" fill="#0f172a">&lt;news:language&gt;</text>
    <text x="642" y="350" fill="#16a34a">en</text>
    <text x="630" y="372" fill="#0f172a">&lt;news:publication_date&gt;</text>
    <text x="630" y="394" fill="#0f172a">&lt;news:title&gt;</text>
    <text x="618" y="418" fill="#2563eb">&lt;/news:news&gt;</text>
  </g>

  <text x="30" y="482" class="font-ui" font-size="11" fill="#94a3b8">Typed as SitemapImage, SitemapVideo, and SitemapNews — attached per URL in the SitemapURL array.</text>
</svg>
