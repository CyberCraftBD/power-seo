<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison showing manual hand-built sitemap maintenance versus the automated pipeline provided by the power-seo sitemap package</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="30" y="44" class="font-ui" font-size="20" font-weight="700" fill="#0f172a">Sitemap workflow — before and after</text>
  <text x="30" y="68" class="font-ui" font-size="13" fill="#64748b">Hand-built XML strings versus a typed, validated pipeline</text>

  <!-- before panel -->
  <rect x="30" y="92" width="392" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="52" y="112" width="128" height="24" rx="12" fill="#fee2e2"/>
  <text x="116" y="128" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Manual process</text>

  <g class="font-ui" font-size="13">
    <text x="80" y="172" fill="#0f172a">Hand-concatenate XML strings</text>
    <text x="80" y="216" fill="#0f172a">Look up namespace URIs each time</text>
    <text x="80" y="260" fill="#0f172a">Single file breaks past 50,000 URLs</text>
    <text x="80" y="304" fill="#0f172a">Escape &amp;, &lt;, &gt; in every loc by hand</text>
    <text x="80" y="348" fill="#0f172a">Bad URLs reach Google silently</text>
    <text x="80" y="392" fill="#0f172a">Memory spikes on large catalogs</text>
  </g>
  <g stroke="#ef4444" stroke-width="2" stroke-linecap="round">
    <path d="M56 162l10 10M66 162l-10 10"/>
    <path d="M56 206l10 10M66 206l-10 10"/>
    <path d="M56 250l10 10M66 250l-10 10"/>
    <path d="M56 294l10 10M66 294l-10 10"/>
    <path d="M56 338l10 10M66 338l-10 10"/>
    <path d="M56 382l10 10M66 382l-10 10"/>
  </g>

  <!-- arrow -->
  <circle cx="450" cy="272" r="24" fill="#dbeafe"/>
  <path d="M440 272h18m-6-7l7 7-7 7" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- after panel -->
  <rect x="478" y="92" width="392" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="500" y="112" width="186" height="24" rx="12" fill="#dcfce7"/>
  <text x="593" y="128" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">With @power-seo/sitemap</text>

  <g class="font-ui" font-size="13">
    <text x="528" y="172" fill="#0f172a"><tspan class="font-mono" fill="#2563eb">generateSitemap()</tspan> — valid &lt;urlset&gt;</text>
    <text x="528" y="216" fill="#0f172a">Namespaces declared automatically</text>
    <text x="528" y="260" fill="#0f172a"><tspan class="font-mono" fill="#2563eb">splitSitemap()</tspan> auto-splits + index</text>
    <text x="528" y="304" fill="#0f172a">XML entities escaped for you</text>
    <text x="528" y="348" fill="#0f172a"><tspan class="font-mono" fill="#2563eb">validateSitemapUrl()</tspan> flags errors</text>
    <text x="528" y="392" fill="#0f172a"><tspan class="font-mono" fill="#2563eb">streamSitemap()</tspan> — constant memory</text>
  </g>
  <g stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M504 167l4 5 8-10"/>
    <path d="M504 211l4 5 8-10"/>
    <path d="M504 255l4 5 8-10"/>
    <path d="M504 299l4 5 8-10"/>
    <path d="M504 343l4 5 8-10"/>
    <path d="M504 387l4 5 8-10"/>
  </g>

  <text x="52" y="430" class="font-ui" font-size="12" fill="#94a3b8">Every release risks malformed XML</text>
  <text x="500" y="430" class="font-ui" font-size="12" fill="#94a3b8">One typed config, standards-compliant output</text>

  <text x="30" y="484" class="font-ui" font-size="11" fill="#94a3b8">Qualitative workflow comparison — capabilities as implemented in the package API.</text>
</svg>
