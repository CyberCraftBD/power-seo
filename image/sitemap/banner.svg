<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280">
  <title>Banner for the power-seo sitemap package: typed XML sitemap generation with streaming output, automatic index splitting, and image, video, and news extensions</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1280" height="280" fill="#f8fafc"/>

  <!-- left: branding -->
  <rect x="56" y="52" width="44" height="44" rx="10" fill="#2563eb"/>
  <path d="M67 66h22M67 74h8m6 0h8M67 82h8m6 0h8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="114" y="83" class="font-ui" font-size="30" font-weight="700" fill="#0f172a">@power-seo/sitemap</text>

  <text x="56" y="134" class="font-ui" font-size="16" fill="#64748b">XML sitemap generation for TypeScript — streaming output, automatic index</text>
  <text x="56" y="158" class="font-ui" font-size="16" fill="#64748b">splitting, image/video/news extensions, and URL validation.</text>

  <!-- feature pills -->
  <rect x="56" y="188" width="176" height="28" rx="14" fill="#dbeafe"/>
  <text x="144" y="207" class="font-ui" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Zero runtime dependencies</text>
  <rect x="244" y="188" width="118" height="28" rx="14" fill="#dcfce7"/>
  <text x="303" y="207" class="font-ui" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Tree-shakeable</text>
  <rect x="374" y="188" width="146" height="28" rx="14" fill="#f1f5f9"/>
  <text x="447" y="207" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Edge runtime ready</text>

  <!-- right: code card -->
  <rect x="700" y="36" width="524" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="700" y1="72" x2="1224" y2="72" stroke="#e2e8f0"/>
  <text x="724" y="59" class="font-mono" font-size="12" fill="#64748b">app/api/sitemap/route.ts</text>
  <rect x="1122" y="46" width="84" height="20" rx="10" fill="#dcfce7"/>
  <text x="1164" y="60" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">valid XML</text>

  <text x="724" y="100" class="font-mono" font-size="13"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> { </tspan><tspan fill="#2563eb">generateSitemap</tspan><tspan fill="#0f172a"> } </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#16a34a"> '@power-seo/sitemap'</tspan><tspan fill="#0f172a">;</tspan></text>
  <text x="724" y="128" class="font-mono" font-size="13"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> xml = </tspan><tspan fill="#2563eb">generateSitemap</tspan><tspan fill="#0f172a">({</tspan></text>
  <text x="744" y="154" class="font-mono" font-size="13"><tspan fill="#0f172a">hostname: </tspan><tspan fill="#16a34a">'https://example.com'</tspan><tspan fill="#0f172a">,</tspan></text>
  <text x="744" y="180" class="font-mono" font-size="13"><tspan fill="#0f172a">urls: [{ loc: </tspan><tspan fill="#16a34a">'/'</tspan><tspan fill="#0f172a">, changefreq: </tspan><tspan fill="#16a34a">'daily'</tspan><tspan fill="#0f172a">, priority: </tspan><tspan fill="#0891b2">1.0</tspan><tspan fill="#0f172a"> }],</tspan></text>
  <text x="724" y="206" class="font-mono" font-size="13" fill="#0f172a">});</text>
  <text x="724" y="230" class="font-mono" font-size="12" fill="#94a3b8">// &lt;urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"&gt;...</text>
</svg>
