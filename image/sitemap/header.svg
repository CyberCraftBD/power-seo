<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Hero graphic for the power-seo sitemap package showing generateSitemap, streamSitemap, and splitSitemap producing standards-compliant XML sitemaps</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- headline -->
  <rect x="80" y="88" width="46" height="46" rx="10" fill="#2563eb"/>
  <path d="M91 103h24M91 111h9m6 0h9M91 119h9m6 0h9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="142" y="121" class="font-ui" font-size="34" font-weight="700" fill="#0f172a">@power-seo/sitemap</text>

  <text x="80" y="176" class="font-ui" font-size="18" fill="#64748b">Standards-compliant &lt;urlset&gt; and &lt;sitemapindex&gt; XML from typed URL arrays.</text>
  <text x="80" y="202" class="font-ui" font-size="18" fill="#64748b">Works in Next.js, Remix, Express, and edge runtimes with zero runtime dependencies.</text>

  <!-- three feature cards -->
  <rect x="80" y="240" width="336" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="102" y="272" class="font-mono" font-size="14" font-weight="600" fill="#2563eb">streamSitemap()</text>
  <text x="102" y="298" class="font-ui" font-size="13" fill="#64748b">Synchronous generator yields XML</text>
  <text x="102" y="318" class="font-ui" font-size="13" fill="#64748b">chunks — constant memory usage.</text>

  <rect x="432" y="240" width="336" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="454" y="272" class="font-mono" font-size="14" font-weight="600" fill="#2563eb">splitSitemap()</text>
  <text x="454" y="298" class="font-ui" font-size="13" fill="#64748b">Auto-splits at the 50,000-URL spec</text>
  <text x="454" y="318" class="font-ui" font-size="13" fill="#64748b">limit and generates the index file.</text>
  <rect x="454" y="330" width="176" height="20" rx="10" fill="#dbeafe"/>
  <text x="542" y="344" class="font-mono" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">MAX_URLS_PER_SITEMAP</text>

  <rect x="784" y="240" width="336" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="806" y="272" class="font-mono" font-size="14" font-weight="600" fill="#2563eb">validateSitemapUrl()</text>
  <text x="806" y="298" class="font-ui" font-size="13" fill="#64748b">Returns { valid, errors, warnings }</text>
  <text x="806" y="318" class="font-ui" font-size="13" fill="#64748b">before bad data reaches Google.</text>

  <!-- output card -->
  <rect x="80" y="392" width="1040" height="186" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="80" y1="428" x2="1120" y2="428" stroke="#e2e8f0"/>
  <text x="102" y="415" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">generateSitemap() output</text>
  <rect x="960" y="400" width="140" height="20" rx="10" fill="#dcfce7"/>
  <text x="1030" y="414" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">application/xml</text>

  <text x="102" y="456" class="font-mono" font-size="13" fill="#94a3b8">&lt;?xml version="1.0" encoding="UTF-8"?&gt;</text>
  <text x="102" y="480" class="font-mono" font-size="13"><tspan fill="#2563eb">&lt;urlset</tspan><tspan fill="#0f172a"> xmlns=</tspan><tspan fill="#16a34a">"http://www.sitemaps.org/schemas/sitemap/0.9"</tspan><tspan fill="#2563eb">&gt;</tspan></text>
  <text x="122" y="504" class="font-mono" font-size="13"><tspan fill="#2563eb">&lt;url&gt;&lt;loc&gt;</tspan><tspan fill="#0f172a">https://example.com/</tspan><tspan fill="#2563eb">&lt;/loc&gt;&lt;lastmod&gt;</tspan><tspan fill="#0f172a">2026-01-01</tspan><tspan fill="#2563eb">&lt;/lastmod&gt;</tspan></text>
  <text x="122" y="528" class="font-mono" font-size="13"><tspan fill="#2563eb">&lt;changefreq&gt;</tspan><tspan fill="#0f172a">daily</tspan><tspan fill="#2563eb">&lt;/changefreq&gt;&lt;priority&gt;</tspan><tspan fill="#0f172a">1.0</tspan><tspan fill="#2563eb">&lt;/priority&gt;&lt;/url&gt;</tspan></text>
  <text x="102" y="552" class="font-mono" font-size="13" fill="#2563eb">&lt;/urlset&gt;</text>

  <!-- footer pills -->
  <rect x="80" y="596" width="150" height="24" rx="12" fill="#f1f5f9"/>
  <text x="155" y="612" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">TypeScript-first</text>
  <rect x="242" y="596" width="196" height="24" rx="12" fill="#f1f5f9"/>
  <text x="340" y="612" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Image / Video / News extensions</text>
  <rect x="450" y="596" width="204" height="24" rx="12" fill="#f1f5f9"/>
  <text x="552" y="612" class="font-ui" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">toNextSitemap() for app/sitemap.ts</text>
</svg>
