<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>SEO audit report dashboard built with @power-seo/audit showing an overall score of 84 with category breakdowns and severity-graded rule results</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- sidebar -->
  <rect width="180" height="500" fill="#ffffff"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#e2e8f0"/>
  <text x="24" y="34" class="font-ui" font-size="14" font-weight="700" fill="#0f172a">power-seo</text>
  <text x="24" y="82" class="font-ui" font-size="13" fill="#64748b">Dashboard</text>
  <rect x="12" y="98" width="156" height="30" rx="6" fill="#dbeafe"/>
  <text x="24" y="118" class="font-ui" font-size="13" font-weight="600" fill="#2563eb">Audit</text>
  <text x="24" y="154" class="font-ui" font-size="13" fill="#64748b">Content</text>
  <text x="24" y="190" class="font-ui" font-size="13" fill="#64748b">Sitemap</text>
  <text x="24" y="226" class="font-ui" font-size="13" fill="#64748b">Links</text>
  <text x="24" y="262" class="font-ui" font-size="13" fill="#64748b">Redirects</text>

  <!-- top bar -->
  <rect x="180" width="720" height="52" fill="#ffffff"/>
  <line x1="180" y1="52" x2="900" y2="52" stroke="#e2e8f0"/>
  <text x="204" y="32" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Page Audit</text>
  <rect x="320" y="12" width="330" height="28" rx="6" fill="#f1f5f9"/>
  <text x="334" y="30" class="font-ui" font-size="12" fill="#64748b">https://example.com/blog/react-seo-guide</text>
  <rect x="776" y="11" width="100" height="30" rx="6" fill="#2563eb"/>
  <text x="826" y="30" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run Audit</text>

  <!-- score card -->
  <rect x="204" y="72" width="200" height="176" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="100" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Overall Score</text>
  <circle cx="304" cy="164" r="40" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <circle cx="304" cy="164" r="40" fill="none" stroke="#16a34a" stroke-width="8"
          stroke-dasharray="211.1 251.3" stroke-linecap="round" transform="rotate(-90 304 164)"/>
  <text x="304" y="171" class="font-ui" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">84</text>
  <text x="304" y="234" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">auditPage(input).score</text>

  <!-- category card -->
  <rect x="420" y="72" width="456" height="176" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="440" y="100" class="font-ui" font-size="13" font-weight="600" fill="#0f172a">Categories</text>

  <text x="440" y="126" class="font-ui" font-size="12" fill="#64748b">meta</text>
  <text x="852" y="126" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">90 · 9 passed · 1 warning</text>
  <rect x="440" y="132" width="416" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="132" width="374" height="8" rx="4" fill="#2563eb"/>

  <text x="440" y="158" class="font-ui" font-size="12" fill="#64748b">content</text>
  <text x="852" y="158" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">82 · 2 passed · 1 warning</text>
  <rect x="440" y="164" width="416" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="164" width="341" height="8" rx="4" fill="#16a34a"/>

  <text x="440" y="190" class="font-ui" font-size="12" fill="#64748b">structure</text>
  <text x="852" y="190" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">78 · 4 passed · 1 error</text>
  <rect x="440" y="196" width="416" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="196" width="324" height="8" rx="4" fill="#f59e0b"/>

  <text x="440" y="222" class="font-ui" font-size="12" fill="#64748b">performance</text>
  <text x="852" y="222" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">86 · 4 passed · 1 warning</text>
  <rect x="440" y="228" width="416" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="228" width="358" height="8" rx="4" fill="#2563eb"/>

  <!-- rules table -->
  <rect x="204" y="268" width="672" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="205" y="269" width="670" height="34" rx="7" fill="#f8fafc"/>
  <text x="224" y="291" class="font-ui" font-size="12" font-weight="600" fill="#64748b">RULE ID</text>
  <text x="472" y="291" class="font-ui" font-size="12" font-weight="600" fill="#64748b">CATEGORY</text>
  <text x="586" y="291" class="font-ui" font-size="12" font-weight="600" fill="#64748b">SEVERITY</text>
  <text x="690" y="291" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FINDING</text>

  <line x1="205" y1="337" x2="875" y2="337" stroke="#e2e8f0"/>
  <text x="224" y="324" class="font-mono" font-size="12" fill="#0f172a">meta-description-length</text>
  <text x="472" y="324" class="font-ui" font-size="12" fill="#64748b">meta</text>
  <rect x="580" y="309" width="64" height="20" rx="10" fill="#fef3c7"/>
  <text x="612" y="323" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <text x="690" y="324" class="font-ui" font-size="12" fill="#64748b">Too short (under 120 chars)</text>

  <line x1="205" y1="372" x2="875" y2="372" stroke="#e2e8f0"/>
  <text x="224" y="359" class="font-mono" font-size="12" fill="#0f172a">structure-heading-h1</text>
  <text x="472" y="359" class="font-ui" font-size="12" fill="#64748b">structure</text>
  <rect x="580" y="344" width="64" height="20" rx="10" fill="#fee2e2"/>
  <text x="612" y="358" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">error</text>
  <text x="690" y="359" class="font-ui" font-size="12" fill="#64748b">Page has no H1 heading</text>

  <line x1="205" y1="407" x2="875" y2="407" stroke="#e2e8f0"/>
  <text x="224" y="394" class="font-mono" font-size="12" fill="#0f172a">content-keyphrase-density</text>
  <text x="472" y="394" class="font-ui" font-size="12" fill="#64748b">content</text>
  <rect x="580" y="379" width="64" height="20" rx="10" fill="#fef3c7"/>
  <text x="612" y="393" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <text x="690" y="394" class="font-ui" font-size="12" fill="#64748b">Keyphrase density above range</text>

  <line x1="205" y1="442" x2="875" y2="442" stroke="#e2e8f0"/>
  <text x="224" y="429" class="font-mono" font-size="12" fill="#0f172a">meta-robots-noindex</text>
  <text x="472" y="429" class="font-ui" font-size="12" fill="#64748b">meta</text>
  <rect x="580" y="414" width="64" height="20" rx="10" fill="#dbeafe"/>
  <text x="612" y="428" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">info</text>
  <text x="690" y="429" class="font-ui" font-size="12" fill="#64748b">noindex directive present</text>

  <text x="224" y="464" class="font-mono" font-size="12" fill="#0f172a">meta-canonical</text>
  <text x="472" y="464" class="font-ui" font-size="12" fill="#64748b">meta</text>
  <rect x="580" y="449" width="64" height="20" rx="10" fill="#dcfce7"/>
  <text x="612" y="463" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>
  <text x="690" y="464" class="font-ui" font-size="12" fill="#64748b">Canonical URL is set</text>
</svg>
