<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Workflow comparison — manual SEO review with spreadsheets versus automated scored audits in CI using @power-seo/audit</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="42" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">From manual review to automated audits</text>

  <!-- left panel: manual -->
  <rect x="40" y="76" width="380" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="110" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">Manual SEO review</text>
  <rect x="322" y="94" width="74" height="22" rx="11" fill="#fee2e2"/>
  <text x="359" y="109" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">slow</text>

  <line x1="64" y1="128" x2="396" y2="128" stroke="#e2e8f0"/>

  <circle cx="76" cy="160" r="8" fill="#fee2e2"/>
  <text x="76" y="164" class="font-ui" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✕</text>
  <text x="96" y="158" class="font-ui" font-size="13" fill="#0f172a">Open every page by hand</text>
  <text x="96" y="176" class="font-ui" font-size="12" fill="#64748b">view-source, inspect each tag</text>

  <circle cx="76" cy="216" r="8" fill="#fee2e2"/>
  <text x="76" y="220" class="font-ui" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✕</text>
  <text x="96" y="214" class="font-ui" font-size="13" fill="#0f172a">Eyeball title and description lengths</text>
  <text x="96" y="232" class="font-ui" font-size="12" fill="#64748b">easy to miss a 165-char description</text>

  <circle cx="76" cy="272" r="8" fill="#fee2e2"/>
  <text x="76" y="276" class="font-ui" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✕</text>
  <text x="96" y="270" class="font-ui" font-size="13" fill="#0f172a">Track findings in a spreadsheet</text>
  <text x="96" y="288" class="font-ui" font-size="12" fill="#64748b">no severity, no consistent scoring</text>

  <circle cx="76" cy="328" r="8" fill="#fee2e2"/>
  <text x="76" y="332" class="font-ui" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✕</text>
  <text x="96" y="326" class="font-ui" font-size="13" fill="#0f172a">Findings go stale after each deploy</text>
  <text x="96" y="344" class="font-ui" font-size="12" fill="#64748b">regressions ship unnoticed</text>

  <circle cx="76" cy="384" r="8" fill="#fee2e2"/>
  <text x="76" y="388" class="font-ui" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✕</text>
  <text x="96" y="382" class="font-ui" font-size="13" fill="#0f172a">Repeat for every page on the site</text>
  <text x="96" y="400" class="font-ui" font-size="12" fill="#64748b">does not scale past a few pages</text>

  <!-- arrow -->
  <line x1="428" y1="266" x2="468" y2="266" stroke="#2563eb" stroke-width="2"/>
  <path d="M 464 259 L 476 266 L 464 273 Z" fill="#2563eb"/>

  <!-- right panel: automated -->
  <rect x="480" y="76" width="380" height="380" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="504" y="110" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">With @power-seo/audit</text>
  <rect x="746" y="94" width="90" height="22" rx="11" fill="#dcfce7"/>
  <text x="791" y="109" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">automated</text>

  <line x1="504" y1="128" x2="836" y2="128" stroke="#e2e8f0"/>

  <circle cx="516" cy="160" r="8" fill="#dcfce7"/>
  <text x="516" y="164" class="font-ui" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="536" y="158" class="font-ui" font-size="13" fill="#0f172a">One call audits the whole site</text>
  <text x="536" y="176" class="font-mono" font-size="12" fill="#2563eb">auditSite({ pages })</text>

  <circle cx="516" cy="216" r="8" fill="#dcfce7"/>
  <text x="516" y="220" class="font-ui" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="536" y="214" class="font-ui" font-size="13" fill="#0f172a">Every rule checked, every time</text>
  <text x="536" y="232" class="font-ui" font-size="12" fill="#64748b">meta, content, structure, performance</text>

  <circle cx="516" cy="272" r="8" fill="#dcfce7"/>
  <text x="516" y="276" class="font-ui" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="536" y="270" class="font-ui" font-size="13" fill="#0f172a">Severity-ranked issue list</text>
  <text x="536" y="288" class="font-ui" font-size="12" fill="#64748b">error → warning → info → pass</text>

  <circle cx="516" cy="328" r="8" fill="#dcfce7"/>
  <text x="516" y="332" class="font-ui" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="536" y="326" class="font-ui" font-size="13" fill="#0f172a">CI gate blocks regressions</text>
  <text x="536" y="344" class="font-mono" font-size="12" fill="#64748b">if (report.score &lt; 75) process.exit(1)</text>

  <circle cx="516" cy="384" r="8" fill="#dcfce7"/>
  <text x="516" y="388" class="font-ui" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="536" y="382" class="font-ui" font-size="13" fill="#0f172a">Fresh scored report on every build</text>
  <text x="536" y="400" class="font-ui" font-size="12" fill="#64748b">local, synchronous, zero network calls</text>

  <text x="450" y="486" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Same checklist, expressed as code — repeatable across any number of pages</text>
</svg>
