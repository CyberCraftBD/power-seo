<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>@power-seo/audit hero — a production-grade SEO audit engine with auditPage and auditSite returning weighted 0 to 100 scores and severity-graded rules</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- brand block -->
  <rect x="490" y="56" width="220" height="26" rx="13" fill="#dbeafe"/>
  <text x="600" y="73" class="font-mono" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">npm i @power-seo/audit</text>
  <text x="600" y="130" class="font-ui" font-size="40" font-weight="700" fill="#0f172a" text-anchor="middle">@power-seo/audit</text>
  <text x="600" y="164" class="font-ui" font-size="16" fill="#64748b" text-anchor="middle">Full SEO audit engine — weighted 0–100 scoring across meta, content, structure and performance</text>

  <!-- UI vignette card -->
  <rect x="220" y="196" width="760" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- card top bar -->
  <line x1="220" y1="248" x2="980" y2="248" stroke="#e2e8f0"/>
  <text x="248" y="228" class="font-ui" font-size="15" font-weight="600" fill="#0f172a">SEO Audit</text>
  <rect x="424" y="212" width="404" height="26" rx="6" fill="#f1f5f9"/>
  <text x="440" y="229" class="font-ui" font-size="13" fill="#64748b">https://example.com/blog/react-seo-guide</text>
  <rect x="852" y="210" width="100" height="30" rx="6" fill="#2563eb"/>
  <text x="902" y="229" class="font-ui" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run Audit</text>

  <!-- score ring 84 -->
  <circle cx="330" cy="360" r="46" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <circle cx="330" cy="360" r="46" fill="none" stroke="#16a34a" stroke-width="8"
          stroke-dasharray="242.8 289" stroke-linecap="round" transform="rotate(-90 330 360)"/>
  <text x="330" y="368" class="font-ui" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">84</text>
  <text x="330" y="434" class="font-ui" font-size="12" fill="#94a3b8" text-anchor="middle">result.score</text>

  <!-- category bars -->
  <text x="440" y="292" class="font-ui" font-size="12" fill="#64748b">Meta · weight 0.30</text>
  <text x="700" y="292" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">90</text>
  <rect x="440" y="300" width="260" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="300" width="234" height="8" rx="4" fill="#2563eb"/>

  <text x="440" y="336" class="font-ui" font-size="12" fill="#64748b">Content · weight 0.30</text>
  <text x="700" y="336" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">82</text>
  <rect x="440" y="344" width="260" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="344" width="213" height="8" rx="4" fill="#16a34a"/>

  <text x="440" y="380" class="font-ui" font-size="12" fill="#64748b">Structure · weight 0.25</text>
  <text x="700" y="380" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">78</text>
  <rect x="440" y="388" width="260" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="388" width="203" height="8" rx="4" fill="#f59e0b"/>

  <text x="440" y="424" class="font-ui" font-size="12" fill="#64748b">Performance · weight 0.15</text>
  <text x="700" y="424" class="font-ui" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">86</text>
  <rect x="440" y="432" width="260" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="432" width="224" height="8" rx="4" fill="#2563eb"/>

  <!-- findings mini list -->
  <text x="748" y="284" class="font-ui" font-size="12" font-weight="600" fill="#0f172a">Findings</text>
  <rect x="748" y="296" width="66" height="20" rx="10" fill="#fef3c7"/>
  <text x="781" y="310" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <text x="822" y="310" class="font-mono" font-size="11" fill="#0f172a">meta-description-length</text>

  <rect x="748" y="326" width="66" height="20" rx="10" fill="#fef3c7"/>
  <text x="781" y="340" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <text x="822" y="340" class="font-mono" font-size="11" fill="#0f172a">meta-og-image</text>

  <rect x="748" y="356" width="66" height="20" rx="10" fill="#dcfce7"/>
  <text x="781" y="370" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>
  <text x="822" y="370" class="font-mono" font-size="11" fill="#0f172a">content-word-count</text>

  <rect x="748" y="386" width="66" height="20" rx="10" fill="#dcfce7"/>
  <text x="781" y="400" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>
  <text x="822" y="400" class="font-mono" font-size="11" fill="#0f172a">structure-heading-h1</text>

  <rect x="748" y="416" width="66" height="20" rx="10" fill="#dcfce7"/>
  <text x="781" y="430" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>
  <text x="822" y="430" class="font-mono" font-size="11" fill="#0f172a">meta-canonical</text>

  <!-- footer chip row inside card -->
  <line x1="220" y1="466" x2="980" y2="466" stroke="#e2e8f0"/>
  <text x="248" y="500" class="font-mono" font-size="12" fill="#2563eb">auditPage()</text>
  <text x="352" y="500" class="font-mono" font-size="12" fill="#2563eb">auditSite()</text>
  <text x="452" y="500" class="font-mono" font-size="12" fill="#2563eb">runMetaRules()</text>
  <text x="582" y="500" class="font-mono" font-size="12" fill="#2563eb">runContentRules()</text>
  <text x="734" y="500" class="font-ui" font-size="12" fill="#64748b">Zero dependencies · TypeScript-first</text>

  <text x="600" y="576" class="font-ui" font-size="13" fill="#94a3b8" text-anchor="middle">Framework-agnostic · SSR and Edge safe · CI/CD quality gates</text>
</svg>
