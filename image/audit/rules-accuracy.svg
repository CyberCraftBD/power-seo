<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>The @power-seo/audit rules engine — real rule identifiers grouped into four weighted categories with four severity levels</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Four weighted rule categories, graded by severity</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Every AuditRule carries a real id, category, and severity — not just pass/fail</text>

  <!-- meta card -->
  <rect x="40" y="88" width="404" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="116" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">runMetaRules()</text>
  <rect x="336" y="100" width="92" height="22" rx="11" fill="#dbeafe"/>
  <text x="382" y="115" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">weight 0.30</text>
  <circle cx="68" cy="140" r="4" fill="#16a34a"/>
  <text x="82" y="144" class="font-mono" font-size="12" fill="#0f172a">meta-title-length</text>
  <circle cx="68" cy="166" r="4" fill="#f59e0b"/>
  <text x="82" y="170" class="font-mono" font-size="12" fill="#0f172a">meta-description-length</text>
  <circle cx="68" cy="192" r="4" fill="#16a34a"/>
  <text x="82" y="196" class="font-mono" font-size="12" fill="#0f172a">meta-canonical</text>
  <circle cx="68" cy="218" r="4" fill="#f59e0b"/>
  <text x="82" y="222" class="font-mono" font-size="12" fill="#0f172a">meta-og-image</text>
  <text x="280" y="144" class="font-mono" font-size="12" fill="#94a3b8">meta-og-title</text>
  <text x="280" y="170" class="font-mono" font-size="12" fill="#94a3b8">meta-og-description</text>
  <text x="280" y="196" class="font-mono" font-size="12" fill="#94a3b8">meta-title-present</text>
  <text x="280" y="222" class="font-mono" font-size="12" fill="#94a3b8">meta-robots-noindex</text>

  <!-- content card -->
  <rect x="456" y="88" width="404" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="476" y="116" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">runContentRules()</text>
  <rect x="752" y="100" width="92" height="22" rx="11" fill="#dbeafe"/>
  <text x="798" y="115" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">weight 0.30</text>
  <circle cx="484" cy="140" r="4" fill="#16a34a"/>
  <text x="498" y="144" class="font-mono" font-size="12" fill="#0f172a">content-word-count</text>
  <circle cx="484" cy="166" r="4" fill="#f59e0b"/>
  <text x="498" y="170" class="font-mono" font-size="12" fill="#0f172a">content-keyphrase-density</text>
  <circle cx="484" cy="192" r="4" fill="#ef4444"/>
  <text x="498" y="196" class="font-mono" font-size="12" fill="#0f172a">content-missing</text>
  <text x="498" y="222" class="font-ui" font-size="12" fill="#64748b">Thin-content detection and keyphrase checks</text>

  <!-- structure card -->
  <rect x="40" y="264" width="404" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="292" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">runStructureRules()</text>
  <rect x="336" y="276" width="92" height="22" rx="11" fill="#dbeafe"/>
  <text x="382" y="291" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">weight 0.25</text>
  <circle cx="68" cy="316" r="4" fill="#16a34a"/>
  <text x="82" y="320" class="font-mono" font-size="12" fill="#0f172a">structure-heading-h1</text>
  <circle cx="68" cy="342" r="4" fill="#f59e0b"/>
  <text x="82" y="346" class="font-mono" font-size="12" fill="#0f172a">structure-heading-hierarchy</text>
  <circle cx="68" cy="368" r="4" fill="#16a34a"/>
  <text x="82" y="372" class="font-mono" font-size="12" fill="#0f172a">structure-https</text>
  <circle cx="68" cy="394" r="4" fill="#16a34a"/>
  <text x="82" y="398" class="font-mono" font-size="12" fill="#0f172a">structure-canonical-self</text>
  <text x="280" y="320" class="font-mono" font-size="12" fill="#94a3b8">structure-schema-</text>
  <text x="280" y="336" class="font-mono" font-size="12" fill="#94a3b8">present</text>
  <text x="280" y="362" class="font-mono" font-size="12" fill="#94a3b8">structure-canonical-</text>
  <text x="280" y="378" class="font-mono" font-size="12" fill="#94a3b8">valid</text>

  <!-- performance card -->
  <rect x="456" y="264" width="404" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="476" y="292" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">runPerformanceRules()</text>
  <rect x="752" y="276" width="92" height="22" rx="11" fill="#dbeafe"/>
  <text x="798" y="291" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">weight 0.15</text>
  <circle cx="484" cy="316" r="4" fill="#16a34a"/>
  <text x="498" y="320" class="font-mono" font-size="12" fill="#0f172a">perf-response-time</text>
  <circle cx="484" cy="342" r="4" fill="#f59e0b"/>
  <text x="498" y="346" class="font-mono" font-size="12" fill="#0f172a">perf-image-alt</text>
  <circle cx="484" cy="368" r="4" fill="#16a34a"/>
  <text x="498" y="372" class="font-mono" font-size="12" fill="#0f172a">perf-status-code</text>
  <circle cx="484" cy="394" r="4" fill="#16a34a"/>
  <text x="498" y="398" class="font-mono" font-size="12" fill="#0f172a">perf-content-size</text>
  <text x="700" y="320" class="font-mono" font-size="12" fill="#94a3b8">perf-image-count</text>

  <!-- severity legend -->
  <rect x="228" y="446" width="52" height="22" rx="11" fill="#fee2e2"/>
  <text x="254" y="461" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">error</text>
  <rect x="292" y="446" width="66" height="22" rx="11" fill="#fef3c7"/>
  <text x="325" y="461" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">warning</text>
  <rect x="370" y="446" width="46" height="22" rx="11" fill="#dbeafe"/>
  <text x="393" y="461" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">info</text>
  <rect x="428" y="446" width="50" height="22" rx="11" fill="#dcfce7"/>
  <text x="453" y="461" class="font-ui" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">pass</text>
  <text x="494" y="461" class="font-ui" font-size="12" fill="#64748b">AuditSeverity — every rule result is graded</text>
</svg>
