<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>auditSite aggregates per-page audit results from @power-seo/audit into an average site score with the most frequent issues across all pages</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Site-wide audits with auditSite()</text>
  <text x="450" y="64" class="font-ui" font-size="13" fill="#64748b" text-anchor="middle">Pass an array of PageAuditInput — get an aggregated SiteAuditResult back</text>

  <!-- left: page cards -->
  <text x="40" y="102" class="font-ui" font-size="12" font-weight="600" fill="#64748b">input.pages — PageAuditInput[]</text>

  <rect x="40" y="114" width="340" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="142" class="font-mono" font-size="12" fill="#0f172a">/</text>
  <text x="60" y="164" class="font-ui" font-size="11" fill="#94a3b8">Home page</text>
  <rect x="310" y="132" width="50" height="26" rx="13" fill="#dcfce7"/>
  <text x="335" y="149" class="font-ui" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">92</text>

  <rect x="40" y="196" width="340" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="224" class="font-mono" font-size="12" fill="#0f172a">/pricing</text>
  <text x="60" y="246" class="font-ui" font-size="11" fill="#94a3b8">2 warnings — meta-description-length, meta-og-image</text>
  <rect x="310" y="214" width="50" height="26" rx="13" fill="#fef3c7"/>
  <text x="335" y="231" class="font-ui" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">76</text>

  <rect x="40" y="278" width="340" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="306" class="font-mono" font-size="12" fill="#0f172a">/blog/react-seo-guide</text>
  <text x="60" y="328" class="font-ui" font-size="11" fill="#94a3b8">1 warning — meta-description-length</text>
  <rect x="310" y="296" width="50" height="26" rx="13" fill="#dcfce7"/>
  <text x="335" y="313" class="font-ui" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">84</text>

  <rect x="40" y="360" width="340" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="388" class="font-mono" font-size="12" fill="#0f172a">/docs/getting-started</text>
  <text x="60" y="410" class="font-ui" font-size="11" fill="#94a3b8">1 error — structure-heading-h1</text>
  <rect x="310" y="378" width="50" height="26" rx="13" fill="#fef3c7"/>
  <text x="335" y="395" class="font-ui" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">72</text>

  <!-- arrow -->
  <line x1="392" y1="272" x2="436" y2="272" stroke="#2563eb" stroke-width="2"/>
  <path d="M 432 265 L 444 272 L 432 279 Z" fill="#2563eb"/>
  <text x="418" y="256" class="font-mono" font-size="11" fill="#2563eb" text-anchor="middle">auditSite</text>

  <!-- right: aggregate card -->
  <rect x="456" y="114" width="404" height="318" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="480" y="146" class="font-ui" font-size="14" font-weight="600" fill="#0f172a">SiteAuditResult</text>
  <rect x="748" y="128" width="92" height="24" rx="12" fill="#dbeafe"/>
  <text x="794" y="144" class="font-ui" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">4 pages</text>

  <!-- aggregate score ring: 81 -->
  <circle cx="540" cy="222" r="38" fill="none" stroke="#e2e8f0" stroke-width="8"/>
  <circle cx="540" cy="222" r="38" fill="none" stroke="#16a34a" stroke-width="8"
          stroke-dasharray="193.3 238.8" stroke-linecap="round" transform="rotate(-90 540 222)"/>
  <text x="540" y="229" class="font-ui" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">81</text>
  <text x="540" y="282" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">report.score</text>
  <text x="540" y="298" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">mean of all pages</text>

  <!-- topIssues list -->
  <text x="628" y="184" class="font-ui" font-size="12" font-weight="600" fill="#64748b">report.topIssues</text>
  <line x1="628" y1="194" x2="836" y2="194" stroke="#e2e8f0"/>

  <text x="628" y="216" class="font-mono" font-size="12" fill="#0f172a">meta-description-length</text>
  <rect x="806" y="203" width="30" height="18" rx="9" fill="#fef3c7"/>
  <text x="821" y="216" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">x2</text>

  <text x="628" y="246" class="font-mono" font-size="12" fill="#0f172a">meta-og-image</text>
  <rect x="806" y="233" width="30" height="18" rx="9" fill="#fef3c7"/>
  <text x="821" y="246" class="font-ui" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">x1</text>

  <text x="628" y="276" class="font-mono" font-size="12" fill="#0f172a">structure-heading-h1</text>
  <rect x="806" y="263" width="30" height="18" rx="9" fill="#fee2e2"/>
  <text x="821" y="276" class="font-ui" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">x1</text>

  <!-- summary bars -->
  <text x="480" y="330" class="font-ui" font-size="12" font-weight="600" fill="#64748b">report.summary — category averages</text>
  <text x="480" y="354" class="font-ui" font-size="11" fill="#64748b">meta</text>
  <rect x="560" y="346" width="240" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="560" y="346" width="199" height="8" rx="4" fill="#2563eb"/>
  <text x="836" y="354" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">83</text>
  <text x="480" y="376" class="font-ui" font-size="11" fill="#64748b">content</text>
  <rect x="560" y="368" width="240" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="560" y="368" width="204" height="8" rx="4" fill="#16a34a"/>
  <text x="836" y="376" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">85</text>
  <text x="480" y="398" class="font-ui" font-size="11" fill="#64748b">structure</text>
  <rect x="560" y="390" width="240" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="560" y="390" width="182" height="8" rx="4" fill="#f59e0b"/>
  <text x="836" y="398" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">76</text>
  <text x="480" y="420" class="font-ui" font-size="11" fill="#64748b">performance</text>
  <rect x="560" y="412" width="240" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="560" y="412" width="197" height="8" rx="4" fill="#2563eb"/>
  <text x="836" y="420" class="font-ui" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">82</text>

  <text x="450" y="472" class="font-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Ideal for dashboards, agency reports, and CI quality gates across an entire site</text>
</svg>
