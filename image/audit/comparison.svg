  <text x="586" y="90" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Screaming Frog</text>
  <text x="706" y="90" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Lighthouse</text>
  <text x="806" y="90" class="font-ui" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">next-seo</text>

  <!-- highlight column -->
  <rect x="365" y="105" width="140" height="362" fill="#dbeafe" opacity="0.35"/>

  <!-- row separators -->
  <line x1="41" y1="150" x2="859" y2="150" stroke="#e2e8f0"/>
  <line x1="41" y1="195" x2="859" y2="195" stroke="#e2e8f0"/>
  <line x1="41" y1="240" x2="859" y2="240" stroke="#e2e8f0"/>
  <line x1="41" y1="285" x2="859" y2="285" stroke="#e2e8f0"/>
  <line x1="41" y1="330" x2="859" y2="330" stroke="#e2e8f0"/>
  <line x1="41" y1="375" x2="859" y2="375" stroke="#e2e8f0"/>
  <line x1="41" y1="420" x2="859" y2="420" stroke="#e2e8f0"/>

  <!-- rows: feature | ps ✓ | sf | lh | ns -->
  <text x="64" y="133" class="font-ui" font-size="13" fill="#0f172a">Programmatic API</text>
  <text x="435" y="134" class="font-ui" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="586" y="133" class="font-ui" font-size="13" fill="#94a3b8" text-anchor="middle">—</text>
