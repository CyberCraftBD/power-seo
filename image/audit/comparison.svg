  <text x="435" y="314" class="font-ui" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="586" y="313" class="font-ui" font-size="13" fill="#94a3b8" text-anchor="middle">—</text>
