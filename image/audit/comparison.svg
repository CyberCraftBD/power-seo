<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>Feature comparison matrix of @power-seo/audit versus Screaming Frog, Lighthouse and next-seo across programmatic API, scoring, aggregation and CI support</title>
  <defs><style>
    .font-ui { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style></defs>
  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="40" class="font-ui" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">How @power-seo/audit compares</text>

  <!-- table card -->
  <rect x="40" y="64" width="820" height="404" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- header row -->
  <rect x="41" y="65" width="818" height="40" rx="7" fill="#f8fafc"/>
  <text x="64" y="90" class="font-ui" font-size="12" font-weight="600" fill="#64748b">FEATURE</text>
